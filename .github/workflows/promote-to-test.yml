# Promotion to the TEST environment (Article XI.4). Nothing is deployed to testing unless the commits that
# reached main pass the SDD rules (G1–G9) and SonarQube has analysed this exact commit of main and its
# quality gate passed. Governance-protected (CODEOWNERS: appsec + sdd-approvers).
# Add required reviewers to the "test" environment in GitHub settings. For private repositories GitHub
# offers environment required reviewers only on GitHub Enterprise; on Team, restrict who can run this
# workflow instead, or deploy from a protected tag.
name: promote-to-test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-to-test
  cancel-in-progress: false

jobs:
  security-gate:
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.4.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SDD commit policy for what reached main (catches direct pushes)
        env:
          BEFORE: ${{ github.event.before }}
        run: node sdd/scripts/git-check.mjs --ci --base auto --before "$BEFORE"
      - name: Install workspace and produce coverage
        if: hashFiles('pnpm-lock.yaml') != ''
        continue-on-error: true
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm test
      - name: Does this scan need OSV-Scanner? (SonarQube as the scanner, or the osv-scanner check switched on)
        id: tools
        run: >-
          node -e "const c=require('./sdd/governance/checks.json');
          const on=c.scanner==='sonarqube'||(c.checks||[]).some(k=>k.id==='osv-scanner'&&k.enabled);
          console.log('osv='+on)" >> "$GITHUB_OUTPUT"
      - name: Install OSV-Scanner (prebuilt release binary, checksum verified)
        if: steps.tools.outputs.osv == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/osv-scanner"; mkdir -p "$dir"; cd "$dir"
          for attempt in 1 2 3; do
            if gh release download "$OSV_SCANNER_VERSION" -R google/osv-scanner --clobber \
                 -p 'osv-scanner*linux_amd64' -p '*SHA256SUMS*' -p '*checksums*.txt'; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::Could not download OSV-Scanner $OSV_SCANNER_VERSION"; exit 1; }
            sleep $((attempt * 10))
          done
          sums=$(ls *SHA256SUMS* *checksums*.txt 2>/dev/null | head -n 1)
          [ -n "$sums" ] || { echo "::error::OSV-Scanner $OSV_SCANNER_VERSION has no checksum file; not installing an unverified binary."; exit 1; }
          sha256sum --check --ignore-missing "$sums"
          mv osv-scanner*linux_amd64 osv-scanner && chmod +x osv-scanner
          echo "$dir" >> "$GITHUB_PATH"
          ./osv-scanner --version
      - name: Scan main at this commit (waits for the quality gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: node sdd/scripts/scan.mjs --ci
      - name: Confirm the gate is for exactly this commit
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: node sdd/scripts/scan.mjs --gate-only --branch main --revision "${{ github.sha }}"

  deploy-test:
    needs: security-gate
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy to the test environment
        run: echo "Deploy ${{ github.sha }} to TEST here (prototype placeholder; replace with your deployment)."
