# Publishes a GitHub release for a version (v1.0.0, v1.1.0, …): push the tag, or run this workflow from the
# Actions tab with the version (it then tags the commit it runs on). The notes come from
# .github/releases/<tag>.md; the presentation PDF and the explainer video are attached.
# Governance-protected (CODEOWNERS: .github/).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release (tags the selected branch's head if the tag does not exist yet)
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release with its downloads
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes=".github/releases/$TAG.md"
          if [ ! -f "$notes" ]; then echo "::error::Write the release notes in $notes first."; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists."; exit 0; fi
          gh release create "$TAG" \
            --title "$TAG — Bob builds. People approve. Checks verify." \
            --notes-file "$notes" \
            --target "$GITHUB_SHA" \
            site/src/deck/tidewell-sdd-ibm-bob-deck.pdf \
            site/src/media/tidewell-sdd-explainer-720p.mp4
