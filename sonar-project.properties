# SonarQube analysis scope for Tidewell Bank (Article XI, NFR-SEC-042..046, ADR-0009).
# GOVERNANCE-PROTECTED: this file decides WHAT the external scanner sees. Bob cannot edit it; humans
# change it through a pull request reviewed by @YOUR-ORG/appsec (CODEOWNERS). Never add
# sonar.issue.ignore.* here — accepted risk is recorded in SonarQube itself (git rule G8).
#
# Run scans with `node sdd/scripts/scan.mjs F##` (/sdd-scan) or `pnpm security:scan F##`, never the
# scanner directly: the script adds sonar.qualitygate.wait=true and binds the result to the code.
# SONAR_HOST_URL and SONAR_TOKEN come from the environment, never from this file.

sonar.projectKey=tidewell-bank
sonar.projectName=Tidewell Bank (prototype)
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Production code (matches PROD_CODE in sdd/scripts/lib.mjs, which fingerprints the same files)
sonar.sources=.
sonar.inclusions=apps/**,packages/**,infra/**,prisma/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.int.test.ts,**/test/factories/**,**/test/helpers/**,**/test/fixtures/**

# Tests (analysed as tests: coverage + test-code rules, not production vulnerabilities)
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.int.test.ts,e2e/**,perf/**,**/test/factories/**,**/test/helpers/**,**/test/fixtures/**
sonar.test.exclusions=**/node_modules/**

# Coverage from the Vitest workspace run (`pnpm test` writes a merged root report)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
