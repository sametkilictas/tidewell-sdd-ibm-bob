t] --&gt; S\n  C -- locked --&gt; L[Locked message + reset link]\n  C -- yes --&gt; T{Trusted device?}\n  T -- yes --&gt; D([/dashboard])\n  T -- no --&gt; V[/sign-in/verify: choose SMS / TOTP / recovery/]\n  V --&gt; K{Code valid?}\n  K -- no, attempts left --&gt; V\n  K -- exceeded --&gt; S\n  K -- yes --&gt; R{Remember device?} --&gt; D\n  D -.sensitive action.-&gt; SU[[Step-up dialog]] --&gt;|verified| A[Original request retried with token]\n  SU --&gt;|cancel| X[Form intact + info note]\n<\/code><\/pre>\n<h2 id=\"d-flows-2-transfer-wizard-f04\">2. Transfer wizard (F04)<\/h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n  W1[1 · Who &amp; how much] --&gt; W2[2 · When &amp; details]\n  W2 --&gt; Q[POST /transfer-quotes]\n  Q --&gt;|422 limit / funds| W1\n  Q --&gt; RV[3 · Review: fees, FX countdown, dates, CoP]\n  RV --&gt;|quote expired| Q\n  RV --&gt;|confirm + Idempotency-Key| SUQ{stepUpRequired?}\n  SUQ -- yes --&gt; SU[[Step-up]] --&gt; P[POST /transfers]\n  SUQ -- no --&gt; P\n  P --&gt;|201 PROCESSING / COMPLETED / SCHEDULED / HELD| RC[Receipt + live status]\n  P --&gt;|network error| RT[Retry same key → true result] --&gt; RC\n<\/code><\/pre>\n<h2 id=\"d-flows-3-add-beneficiary-f04\">3. Add beneficiary (F04)<\/h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n  T[Choose type] --&gt; F[Details form: IBAN / acct+BIC, name, address]\n  F --&gt; V{Valid IBAN/BIC?} -- no --&gt; F\n  V -- yes --&gt; NC[POST /name-checks]\n  NC --&gt; M{Result}\n  M -- MATCH --&gt; RV[Review]\n  M -- CLOSE_MATCH --&gt; SG[Use suggested / keep mine] --&gt; RV\n  M -- NO_MATCH --&gt; AK[Risk acknowledgement required] --&gt; RV\n  M -- UNAVAILABLE --&gt; RV\n  RV --&gt; SU[[Step-up BENEFICIARY_CREATE]] --&gt; OK[Saved · cooling-off 24 h · security alert sent]\n<\/code><\/pre>\n<h2 id=\"d-flows-4-held-payment-maker-checker-f11\">4. Held payment maker-checker (F11)<\/h2>\n<pre><code class=\"language-mermaid\">sequenceDiagram\n  actor C as Customer (Daniel)\n  participant API\n  actor A as Ops agent (Mina)\n  actor S as Supervisor (Yusuf)\n  C-&gt;&gt;API: POST /transfers (ref &quot;DEMO-REVIEW&quot;)\n  API--&gt;&gt;C: 201 HELD_FOR_REVIEW (hold placed)\n  A-&gt;&gt;API: POST /ops/held-payments/{id}/recommendation APPROVE\n  S-&gt;&gt;API: POST /ops/held-payments/{id}/decision APPROVE\n  API--&gt;&gt;C: SSE payment.status_changed → PROCESSING → COMPLETED\n<\/code><\/pre>\n<h2 id=\"d-flows-5-demo-script-15-minutes-executed-at-phase-7-gate\">5. Demo script (≈ 15 minutes) — executed at Phase 7 gate<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>#<\/th>\n<th>Step<\/th>\n<th>Persona<\/th>\n<th>Proves<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Open app → demo banner visible; switch to Arabic and back<\/td>\n<td>—<\/td>\n<td>Art. X, RTL<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Sign in as Sara; OTP from Dev outbox; tick \"Remember this device\"<\/td>\n<td>Sara<\/td>\n<td>J2, AUTH-001/003/006<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Dashboard: totals per currency, hide balances toggle, upcoming rent<\/td>\n<td>Sara<\/td>\n<td>F02<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Open Everyday Current; search \"lulu\"; open a USD card purchase detail<\/td>\n<td>Sara<\/td>\n<td>F03<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Move AED 1,000.00 → USD account; watch 30 s quote countdown; confirm<\/td>\n<td>Sara<\/td>\n<td>J3, FX, ledger<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Add domestic payee (CoP close match → accept suggestion) with step-up<\/td>\n<td>Sara<\/td>\n<td>XFER-012/014/015<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Pay Ahmad Saleh 1,200.00, reference \"Nov rent top-up\"; receipt live → Completed; download PDF<\/td>\n<td>Sara<\/td>\n<td>J4<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Pay Ahmad again with reference <code>DEMO-REJECT<\/code>; see Failed + balance restored + alert<\/td>\n<td>Sara<\/td>\n<td>XFER-034<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Cards: freeze debit card, toggle online purchases, show card details (step-up, 30 s)<\/td>\n<td>Sara<\/td>\n<td>J6<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Pay AquaGrid bill using inquiry amount<\/td>\n<td>Sara<\/td>\n<td>J7<\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Download last month's statement; generate balance certificate in Arabic<\/td>\n<td>Sara<\/td>\n<td>J8, NFR-I18N-004<\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>Sign in as Layla (other browser); transfer leaves balance &lt; 250 → low-balance alert toast<\/td>\n<td>Layla<\/td>\n<td>J9<\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Daniel sends EUR to Carlos with <code>DEMO-REVIEW<\/code>; Mina recommends, Yusuf approves; Daniel sees live update<\/td>\n<td>Daniel, Mina, Yusuf<\/td>\n<td>J12<\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Idle 4 min (or <code>/dev/clock<\/code> +240 s) → timeout modal → Stay signed in<\/td>\n<td>Sara<\/td>\n<td>AUTH-031<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Settings › Security: sessions list, sign out everywhere<\/td>\n<td>Sara<\/td>\n<td>J10<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": [{"id": "d-flows-1-sign-in-with-mfa-and-step-up-f01", "t": "1. Sign-in with MFA and step-up (F01)"}, {"id": "d-flows-2-transfer-wizard-f04", "t": "2. Transfer wizard (F04)"}, {"id": "d-flows-3-add-beneficiary-f04", "t": "3. Add beneficiary (F04)"}, {"id": "d-flows-4-held-payment-maker-checker-f11", "t": "4. Held payment maker-checker (F11)"}, {"id": "d-flows-5-demo-script-15-minutes-executed-at-phase-7-gate", "t": "5. Demo script (≈ 15 minutes) — executed at Phase 7 gate"}]}, {"k": "wire", "floor": "contract", "name": "Low-fidelity Wireframes", "file": "sdd/design/wireframes.md", "html": "<p>ASCII wireframes define <strong>content, hierarchy and order<\/strong>, not pixels. Carbon components\nand tokens (SPEC-05) determine final look. In Arabic, mirror horizontally.<\/p>\n<h2 id=\"d-wire-w1-sign-in-sign-in-lg\">W1 — Sign in (<code>/sign-in<\/code>, lg)<\/h2>\n<pre><code>┌──────────────────────────────┬───────────────────────────────────────────────┐\n│  ≋ Tidewell                    │  DEMO ENVIRONMENT — NO REAL MONEY              │\n│                               │                                               │\n│  Banking that keeps           │   Sign in                              EN|ع   │\n│  you calm.                    │   ┌─────────────────────────────────────────┐ │\n│                               │   │ Username                                │ │\n│  🔒 Security tip 1 of 3        │   └─────────────────────────────────────────┘ │\n│  We will never ask for your   │   ┌─────────────────────────────────────┐ 👁 │ │\n│  password or codes by phone.  │   │ Password                            │    │ │\n│  ‹ ● ○ ○ ›  (pause)           │   └─────────────────────────────────────┘    │ │\n│                               │   ☐ Remember my username                     │\n│                               │   [        Sign in        ]  (primary, full) │\n│                               │   Forgot password?   ·   New here? Enrol     │\n└──────────────────────────────┴───────────────────────────────────────────────┘\n<\/code><\/pre>\n<h2 id=\"d-wire-w2-verify-its-you-sign-inverify\">W2 — Verify it's you (<code>/sign-in/verify<\/code>)<\/h2>\n<pre><code>  Verify it's you\n  Choose how to get your code\n  (•) Text message to +971 •• ••• 4417\n  ( ) Authenticator app\n  ( ) Use a recovery code\n  ┌───┬───┬───┬───┬───┬───┐\n  │   │   │   │   │   │   │   ← one-time-code, paste fills all\n  └───┴───┴───┴───┴───┴───┘\n  Didn't get it? Resend in 0:27\n  ☐ Remember this device for 30 days\n  [ Verify ]   Cancel\n  ⓘ Demo: use 000000 or open Dev outbox      (demo mode only)\n<\/code><\/pre>\n<h2 id=\"d-wire-w3-account-detail-accountsid\">W3 — Account detail (<code>/accounts/:id<\/code>)<\/h2>\n<pre><code>  Accounts › Main (Everyday Current)\n  ┌───────────────────────────────────────────────────────────────────────────┐\n  │ Main · Everyday Current · •••• 4821                    [Transfer] [⋯]     │\n  │ Available            AED 34,502.50                                        │\n  │ Current balance      AED 34,652.50   Pending −AED 150.00 (1)  ⓘ           │\n  │ [Show details ▾]  IBAN AE55 9900 0000 … 4821 [⧉]  BIC TDWLAEA0 [⧉]        │\n  └───────────────────────────────────────────────────────────────────────────┘\n  [ Transactions ] [ Details ] [ Statements ]\n  🔍 Search transactions…     [Filters (2)]  [Sort: Newest ▾]  [Export ▾]\n  Active: (Last 30 days ×) (Groceries ×)   Clear all\n  PENDING\n   Today      Coffee House            🍽  −AED 17.50        —\n  TUESDAY 17 NOVEMBER\n   09:12      LULU HYPERMARKET        🛒  −AED 234.00    AED 34,652.50\n   08:01      Salary — Acme Corp      💼  +AED 14,500.00  AED 34,886.50\n  …\n  [ Load more ]\n<\/code><\/pre>\n<h2 id=\"d-wire-w4-transfer-step-1-transfersnew\">W4 — Transfer step 1 (<code>/transfers/new<\/code>)<\/h2>\n<pre><code>  Make a transfer                                   ① Who &amp; how much ─ ② When ─ ③ Review\n  From\n  ┌ Main · •••• 4821 · Available AED 34,502.50                         ▾ ┐\n  To\n  ( My accounts | Payees )   🔍 Search payees            [+ New payee]\n  ★ Mum — Huda Haddad     Tidewell · •••• 9012\n    Ahmad Saleh           Northbay Lantern Bank · •••• 3301\n    Salma Nour  [New payee · limits until 18:20]  Crescent Lantern Savings · •••• 7740\n  Amount\n  ┌ AED │ 0.00                                   ┐\n  Daily limit remaining: AED 48,800.00\n                                        [ Cancel ]   [ Continue → ]\n<\/code><\/pre>\n<h2 id=\"d-wire-w5-review-transfersnew-step-3\">W5 — Review (<code>/transfers/new<\/code>, step 3)<\/h2>\n<pre><code>  Review your transfer\n  From        Main · •••• 4821\n  To          Ahmad Saleh · Northbay Lantern Bank · •••• 3301   ✔ Name matches\n  Amount      AED 1,200.00\n  Fee         AED 0.00\n  Total       AED 1,200.00\n  Sent on     Today, Wed 18 Nov       Arrives  Wed 18 Nov\n  Reference   Nov rent top-up\n  ⓘ Cut-off for same-day domestic transfers is 14:00.\n                      [ ← Back ]   [ Send AED 1,200.00 ]   (inline loading on submit)\n  -- FX variant --\n  Rate        1 AED = 0.2709 USD  (1 USD = 3.6914 AED)   ⏱ 0:24  [Refresh rate]\n  You send    AED 1,000.00            They receive  USD 270.90\n<\/code><\/pre>\n<h2 id=\"d-wire-w6-receipt\">W6 — Receipt<\/h2>\n<pre><code>  ✔ (pictogram)\n  Transfer sent                                   [Processing → Completed live]\n  Reference  HB261118-7KQ2MX [⧉]\n  … summary as review …\n  [ Download receipt (PDF) ]  [ Make another transfer ]  [ Go to dashboard ]\n<\/code><\/pre>\n<h2 id=\"d-wire-w7-card-detail-cardsid\">W7 — Card detail (<code>/cards/:id<\/code>)<\/h2>\n<pre><code>  ┌───────────────────────────┐   Debit card •••• 1111   [Active]\n  │ ≋ Tidewell        DEBIT    │   Linked to Main · •••• 4821\n  │                           │   [ ◯ Freeze card ]  [ Show card details ]  [ Report a problem ]\n  │ •••• •••• •••• 1111       │\n  │ SARA HADDAD     09/29 VISA│   Controls\n  └───────────────────────────┘   Online purchases        [■■ On ]\n                                  Use abroad              [□□ Off]\n                                  Contactless             [■■ On ]\n                                  ATM withdrawals         [■■ On ]\n  Limits (daily)   ATM  ──●────── AED [5,000.00]   Purchases ───●── AED [20,000.00]   Online ──●── AED [10,000.00]\n  Recent card transactions …                                   View all →\n<\/code><\/pre>\n<h2 id=\"d-wire-w8-security-settings-settingssecurity\">W8 — Security settings (<code>/settings/security<\/code>)<\/h2>\n<pre><code>  Security\n  Password            Last changed 3 months ago                     [Change]\n  Two-step verification\n    Text message      +971 •• ••• 4417 (always on)\n    Authenticator app Not set up                                    [Set up]\n    Recovery codes    —                                             [Generate]\n  Trusted devices\n    Chrome on macOS (this device)  added 12 Nov · used today         [Remove]\n  Active sessions\n    Chrome on macOS · Dubai (approx.) · active now (current)\n    Safari on iOS · Dubai (approx.) · 2 h ago                  [Sign out]\n    [Sign out of all other sessions]   [Sign out everywhere]\n  Security activity (last 90 days)                                   View all →\n<\/code><\/pre>", "toc": [{"id": "d-wire-w1-sign-in-sign-in-lg", "t": "W1 — Sign in (/sign-in, lg)"}, {"id": "d-wire-w2-verify-its-you-sign-inverify", "t": "W2 — Verify it's you (/sign-in/verify)"}, {"id": "d-wire-w3-account-detail-accountsid", "t": "W3 — Account detail (/accounts/:id)"}, {"id": "d-wire-w4-transfer-step-1-transfersnew", "t": "W4 — Transfer step 1 (/transfers/new)"}, {"id": "d-wire-w5-review-transfersnew-step-3", "t": "W5 — Review (/transfers/new, step 3)"}, {"id": "d-wire-w6-receipt", "t": "W6 — Receipt"}, {"id": "d-wire-w7-card-detail-cardsid", "t": "W7 — Card detail (/cards/:id)"}, {"id": "d-wire-w8-security-settings-settingssecurity", "t": "W8 — Security settings (/settings/security)"}]}, {"k": "comp", "floor": "contract", "name": "Component map and skeletons — Tidewell Bank", "file": "sdd/design/component-map.md", "html": "<p>The shared components of this worked example and their contracts, used through the generic\n<strong>carbon-ui<\/strong> skill. Banking patterns from the original UI guidance:<\/p>\n<ul>\n<li><strong>Money<\/strong>: <code>&lt;MoneyAmount value={money} signed? emphasis? /&gt;<\/code>; it respects the <code>hideBalances<\/code> preference (renders <code>••••<\/code>, label \"Balance hidden\").<\/li>\n<li><strong>IBANs and references<\/strong>: <code>&lt;IbanText&gt;<\/code> (LTR-isolated, copy without spaces).<\/li>\n<li><strong>Step-up<\/strong>: <code>withStepUp(requestFn, purpose)<\/code> opens <code>StepUpDialog<\/code> on <code>STEP_UP_REQUIRED<\/code> and retries with the token.<\/li>\n<li><strong>Money-moving submit buttons<\/strong>: <code>InlineLoading<\/code>, disabled until the response.<\/li>\n<li><strong>Visual check<\/strong>: <code>en<\/code>/<code>ar<\/code> × <code>white<\/code>/<code>g100<\/code> at 1440 and 375 px.<\/li>\n<\/ul>\n<h2 id=\"d-comp-shared-components-to-create-in-f00-appswebsrccomponents\">Shared components to create in F00 (apps/web/src/components)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Built from<\/th>\n<th>Contract<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>MoneyAmount<\/code><\/td>\n<td><code>&lt;span&gt;<\/code> + <code>formatMoney<\/code><\/td>\n<td>props: <code>value: Money<\/code>, <code>signed?<\/code>, <code>emphasis?: 'hero'\\|'body'<\/code>, <code>hideable = true<\/code>; <code>aria-label<\/code> spoken form<\/td>\n<\/tr>\n<tr>\n<td><code>IbanText<\/code><\/td>\n<td><code>&lt;bdi dir=\"ltr\"&gt;<\/code> + optional <code>CopyButton<\/code><\/td>\n<td>grouped display, copy without spaces<\/td>\n<\/tr>\n<tr>\n<td><code>StatusTag<\/code><\/td>\n<td><code>Tag<\/code> + Carbon icon<\/td>\n<td>status → type/icon/label from SPEC-05 §6<\/td>\n<\/tr>\n<tr>\n<td><code>EmptyState<\/code><\/td>\n<td>Carbon pictogram + heading + body + <code>Button<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>PageHeader<\/code><\/td>\n<td><code>Breadcrumb<\/code> + <code>h1<\/code> (focus target) + actions slot<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>ErrorPanel<\/code><\/td>\n<td><code>InlineNotification kind=\"error\"<\/code> + Retry <code>Button<\/code><\/td>\n<td>shows <code>traceId<\/code> short<\/td>\n<\/tr>\n<tr>\n<td><code>OtpInput<\/code><\/td>\n<td>single <code>TextInput<\/code> (<code>inputMode=\"numeric\"<\/code>, <code>autoComplete=\"one-time-code\"<\/code>, maxLength 6)<\/td>\n<td>paste-friendly<\/td>\n<\/tr>\n<tr>\n<td><code>SessionTimeoutModal<\/code><\/td>\n<td><code>Modal<\/code> passive→danger<\/td>\n<td>countdown live region per SPEC-05 §7<\/td>\n<\/tr>\n<tr>\n<td><code>StepUpDialog<\/code><\/td>\n<td><code>ComposedModal<\/code> + <code>RadioButtonGroup<\/code> + <code>OtpInput<\/code><\/td>\n<td>purpose-specific title<\/td>\n<\/tr>\n<tr>\n<td><code>WizardLayout<\/code><\/td>\n<td><code>ProgressIndicator<\/code> + <code>Grid<\/code> + sticky footer <code>ButtonSet<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>ReceiptLayout<\/code><\/td>\n<td>pictogram + <code>StructuredList<\/code> + actions<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>DemoBanner<\/code><\/td>\n<td><code>ActionableNotification<\/code>-styled static banner (<code>role=\"status\"<\/code>)<\/td>\n<td>not dismissible<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-comp-skeleton-moneyamount\">Skeleton — MoneyAmount<\/h2>\n<pre><code class=\"language-tsx\">export function MoneyAmount({ value, signed, emphasis = 'body', hideable = true }: Props) {\n  const intl = useIntl();\n  const { hideBalances } = usePreferences();\n  if (hideable &amp;&amp; hideBalances) {\n    return &lt;span className={cx('hb-money', emphasis)} aria-label={intl.formatMessage({ id: 'money.hidden' })}&gt;••••&lt;/span&gt;;\n  }\n  const text = formatMoney(value, intl.locale, { signed });          // string math only\n  const spoken = spokenMoney(value, intl);                            // &quot;minus 125.00 UAE dirhams&quot;\n  return &lt;bdi dir=&quot;ltr&quot; className={cx('hb-money', emphasis)} aria-label={spoken}&gt;{text}&lt;/bdi&gt;;\n}\n<\/code><\/pre>\n<h2 id=\"d-comp-skeleton-data-view-states\">Skeleton — data view states<\/h2>\n<pre><code class=\"language-tsx\">const q = useQuery(accountQueries.transactions(accountId, filters));\nif (q.isPending) return &lt;DataTableSkeleton columnCount={5} rowCount={8} /&gt;;\nif (q.isError) return &lt;ErrorPanel error={q.error} onRetry={q.refetch} /&gt;;\nif (q.data.items.length === 0) return &lt;EmptyState titleId=&quot;transactions.empty.title&quot; bodyId=&quot;transactions.empty.body&quot; /&gt;;\nreturn &lt;TransactionsTable data={q.data} /&gt;;\n<\/code><\/pre>\n<h2 id=\"d-comp-skeleton-step-up-wrapper\">Skeleton — step-up wrapper<\/h2>\n<pre><code class=\"language-ts\">export async function withStepUp&lt;T&gt;(run: (token?: string) =&gt; Promise&lt;T&gt;, purpose: StepUpPurpose, payload?: unknown): Promise&lt;T&gt; {\n  try { return await run(); }\n  catch (e) {\n    if (!(e instanceof ApiError) || e.code !== 'STEP_UP_REQUIRED') throw e;\n    const token = await stepUpDialog.open({ purpose, payloadHash: payload ? await sha256Canonical(payload) : undefined });\n    if (!token) throw new StepUpCancelled();\n    return run(token);\n  }\n}\n<\/code><\/pre>\n<h2 id=\"d-comp-carbon-gotchas\">Carbon gotchas<\/h2>\n<ul>\n<li>Import styles once: <code>@use '@carbon/react';<\/code> in <code>styles/index.scss<\/code> with theme tokens overridden before.<\/li>\n<li><code>DataTable<\/code> needs stable <code>id<\/code>s per row; pass <code>useZebraStyles={false}<\/code> for finance readability.<\/li>\n<li><code>DatePicker<\/code> range: set <code>locale<\/code> (<code>ar<\/code> uses Arabic month names) and <code>dateFormat=\"d/m/Y\"<\/code>; value is a JS Date → convert to business date string via domain helper, never <code>toISOString()<\/code> (time zone shift).<\/li>\n<li><code>Toggle<\/code> requires <code>labelText<\/code> even when visually hidden (<code>hideLabel<\/code>).<\/li>\n<li>RTL: verify <code>SideNav<\/code> placement and <code>ProgressIndicator<\/code> direction; set <code>dir<\/code> on <code>&lt;html&gt;<\/code>, not on a wrapper.<\/li>\n<\/ul>", "toc": [{"id": "d-comp-shared-components-to-create-in-f00-appswebsrccomponents", "t": "Shared components to create in F00 (apps/web/src/components)"}, {"id": "d-comp-skeleton-moneyamount", "t": "Skeleton — MoneyAmount"}, {"id": "d-comp-skeleton-data-view-states", "t": "Skeleton — data view states"}, {"id": "d-comp-skeleton-step-up-wrapper", "t": "Skeleton — step-up wrapper"}, {"id": "d-comp-carbon-gotchas", "t": "Carbon gotchas"}]}, {"k": "content", "floor": "contract", "name": "Content Style Guide (microcopy)", "file": "sdd/design/content-style-guide.md", "html": "<h2 id=\"d-content-1-voice\">1. Voice<\/h2>\n<p>Calm, clear, respectful, never alarmist. Plain language at roughly a reading age of 12.\nSecond person (\"you\", \"your\"). Active voice. No banking jargon without explanation\n(IBAN, BIC, value date get Toggletips). Never blame the customer.<\/p>\n<h2 id=\"d-content-2-terminology-use-exactly-these\">2. Terminology (use exactly these)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Use<\/th>\n<th>Don't use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Transfer (noun/verb)<\/td>\n<td>Remittance, wire (except \"international transfer\")<\/td>\n<\/tr>\n<tr>\n<td>Payee (UI) — beneficiary in code/specs<\/td>\n<td>Recipient, beneficiary (in UI)<\/td>\n<\/tr>\n<tr>\n<td>Available balance<\/td>\n<td>Usable funds<\/td>\n<\/tr>\n<tr>\n<td>Current balance<\/td>\n<td>Ledger balance (in UI)<\/td>\n<\/tr>\n<tr>\n<td>Pending<\/td>\n<td>Unposted, memo<\/td>\n<\/tr>\n<tr>\n<td>Verify it's you<\/td>\n<td>Authenticate, 2FA challenge<\/td>\n<\/tr>\n<tr>\n<td>Code<\/td>\n<td>OTP, token (in UI)<\/td>\n<\/tr>\n<tr>\n<td>Freeze card<\/td>\n<td>Block card (block = permanent)<\/td>\n<\/tr>\n<tr>\n<td>Sign in / Sign out<\/td>\n<td>Log in / Log out<\/td>\n<\/tr>\n<tr>\n<td>Statement<\/td>\n<td>e-Statement<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-content-3-patterns\">3. Patterns<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Pattern<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Field validation<\/td>\n<td>What's wrong + how to fix<\/td>\n<td>\"Use at least 12 characters.\"<\/td>\n<\/tr>\n<tr>\n<td>Blocking error<\/td>\n<td>What happened + what you can do<\/td>\n<td>\"Your available balance isn't enough for this payment, including fees. Choose a smaller amount or another account.\"<\/td>\n<\/tr>\n<tr>\n<td>System error<\/td>\n<td>Apologise once + reference<\/td>\n<td>\"Something went wrong on our side. Please try again. Reference: 4bf92f35.\"<\/td>\n<\/tr>\n<tr>\n<td>Success toast<\/td>\n<td>Past tense, specific<\/td>\n<td>\"Card frozen. New purchases will be declined.\"<\/td>\n<\/tr>\n<tr>\n<td>Destructive confirm<\/td>\n<td>Title = question, body = consequence, button = verb<\/td>\n<td>\"Delete Ahmad Saleh?\" / \"This also cancels 1 standing order.\" / [Delete payee]<\/td>\n<\/tr>\n<tr>\n<td>Empty state<\/td>\n<td>What this is + first action<\/td>\n<td>\"No payees yet. Add someone you pay regularly.\" [Add payee]<\/td>\n<\/tr>\n<tr>\n<td>Security notice<\/td>\n<td>Fact + action if not you<\/td>\n<td>\"New sign-in from Chrome on macOS. If this wasn't you, change your password now.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-content-4-numbers-dates-and-money\">4. Numbers, dates and money<\/h2>\n<ul>\n<li>Money: currency code + space + amount with grouping and exact decimals: <code>AED 12,505.00<\/code>,\n  <code>USD 19.99<\/code>, <code>JPY 1,200<\/code>. Sign before currency code: <code>−AED 125.00<\/code> (true minus U+2212 in UI,\n  ASCII <code>-<\/code> in CSV).<\/li>\n<li>Arabic: same Western digits; currency code placement per <code>Intl<\/code> for <code>ar<\/code> with Latin digits\n  (<code>numberingSystem: 'latn'<\/code>); amounts wrapped in LTR isolate.<\/li>\n<li>Dates: <code>Wed 18 Nov 2026<\/code> in lists/receipts (en), <code>الأربعاء 18 نوفمبر 2026<\/code> (ar); times 24-hour.<\/li>\n<li>Relative: \"Today\", \"Yesterday\", then absolute.<\/li>\n<li>Rates: 4 dp for display (<code>1 USD = 3.6914 AED<\/code>), full precision on receipts.<\/li>\n<\/ul>\n<h2 id=\"d-content-5-accessibility-of-copy\">5. Accessibility of copy<\/h2>\n<ul>\n<li>Link text describes destination (\"View all transactions for Main\"), never \"click here\".<\/li>\n<li>Button labels start with a verb and are unique per page.<\/li>\n<li>Error messages are associated to fields (<code>aria-describedby<\/code>) and listed in the summary.<\/li>\n<li>Don't rely on colour words (\"the red button\").<\/li>\n<\/ul>\n<h2 id=\"d-content-6-arabic-translation-notes\">6. Arabic translation notes<\/h2>\n<ul>\n<li>Translations are written natively, not machine-literal; review by a fluent speaker is a\n  Phase 7 gate item (record reviewer in <code>sdd/reports/verification/NFR.md<\/code>).<\/li>\n<li>Keep product names (Tidewell, Smart Saver) untranslated; transliterate in Arabic where\n  natural (\"تايدويل\").<\/li>\n<li>Gendered forms: use neutral/plural address where possible.<\/li>\n<\/ul>", "toc": [{"id": "d-content-1-voice", "t": "1. Voice"}, {"id": "d-content-2-terminology-use-exactly-these", "t": "2. Terminology (use exactly these)"}, {"id": "d-content-3-patterns", "t": "3. Patterns"}, {"id": "d-content-4-numbers-dates-and-money", "t": "4. Numbers, dates and money"}, {"id": "d-content-5-accessibility-of-copy", "t": "5. Accessibility of copy"}, {"id": "d-content-6-arabic-translation-notes", "t": "6. Arabic translation notes"}]}, {"k": "testing", "floor": "build", "name": "Testing and Verification Strategy", "file": "sdd/specs/90-testing-strategy.md", "html": "<h2 id=\"d-testing-1-principles\">1. Principles<\/h2>\n<ol>\n<li><strong>Every acceptance criterion is executable.<\/strong> Each <code>*-ACn<\/code> maps to ≥ 1 automated test\n   (or a documented manual check for the few marked <em>manual<\/em>).<\/li>\n<li><strong>Tests carry requirement tags<\/strong> in their titles: <code>[XFER-021]<\/code>. <code>pnpm specs:trace<\/code> turns\n   tags into <code>sdd/traceability/matrix.md<\/code>. Multiple tags allowed: <code>[XFER-026][NFR-REL-003]<\/code>.<\/li>\n<li><strong>Test at the lowest layer that proves the behaviour<\/strong>, then one E2E per journey.<\/li>\n<li><strong>No mocks of our own domain.<\/strong> Mock only ports (adapters) — and prefer the simulated\n   adapters themselves with deterministic settings.<\/li>\n<li><strong>Determinism<\/strong>: fixed PRNG seed, injectable <code>Clock<\/code>, no <code>sleep<\/code> in tests (poll with\n   timeout helpers), unique data per test via factories.<\/li>\n<li><strong>The security checks look first.<\/strong> Testing (<code>/sdd-verify<\/code>) starts only after the security scan —\n   the checks in <code>sdd/governance/checks.json<\/code>, or SonarQube and the SCA provider — has passed the current\n   production code (Constitution Article XI, §9).<\/li>\n<\/ol>\n<h2 id=\"d-testing-2-test-pyramid-and-tooling\">2. Test pyramid and tooling<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Tool<\/th>\n<th>Location<\/th>\n<th>Scope<\/th>\n<th>Target count (end)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Unit (pure)<\/td>\n<td>Vitest + fast-check<\/td>\n<td><code>packages/domain/**/*.test.ts<\/code><\/td>\n<td>Money, IBAN, calendar, limits, fees, state machines, rule evaluators<\/td>\n<td>400+<\/td>\n<\/tr>\n<tr>\n<td>Unit (web)<\/td>\n<td>Vitest + Testing Library<\/td>\n<td><code>apps/web/src/**/*.test.tsx<\/code><\/td>\n<td>Components &amp; hooks (states, a11y names, formatting)<\/td>\n<td>250+<\/td>\n<\/tr>\n<tr>\n<td>Integration (API)<\/td>\n<td>Vitest + <code>app.inject()<\/code> + real Postgres<\/td>\n<td><code>apps/api/test/**/*.int.test.ts<\/code><\/td>\n<td>Routes end-to-end inside the API incl. DB, ledger, idempotency, authz<\/td>\n<td>350+<\/td>\n<\/tr>\n<tr>\n<td>Contract<\/td>\n<td>Response validation hook + Redocly lint<\/td>\n<td>built into integration tests<\/td>\n<td>Every response matches <code>openapi.yaml<\/code><\/td>\n<td>all ops<\/td>\n<\/tr>\n<tr>\n<td>E2E<\/td>\n<td>Playwright (Chromium, Firefox, WebKit)<\/td>\n<td><code>e2e/journeys/J*.spec.ts<\/code><\/td>\n<td>Journeys J1–J12 from SPEC-01 §5<\/td>\n<td>12 journeys + smoke<\/td>\n<\/tr>\n<tr>\n<td>Accessibility<\/td>\n<td><code>@axe-core/playwright<\/code><\/td>\n<td><code>e2e/a11y.spec.ts<\/code><\/td>\n<td>All routes × themes × locales<\/td>\n<td>inventory-driven<\/td>\n<\/tr>\n<tr>\n<td>Visual (RTL)<\/td>\n<td>Playwright screenshots<\/td>\n<td><code>e2e/visual.spec.ts<\/code><\/td>\n<td>Key screens in <code>ar<\/code><\/td>\n<td>6 snapshots<\/td>\n<\/tr>\n<tr>\n<td>Performance<\/td>\n<td>autocannon/k6 + Lighthouse CI<\/td>\n<td><code>perf/<\/code><\/td>\n<td>NFR-PERF<\/td>\n<td>phase 7<\/td>\n<\/tr>\n<tr>\n<td>External scan (before testing)<\/td>\n<td>SonarQube SAST + quality gate, OSV-Scanner / SonarQube Advanced Security SCA, optional Bob SARIF<\/td>\n<td><code>sdd/scripts/scan.mjs<\/code> → <code>sdd/reports/scan/<\/code>; CI <code>sdd-gates / sonarqube<\/code>, <code>promote-to-test<\/code><\/td>\n<td>NFR-SEC-042..046<\/td>\n<td>every feature, every PR, every test deployment<\/td>\n<\/tr>\n<tr>\n<td>Security<\/td>\n<td>ESLint security, <code>pnpm audit<\/code>, secret scan, authz matrix, ZAP baseline (optional)<\/td>\n<td>CI + <code>sdd/reports/security/<\/code><\/td>\n<td>NFR-SEC<\/td>\n<td>each gate<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-testing-3-coverage-thresholds-enforced-in-vitest-config\">3. Coverage thresholds (enforced in Vitest config)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Package<\/th>\n<th>Lines<\/th>\n<th>Branches<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>packages/domain<\/code><\/td>\n<td>90 %<\/td>\n<td>90 %<\/td>\n<\/tr>\n<tr>\n<td><code>apps/api/src/modules/ledger<\/code>, <code>payments<\/code><\/td>\n<td>90 %<\/td>\n<td>85 %<\/td>\n<\/tr>\n<tr>\n<td><code>apps/api<\/code> (overall)<\/td>\n<td>80 %<\/td>\n<td>75 %<\/td>\n<\/tr>\n<tr>\n<td><code>apps/web<\/code><\/td>\n<td>70 %<\/td>\n<td>65 %<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-testing-4-test-data\">4. Test data<\/h2>\n<ul>\n<li><strong>Factories<\/strong> (<code>apps/api/test/factories/*.ts<\/code>): <code>customerFactory<\/code>, <code>accountFactory({currency, balance})<\/code>,\n  <code>beneficiaryFactory({type, ageHours})<\/code>, <code>cardFactory<\/code>, etc. Balances are created via\n  <code>GL-SEED-EQUITY<\/code> journals — never by writing balance columns.<\/li>\n<li><strong>Seed<\/strong> (SPEC-91) is for demos and E2E; integration tests use factories on isolated schemas.<\/li>\n<li><strong>Personas in E2E<\/strong> use seeded users. The E2E run starts with one <code>pnpm db:reset<\/code>; tests\n  then create their own data with unique references (<code>E2E-&lt;timestamp&gt;<\/code>) and assert on\n  deltas, never on absolute seeded balances that other tests may change. Journeys that\n  need pristine state (J1 enrolment) use dedicated seeded personas reserved for them.<\/li>\n<\/ul>\n<h2 id=\"d-testing-5-mandatory-special-tests\">5. Mandatory special tests<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Requirement<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Concurrency storm<\/td>\n<td>NFR-REL-002<\/td>\n<td>50 parallel transfers on one account; assert exact success count and non-negative available<\/td>\n<\/tr>\n<tr>\n<td>Idempotency storm<\/td>\n<td>NFR-REL-003<\/td>\n<td>10 parallel identical requests with one key<\/td>\n<\/tr>\n<tr>\n<td>Fault injection<\/td>\n<td>NFR-REL-004<\/td>\n<td>Throw inside ledger posting; assert full rollback<\/td>\n<\/tr>\n<tr>\n<td>Ledger invariant hook<\/td>\n<td>NFR-REL-001<\/td>\n<td><code>afterAll<\/code> in every integration file runs invariant checker<\/td>\n<\/tr>\n<tr>\n<td>AuthZ matrix<\/td>\n<td>NFR-SEC-010/011<\/td>\n<td>Generated from OpenAPI paths: cross-customer IDs → 404; customer on <code>/ops<\/code> → 403<\/td>\n<\/tr>\n<tr>\n<td>CSRF matrix<\/td>\n<td>NFR-SEC-005<\/td>\n<td>Every unsafe op without token → 403 &amp; no side effects<\/td>\n<\/tr>\n<tr>\n<td>Log capture<\/td>\n<td>NFR-SEC-031<\/td>\n<td>Known secrets/PII never appear in logs<\/td>\n<\/tr>\n<tr>\n<td>Timing equality<\/td>\n<td>NFR-SEC-003<\/td>\n<td>Unknown vs wrong-password median latency<\/td>\n<\/tr>\n<tr>\n<td>Statement reconciliation property<\/td>\n<td>STMT-002<\/td>\n<td>Random ledgers → statement totals reconcile<\/td>\n<\/tr>\n<tr>\n<td>Money properties<\/td>\n<td>FND-009<\/td>\n<td>Associativity, allocation sum preservation, round-trip parsing<\/td>\n<\/tr>\n<tr>\n<td>Demo fencing<\/td>\n<td>NFR-SEC-033<\/td>\n<td>Run selected tests with <code>DEMO_MODE=false<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-testing-6-e2e-conventions\">6. E2E conventions<\/h2>\n<ul>\n<li>Page objects in <code>e2e/pages/*<\/code>; selectors by role and accessible name (<code>getByRole<\/code>), never by CSS class.<\/li>\n<li>OTPs read from <code>/dev/outbox<\/code> API helper or <code>000000<\/code> in demo mode.<\/li>\n<li>Clock control via <code>PUT /dev/clock<\/code> for scheduled/timeout flows.<\/li>\n<li>Each journey file title: <code>J4 — Add domestic payee and pay [XFER-012][XFER-014][XFER-026][XFER-027]<\/code>.<\/li>\n<li>Traces/videos kept on failure; uploaded as CI artifacts.<\/li>\n<\/ul>\n<h2 id=\"d-testing-7-verification-report-per-feature\">7. Verification report (per feature)<\/h2>\n<p><code>/sdd-verify &lt;feature&gt;<\/code> produces <code>sdd/reports/verification/&lt;feature&gt;.md<\/code> from\n<code>sdd/specs/templates/verification-report.template.md<\/code> containing: requirement coverage table\n(ID → tests → result), <code>pnpm verify<\/code> summary, coverage numbers, a11y results, open defects,\ndeviations/CRs, screenshots of key screens (paths), and the sign-off checklist.<\/p>\n<h2 id=\"d-testing-8-defect-severity\">8. Defect severity<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Sev<\/th>\n<th>Definition<\/th>\n<th>Gate impact<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>S1<\/td>\n<td>Money incorrect, security breach, data loss, journey blocked<\/td>\n<td>Blocks gate<\/td>\n<\/tr>\n<tr>\n<td>S2<\/td>\n<td>Feature misbehaves with workaround; a11y serious<\/td>\n<td>Blocks gate unless waived by PO<\/td>\n<\/tr>\n<tr>\n<td>S3<\/td>\n<td>Cosmetic / minor copy<\/td>\n<td>Logged<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-testing-9-external-security-scan-the-gate-before-testing\">9. External security scan — the gate before testing<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Where<\/th>\n<th>What runs<\/th>\n<th>Blocks<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Per feature, after the last task (<code>/sdd-scan F##<\/code>, 🔐 Check Runner)<\/td>\n<td><code>sdd/scripts/scan.mjs F##<\/code>: SonarQube analysis waiting for the <strong>Tidewell Bank<\/strong> gate; OSV-Scanner when <code>SCA_PROVIDER<\/code> is <code>osv-scanner<\/code>/<code>both<\/code>; optional Bob review as SARIF<\/td>\n<td><code>/sdd-verify<\/code> and <code>/sdd-secure<\/code> (step guard) until <code>sdd/reports/scan/F##.json<\/code> is PASS and fresh<\/td>\n<\/tr>\n<tr>\n<td>Every push to a branch other than <code>main<\/code><\/td>\n<td><code>scan.mjs --ci<\/code> in <code>sdd-gates / sonarqube<\/code> (branch analysis), plus the commit policy<\/td>\n<td>nothing yet: an early warning before a pull request exists<\/td>\n<\/tr>\n<tr>\n<td>Every pull request to <code>main<\/code><\/td>\n<td><code>scan.mjs --ci<\/code> in <code>sdd-gates / sonarqube<\/code> (PR analysis)<\/td>\n<td>the merge (required check)<\/td>\n<\/tr>\n<tr>\n<td>Every deployment to the test environment<\/td>\n<td><code>promote-to-test<\/code>: scan <code>main<\/code>, then <code>--gate-only --revision &lt;sha&gt;<\/code><\/td>\n<td><code>deploy-test<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Fresh<\/strong> means the evidence's <code>codeFingerprint<\/code> equals the fingerprint of today's production\n  files (<code>apps/<\/code>, <code>packages/<\/code>, <code>infra/<\/code>, <code>prisma/<\/code>, root manifests; tests excluded). Adding tests while\n  verifying does not invalidate a scan; changing production code does.<\/li>\n<li><strong>Fixing findings<\/strong> is ordirhamy builder work: a <code>T0NN-fix<\/code> task tagged <code>[NFR-SEC-043]<\/code> or\n  <code>[NFR-SEC-044]<\/code>, test-first where a test can demonstrate the flaw.<\/li>\n<li><strong>Accepting risk<\/strong> is human: false positives / accepted issues in SonarQube; dependency CVEs via\n  <code>approve.mjs waiver<\/code> (≤ 90 days). Both appear in the scan report.<\/li>\n<li>The verification report links <code>sdd/reports/scan/F##.md<\/code>; the security report starts from it.<\/li>\n<\/ul>", "toc": [{"id": "d-testing-1-principles", "t": "1. Principles"}, {"id": "d-testing-2-test-pyramid-and-tooling", "t": "2. Test pyramid and tooling"}, {"id": "d-testing-3-coverage-thresholds-enforced-in-vitest-config", "t": "3. Coverage thresholds (enforced in Vitest config)"}, {"id": "d-testing-4-test-data", "t": "4. Test data"}, {"id": "d-testing-5-mandatory-special-tests", "t": "5. Mandatory special tests"}, {"id": "d-testing-6-e2e-conventions", "t": "6. E2E conventions"}, {"id": "d-testing-7-verification-report-per-feature", "t": "7. Verification report (per feature)"}, {"id": "d-testing-8-defect-severity", "t": "8. Defect severity"}, {"id": "d-testing-9-external-security-scan-the-gate-before-testing", "t": "9. External security scan — the gate before testing"}]}, {"k": "seed", "floor": "build", "name": "Seed and Demo Data", "file": "sdd/specs/91-seed-data.md", "html": "<p>All data is <strong>synthetic<\/strong> and generated deterministically (<code>PRNG seed = 20261118<\/code>,\n\"today\" anchored to the real current date at seed time; history generated backwards).\n<code>pnpm db:reset<\/code> must reproduce identical data (NFR-REL-008).<\/p>\n<h2 id=\"d-seed-1-personas-and-credentials-demo-only-printed-by-pnpm-dbseed-and-shown-in-readme\">1. Personas and credentials (demo only — printed by <code>pnpm db:seed<\/code> and shown in README)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Persona<\/th>\n<th>Username<\/th>\n<th>Password<\/th>\n<th>Customer no.<\/th>\n<th>DOB<\/th>\n<th>Mobile<\/th>\n<th>Locale<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sara Haddad<\/td>\n<td><code>sara.haddad<\/code><\/td>\n<td><code>Tidewell-Demo-2026!<\/code><\/td>\n<td>10000001<\/td>\n<td>1992-03-14<\/td>\n<td>+971 55 5504 417<\/td>\n<td>en<\/td>\n<td>Primary demo; trusted device none<\/td>\n<\/tr>\n<tr>\n<td>Daniel Reyes<\/td>\n<td><code>daniel.reyes<\/code><\/td>\n<td><code>Tidewell-Demo-2026!<\/code><\/td>\n<td>10000002<\/td>\n<td>1985-07-02<\/td>\n<td>+971 56 6602 290<\/td>\n<td>en<\/td>\n<td>International transfers; has TOTP (secret printed by seed)<\/td>\n<\/tr>\n<tr>\n<td>Omar Nasser<\/td>\n<td>— (not enrolled)<\/td>\n<td>—<\/td>\n<td>10000003<\/td>\n<td>1964-11-20<\/td>\n<td>+971 58 9903 105<\/td>\n<td>ar<\/td>\n<td>Use for J1 enrolment<\/td>\n<\/tr>\n<tr>\n<td>Layla Karim<\/td>\n<td><code>layla.karim<\/code><\/td>\n<td><code>Tidewell-Demo-2026!<\/code><\/td>\n<td>10000004<\/td>\n<td>1998-01-09<\/td>\n<td>+971 55 5517 788<\/td>\n<td>ar<\/td>\n<td>Arabic-first customer, RTL demos<\/td>\n<\/tr>\n<tr>\n<td>Locked Lou<\/td>\n<td><code>locked.lou<\/code><\/td>\n<td><code>Tidewell-Demo-2026!<\/code><\/td>\n<td>10000005<\/td>\n<td>1979-05-30<\/td>\n<td>+971 55 5520 001<\/td>\n<td>en<\/td>\n<td>Seeded LOCKED for OPS-004<\/td>\n<\/tr>\n<tr>\n<td>Mina Patel<\/td>\n<td><code>mina.ops<\/code><\/td>\n<td><code>Tidewell-Ops-2026!<\/code><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>+971 55 5531 000<\/td>\n<td>en<\/td>\n<td>OPS_AGENT<\/td>\n<\/tr>\n<tr>\n<td>Yusuf Adel<\/td>\n<td><code>yusuf.sup<\/code><\/td>\n<td><code>Tidewell-Ops-2026!<\/code><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>+971 55 5532 000<\/td>\n<td>en<\/td>\n<td>OPS_SUPERVISOR<\/td>\n<\/tr>\n<tr>\n<td>Grace Lim<\/td>\n<td><code>grace.sup<\/code><\/td>\n<td><code>Tidewell-Ops-2026!<\/code><\/td>\n<td>—<\/td>\n<td>—<\/td>\n<td>+971 55 5533 000<\/td>\n<td>en<\/td>\n<td>OPS_SUPERVISOR (second checker)<\/td>\n<\/tr>\n<tr>\n<td>17 background customers<\/td>\n<td><code>cust.NN<\/code><\/td>\n<td>random (not printed)<\/td>\n<td>100000NN<\/td>\n<td>random<\/td>\n<td>random<\/td>\n<td>mixed<\/td>\n<td>Volume for search/perf; some are beneficiaries of others<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Demo OTP <code>000000<\/code> works for seeded users in demo mode only (AUTH-050).<\/p>\n<h2 id=\"d-seed-2-accounts-balances-at-seed-today\">2. Accounts (balances at seed \"today\")<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Owner<\/th>\n<th>Product<\/th>\n<th>Type<\/th>\n<th>Ccy<\/th>\n<th>Balance<\/th>\n<th>Extras<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sara<\/td>\n<td>Everyday Current<\/td>\n<td>CURRENT<\/td>\n<td>AED<\/td>\n<td>34,502.50<\/td>\n<td>overdraft 0; nickname \"Main\"<\/td>\n<\/tr>\n<tr>\n<td>Sara<\/td>\n<td>Smart Saver<\/td>\n<td>SAVINGS<\/td>\n<td>AED<\/td>\n<td>120,000.00<\/td>\n<td>2.75 % p.a. (275 bps)<\/td>\n<\/tr>\n<tr>\n<td>Sara<\/td>\n<td>Global Current<\/td>\n<td>CURRENT<\/td>\n<td>USD<\/td>\n<td>2,150.75<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Sara<\/td>\n<td>Platinum Credit Card<\/td>\n<td>CREDIT_CARD<\/td>\n<td>AED<\/td>\n<td>owed 3,124.00<\/td>\n<td>limit 20,000.00; statement 2,899.00; min due 289.90; due in 17 days<\/td>\n<\/tr>\n<tr>\n<td>Sara<\/td>\n<td>Fixed Deposit 12M<\/td>\n<td>TERM_DEPOSIT<\/td>\n<td>AED<\/td>\n<td>50,000.00<\/td>\n<td>4.10 %; matures in 7 months<\/td>\n<\/tr>\n<tr>\n<td>Daniel<\/td>\n<td>Everyday Current<\/td>\n<td>CURRENT<\/td>\n<td>AED<\/td>\n<td>18,205.00<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Daniel<\/td>\n<td>Global Current<\/td>\n<td>CURRENT<\/td>\n<td>EUR<\/td>\n<td>640.00<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Daniel<\/td>\n<td>Global Current<\/td>\n<td>CURRENT<\/td>\n<td>USD<\/td>\n<td>3,905.10<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Daniel<\/td>\n<td>Home Loan<\/td>\n<td>LOAN<\/td>\n<td>AED<\/td>\n<td>outstanding 384,000.00<\/td>\n<td>instalment 4,200.00 monthly<\/td>\n<\/tr>\n<tr>\n<td>Omar<\/td>\n<td>Pension Current<\/td>\n<td>CURRENT<\/td>\n<td>AED<\/td>\n<td>7,426.00<\/td>\n<td>monthly pension credit on 25th<\/td>\n<\/tr>\n<tr>\n<td>Layla<\/td>\n<td>Everyday Current<\/td>\n<td>CURRENT<\/td>\n<td>AED<\/td>\n<td>2,650.40<\/td>\n<td>near low-balance threshold for J9<\/td>\n<\/tr>\n<tr>\n<td>Layla<\/td>\n<td>Smart Saver<\/td>\n<td>SAVINGS<\/td>\n<td>AED<\/td>\n<td>9,800.00<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Locked Lou<\/td>\n<td>Everyday Current<\/td>\n<td>CURRENT<\/td>\n<td>AED<\/td>\n<td>1,500.00<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Background<\/td>\n<td>1–4 accounts each<\/td>\n<td>mixed<\/td>\n<td>mixed<\/td>\n<td>random<\/td>\n<td>1 FROZEN, 1 DORMANT, 1 CLOSED among them<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>IBANs: <code>buildIban('AE','990', &lt;16-digit account number&gt;)<\/code> — checksum-valid, fictional. Account numbers\nare the last 12 digits of the BBAN.<\/p>\n<h2 id=\"d-seed-3-transaction-history\">3. Transaction history<\/h2>\n<ul>\n<li>24 months for Sara, Daniel, Layla; 12 months for Omar; 6 months for background customers.<\/li>\n<li>Generators per persona: salary/pension credits (monthly, 25th or last business day),\n  rent (Sara, standing order 4,500.00 to \"Ahmad Saleh\" on the 1st), groceries (2–4/week),\n  dining, transport, utilities (via F05 billers), subscriptions, ATM cash, card FX purchases\n  (USD/EUR on travel weeks), interest credits (savings, monthly), fees.<\/li>\n<li>Merchants (fictional, en/ar aliases): Lulu Hypermarket / لولو هايبرماركت, Coffee House / مقهى البيت,\n  Metro Taxi, Book Corner, City Cinema, FitLife Gym, Cloud Music, Pharmacy Plus, AirGulf Travel,\n  StreamBox, Corner Bakery — categories mapped per BR-ACCT-06.<\/li>\n<li>3 pending card authorisations for Sara (one USD), 1 expired hold in history.<\/li>\n<li>Postings for ALL seeded transactions go through <code>ledger.post<\/code> with seed equity journals\n  so <code>pnpm ledger:check<\/code> passes after seed.<\/li>\n<\/ul>\n<h2 id=\"d-seed-4-cards-test-pans-only\">4. Cards (test PANs only)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Owner<\/th>\n<th>Card<\/th>\n<th>Kind/Network<\/th>\n<th>PAN (test range)<\/th>\n<th>Status<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Sara<\/td>\n<td>Debit ••1111<\/td>\n<td>DEBIT / VISA<\/td>\n<td><code>4000 0000 0000 1111<\/code>-style generated from test BIN <code>400000<\/code> (Luhn-valid)<\/td>\n<td>ACTIVE<\/td>\n<\/tr>\n<tr>\n<td>Sara<\/td>\n<td>Credit ••1234<\/td>\n<td>CREDIT / MASTERCARD<\/td>\n<td>test BIN <code>555555<\/code><\/td>\n<td>ACTIVE<\/td>\n<\/tr>\n<tr>\n<td>Daniel<\/td>\n<td>Debit ••2222<\/td>\n<td>DEBIT / VISA<\/td>\n<td>test BIN <code>400000<\/code><\/td>\n<td>FROZEN<\/td>\n<\/tr>\n<tr>\n<td>Layla<\/td>\n<td>Debit ••3333<\/td>\n<td>DEBIT / VISA<\/td>\n<td>test BIN <code>400000<\/code><\/td>\n<td>PENDING_ACTIVATION (replacement)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Only BINs <code>400000<\/code> and <code>555555<\/code> are permitted (NFR-PRIV-002). CVCs random 3 digits, encrypted.<\/p>\n<h2 id=\"d-seed-5-reference-data\">5. Reference data<\/h2>\n<ul>\n<li><strong>Domestic banks<\/strong> (invented names and codes; any resemblance to real institutions is\n  coincidental): IBAN bank code 990 Tidewell Bank, 991 Northbay Lantern Bank, 992 Gulf Lantern Bank,\n  993 Crescent Lantern Savings, 994 Pearl Lantern Commercial Bank.<\/li>\n<li><strong>BIC directory<\/strong> — all fictional BICs are <strong>ISO 9362 test BICs<\/strong> (second character of the\n  location code is <code>0<\/code>), so they can never collide with a live institution:\n  <code>TDWLAEA0<\/code> (Tidewell Bank), <code>NBKXAEA0<\/code> (Northbay Lantern Bank), <code>KSTRDEF0<\/code> (Kestrel Demo Bank, Frankfurt),\n  <code>THMSGB20<\/code> (Thames Harbour Demo Bank, London), <code>HDSNUS30<\/code> (Hudson Lantern Demo Bank, New York),\n  <code>DSRTKWK0<\/code> (Desert Rose Demo Bank, Kuwait City), <code>OASSSAR0<\/code> (Oasis Crest Demo Bank, Riyadh),\n  <code>CHRYJPJ0<\/code> (Cherry Blossom Demo Trust, Tokyo).<\/li>\n<li><strong>FX mid rates (illustrative, AED per unit)<\/strong>: USD 3.6725 · EUR 3.9840 · GBP 4.6540 ·\n  KWD 11.9620 · SAR 0.9793 · BHD 9.7410 · JPY 0.02405.<\/li>\n<li><strong>Holidays<\/strong>: 6 fictional/generic public holidays in the next 12 months + any in the past\n  24 months used by history; editable in <code>prisma/seed/reference/holidays.json<\/code>.<\/li>\n<li><strong>Billers<\/strong>: per F05 §2.1; each saved biller for Sara has a current bill (AquaGrid 374.50 due in 9 days; Coastline postpaid 180.00; FiberLink 225.00 overdue).<\/li>\n<li><strong>Purpose codes<\/strong>: per BR-XFER-08.<\/li>\n<\/ul>\n<h2 id=\"d-seed-6-pre-seeded-scenario-states-so-every-journey-is-demoable-immediately\">6. Pre-seeded scenario states (so every journey is demoable immediately)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Scenario<\/th>\n<th>Data<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beneficiaries for Sara<\/td>\n<td>Ahmad Saleh (DOMESTIC, NBKX, landlord, 400 days old), Mum — Huda Haddad (INTERNAL, favourite), Salma Nour (DOMESTIC, created 3 h ago → cooling-off), Lena Reyes (INTERNATIONAL, Germany, EUR)<\/td>\n<\/tr>\n<tr>\n<td>Beneficiaries for Daniel<\/td>\n<td>Maria Reyes (INTERNATIONAL, US, USD, account+BIC), Carlos Reyes (INTERNATIONAL, DE IBAN, EUR)<\/td>\n<\/tr>\n<tr>\n<td>Scheduled<\/td>\n<td>Sara: one-off 750.00 to Mum in 6 days; standing order rent monthly 1st<\/td>\n<\/tr>\n<tr>\n<td>Held for review<\/td>\n<td>1 Daniel transfer <code>HELD_FOR_REVIEW<\/code> (FR-1) aged 5 h, no recommendation<\/td>\n<\/tr>\n<tr>\n<td>Notifications<\/td>\n<td>Sara: 3 unread (new device sign-in, statement ready, payment completed)<\/td>\n<\/tr>\n<tr>\n<td>Messages<\/td>\n<td>Sara: 1 open thread \"Card replacement timing\" awaiting customer; 1 closed<\/td>\n<\/tr>\n<tr>\n<td>Statements<\/td>\n<td>12 monthly statements per deposit/credit account for Sara &amp; Daniel<\/td>\n<\/tr>\n<tr>\n<td>Alerts<\/td>\n<td>Layla: LOW_BALANCE threshold 2,500.00 on Everyday Current<\/td>\n<\/tr>\n<tr>\n<td>Locked user<\/td>\n<td>Locked Lou status LOCKED (10 failed attempts yesterday)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-seed-7-demo-markers-and-toggles-demo-mode-only\">7. Demo markers and toggles (demo mode only)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Marker<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reference contains <code>DEMO-REJECT<\/code><\/td>\n<td>Rail rejects (domestic <code>BENEFICIARY_ACCOUNT_CLOSED<\/code>, SWIFT <code>INTERMEDIARY_BANK_REJECTED<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Reference contains <code>DEMO-RETURN<\/code><\/td>\n<td>Completes then RETURNED 10 s later<\/td>\n<\/tr>\n<tr>\n<td>Reference contains <code>DEMO-REVIEW<\/code><\/td>\n<td>Fraud rule FR-4 → HELD_FOR_REVIEW<\/td>\n<\/tr>\n<tr>\n<td>IBAN ending <code>0000<\/code><\/td>\n<td>Name check UNAVAILABLE<\/td>\n<\/tr>\n<tr>\n<td>Biller reference ending <code>999<\/code><\/td>\n<td><code>BILLER_REFERENCE_NOT_FOUND<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>PUT /dev/faults<\/code><\/td>\n<td>fx / billers / cardProcessor / notifications / insights down<\/td>\n<\/tr>\n<tr>\n<td><code>PUT /dev/clock<\/code><\/td>\n<td>Advance server clock (timeouts, scheduled transfers, statements)<\/td>\n<\/tr>\n<tr>\n<td><code>POST /dev/jobs/run<\/code><\/td>\n<td>Run any job now<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": [{"id": "d-seed-1-personas-and-credentials-demo-only-printed-by-pnpm-dbseed-and-shown-in-readme", "t": "1. Personas and credentials (demo only — printed by pnpm db:seed and shown in README)"}, {"id": "d-seed-2-accounts-balances-at-seed-today", "t": "2. Accounts (balances at seed \"today\")"}, {"id": "d-seed-3-transaction-history", "t": "3. Transaction history"}, {"id": "d-seed-4-cards-test-pans-only", "t": "4. Cards (test PANs only)"}, {"id": "d-seed-5-reference-data", "t": "5. Reference data"}, {"id": "d-seed-6-pre-seeded-scenario-states-so-every-journey-is-demoable-immediately", "t": "6. Pre-seeded scenario states (so every journey is demoable immediately)"}, {"id": "d-seed-7-demo-markers-and-toggles-demo-mode-only", "t": "7. Demo markers and toggles (demo mode only)"}]}, {"k": "plan", "floor": "build", "name": "Delivery Plan and Phase Gates", "file": "sdd/specs/92-delivery-plan.md", "html": "<p>This file is the <strong>execution order<\/strong> for Bob. The <code>/sdd-prototype<\/code> command and the\n🎼 SDD Conductor mode walk through it phase by phase. A phase starts only when the previous\ngate is approved by a human (Constitution Art. IX).<\/p>\n<h2 id=\"d-plan-1-per-feature-loop-applies-inside-every-phase\">1. Per-feature loop (applies inside every phase)<\/h2>\n<pre><code class=\"language-mermaid\">flowchart LR\n  A[spec.md Approved] --&gt; B[/sdd-clarify F##/]\n  B --&gt;|questions answered, log updated| C[/sdd-plan F##/]\n  C --&gt; G1{{Human: approve plan}}\n  G1 --&gt;|approved| D[/sdd-tasks F##/]\n  D --&gt; E[/sdd-implement F##/]\n  E --&gt;|gap found| CR[/sdd-change-request/] --&gt; G2{{Human decision}} --&gt; A\n  E --&gt; SC[/sdd-scan F##/]\n  SC --&gt;|SonarQube gate or CVE fails| E\n  SC --&gt;|PASS, fresh| F[/sdd-verify F##/]\n  F --&gt;|failures| E\n  F --&gt; S[/sdd-secure F##/]\n  S --&gt;|High/Critical findings| E\n  S --&gt; H[traceability + report updated]\n<\/code><\/pre>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Step<\/th>\n<th>Mode<\/th>\n<th>Output<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Clarify<\/td>\n<td>📐 Spec Architect<\/td>\n<td>Clarifications log rows in <code>spec.md<\/code> (no behaviour change without CR)<\/td>\n<\/tr>\n<tr>\n<td>Plan<\/td>\n<td>📐 Spec Architect<\/td>\n<td><code>sdd/specs/features/F##/plan.md<\/code> (template) incl. Constitution check<\/td>\n<\/tr>\n<tr>\n<td>Tasks<\/td>\n<td>📐 Spec Architect<\/td>\n<td><code>sdd/specs/features/F##/tasks.md<\/code> with T-IDs, Req refs, DoD<\/td>\n<\/tr>\n<tr>\n<td>Implement<\/td>\n<td>🏗️ Spec Builder<\/td>\n<td>Code + tests, one commit per task<\/td>\n<\/tr>\n<tr>\n<td><strong>Scan<\/strong><\/td>\n<td>🔐 Check Runner<\/td>\n<td><code>sdd/reports/scan/F##.json<\/code> + <code>.md<\/code> from SonarQube (+ SCA, optional Bob SARIF) — <strong>required before testing<\/strong> (Article XI)<\/td>\n<\/tr>\n<tr>\n<td>Verify<\/td>\n<td>🔍 Spec Verifier<\/td>\n<td><code>sdd/reports/verification/F##.md<\/code>, updated <code>sdd/traceability/matrix.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>Secure<\/td>\n<td>🛡️ Security Reviewer<\/td>\n<td><code>sdd/reports/security/F##.md<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Promotion rule.<\/strong> \"Promotion to testing\" means <code>/sdd-verify<\/code> locally and the <code>test<\/code> environment\nin CI. Both require a passing external scan of the exact code being promoted: the step guard checks\n<code>sdd/reports/scan/F##.json<\/code> against the current code fingerprint; <code>sdd-gates / sonarqube<\/code> gates the\nmerge; <code>promote-to-test<\/code> re-scans <code>main<\/code> and confirms the gate for that commit before <code>deploy-test<\/code>.\nA feature is <em>done<\/em> only while its scan evidence is still fresh, so every phase gate implies a\ncurrent PASS for every feature in the phase.<\/p>\n<h2 id=\"d-plan-2-phases\">2. Phases<\/h2>\n<h3 id=\"d-plan-phase-0-foundation\">Phase 0 — Foundation<\/h3>\n<ul>\n<li><strong>Features:<\/strong> F00 (plan &amp; tasks are provided — a human reviews and approves the plan with\n  <code>approve.mjs plan F00<\/code>; then skip straight to Implement).<\/li>\n<li><strong>Demo at gate:<\/strong> shell in en/ar, light/dark, demo banner, dev outbox, <code>pnpm verify<\/code> output.<\/li>\n<li><strong>Gate checklist:<\/strong><\/li>\n<li>[ ] <code>pnpm verify<\/code> green from clean clone (FND-001-AC1 timing recorded)<\/li>\n<li>[ ] Scanner chosen in <code>sdd/governance/checks.json<\/code> (built-in checks; or SonarQube set up per <code>sdd/docs/SONARQUBE.md<\/code>); the bank's own tools switched on where wanted (<code>sdd/docs/CHECKS.md<\/code>); <code>sdd/reports/scan/F00.md<\/code> PASS<\/li>\n<li>[ ] All FND requirements covered in matrix<\/li>\n<li>[ ] ADR-0001 resolved versions filled<\/li>\n<li>[ ] <code>sdd/reports/verification/F00.md<\/code> written<\/li>\n<li>[ ] Human approval recorded below<\/li>\n<\/ul>\n<h3 id=\"d-plan-phase-1-identity\">Phase 1 — Identity<\/h3>\n<ul>\n<li><strong>Features:<\/strong> F01 (all P1; P2 items AUTH-004/005/012 may slip to Phase 4).<\/li>\n<li><strong>Journeys:<\/strong> J1, J2 (sign-in part).<\/li>\n<li><strong>Gate checklist:<\/strong><\/li>\n<li>[ ] Verification + security reports for F01; no open High/Critical<\/li>\n<li>[ ] Lockout, timeout modal, cross-tab sign-out demoed<\/li>\n<li>[ ] AuthZ/CSRF matrix tests in place (they will grow with each feature)<\/li>\n<li>[ ] Human approval<\/li>\n<\/ul>\n<h3 id=\"d-plan-phase-2-accounts-dashboard\">Phase 2 — Accounts &amp; Dashboard<\/h3>\n<ul>\n<li><strong>Features:<\/strong> F03 (P1, P2), F02 (P1; DASH-008/011/013 P2 may follow in Phase 4).<\/li>\n<li><strong>Journeys:<\/strong> J2 complete.<\/li>\n<li><strong>Gate checklist:<\/strong><\/li>\n<li>[ ] NFR-PERF-002 EXPLAIN tests pass on seed volume<\/li>\n<li>[ ] Ledger check after seed; statement-ready data present<\/li>\n<li>[ ] a11y sweep on dashboard/accounts in both locales<\/li>\n<li>[ ] Human approval<\/li>\n<\/ul>\n<h3 id=\"d-plan-phase-3-money-movement-core\">Phase 3 — Money movement (core)<\/h3>\n<ul>\n<li><strong>Features:<\/strong> F04 P1 requirements (own, FX own, internal, domestic, beneficiaries, scheduled, history, receipt, failures).<\/li>\n<li><strong>Journeys:<\/strong> J3, J4.<\/li>\n<li><strong>Gate checklist:<\/strong><\/li>\n<li>[ ] Concurrency + idempotency storms green 20× (NFR-REL-002/003)<\/li>\n<li>[ ] Step-up binding matrix green<\/li>\n<li>[ ] Receipts PDF reviewed by PO<\/li>\n<li>[ ] Security review focusing on payments (checklist §Payments) — no High/Critical<\/li>\n<li>[ ] SonarQube: every hotspot in <code>apps/api/src/modules/payments<\/code> and <code>ledger<\/code> reviewed by a human<\/li>\n<li>[ ] Human approval<\/li>\n<\/ul>\n<h3 id=\"d-plan-phase-4-profile-security-settings-notifications\">Phase 4 — Profile, security settings, notifications<\/h3>\n<ul>\n<li><strong>Features:<\/strong> F09 (all), F08 (all), slipped P2 items from F01/F02.<\/li>\n<li><strong>Journeys:<\/strong> J9, J10.<\/li>\n<li><strong>Gate checklist:<\/strong><\/li>\n<li>[ ] Mandatory alerts locked; SSE replay test<\/li>\n<li>[ ] ATO review (contact change + password + device) — no High/Critical<\/li>\n<li>[ ] Human approval<\/li>\n<\/ul>\n<h3 id=\"d-plan-phase-5-everyday-banking-breadth\">Phase 5 — Everyday banking breadth<\/h3>\n<ul>\n<li><strong>Features:<\/strong> F04 P2 (international, standing orders, limits, repeat), F05, F06, F07.<\/li>\n<li><strong>Journeys:<\/strong> J5, J6, J7, J8.<\/li>\n<li><strong>Gate checklist:<\/strong><\/li>\n<li>[ ] Statement reconciliation property test green<\/li>\n<li>[ ] Card reveal leak tests green; PAN vault encryption verified<\/li>\n<li>[ ] Biller/FX/card-processor fault toggles demoed (NFR-REL-005)<\/li>\n<li>[ ] Human approval<\/li>\n<\/ul>\n<h3 id=\"d-plan-phase-6-service-operations-p3-stretch\">Phase 6 — Service &amp; operations (P3, stretch)<\/h3>\n<ul>\n<li><strong>Features:<\/strong> F10, F11.<\/li>\n<li><strong>Journeys:<\/strong> J11, J12.<\/li>\n<li><strong>Gate checklist:<\/strong><\/li>\n<li>[ ] Role matrix + maker-checker tests green<\/li>\n<li>[ ] Attachment security tests green<\/li>\n<li>[ ] Human approval<\/li>\n<\/ul>\n<h3 id=\"d-plan-phase-7-hardening-demo-readiness\">Phase 7 — Hardening &amp; demo readiness<\/h3>\n<ul>\n<li><strong>Scope:<\/strong> NFR verification sweep (perf scripts, Lighthouse, full a11y incl. manual SR smoke,\n  dependency/secret scans), polish backlog (S3 defects), demo script rehearsal.<\/li>\n<li><strong>Gate checklist:<\/strong><\/li>\n<li>[ ] All NFRs verified or waived with PO signature in <code>sdd/reports/verification/NFR.md<\/code><\/li>\n<li>[ ] <code>sdd/traceability/matrix.md<\/code>: 0 uncovered P1/P2<\/li>\n<li>[ ] <code>sdd/reports/security/final.md<\/code>: 0 open High/Critical<\/li>\n<li>[ ] SonarQube on <code>main<\/code>: 0 open vulnerabilities on overall code, 100 % hotspots reviewed; SCA: 0 unwaived High/Critical; every waiver re-reviewed<\/li>\n<li>[ ] Demo script (<code>sdd/design/user-flows.md<\/code> §5) executed end-to-end without intervention<\/li>\n<li>[ ] Human approval → prototype release tag <code>v1.0.0-prototype<\/code><\/li>\n<\/ul>\n<h2 id=\"d-plan-3-gate-approvals\">3. Gate approvals<\/h2>\n<p>The loop and its gates are defined as workflows in <code>sdd/workflows/<\/code> (feature-delivery, change-request,\nphase-gate). The <strong>machine record<\/strong> is <code>sdd/state/approvals.json<\/code>, written only from a person's sign-off: by\ndefault a comment on the phase pull request — <code>/approve-phase &lt;n&gt;<\/code> (plans: <code>/approve-plan F##<\/code>; change\nrequests: <code>/approve-cr CR-### option A<\/code> or <code>/reject-cr<\/code>; dependency-CVE waivers by AppSec:\n<code>/accept-risk &lt;ID&gt; F## until &lt;date&gt; because …<\/code>, ≤ 90 days) — recorded by the sign-off workflow after checking\n<code>sdd/governance/approvers.json<\/code>, and re-verified against the comment by the <code>signoffs<\/code> check. Where the\nrepository takes terminal sign-offs, the same decisions are <code>node sdd/scripts/approve.mjs phase &lt;n&gt;<\/code> etc.\nPlan approvals are bound to the SHA-256 of the plan <strong>and<\/strong> of the feature's <code>spec.md<\/code>, so editing\neither voids the approval (spec lock, Article I.4). Re-approving after a spec change needs a change\nrequest approved since the previous approval, or an explicit, recorded <code>--override \"&lt;reason&gt;\"<\/code>. Bob reads the current phase from that file (via the\n<code>[SDD STATE]<\/code> hook) and cannot write it. The table below is an optional human-readable log.<\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Date<\/th>\n<th>Approver<\/th>\n<th>Decision<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-plan-4-branching-commits\">4. Branching &amp; commits<\/h2>\n<ul>\n<li>Branch per phase: <code>phase/&lt;n&gt;-&lt;slug&gt;<\/code>, with a <strong>draft pull request into <code>main<\/code> from the start<\/strong>: it collects\n  the phase's commits and every sign-off comment, runs the checks (<code>sdd-policy<\/code>, <code>signoffs<\/code>, <code>sonarqube<\/code>) on\n  each push and gets Bob's advisory review once it is ready. A person pushes and opens it (Bob's\n  <code>/create-pull-request<\/code> fills in the template); Bob never pushes, merges or signs. Merge after the phase\n  sign-off, with a merge commit (no squash).<\/li>\n<li>Conventional Commits with task and requirement refs: <code>feat(F04): T012 limits engine [XFER-021]<\/code>.<\/li>\n<li>Tags: <code>phase-&lt;n&gt;-approved<\/code> after each gate.<\/li>\n<\/ul>\n<h2 id=\"d-plan-5-autonomy-guidance-for-bob\">5. Autonomy guidance for Bob<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Bob may proceed autonomously?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Implementing a task whose DoD is clear<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Choosing a library not in SPEC-02 §4<\/td>\n<td>No — propose in plan with justification<\/td>\n<\/tr>\n<tr>\n<td>Spec ambiguity that changes behaviour<\/td>\n<td>No — <code>/sdd-change-request<\/code><\/td>\n<\/tr>\n<tr>\n<td>Spec ambiguity that is purely presentational (spacing, icon choice within Carbon)<\/td>\n<td>Yes — note in commit<\/td>\n<\/tr>\n<tr>\n<td>Failing test unrelated to current task<\/td>\n<td>Fix if trivial (&lt; 15 min) else log defect and continue<\/td>\n<\/tr>\n<tr>\n<td>Lowering a threshold / skipping a test<\/td>\n<td>Never<\/td>\n<\/tr>\n<tr>\n<td>Editing constitution, NFR, ADR decision, contract (in Builder mode)<\/td>\n<td>Never (mode-enforced)<\/td>\n<\/tr>\n<tr>\n<td>Writing any file without an active step<\/td>\n<td>Never (hook-enforced)<\/td>\n<\/tr>\n<tr>\n<td>Approving a plan, phase or change request<\/td>\n<td>Never (human-only: sign-off comments are refused from bots, the hook blocks <code>approve.mjs<\/code>, the GitHub scripts and any sign-off command Bob might post, and <code>signoffs<\/code> re-verifies each record)<\/td>\n<\/tr>\n<tr>\n<td>Reviewing a pull request (advisory)<\/td>\n<td>Yes — 🔎 SDD PR Reviewer runs headless on GitHub; findings only<\/td>\n<\/tr>\n<tr>\n<td>Pushing fixes to a pull request<\/td>\n<td>Only when a developer comments <code>/bob fix F## …<\/code>; inside that feature's implement step, re-checked before the workflow pushes<\/td>\n<\/tr>\n<tr>\n<td>Changing an approved spec, a foundation spec, an NFR or the contract outside planning<\/td>\n<td>Never directly — only <code>/sdd-apply-cr<\/code> for a human-approved CR (step guard + git rule G9)<\/td>\n<\/tr>\n<tr>\n<td>Running the external scan when a feature's tasks are done<\/td>\n<td>Yes — <code>/sdd-scan F##<\/code> in 🔐 Check Runner<\/td>\n<\/tr>\n<tr>\n<td>Fixing SonarQube findings or upgrading a vulnerable dependency<\/td>\n<td>Yes — as <code>T0NN-fix<\/code> tasks in 🏗️ Spec Builder<\/td>\n<\/tr>\n<tr>\n<td>Marking a SonarQube issue/hotspot safe, waiving a CVE, adding <code>NOSONAR<\/code>, changing the scan scope or gate<\/td>\n<td>Never (human-only; read-only MCP, hook, git rule G8, CODEOWNERS)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-plan-6-how-the-cycle-is-enforced\">6. How the cycle is enforced<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Layer<\/th>\n<th>Mechanism<\/th>\n<th>Stops<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1 Front door<\/td>\n<td>Built-in Agent/Plan/Ask overridden as read-only routers (<code>.bob/custom_modes.yaml<\/code>)<\/td>\n<td>Work starting in the \"wrong\" mode<\/td>\n<\/tr>\n<tr>\n<td>2 Context<\/td>\n<td><code>UserPromptSubmit<\/code> hook injects <code>[SDD STATE]<\/code> into every prompt<\/td>\n<td>Modes losing track of phase/step<\/td>\n<\/tr>\n<tr>\n<td>3 Who<\/td>\n<td>Per-mode <code>fileRegex<\/code> edit permissions<\/td>\n<td>e.g. Builder editing specs<\/td>\n<\/tr>\n<tr>\n<td>4 When<\/td>\n<td><code>step.mjs<\/code> preconditions + <code>PreToolUse<\/code> hook write scope per active step<\/td>\n<td>e.g. coding before plan approval, verifying with open tasks<\/td>\n<\/tr>\n<tr>\n<td>5 Humans<\/td>\n<td>Hash-bound sign-offs from people: pull-request comments checked against <code>sdd/governance/approvers.json<\/code> on the default branch (or interactive <code>approve.mjs<\/code>); a plan sign-off also locks the feature's <code>spec.md<\/code><\/td>\n<td>Bob self-approving; requirements changing after sign-off<\/td>\n<\/tr>\n<tr>\n<td>6 External verdict<\/td>\n<td>SonarQube quality gate + SCA via <code>scan.mjs<\/code>, evidence bound to a code fingerprint; read-only SonarQube MCP; <code>NOSONAR<\/code>/scope/evidence writes denied<\/td>\n<td>Untested code reaching testing, Bob grading its own work, hiding findings<\/td>\n<\/tr>\n<tr>\n<td>7 Backstop<\/td>\n<td><code>commit-msg<\/code> hook (G1–G9) + <code>sdd-gates<\/code> CI on every push and pull request (<code>sdd-policy<\/code>, <code>signoffs<\/code> — each sign-off re-verified against its GitHub comment — and <code>sonarqube<\/code>) + <code>promote-to-test<\/code> (re-checks what reached <code>main<\/code>) + CODEOWNERS + the <code>sdd-main<\/code> ruleset + optional GitHub push rules; Bob's advisory review on every ready pull request<\/td>\n<td>Manual edits, other tools, <code>--no-verify<\/code>, hand-written sign-offs, spec edits without a CR, deploying unscanned commits<\/td>\n<\/tr>\n<tr>\n<td>8 Org<\/td>\n<td>Bob enterprise policy <code>EnforcedHooks<\/code>, <code>DisabledAutoApprovalGroups<\/code> (<code>sdd/docs/enterprise-policy.sample.json<\/code>)<\/td>\n<td>Users removing hooks or auto-approving mode switches<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": [{"id": "d-plan-1-per-feature-loop-applies-inside-every-phase", "t": "1. Per-feature loop (applies inside every phase)"}, {"id": "d-plan-2-phases", "t": "2. Phases"}, {"id": "d-plan-3-gate-approvals", "t": "3. Gate approvals"}, {"id": "d-plan-4-branching-commits", "t": "4. Branching & commits"}, {"id": "d-plan-5-autonomy-guidance-for-bob", "t": "5. Autonomy guidance for Bob"}, {"id": "d-plan-6-how-the-cycle-is-enforced", "t": "6. How the cycle is enforced"}]}]}}</script>

/* ---------- 3D isometric stack: the signed-layer tower, reused for Bob's autonomy layers ---------- */
function isoStack(host,layers,o={}){
 const W=o.w||200,T=o.t||26,G=o.gap||6;let z=0;const zs=[];
 layers.forEach((L,i)=>{if(L.gate){z+=10;zs.push(z);z+=12}else{zs.push(z);z+=T+G}});
 host.innerHTML=`<div class="iso" tabindex="0" role="group" aria-label="${esc(o.label||'3D diagram')}. Use left and right arrows to turn it." style="--h:${o.h||460}px;--top:${o.top||'64%'}"><div class="stage"><div class="shadow" style="--w:${W}px"></div>${layers.map((L,i)=>`<div class="lay" style="--i:${i}"><div class="slab${L.gate?' gate':''}" data-i="${i}" style="--w:${L.gate?W*1.14:W}px;--t:${L.gate?0:T}px;--z:${zs[i]}px;--c:${L.color}"><div class="f top">${L.icon?icon(L.icon):''}</div><div class="f fn"></div><div class="f fs"></div><div class="f fe"></div><div class="f fw"></div></div></div>`).join('')}</div></div>`;
 const iso=$('.iso',host),stage=$('.stage',iso),slabs=$$('.slab',iso);let rz=o.rz??-38,base=rz,drag=null,moved=0,raf=0,t0=performance.now(),hl=-1;
 const shade=()=>{const a=rz*Math.PI/180,L=[-.75,.66],n={dn:[0,-1],ds:[0,1],de:[1,0],dw:[-1,0]};
  for(const k in n){const[x,y]=n[k],xr=x*Math.cos(a)-y*Math.sin(a),yr=x*Math.sin(a)+y*Math.cos(a),d=Math.max(0,xr*L[0]+yr*L[1]);stage.style.setProperty('--'+k,(0.42-0.36*d).toFixed(3))}};
 const apply=()=>{stage.style.setProperty('--rz',rz.toFixed(2)+'deg');shade()};
 const tick=now=>{if(!drag&&!RM&&!o.still){rz=base+9*Math.sin((now-t0)/2600)}apply();raf=requestAnimationFrame(tick)};
 apply();if(!RM&&!o.still)raf=requestAnimationFrame(tick);
 iso.addEventListener('pointerdown',e=>{drag={x:e.clientX,r:rz};moved=0;iso.setPointerCapture(e.pointerId);iso.classList.add('drag')});
 iso.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;moved=Math.max(moved,Math.abs(dx));rz=drag.r+dx*.45;apply()});
 const up=e=>{if(!drag)return;iso.classList.remove('drag');drag=null;base=rz;t0=performance.now();
  if(moved<4&&o.onPick){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slab');if(el)o.onPick(+el.dataset.i)}};
 iso.addEventListener('pointerup',up);iso.addEventListener('pointercancel',()=>{drag=null;iso.classList.remove('drag')});
 iso.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();base+=e.key==='ArrowLeft'?-15:15;rz=base;t0=performance.now();apply()}});
 const highlight=i=>{hl=i;slabs.forEach((s,j)=>{const lift=i<0?0:j>i?34:j===i?14:0;s.style.transform=`translateZ(${zs[j]+lift}px)`;s.classList.toggle('on',j===i)})};
 return {highlight,stop(){cancelAnimationFrame(raf)}};
}

// Code named in running text (a command, a file, a flag, a slash command) is set as inline code, so it stands out.
// Runs on every page and on whatever a page adds later; text already in code, terminals, tags and drawings is left alone.
const CODE_RE=/node\s+sdd\/[\w./-]+(?:\s+(?:pr|show|plan|list|status|next|--[\w-]+|F\d\d))*|\bsdd\/[\w./…#-]*[\w/]|\.bob\/[\w./-]*|\b[\w-]+\.(?:mjs|json|ya?ml|md|sh|sarif|properties)\b|--[a-z][a-z-]*[a-z]|\bgit (?:push|commit|clone|config)\b|\bbob run\b|\b(?:BOB_API_KEY|SONAR_[A-Z_]+)\b|\/(?:sdd-[a-z-]*[a-z]|approve-[a-z]+|accept-risk|revoke|bob [a-z]+)(?: F\d\d)?/g;
const CODE_SKIP='code,pre,kbd,samp,svg,script,style,textarea,input,select,.tag,.term,.mono,.nocode';
function codify(root){
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),todo=[];let n;
 while((n=w.nextNode())){const p=n.parentElement;if(!p||p.closest(CODE_SKIP))continue;CODE_RE.lastIndex=0;if(CODE_RE.test(n.data))todo.push(n)}
 for(const t of todo){const s=t.data,f=document.createDocumentFragment();let last=0,m;CODE_RE.lastIndex=0;
  while((m=CODE_RE.exec(s))){const pre=s[m.index-1]||' ';if(/[\w/@.-]/.test(pre)&&!/^(sdd|node)/.test(m[0]))continue;
   if(m.index>last)f.append(s.slice(last,m.index));const c=document.createElement('code');c.textContent=m[0];if(m[0].length<=28)c.className='nw';f.append(c);last=m.index+m[0].length}
  if(last){if(last<s.length)f.append(s.slice(last));t.replaceWith(f)}}
}

P.sdlc={title:'SDLC meets SDD',render(){return `<div class="wrap"><p class="eyebrow">How it fits</p><h1>Your SDLC, with spec-driven development inside it</h1>
 <p class="lede">Nothing in the bank's life cycle disappears. What changes is what each phase produces (a written, checkable artifact), who does the writing (Bob, in a mode limited to that phase) and where the checks run (as the work is written first, then again in the pipeline).</p>

 <div class="flipgrid" id="sdlcgrid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))">${SDLC.map((r,i)=>`<div class="flip${SDLCV==='sdd'?' on':''}" style="min-height:300px"><button class="inner" type="button" aria-label="${r[0]}: show ${SDLCV==='sdd'?'before':'with SDD'}" style="min-height:300px">
 <span class="face"><span class="label">0${i+1} · Before</span><h3 style="margin-top:8px">${r[0]}</h3><p class="muted">${r[1]}</p><span class="tag outline" style="margin-top:auto;align-self:flex-start">Evidence: scattered</span></span>
 <span class="face back"><span class="label">With SDD and Bob</span><h3 style="margin-top:8px">${r[0]}</h3><p>${r[2]}</p><span style="margin-top:auto"><code>${esc(r[3])}</code></span><span class="tag hum" style="margin-top:12px;align-self:flex-start">${icon('pen')}${r[4]}</span></span></button></div>`).join('')}</div>
 <h2>Two loops, one set of rules</h2><p class="sub">The inner loop is where the team works with Bob, in the Bob IDE or Bob Shell: every write, commit and test is checked within minutes, before anything is pushed. The outer loop starts with the push: the same checks run again in the pipeline, where nobody can switch them off. Select any stop.</p>
 <div class="panel" style="padding:16px"><div class="fig" id="loops"></div></div>
 <div class="notif info" id="loopinfo" aria-live="polite" style="margin-top:1px">${icon('info')}<div><b>Bob writes.</b> ${LOOPN.inner[0][3]}</div></div>
 <div class="tgrid g2" style="margin-top:32px"><div class="tile" style="padding:24px"><span class="tag bob">Inner loop · working with Bob · minutes</span><p style="margin-top:16px">Catches problems while they are cheap, in the same minute they are made, for everyone who works with Bob: analyst, architect, developer and tester. A refused write or commit comes with the reason and the fix.</p></div>

function drawLoops(host,onPick){
 let raf=0,paths=[],W=0;const col={bob:'var(--bob)',hum:'var(--hum)',tool:'var(--tool)',pipe:'var(--pipe)'};
 function track(x,y,w,h,nodes,title,horiz,key,foot,tx=x){const r=20;let s='';

   :`M${x+r} ${y}Q${x} ${y} ${x} ${y+r}V${y+h-r}Q${x} ${y+h} ${x+r} ${y+h}H${x+w-r}Q${x+w} ${y+h} ${x+w} ${y+h-r}V${y+r}Q${x+w} ${y} ${x+w-r} ${y}Z`;

  if(foot)s+=horiz?`<text x="${x+w/2}" y="${y+h-14}" text-anchor="middle" font-size="12" fill="var(--ts)">${foot}</text>`:'';
  nodes.forEach((n,i)=>{let cx,cy,lx,ly,anc;
   if(horiz){cx=x+w*(i+.5)/nodes.length;cy=y;lx=cx;ly=y+38;anc='middle'}
   else{cx=x;cy=y+36+i*((h-72)/(nodes.length-1||1));lx=x+30;ly=cy-2;anc='start'}

   <text x="${lx}" y="${ly}" text-anchor="${anc}" font-size="14" font-weight="600" fill="var(--tp)">${esc(n[0])}</text><text x="${lx}" y="${ly+17}" text-anchor="${anc}" font-size="12" fill="var(--ts)">${esc(n[1])}</text></g>`});

   `<path d="M52 ${40+hi+4}V${y2-4}" stroke="var(--bst)" stroke-width="2" marker-end="url(#ah)"/><text x="66" y="${40+hi+28}" font-size="12" fill="var(--ts)">git push</text>`}
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="group" aria-label="Inner and outer loop"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--bst)"/></marker></defs>${s}<circle id="dot-in" r="6" fill="var(--bob)"/><circle id="dot-out" r="6" fill="var(--pipe)"/></svg>`;
