<code>fromDecimalString(\"1200.5\",\"JPY\")<\/code><\/td>\n<td>throws (JPY has no decimals)<\/td>\n<\/tr>\n<tr>\n<td><code>toDecimalString(5n,\"EUR\")<\/code><\/td>\n<td><code>\"0.05\"<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>toDecimalString(-1250500n,\"AED\")<\/code><\/td>\n<td><code>\"-12505.00\"<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>toDecimalString(-1250500n,\"KWD\")<\/code><\/td>\n<td><code>\"-1250.500\"<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>AED 1000.00 × 0.2709 (→USD)<\/code> HALF_EVEN<\/td>\n<td><code>USD 270.90<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>AED 0.05 × 0.2709<\/code><\/td>\n<td><code>USD 0.01<\/code> (0.013545 → 0.01)<\/td>\n<\/tr>\n<tr>\n<td><code>USD 0.125 → round HALF_EVEN to 2dp<\/code><\/td>\n<td><code>0.12<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>USD 0.135 → round HALF_EVEN to 2dp<\/code><\/td>\n<td><code>0.14<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>allocate(AED 10.00,[1,1,1])<\/code><\/td>\n<td><code>[3.34, 3.33, 3.33]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>allocate(KWD 10.000,[1,1,1])<\/code><\/td>\n<td><code>[3.334, 3.333, 3.333]<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-dom-cur-display-en\">Display (en)<\/h2>\n<p><code>AED 12,505.00<\/code> · <code>USD 19.99<\/code> · <code>JPY 1,200<\/code> · negative <code>−AED 125.00<\/code> (U+2212 in UI).<\/p>", "toc": [{"id": "d-dom-cur-must-pass-unit-cases", "t": "Must-pass unit cases"}, {"id": "d-dom-cur-display-en", "t": "Display (en)"}]}, {"k": "dom-post", "floor": "rules", "name": "Posting recipes (worked examples)", "file": "sdd/specs/domain/posting-recipes.md", "html": "<p>Notation: <code>Dr<\/code> debit, <code>Cr<\/code> credit; customer deposit accounts increase with Cr.\nEach journal must balance <strong>per currency<\/strong>.<\/p>\n<h2 id=\"d-dom-post-r1-own-transfer-same-currency-sara-main-smart-saver-aed-200000\">R1 — Own transfer, same currency (Sara: Main → Smart Saver, AED 2,000.00)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Leg<\/th>\n<th>Account<\/th>\n<th>Dr<\/th>\n<th>Cr<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>acc Main (AED)<\/td>\n<td>2,000.00<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>acc Smart Saver (AED)<\/td>\n<td><\/td>\n<td>2,000.00<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-dom-post-r2-own-transfer-with-fx-sara-main-aed-global-usd-send-aed-100000-rate-02709\">R2 — Own transfer with FX (Sara: Main AED → Global USD, send AED 1,000.00, rate 0.2709)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Leg<\/th>\n<th>Account<\/th>\n<th>Ccy<\/th>\n<th>Dr<\/th>\n<th>Cr<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>acc Main<\/td>\n<td>AED<\/td>\n<td>1,000.00<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>GL-FX-POSITION-AED<\/td>\n<td>AED<\/td>\n<td><\/td>\n<td>1,000.00<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>GL-FX-POSITION-USD<\/td>\n<td>USD<\/td>\n<td>270.90<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>acc Global USD<\/td>\n<td>USD<\/td>\n<td><\/td>\n<td>270.90<\/td>\n<\/tr>\n<tr>\n<td>AED: 1,000.00 = 1,000.00 ✔ · USD: 270.90 = 270.90 ✔. The USD amount was rounded HALF_EVEN when the<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>quote was created and the stored quote amounts are posted verbatim, so each currency balances by<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>construction; the sub-minor-unit difference is recorded on the quote (<code>roundingResidue<\/code>) for<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>reporting. <code>GL-FX-ROUNDING-&lt;CCY&gt;<\/code> is used only when one converted amount is split across several<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>legs (allocation residue, e.g. fee + principal from one conversion).<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-dom-post-r3-domestic-outgoing-sara-ahmad-saleh-at-northbay-lantern-bank-aed-120000\">R3 — Domestic outgoing (Sara → Ahmad Saleh at Northbay Lantern Bank, AED 1,200.00)<\/h2>\n<p>At submission: <code>placeHold(Main, 1,200.00, reason PAYMENT, ref order)<\/code>; no postings.\nAt settlement (job), single transaction:\n| Leg | Account | Dr | Cr |\n|---|---|---|---|\n| 1 | acc Main | 1,200.00 | |\n| 2 | GL-SETTLE-DOMESTIC-AED | | 1,200.00 |\nthen <code>releaseHold(order)<\/code>. On rail rejection: <code>releaseHold(order)<\/code> only.<\/p>\n<h2 id=\"d-dom-post-r4-international-sha-with-fee-daniel-aed-account-eur-50000-to-carlos-rate-aed-per-eur-40039-incl-margin-fee-aed-3500\">R4 — International SHA with fee (Daniel: AED account → EUR 500.00 to Carlos, rate AED per EUR 4.0039 incl. margin, fee AED 35.00)<\/h2>\n<p>Debit amount = 500.00 × 4.0039 = AED 2,001.95; total = 2,036.95 (hold at submission).\n| Leg | Account | Ccy | Dr | Cr |\n|---|---|---|---|---|\n| 1 | acc Daniel AED | AED | 2,036.95 | |\n| 2 | GL-FEE-INCOME-AED | AED | | 35.00 |\n| 3 | GL-FX-POSITION-AED | AED | | 2,001.95 |\n| 4 | GL-FX-POSITION-EUR | EUR | 500.00 | |\n| 5 | GL-SETTLE-SWIFT-EUR | EUR | | 500.00 |<\/p>\n<h2 id=\"d-dom-post-r5-bill-payment-sara-aquagrid-aed-37450\">R5 — Bill payment (Sara → AquaGrid AED 374.50)<\/h2>\n<p>| 1 | acc Main | 374.50 | |\n| 2 | GL-BILLER-SETTLE-AED | | 374.50 |<\/p>\n<h2 id=\"d-dom-post-r6-credit-card-repayment-sara-main-credit-card-aed-289900\">R6 — Credit-card repayment (Sara: Main → Credit card, AED 2,899.00)<\/h2>\n<p>Credit-card balance is \"owed\": a <strong>Cr<\/strong> on the card account reduces owed.\n| 1 | acc Main | 2,899.00 | |\n| 2 | acc Credit card | | 2,899.00 |<\/p>\n<h2 id=\"d-dom-post-r7-return-after-completion-demo-return-on-r3\">R7 — Return after completion (DEMO-RETURN on R3)<\/h2>\n<p>Reversing journal referencing the original:\n| 1 | GL-SETTLE-DOMESTIC-AED | 1,200.00 | |\n| 2 | acc Main | | 1,200.00 |\nOrder status COMPLETED → RETURNED.<\/p>\n<h2 id=\"d-dom-post-r8-card-replacement-fee-aed-5000\">R8 — Card replacement fee (AED 50.00)<\/h2>\n<p>| 1 | acc linked | 50.00 | |\n| 2 | GL-FEE-INCOME-AED | | 50.00 |<\/p>\n<h2 id=\"d-dom-post-r9-seed-opening-balance-seed-only\">R9 — Seed opening balance (seed only)<\/h2>\n<p>| 1 | GL-SEED-EQUITY-AED | 34,502.50 | |\n| 2 | acc Main | | 34,502.50 |<\/p>", "toc": [{"id": "d-dom-post-r1-own-transfer-same-currency-sara-main-smart-saver-aed-200000", "t": "R1 — Own transfer, same currency (Sara: Main → Smart Saver, AED 2,000.00)"}, {"id": "d-dom-post-r2-own-transfer-with-fx-sara-main-aed-global-usd-send-aed-100000-rate-02709", "t": "R2 — Own transfer with FX (Sara: Main AED → Global USD, send AED 1,000.00, rate 0.2709)"}, {"id": "d-dom-post-r3-domestic-outgoing-sara-ahmad-saleh-at-northbay-lantern-bank-aed-120000", "t": "R3 — Domestic outgoing (Sara → Ahmad Saleh at Northbay Lantern Bank, AED 1,200.00)"}, {"id": "d-dom-post-r4-international-sha-with-fee-daniel-aed-account-eur-50000-to-carlos-rate-aed-per-eur-40039-incl-margin-fee-aed-3500", "t": "R4 — International SHA with fee (Daniel: AED account → EUR 500.00 to Carlos, rate AED per EUR 4.0039 incl. margin, fee AED 35.00)"}, {"id": "d-dom-post-r5-bill-payment-sara-aquagrid-aed-37450", "t": "R5 — Bill payment (Sara → AquaGrid AED 374.50)"}, {"id": "d-dom-post-r6-credit-card-repayment-sara-main-credit-card-aed-289900", "t": "R6 — Credit-card repayment (Sara: Main → Credit card, AED 2,899.00)"}, {"id": "d-dom-post-r7-return-after-completion-demo-return-on-r3", "t": "R7 — Return after completion (DEMO-RETURN on R3)"}, {"id": "d-dom-post-r8-card-replacement-fee-aed-5000", "t": "R8 — Card replacement fee (AED 50.00)"}, {"id": "d-dom-post-r9-seed-opening-balance-seed-only", "t": "R9 — Seed opening balance (seed only)"}]}, {"k": "dom-sec", "floor": "rules", "name": "Security checklist — Tidewell Bank (ASVS 4.0.3 L2 subset + banking specifics)", "file": "sdd/specs/domain/security-checklist.md", "html": "<p>The project's own checklist for this worked example, walked by the 🛡️ Security Reviewer through the\ngeneric <strong>security-review<\/strong> skill, after the skill's general ASVS checklist.<\/p>\n<h2 id=\"d-dom-sec-a-authentication-v2\">A. Authentication (V2)<\/h2>\n<ul>\n<li>[ ] A1 Argon2id with ≥ 19 MiB / t ≥ 2; per-hash salt (NFR-SEC-001)<\/li>\n<li>[ ] A2 Password policy 12–128, breached list, no composition rules, paste allowed (NFR-SEC-002, V2.1)<\/li>\n<li>[ ] A3 Lockout 5 → 15 min, 10/24 h → hard lock; uniform responses &amp; timing (NFR-SEC-003, V2.2.1)<\/li>\n<li>[ ] A4 OTP: 6 digits, 5 min TTL, 3 attempts, hashed at rest, single use, resend throttled (V2.7)<\/li>\n<li>[ ] A5 TOTP: replay in same step rejected; secret encrypted (V2.8)<\/li>\n<li>[ ] A6 Recovery codes hashed, single use, shown once (V2.5)<\/li>\n<li>[ ] A7 Enrolment &amp; reset reveal nothing about account existence (V2.5.x)<\/li>\n<li>[ ] A8 Reset tokens single-use, 30 min, revoke sessions on success (V2.5.6)<\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-b-session-management-v3\">B. Session management (V3)<\/h2>\n<ul>\n<li>[ ] B1 ≥128-bit random IDs, hashed in DB; <code>__Host-<\/code> cookie, HttpOnly, Secure, SameSite=Strict (V3.4)<\/li>\n<li>[ ] B2 Session ID rotated on login, MFA completion and password change (V3.2.1)<\/li>\n<li>[ ] B3 Idle 5 min / absolute 8 h server-enforced (V3.3)<\/li>\n<li>[ ] B4 Logout &amp; \"sign out everywhere\" invalidate server-side (V3.3.1, V3.3.3)<\/li>\n<li>[ ] B5 Cross-tab sign-out; no sensitive data in <code>localStorage<\/code>/<code>sessionStorage<\/code> (V8.2)<\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-c-access-control-v4\">C. Access control (V4)<\/h2>\n<ul>\n<li>[ ] C1 Every repository query scoped by session <code>customerId<\/code> (V4.2.1)<\/li>\n<li>[ ] C2 Cross-customer access → 404 + audit; authz matrix test covers all path-ID routes<\/li>\n<li>[ ] C3 Ops routes role-checked server-side; maker ≠ checker; access reason enforced &amp; audited<\/li>\n<li>[ ] C4 No mass assignment (<code>additionalProperties: false<\/code>) (V5.1.2)<\/li>\n<li>[ ] C5 CSRF token on all unsafe methods (V4.2.2)<\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-d-payments-money-banking\">D. Payments &amp; money (banking)<\/h2>\n<ul>\n<li>[ ] D1 Idempotency key required, scoped per user, payload-hash checked<\/li>\n<li>[ ] D2 Balance/limit checks under row lock in same transaction as hold/posting<\/li>\n<li>[ ] D3 Step-up token bound to session + purpose + payload hash; single use; 5 min<\/li>\n<li>[ ] D4 Limits enforced server-side at quote <strong>and<\/strong> submit <strong>and<\/strong> scheduled execution<\/li>\n<li>[ ] D5 FX quote expiry enforced server-side; amounts from stored quote, not client<\/li>\n<li>[ ] D6 Cooling-off and new-beneficiary limits enforced; beneficiary-added alert mandatory<\/li>\n<li>[ ] D7 Fraud rules evaluated; held payments cannot settle without checker approval<\/li>\n<li>[ ] D8 No float money; ledger invariants checked<\/li>\n<li>[ ] D9 Demo markers only when <code>DEMO_MODE=true<\/code><\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-e-data-protection-v8-v6\">E. Data protection (V8, V6)<\/h2>\n<ul>\n<li>[ ] E1 PAN/CVC/TOTP secrets AES-256-GCM with unique nonce + key version (V6.2)<\/li>\n<li>[ ] E2 Reveal: step-up, 30 s, rate-limited, <code>no-store<\/code>, audited, wiped from client state<\/li>\n<li>[ ] E3 <code>Cache-Control: no-store<\/code> on authenticated responses (V8.2.1)<\/li>\n<li>[ ] E4 Masking rules applied in API (not only UI) (NFR-PRIV-001)<\/li>\n<li>[ ] E5 Exports/PDFs only via authorised endpoints with <code>Content-Disposition: attachment<\/code><\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-f-validation-encoding-injection-v5\">F. Validation, encoding, injection (V5)<\/h2>\n<ul>\n<li>[ ] F1 Contract validation for path/query/header/body with lengths &amp; patterns<\/li>\n<li>[ ] F2 Parameterised SQL only (raw SQL uses tagged templates)<\/li>\n<li>[ ] F3 No <code>dangerouslySetInnerHTML<\/code>; message bodies rendered as text<\/li>\n<li>[ ] F4 <code>returnTo<\/code> restricted to internal paths<\/li>\n<li>[ ] F5 CSV export protected against formula injection (prefix <code>'<\/code> on cells starting <code>= + - @<\/code>)<\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-g-files-v12\">G. Files (V12)<\/h2>\n<ul>\n<li>[ ] G1 Magic-byte type check, size ≤ 5 MB, count ≤ 3, EICAR rejected<\/li>\n<li>[ ] G2 Stored outside web root with random names; original names sanitised for display<\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-h-errors-logging-audit-v7\">H. Errors, logging, audit (V7)<\/h2>\n<ul>\n<li>[ ] H1 Problem+json without internals; <code>traceId<\/code> included<\/li>\n<li>[ ] H2 Redaction list effective (log-capture test)<\/li>\n<li>[ ] H3 Audit events for all listed actions, success &amp; failure; hash chain verifies<\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-i-configuration-supply-chain-v14\">I. Configuration &amp; supply chain (V14)<\/h2>\n<ul>\n<li>[ ] I1 Security headers &amp; CSP per SPEC-04 §11; no CSP violations in E2E<\/li>\n<li>[ ] I2 Fail-fast config; refuses default secrets outside dev<\/li>\n<li>[ ] I3 <code>pnpm audit --prod<\/code> clean or waived; lockfile committed; secret scan clean<\/li>\n<li>[ ] I4 Rate limits per SPEC-04 §8 with <code>Retry-After<\/code><\/li>\n<\/ul>\n<h2 id=\"d-dom-sec-severity-examples-for-this-domain\">Severity examples for this domain<\/h2>\n<p>Rated with the general scale in <code>.bob/skills/security-review/severity-levels.md<\/code>:<\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Severity<\/th>\n<th>Banking examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Critical<\/strong><\/td>\n<td>Overspend via a race; step-up token reusable for a different amount; IDOR on transactions; OTP bypass active without <code>DEMO_MODE<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>High<\/strong><\/td>\n<td>PAN in logs; a customer can call an ops route; nickname XSS in the ops console<\/td>\n<\/tr>\n<tr>\n<td><strong>Medium<\/strong><\/td>\n<td>Missing rate limit on statement export; CSV formula injection in transaction export<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": [{"id": "d-dom-sec-a-authentication-v2", "t": "A. Authentication (V2)"}, {"id": "d-dom-sec-b-session-management-v3", "t": "B. Session management (V3)"}, {"id": "d-dom-sec-c-access-control-v4", "t": "C. Access control (V4)"}, {"id": "d-dom-sec-d-payments-money-banking", "t": "D. Payments & money (banking)"}, {"id": "d-dom-sec-e-data-protection-v8-v6", "t": "E. Data protection (V8, V6)"}, {"id": "d-dom-sec-f-validation-encoding-injection-v5", "t": "F. Validation, encoding, injection (V5)"}, {"id": "d-dom-sec-g-files-v12", "t": "G. Files (V12)"}, {"id": "d-dom-sec-h-errors-logging-audit-v7", "t": "H. Errors, logging, audit (V7)"}, {"id": "d-dom-sec-i-configuration-supply-chain-v14", "t": "I. Configuration & supply chain (V14)"}, {"id": "d-dom-sec-severity-examples-for-this-domain", "t": "Severity examples for this domain"}]}, {"k": "vision", "floor": "bank", "name": "Product Vision, Personas and Scope", "file": "sdd/specs/01-product-vision.md", "html": "<h2 id=\"d-vision-1-vision-statement\">1. Vision statement<\/h2>\n<p><em>For<\/em> retail customers of Tidewell Bank <em>who<\/em> want to manage everyday money safely from a\nbrowser, <em>the<\/em> Tidewell Online Banking prototype <em>is<\/em> a secure, accessible, bilingual\nweb application <em>that<\/em> lets them see every account, move money with confidence, control\ntheir cards and get help — <em>unlike<\/em> legacy portals that feel slow, confusing and\nuntrustworthy, <em>our prototype<\/em> demonstrates bank-grade UX, security and correctness\nend-to-end.<\/p>\n<h2 id=\"d-vision-2-goals-and-success-metrics-for-the-prototype\">2. Goals and success metrics (for the prototype)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Goal<\/th>\n<th>Metric<\/th>\n<th>Target<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Stakeholders can demo every core journey without hand-waving<\/td>\n<td>Scripted demo (<code>sdd/design/user-flows.md<\/code> §Demo script) completes<\/td>\n<td>100 % of steps<\/td>\n<\/tr>\n<tr>\n<td>Correctness of money movement<\/td>\n<td>Ledger invariant checks (<code>pnpm verify<\/code>)<\/td>\n<td>0 violations<\/td>\n<\/tr>\n<tr>\n<td>Professional UX<\/td>\n<td>Heuristic review score (Nielsen 10) by 2 reviewers<\/td>\n<td>≥ 4/5 average<\/td>\n<\/tr>\n<tr>\n<td>Accessibility<\/td>\n<td>axe-core serious/critical violations on all routes<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>Performance<\/td>\n<td>p95 API latency on seed data; LCP on dashboard<\/td>\n<td>&lt; 300 ms; &lt; 2.5 s<\/td>\n<\/tr>\n<tr>\n<td>Security posture<\/td>\n<td>Open High/Critical findings in <code>sdd/reports/security/<\/code><\/td>\n<td>0 at final gate<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-vision-3-personas\">3. Personas<\/h2>\n<h3 id=\"d-vision-p1-sara-haddad-the-busy-professional-primary\">P1 — Sara Haddad, \"the busy professional\" (primary)<\/h3>\n<ul>\n<li>34, product manager, banks digitally, uses laptop at work and phone at home.<\/li>\n<li>Holds AED current, AED savings, USD current account, a credit card and a debit card.<\/li>\n<li>Jobs-to-be-done: check balances in 5 seconds; pay rent and bills on time; send money to\n  family; find a transaction quickly; freeze a card the moment she misplaces it.<\/li>\n<li>Pain points: hidden fees, unclear transfer status, sessions that log her out mid-task\n  without warning.<\/li>\n<\/ul>\n<h3 id=\"d-vision-p2-daniel-reyes-the-expat-sending-money-home-secondary\">P2 — Daniel Reyes, \"the expat sending money home\" (secondary)<\/h3>\n<ul>\n<li>41, engineer working abroad; sends monthly international transfers in USD/EUR.<\/li>\n<li>Jobs: know the exact FX rate, fee and arrival date <em>before<\/em> confirming; reuse saved\n  beneficiaries; download receipts as proof of payment.<\/li>\n<li>Prefers English; occasionally shares screen with family who read Arabic.<\/li>\n<\/ul>\n<h3 id=\"d-vision-p3-omar-nasser-the-new-to-digital-customer-secondary\">P3 — Omar Nasser, \"the new-to-digital customer\" (secondary)<\/h3>\n<ul>\n<li>62, retired teacher, prefers Arabic, uses larger text and a screen magnifier.<\/li>\n<li>Jobs: enrol online for the first time; check pension credit; pay electricity bill.<\/li>\n<li>Needs: plain language, generous touch/click targets, RTL that \"feels native\", no time\n  pressure surprises (clear session-timeout warnings).<\/li>\n<\/ul>\n<h3 id=\"d-vision-p4-mina-patel-operations-analyst-internal\">P4 — Mina Patel, \"operations analyst\" (internal)<\/h3>\n<ul>\n<li>Works in the bank's digital operations team using the <strong>Operations Console<\/strong> (F11).<\/li>\n<li>Jobs: unlock locked customers, review payments held by fraud rules (maker), answer\n  secure messages; supervisors (checker) approve/reject held payments.<\/li>\n<li>Needs: least-privilege access, every view of customer data justified and audited.<\/li>\n<\/ul>\n<h2 id=\"d-vision-4-scope\">4. Scope<\/h2>\n<h3 id=\"d-vision-41-feature-map-and-priorities\">4.1 Feature map and priorities<\/h3>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Feature<\/th>\n<th>Priority<\/th>\n<th>Personas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>F00<\/td>\n<td>Foundation (monorepo, app shell, API skeleton, DB, CI, design tokens)<\/td>\n<td>P1<\/td>\n<td>all<\/td>\n<\/tr>\n<tr>\n<td>F01<\/td>\n<td>Authentication, enrolment, MFA, sessions, step-up<\/td>\n<td>P1<\/td>\n<td>all<\/td>\n<\/tr>\n<tr>\n<td>F02<\/td>\n<td>Dashboard<\/td>\n<td>P1<\/td>\n<td>P1 P2 P3<\/td>\n<\/tr>\n<tr>\n<td>F03<\/td>\n<td>Accounts and transaction history<\/td>\n<td>P1<\/td>\n<td>P1 P2 P3<\/td>\n<\/tr>\n<tr>\n<td>F04<\/td>\n<td>Transfers and beneficiaries (own, internal, domestic; international = P2)<\/td>\n<td>P1/P2<\/td>\n<td>P1 P2<\/td>\n<\/tr>\n<tr>\n<td>F05<\/td>\n<td>Bill payments<\/td>\n<td>P2<\/td>\n<td>P1 P3<\/td>\n<\/tr>\n<tr>\n<td>F06<\/td>\n<td>Card management<\/td>\n<td>P2<\/td>\n<td>P1<\/td>\n<\/tr>\n<tr>\n<td>F07<\/td>\n<td>Statements and documents<\/td>\n<td>P2<\/td>\n<td>P2 P3<\/td>\n<\/tr>\n<tr>\n<td>F08<\/td>\n<td>Notifications and alerts<\/td>\n<td>P2<\/td>\n<td>all<\/td>\n<\/tr>\n<tr>\n<td>F09<\/td>\n<td>Profile, preferences and security settings<\/td>\n<td>P1/P2<\/td>\n<td>all<\/td>\n<\/tr>\n<tr>\n<td>F10<\/td>\n<td>Secure messaging and disputes<\/td>\n<td>P3<\/td>\n<td>P1 P3<\/td>\n<\/tr>\n<tr>\n<td>F11<\/td>\n<td>Operations console (maker-checker, unlock, audit)<\/td>\n<td>P3<\/td>\n<td>P4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Priority meanings:<\/strong> P1 = MVP, required for first demo gate. P2 = required for full\nprototype. P3 = stretch, build only after all P1/P2 phase gates pass.<\/p>\n<h3 id=\"d-vision-42-explicitly-out-of-scope-non-goals\">4.2 Explicitly out of scope (non-goals)<\/h3>\n<ul>\n<li>Real payment rails, real card processing, real KYC/AML screening, real credit decisions.<\/li>\n<li>Account opening / loan origination journeys (accounts are pre-provisioned by seed data).<\/li>\n<li>Native mobile apps (the web app must be responsive down to 360 px width).<\/li>\n<li>Investments, trading, insurance, crypto, open-banking third-party consent management.<\/li>\n<li>Production deployment, HA, disaster recovery, HSM key management (documented as future\n  work in SPEC-02 §9).<\/li>\n<li>Chatbots / generative-AI assistants inside the banking app.<\/li>\n<\/ul>\n<h2 id=\"d-vision-5-core-user-journeys-golden-paths\">5. Core user journeys (golden paths)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>#<\/th>\n<th>Journey<\/th>\n<th>Features<\/th>\n<th>Priority<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>J1<\/td>\n<td>Enrol online → set password → set up MFA → land on dashboard<\/td>\n<td>F01 F02<\/td>\n<td>P1<\/td>\n<\/tr>\n<tr>\n<td>J2<\/td>\n<td>Sign in with MFA → view balances → open account → find a transaction by search<\/td>\n<td>F01 F02 F03<\/td>\n<td>P1<\/td>\n<\/tr>\n<tr>\n<td>J3<\/td>\n<td>Move money between own accounts in different currencies (with FX quote)<\/td>\n<td>F04<\/td>\n<td>P1<\/td>\n<\/tr>\n<tr>\n<td>J4<\/td>\n<td>Add a domestic beneficiary (step-up) → pay them → download receipt<\/td>\n<td>F04<\/td>\n<td>P1<\/td>\n<\/tr>\n<tr>\n<td>J5<\/td>\n<td>International transfer with fee option, purpose code, cut-off/value-date preview<\/td>\n<td>F04<\/td>\n<td>P2<\/td>\n<\/tr>\n<tr>\n<td>J6<\/td>\n<td>Freeze a card, change online-purchase control, report card stolen and order replacement<\/td>\n<td>F06<\/td>\n<td>P2<\/td>\n<\/tr>\n<tr>\n<td>J7<\/td>\n<td>Pay an electricity bill using inquiry amount; schedule a recurring bill<\/td>\n<td>F05<\/td>\n<td>P2<\/td>\n<\/tr>\n<tr>\n<td>J8<\/td>\n<td>Download last month's e-statement; generate balance certificate<\/td>\n<td>F07<\/td>\n<td>P2<\/td>\n<\/tr>\n<tr>\n<td>J9<\/td>\n<td>Receive a real-time low-balance alert; adjust alert thresholds<\/td>\n<td>F08<\/td>\n<td>P2<\/td>\n<\/tr>\n<tr>\n<td>J10<\/td>\n<td>Change password, review devices, revoke a device, sign out everywhere<\/td>\n<td>F09<\/td>\n<td>P1/P2<\/td>\n<\/tr>\n<tr>\n<td>J11<\/td>\n<td>Dispute a card transaction via secure message with attachment<\/td>\n<td>F10<\/td>\n<td>P3<\/td>\n<\/tr>\n<tr>\n<td>J12<\/td>\n<td>Ops: transfer held by fraud rule → analyst recommends → supervisor approves<\/td>\n<td>F11<\/td>\n<td>P3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-vision-6-glossary\">6. Glossary<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Term<\/th>\n<th>Definition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Available balance<\/td>\n<td>Ledger balance − active holds + unused overdraft limit. What the customer can spend.<\/td>\n<\/tr>\n<tr>\n<td>Ledger (current) balance<\/td>\n<td>Sum of posted entries on the account.<\/td>\n<\/tr>\n<tr>\n<td>Hold<\/td>\n<td>A reservation of funds for an in-flight payment or card authorisation.<\/td>\n<\/tr>\n<tr>\n<td>Beneficiary<\/td>\n<td>A saved payee (internal, domestic, international).<\/td>\n<\/tr>\n<tr>\n<td>Step-up<\/td>\n<td>Re-authentication (OTP/TOTP) bound to a single sensitive action.<\/td>\n<\/tr>\n<tr>\n<td>Cooling-off period<\/td>\n<td>24 h after adding a beneficiary during which reduced limits apply.<\/td>\n<\/tr>\n<tr>\n<td>Cut-off time<\/td>\n<td>Latest local time a payment can be submitted to be processed same business day.<\/td>\n<\/tr>\n<tr>\n<td>Value date<\/td>\n<td>Date funds are expected to reach the beneficiary.<\/td>\n<\/tr>\n<tr>\n<td>Minor units<\/td>\n<td>Integer representation of money (AED 1.00 = 100 fils).<\/td>\n<\/tr>\n<tr>\n<td>Maker-checker<\/td>\n<td>Four-eyes control: one person proposes, a different person approves.<\/td>\n<\/tr>\n<tr>\n<td>Idempotency key<\/td>\n<td>Client-generated UUID making a POST safe to retry.<\/td>\n<\/tr>\n<tr>\n<td>PAN<\/td>\n<td>Primary Account Number (card number). Never stored or logged in clear text.<\/td>\n<\/tr>\n<tr>\n<td>CoP<\/td>\n<td>Confirmation of Payee — name-check of beneficiary account holder (simulated).<\/td>\n<\/tr>\n<tr>\n<td>EARS<\/td>\n<td>Easy Approach to Requirements Syntax used in all feature specs.<\/td>\n<\/tr>\n<tr>\n<td>Demo mode<\/td>\n<td>Configuration that enables banner, dev outbox and magic test values (SPEC-91 §6).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": [{"id": "d-vision-1-vision-statement", "t": "1. Vision statement"}, {"id": "d-vision-2-goals-and-success-metrics-for-the-prototype", "t": "2. Goals and success metrics (for the prototype)"}, {"id": "d-vision-3-personas", "t": "3. Personas"}, {"id": "d-vision-4-scope", "t": "4. Scope"}, {"id": "d-vision-5-core-user-journeys-golden-paths", "t": "5. Core user journeys (golden paths)"}, {"id": "d-vision-6-glossary", "t": "6. Glossary"}]}, {"k": "arch", "floor": "bank", "name": "System Architecture", "file": "sdd/specs/02-architecture.md", "html": "<h2 id=\"d-arch-1-architectural-style\">1. Architectural style<\/h2>\n<p>A <strong>modular monolith<\/strong> API (hexagonal / ports-and-adapters inside each module) plus a\n<strong>single-page web app<\/strong>, in one <strong>TypeScript pnpm monorepo<\/strong> (ADR-0001). All external\nsystems are simulated adapters (ADR-0007). PostgreSQL is the system of record.<\/p>\n<h2 id=\"d-arch-2-c4-system-context\">2. C4 — System context<\/h2>\n<pre><code class=\"language-mermaid\">C4Context\n  title Tidewell Online Banking — System Context (prototype)\n  Person(customer, &quot;Retail customer&quot;, &quot;Sara, Daniel, Omar&quot;)\n  Person(ops, &quot;Operations analyst / supervisor&quot;, &quot;Mina&quot;)\n  System(hob, &quot;Tidewell Online Banking&quot;, &quot;Web app + API + ledger&quot;)\n  System_Ext(rails, &quot;Payment rails (simulated)&quot;, &quot;Domestic ACH-like rail, SWIFT-like rail&quot;)\n  System_Ext(cardproc, &quot;Card processor (simulated)&quot;, &quot;Card status &amp; controls&quot;)\n  System_Ext(notify, &quot;Email / SMS gateways (simulated)&quot;, &quot;Mailpit + dev outbox&quot;)\n  System_Ext(fx, &quot;FX rate feed (simulated)&quot;, &quot;Mid-market rates&quot;)\n  System_Ext(billers, &quot;Biller network (simulated)&quot;, &quot;Bill inquiry &amp; payment&quot;)\n  Rel(customer, hob, &quot;Uses&quot;, &quot;HTTPS&quot;)\n  Rel(ops, hob, &quot;Uses /ops console&quot;, &quot;HTTPS&quot;)\n  Rel(hob, rails, &quot;Submits payment orders&quot;)\n  Rel(hob, cardproc, &quot;Updates card state&quot;)\n  Rel(hob, notify, &quot;Sends OTP &amp; alerts&quot;)\n  Rel(hob, fx, &quot;Reads rates&quot;)\n  Rel(hob, billers, &quot;Inquiry &amp; pay&quot;)\n<\/code><\/pre>\n<h2 id=\"d-arch-3-c4-containers\">3. C4 — Containers<\/h2>\n<pre><code class=\"language-mermaid\">C4Container\n  title Containers\n  Person(customer, &quot;Customer&quot;)\n  Person(ops, &quot;Ops user&quot;)\n  Container(web, &quot;apps/web&quot;, &quot;React 19 + TypeScript + Vite + Carbon&quot;, &quot;Customer SPA and /ops console&quot;)\n  Container(api, &quot;apps/api&quot;, &quot;Node.js LTS + Fastify 5 + TypeScript&quot;, &quot;REST /api/v1, SSE, jobs&quot;)\n  ContainerDb(db, &quot;PostgreSQL 16+&quot;, &quot;Relational&quot;, &quot;Ledger, customers, payments, audit&quot;)\n  Container(mail, &quot;Mailpit&quot;, &quot;SMTP sink + web UI&quot;, &quot;Captures emails (dev)&quot;)\n  Rel(customer, web, &quot;HTTPS&quot;)\n  Rel(ops, web, &quot;HTTPS&quot;)\n  Rel(web, api, &quot;JSON/HTTPS, cookies, SSE&quot;)\n  Rel(api, db, &quot;Prisma / SQL&quot;)\n  Rel(api, mail, &quot;SMTP&quot;)\n<\/code><\/pre>\n<h2 id=\"d-arch-4-technology-stack-authoritative\">4. Technology stack (authoritative)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Concern<\/th>\n<th>Choice<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Runtime<\/td>\n<td>Node.js current LTS (≥ 22; 24 recommended)<\/td>\n<td><code>.nvmrc<\/code> pins exact version<\/td>\n<\/tr>\n<tr>\n<td>Package manager<\/td>\n<td>pnpm workspaces (≥ 9)<\/td>\n<td><code>corepack enable<\/code><\/td>\n<\/tr>\n<tr>\n<td>Language<\/td>\n<td>TypeScript (strict, <code>noUncheckedIndexedAccess<\/code>)<\/td>\n<td>ES2022 target<\/td>\n<\/tr>\n<tr>\n<td>API framework<\/td>\n<td>Fastify 5<\/td>\n<td><code>@fastify/helmet<\/code>, <code>@fastify/cookie<\/code>, <code>@fastify/rate-limit<\/code>, <code>@fastify/multipart<\/code>, <code>@fastify/sensible<\/code><\/td>\n<\/tr>\n<tr>\n<td>Validation<\/td>\n<td>Zod + OpenAPI-generated types<\/td>\n<td>Request/response validated against <code>sdd/contracts/openapi.yaml<\/code><\/td>\n<\/tr>\n<tr>\n<td>ORM / migrations<\/td>\n<td>Prisma (current major)<\/td>\n<td>Raw SQL allowed in ledger repository for <code>SELECT … FOR UPDATE<\/code><\/td>\n<\/tr>\n<tr>\n<td>Database<\/td>\n<td>PostgreSQL 16+ (Docker)<\/td>\n<td><code>SERIALIZABLE<\/code> for postings; see SPEC-03 §7<\/td>\n<\/tr>\n<tr>\n<td>Jobs / scheduler<\/td>\n<td>In-process scheduler (<code>node-cron<\/code>-style) with DB-backed job table + advisory locks<\/td>\n<td>Simulated rails, standing orders, statement generation<\/td>\n<\/tr>\n<tr>\n<td>Passwords<\/td>\n<td>Argon2id (<code>@node-rs/argon2<\/code>)<\/td>\n<td>Params in NFR-SEC<\/td>\n<\/tr>\n<tr>\n<td>TOTP<\/td>\n<td><code>otplib<\/code> (RFC 6238)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>PDF<\/td>\n<td><code>pdfkit<\/code> (server-side)<\/td>\n<td>Statements, receipts, letters<\/td>\n<\/tr>\n<tr>\n<td>Email<\/td>\n<td><code>nodemailer<\/code> → Mailpit (SMTP :1025, UI :8025)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Logging<\/td>\n<td><code>pino<\/code> (JSON) with redaction paths<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Web framework<\/td>\n<td>React 19 + Vite<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Routing<\/td>\n<td>React Router (data router)<\/td>\n<td>Lazy-loaded route modules<\/td>\n<\/tr>\n<tr>\n<td>Server state<\/td>\n<td>TanStack Query<\/td>\n<td>Query keys per resource<\/td>\n<\/tr>\n<tr>\n<td>Forms<\/td>\n<td>react-hook-form + Zod resolver<\/td>\n<td>Same Zod schemas as API where possible<\/td>\n<\/tr>\n<tr>\n<td>UI<\/td>\n<td><code>@carbon/react<\/code> (Carbon v11), <code>@carbon/icons-react<\/code>, <code>@carbon/charts-react<\/code><\/td>\n<td>ADR-0006<\/td>\n<\/tr>\n<tr>\n<td>i18n<\/td>\n<td><code>react-intl<\/code> (ICU messages)<\/td>\n<td><code>en<\/code>, <code>ar<\/code> catalogs; RTL via <code>dir<\/code> attribute<\/td>\n<\/tr>\n<tr>\n<td>Unit / integration tests<\/td>\n<td>Vitest, Supertest-style <code>fastify.inject<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contract tests<\/td>\n<td>Response validation against OpenAPI (<code>openapi-backend<\/code> or <code>ajv<\/code> + bundled schema)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>E2E / a11y<\/td>\n<td>Playwright + <code>@axe-core/playwright<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Lint / format<\/td>\n<td>ESLint (typescript-eslint, jsx-a11y, security plugin), Prettier<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Contracts codegen<\/td>\n<td><code>openapi-typescript<\/code> → <code>packages/contracts<\/code><\/td>\n<td><code>pnpm contracts:gen<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Exact resolved versions are recorded by Bob in <code>sdd/adr/0001-typescript-monorepo.md<\/code> §Resolved versions\nduring F00.<\/p>\n<h2 id=\"d-arch-5-repository-layout-target-created-in-f00\">5. Repository layout (target, created in F00)<\/h2>\n<pre><code>.\n├── apps/\n│   ├── api/                      # Fastify modular monolith\n│   │   ├── src/\n│   │   │   ├── main.ts           # bootstrap\n│   │   │   ├── app.ts            # buildApp(): plugins, routes, error handler\n│   │   │   ├── config/           # env parsing (zod), feature flags\n│   │   │   ├── platform/         # cross-cutting: auth, csrf, audit, idempotency, errors, logging, sse, jobs\n│   │   │   ├── modules/\n│   │   │   │   ├── identity/     # F01, F09 (users, sessions, mfa, devices)\n│   │   │   │   ├── customers/    # customer profile, preferences\n│   │   │   │   ├── accounts/     # F03 accounts, transactions view\n│   │   │   │   ├── ledger/       # SPEC-03 double-entry core (no HTTP routes)\n│   │   │   │   ├── payments/     # F04 transfers, beneficiaries, standing orders, limits, fx\n│   │   │   │   ├── bills/        # F05\n│   │   │   │   ├── cards/        # F06\n│   │   │   │   ├── documents/    # F07 statements, letters, receipts (PDF)\n│   │   │   │   ├── notifications/# F08 notifications, alert rules, outbox\n│   │   │   │   ├── messaging/    # F10\n│   │   │   │   ├── ops/          # F11\n│   │   │   │   └── dashboard/    # F02 read-model composition\n│   │   │   └── adapters/         # simulated rails, card processor, sms, email, fx, billers\n│   │   ├── prisma/ (schema.prisma, migrations/, seed.ts)\n│   │   └── test/                 # integration tests, factories\n│   └── web/\n│       ├── src/\n│       │   ├── app/              # providers, router, layout shell, error boundaries\n│       │   ├── features/         # mirrors API modules: auth, dashboard, accounts, transfers, …\n│       │   ├── components/       # shared presentational components (MoneyAmount, StatusTag, …)\n│       │   ├── lib/              # api client, query client, formatters, idempotency, session timer\n│       │   ├── i18n/             # en.json, ar.json, rtl utilities\n│       │   └── styles/           # Carbon theme overrides &amp; tokens (SPEC-05)\n│       └── test/                 # component tests\n├── packages/\n│   ├── sdd/contracts/                # generated OpenAPI types + hand-written Zod schemas\n│   ├── domain/                   # PURE TS: Money, Currency, IBAN, BIC, Luhn, business calendar,\n│   │                             # state machines, limits engine, fee calculator (no I/O)\n│   └── config/                   # shared tsconfig, eslint, prettier, vitest presets\n├── e2e/                          # Playwright specs per journey (J1…J12)\n├── infra/docker-compose.yml      # postgres, mailpit\n├── sdd/contracts/ sdd/specs/ sdd/adr/ sdd/design/ sdd/traceability/ sdd/reports/   # (this spec pack)\n└── sdd/scripts/validate-specs.mjs\n<\/code><\/pre>\n<h3 id=\"d-arch-51-module-boundary-rules\">5.1 Module boundary rules<\/h3>\n<ol>\n<li>A module exposes an <code>index.ts<\/code> <strong>public API<\/strong> (application services + DTOs). Other\n   modules import only from that file. Enforced by ESLint <code>no-restricted-imports<\/code>.<\/li>\n<li><code>packages/domain<\/code> has <strong>no<\/strong> runtime dependencies on Node APIs, Prisma or Fastify.<\/li>\n<li>Only <code>ledger<\/code> writes <code>journal_entries<\/code> / <code>postings<\/code>. Other modules call\n   <code>ledger.post(journal)<\/code>.<\/li>\n<li>Routes are thin: parse → authorize → call application service → map to contract DTO.<\/li>\n<li>Adapters implement ports defined in the owning module (<code>payments/ports/PaymentRail.ts<\/code>).<\/li>\n<\/ol>\n<h2 id=\"d-arch-6-cross-cutting-concerns-owned-by-appsapisrcplatform\">6. Cross-cutting concerns (owned by <code>apps/api/src/platform<\/code>)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Concern<\/th>\n<th>Mechanism<\/th>\n<th>Spec<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Authentication<\/td>\n<td>Server-side session, cookie <code>__Host-hb_sid<\/code><\/td>\n<td>ADR-0004, F01<\/td>\n<\/tr>\n<tr>\n<td>CSRF<\/td>\n<td>Synchronizer token: <code>X-CSRF-Token<\/code> header must match session token on unsafe methods<\/td>\n<td>ADR-0004<\/td>\n<\/tr>\n<tr>\n<td>Authorization<\/td>\n<td><code>requireCustomer()<\/code>, <code>requireOpsRole(role)<\/code>; repository methods take <code>customerId<\/code><\/td>\n<td>NFR-SEC<\/td>\n<\/tr>\n<tr>\n<td>Step-up<\/td>\n<td><code>requireStepUp(purpose)<\/code> checks <code>X-Step-Up-Token<\/code> bound to purpose + payload hash<\/td>\n<td>F01<\/td>\n<\/tr>\n<tr>\n<td>Idempotency<\/td>\n<td><code>idempotent()<\/code> preHandler; table <code>idempotency_records<\/code><\/td>\n<td>ADR-0005<\/td>\n<\/tr>\n<tr>\n<td>Errors<\/td>\n<td>RFC 9457 problem+json; error catalog in <code>sdd/contracts/error-codes.md<\/code><\/td>\n<td>SPEC-04<\/td>\n<\/tr>\n<tr>\n<td>Audit<\/td>\n<td><code>audit.record(event)<\/code> in the same DB transaction as the change<\/td>\n<td>NFR-OBS, SPEC-03<\/td>\n<\/tr>\n<tr>\n<td>Logging<\/td>\n<td>pino, <code>traceId<\/code> per request (<code>traceparent<\/code> honoured), redaction list<\/td>\n<td>NFR-OBS<\/td>\n<\/tr>\n<tr>\n<td>Rate limiting<\/td>\n<td>per-IP and per-user buckets<\/td>\n<td>NFR-SEC<\/td>\n<\/tr>\n<tr>\n<td>Real-time<\/td>\n<td>SSE endpoint <code>/api/v1/notifications/stream<\/code><\/td>\n<td>F08<\/td>\n<\/tr>\n<tr>\n<td>Jobs<\/td>\n<td><code>jobs<\/code> table + advisory lock; runner every 5 s in dev<\/td>\n<td>§8<\/td>\n<\/tr>\n<tr>\n<td>Clock<\/td>\n<td>Injectable <code>Clock<\/code> port; <code>DEMO_MODE<\/code> allows <code>/dev/clock<\/code> offset<\/td>\n<td>SPEC-91<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-arch-7-key-runtime-flows\">7. Key runtime flows<\/h2>\n<h3 id=\"d-arch-71-sign-in-with-mfa\">7.1 Sign-in with MFA<\/h3>\n<pre><code class=\"language-mermaid\">sequenceDiagram\n  autonumber\n  participant B as Browser (web)\n  participant A as API\n  participant DB as Postgres\n  participant N as Notify adapter\n  B-&gt;&gt;A: POST /auth/login {username,password}\n  A-&gt;&gt;DB: load user, check lockout\n  A-&gt;&gt;A: argon2id verify (constant-time path for unknown users)\n  alt device trusted &amp; policy allows\n    A-&gt;&gt;DB: create session\n    A--&gt;&gt;B: 200 {status:AUTHENTICATED} + Set-Cookie\n  else MFA required\n    A-&gt;&gt;DB: create mfa_challenge (hashed code, 5 min TTL)\n    A-&gt;&gt;N: send OTP (SMS sim) unless TOTP\n    A--&gt;&gt;B: 200 {status:MFA_REQUIRED, challengeId, methods}\n    B-&gt;&gt;A: POST /auth/mfa/verify {challengeId, code, rememberDevice}\n    A-&gt;&gt;DB: verify, create session (+ trusted device), audit LOGIN_SUCCEEDED\n    A--&gt;&gt;B: 200 session + Set-Cookie __Host-hb_sid, CSRF token in body\n  end\n<\/code><\/pre>\n<h3 id=\"d-arch-72-transfer-to-a-domestic-beneficiary\">7.2 Transfer to a domestic beneficiary<\/h3>\n<pre><code class=\"language-mermaid\">sequenceDiagram\n  autonumber\n  participant B as Browser\n  participant A as API (payments)\n  participant L as Ledger\n  participant R as Domestic rail (sim)\n  B-&gt;&gt;A: POST /transfer-quotes\n  A--&gt;&gt;B: fees, fx, valueDate, limit check, stepUpRequired\n  opt stepUpRequired\n    B-&gt;&gt;A: POST /auth/step-up {purpose: TRANSFER_CREATE, payloadHash}\n    B-&gt;&gt;A: POST /auth/step-up/verify → stepUpToken\n  end\n  B-&gt;&gt;A: POST /transfers (Idempotency-Key, X-Step-Up-Token)\n  A-&gt;&gt;A: re-validate (limits, balance, cut-off), fraud rules\n  A-&gt;&gt;L: place hold (available ↓)\n  A--&gt;&gt;B: 201 Transfer {status: PROCESSING | SCHEDULED | HELD_FOR_REVIEW}\n  R--&gt;&gt;A: (job) settlement result after simulated delay\n  A-&gt;&gt;L: post journal (customer → settlement GL) and release hold\n  A--&gt;&gt;B: SSE notification &quot;Transfer completed&quot;\n<\/code><\/pre>\n<h2 id=\"d-arch-8-background-jobs\">8. Background jobs<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Job<\/th>\n<th>Schedule (dev)<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>rail.domestic.settle<\/code><\/td>\n<td>every 5 s<\/td>\n<td>Settle PROCESSING domestic orders older than 5 s<\/td>\n<\/tr>\n<tr>\n<td><code>rail.swift.settle<\/code><\/td>\n<td>every 10 s<\/td>\n<td>Settle international orders older than 30 s<\/td>\n<\/tr>\n<tr>\n<td><code>standing-orders.run<\/code><\/td>\n<td>every minute<\/td>\n<td>Create transfers for due standing orders (business-day aware)<\/td>\n<\/tr>\n<tr>\n<td><code>scheduled-transfers.release<\/code><\/td>\n<td>every minute<\/td>\n<td>Move SCHEDULED → PROCESSING on execution date after 00:05 local<\/td>\n<\/tr>\n<tr>\n<td><code>statements.generate<\/code><\/td>\n<td>02:00 local, 1st of month<\/td>\n<td>Generate previous-month statements<\/td>\n<\/tr>\n<tr>\n<td><code>holds.expire<\/code><\/td>\n<td>hourly<\/td>\n<td>Expire stale card authorisation holds (7 days)<\/td>\n<\/tr>\n<tr>\n<td><code>sessions.purge<\/code><\/td>\n<td>hourly<\/td>\n<td>Delete expired sessions &amp; challenges<\/td>\n<\/tr>\n<tr>\n<td><code>idempotency.purge<\/code><\/td>\n<td>hourly<\/td>\n<td>Delete records older than 24 h<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>POST /dev/jobs/run {job}<\/code> triggers any job immediately in <code>DEMO_MODE<\/code>.<\/p>\n<h2 id=\"d-arch-9-environments-and-configuration\">9. Environments and configuration<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Variable<\/th>\n<th>Example<\/th>\n<th>Required<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>NODE_ENV<\/code><\/td>\n<td>development<\/td>\n<td>yes<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>DEMO_MODE<\/code><\/td>\n<td>true<\/td>\n<td>yes<\/td>\n<td>Must default to <code>false<\/code> if unset<\/td>\n<\/tr>\n<tr>\n<td><code>DATABASE_URL<\/code><\/td>\n<td>postgresql://hb:hb@localhost:5432/tidewell<\/td>\n<td>yes<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>SESSION_SECRET<\/code><\/td>\n<td>64+ random chars<\/td>\n<td>yes<\/td>\n<td>Rotatable (array)<\/td>\n<\/tr>\n<tr>\n<td><code>DATA_ENCRYPTION_KEY<\/code><\/td>\n<td>base64 32 bytes<\/td>\n<td>yes<\/td>\n<td>AES-256-GCM for PAN vault &amp; TOTP secrets<\/td>\n<\/tr>\n<tr>\n<td><code>SESSION_IDLE_MINUTES<\/code><\/td>\n<td>5<\/td>\n<td>no<\/td>\n<td>Default 5<\/td>\n<\/tr>\n<tr>\n<td><code>SESSION_ABSOLUTE_HOURS<\/code><\/td>\n<td>8<\/td>\n<td>no<\/td>\n<td>Default 8<\/td>\n<\/tr>\n<tr>\n<td><code>SMTP_URL<\/code><\/td>\n<td>smtp://localhost:1025<\/td>\n<td>yes<\/td>\n<td>Mailpit<\/td>\n<\/tr>\n<tr>\n<td><code>WEB_ORIGIN<\/code><\/td>\n<td>http://localhost:5173<\/td>\n<td>yes<\/td>\n<td>CORS + CSP<\/td>\n<\/tr>\n<tr>\n<td><code>API_PORT<\/code><\/td>\n<td>4000<\/td>\n<td>no<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>LOG_LEVEL<\/code><\/td>\n<td>info<\/td>\n<td>no<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>.env.example<\/code> is committed; <code>.env<\/code> is git-ignored. Config is parsed once with Zod and the\nprocess fails fast on invalid configuration.<\/p>\n<h3 id=\"d-arch-ports-dev\">Ports (dev)<\/h3>\n<p>web <code>5173<\/code> · api <code>4000<\/code> (Vite proxies <code>/api<\/code> → <code>4000<\/code>) · postgres <code>5432<\/code> · mailpit <code>8025<\/code>/<code>1025<\/code><\/p>\n<h2 id=\"d-arch-10-future-production-considerations-documented-not-built\">10. Future production considerations (documented, not built)<\/h2>\n<p>HSM/KMS-managed keys; WAF and bot protection; Redis-backed sessions &amp; rate limits;\noutbox + message broker (Kafka) for events; read replicas for history; OpenShift\ndeployment with Helm; SIEM integration of audit stream; real ISO 20022 (pacs.008)\nmessaging; card tokenisation via processor; PSD2/open-banking style consent APIs.<\/p>", "toc": [{"id": "d-arch-1-architectural-style", "t": "1. Architectural style"}, {"id": "d-arch-2-c4-system-context", "t": "2. C4 — System context"}, {"id": "d-arch-3-c4-containers", "t": "3. C4 — Containers"}, {"id": "d-arch-4-technology-stack-authoritative", "t": "4. Technology stack (authoritative)"}, {"id": "d-arch-5-repository-layout-target-created-in-f00", "t": "5. Repository layout (target, created in F00)"}, {"id": "d-arch-6-cross-cutting-concerns-owned-by-appsapisrcplatform", "t": "6. Cross-cutting concerns (owned by apps/api/src/platform)"}, {"id": "d-arch-7-key-runtime-flows", "t": "7. Key runtime flows"}, {"id": "d-arch-8-background-jobs", "t": "8. Background jobs"}, {"id": "d-arch-9-environments-and-configuration", "t": "9. Environments and configuration"}, {"id": "d-arch-10-future-production-considerations-documented-not-built", "t": "10. Future production considerations (documented, not built)"}]}, {"k": "model", "floor": "bank", "name": "Domain Model, Ledger and State Machines", "file": "sdd/specs/03-domain-model.md", "html": "<h2 id=\"d-model-1-bounded-contexts\">1. Bounded contexts<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Context<\/th>\n<th>Aggregates<\/th>\n<th>Owner module<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Identity<\/td>\n<td>User, Credential, Session, TrustedDevice, MfaFactor, Challenge, RecoveryCode<\/td>\n<td><code>identity<\/code><\/td>\n<\/tr>\n<tr>\n<td>Customer<\/td>\n<td>Customer, Address, Preferences, Consent<\/td>\n<td><code>customers<\/code><\/td>\n<\/tr>\n<tr>\n<td>Accounts &amp; Ledger<\/td>\n<td>Account, GlAccount, JournalEntry, Posting, Hold<\/td>\n<td><code>accounts<\/code>, <code>ledger<\/code><\/td>\n<\/tr>\n<tr>\n<td>Payments<\/td>\n<td>Beneficiary, PaymentOrder, StandingOrder, FxQuote, LimitProfile, LimitUsage<\/td>\n<td><code>payments<\/code><\/td>\n<\/tr>\n<tr>\n<td>Bills<\/td>\n<td>Biller, SavedBiller, BillPayment<\/td>\n<td><code>bills<\/code><\/td>\n<\/tr>\n<tr>\n<td>Cards<\/td>\n<td>Card, CardControls, CardVaultEntry<\/td>\n<td><code>cards<\/code><\/td>\n<\/tr>\n<tr>\n<td>Documents<\/td>\n<td>Statement, GeneratedDocument<\/td>\n<td><code>documents<\/code><\/td>\n<\/tr>\n<tr>\n<td>Notifications<\/td>\n<td>Notification, AlertRule, OutboxMessage<\/td>\n<td><code>notifications<\/code><\/td>\n<\/tr>\n<tr>\n<td>Messaging<\/td>\n<td>MessageThread, Message, Attachment<\/td>\n<td><code>messaging<\/code><\/td>\n<\/tr>\n<tr>\n<td>Operations<\/td>\n<td>OpsUser (role on User), HeldPaymentReview, AccessJustification<\/td>\n<td><code>ops<\/code><\/td>\n<\/tr>\n<tr>\n<td>Platform<\/td>\n<td>AuditEvent, IdempotencyRecord, Job<\/td>\n<td><code>platform<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-model-2-identifiers\">2. Identifiers<\/h2>\n<ul>\n<li>All public IDs are <strong>opaque, prefixed ULIDs<\/strong>: <code>cus_<\/code>, <code>usr_<\/code>, <code>acc_<\/code>, <code>txn_<\/code>, <code>jrn_<\/code>,\n  <code>pst_<\/code>, <code>hld_<\/code>, <code>ben_<\/code>, <code>pay_<\/code>, <code>sto_<\/code>, <code>fxq_<\/code>, <code>bil_<\/code>, <code>sbl_<\/code>, <code>bpy_<\/code>, <code>crd_<\/code>, <code>stm_<\/code>,\n  <code>doc_<\/code>, <code>ntf_<\/code>, <code>alr_<\/code>, <code>thr_<\/code>, <code>msg_<\/code>, <code>att_<\/code>, <code>aud_<\/code>, <code>dev_<\/code>, <code>ses_<\/code>, <code>chl_<\/code>.<\/li>\n<li>IDs are never sequential, never derived from PII, and never accepted as proof of\n  ownership (authorization is always checked).<\/li>\n<li>Customer-facing <strong>references<\/strong> (shown on receipts) are human-friendly:\n  <code>HB<\/code> + business date <code>YYMMDD<\/code> + 6 base32 chars, e.g. <code>HB261118-7KQ2MX<\/code>.<\/li>\n<\/ul>\n<h2 id=\"d-model-3-entityrelationship-overview\">3. Entity–relationship overview<\/h2>\n<pre><code class=\"language-mermaid\">erDiagram\n  CUSTOMER ||--|| USER : &quot;has login&quot;\n  CUSTOMER ||--o{ ACCOUNT : owns\n  CUSTOMER ||--o{ BENEFICIARY : saves\n  CUSTOMER ||--o{ CARD : holds\n  CUSTOMER ||--o{ ALERT_RULE : configures\n  CUSTOMER ||--o{ MESSAGE_THREAD : opens\n  USER ||--o{ SESSION : starts\n  USER ||--o{ TRUSTED_DEVICE : trusts\n  USER ||--o{ MFA_FACTOR : enrols\n  ACCOUNT ||--o{ POSTING : &quot;is debited/credited by&quot;\n  GL_ACCOUNT ||--o{ POSTING : &quot;is debited/credited by&quot;\n  JOURNAL_ENTRY ||--|{ POSTING : &quot;balances&quot;\n  ACCOUNT ||--o{ HOLD : reserves\n  ACCOUNT ||--o{ PAYMENT_ORDER : &quot;debit account&quot;\n  BENEFICIARY ||--o{ PAYMENT_ORDER : &quot;credit party&quot;\n  PAYMENT_ORDER |o--o| FX_QUOTE : uses\n  PAYMENT_ORDER |o--o| JOURNAL_ENTRY : &quot;settles via&quot;\n  STANDING_ORDER ||--o{ PAYMENT_ORDER : generates\n  CARD }o--|| ACCOUNT : &quot;linked to&quot;\n  ACCOUNT ||--o{ STATEMENT : has\n  MESSAGE_THREAD ||--|{ MESSAGE : contains\n  MESSAGE ||--o{ ATTACHMENT : has\n<\/code><\/pre>\n<h2 id=\"d-model-4-money-and-currency\">4. Money and currency<\/h2>\n<h3 id=\"d-model-41-representation\">4.1 Representation<\/h3>\n<ul>\n<li>Domain type <code>Money { minor: bigint; currency: CurrencyCode }<\/code> in <code>packages/domain<\/code>.<\/li>\n<li>Wire format: <code>{ \"amount\": \"&lt;decimal string&gt;\", \"currency\": \"AED\" }<\/code> where the string has\n  <strong>exactly<\/strong> the currency exponent digits after the point (<code>\"12.00\"<\/code> AED, <code>\"0.500\"<\/code> KWD, <code>\"5\"<\/code> JPY).<\/li>\n<li>DB columns: <code>amount_minor BIGINT NOT NULL<\/code>, <code>currency CHAR(3) NOT NULL<\/code>.<\/li>\n<li>Parsing rejects: more decimals than exponent, exponent notation, signs on amounts that\n  must be positive, values &gt; 999,999,999,999 minor units for customer input.<\/li>\n<\/ul>\n<h3 id=\"d-model-42-supported-currencies\">4.2 Supported currencies<\/h3>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Code<\/th>\n<th>Exponent<\/th>\n<th>Customer accounts<\/th>\n<th>FX tradable<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AED<\/td>\n<td>2<\/td>\n<td>✔<\/td>\n<td>✔<\/td>\n<td>Base currency<\/td>\n<\/tr>\n<tr>\n<td>USD<\/td>\n<td>2<\/td>\n<td>✔<\/td>\n<td>✔<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>EUR<\/td>\n<td>2<\/td>\n<td>✔<\/td>\n<td>✔<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>GBP<\/td>\n<td>2<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td>International transfers only<\/td>\n<\/tr>\n<tr>\n<td>KWD<\/td>\n<td>3<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td>Exercises 3-dp path<\/td>\n<\/tr>\n<tr>\n<td>SAR<\/td>\n<td>2<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>BHD<\/td>\n<td>3<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td>Exercises 3-dp path<\/td>\n<\/tr>\n<tr>\n<td>JPY<\/td>\n<td>0<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td>Exercises 0-dp path in tests<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"d-model-43-fx\">4.3 FX<\/h3>\n<ul>\n<li>Mid rates come from the simulated FX adapter (seeded, SPEC-91 §5), refreshed every 60 s\n  with ±0.05 % jitter in demo mode.<\/li>\n<li>Customer rate = mid × (1 ∓ margin). Default margin <strong>0.50 %<\/strong> (bank sells foreign at\n  mid × 1.005 AED per unit, buys at mid × 0.995).<\/li>\n<li>An <code>FxQuote<\/code> locks a rate for <strong>30 seconds<\/strong>; executing after expiry → <code>FX_QUOTE_EXPIRED<\/code>.<\/li>\n<li>Conversion rounds the <strong>credited<\/strong> amount half-even to the target exponent when the quote is\n  created; the quote stores both amounts and the sub-minor <code>roundingResidue<\/code>. Postings use the\n  stored amounts, so each currency balances by construction. Allocation residues (one conversion\n  split across several legs) are posted to <code>GL-FX-ROUNDING-&lt;CCY&gt;<\/code>.<\/li>\n<li>Cross rates (USD→EUR) go via AED and are quoted as a single customer rate.<\/li>\n<\/ul>\n<h2 id=\"d-model-5-ledger-adr-0003\">5. Ledger (ADR-0003)<\/h2>\n<h3 id=\"d-model-51-chart-of-accounts-gl\">5.1 Chart of accounts (GL)<\/h3>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>GL code<\/th>\n<th>Type<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>GL-SETTLE-DOMESTIC-AED<\/code><\/td>\n<td>Asset (clearing)<\/td>\n<td>Outgoing/incoming domestic rail<\/td>\n<\/tr>\n<tr>\n<td><code>GL-SETTLE-SWIFT-&lt;CCY&gt;<\/code><\/td>\n<td>Asset (nostro)<\/td>\n<td>International rail per currency<\/td>\n<\/tr>\n<tr>\n<td><code>GL-FX-POSITION-&lt;CCY&gt;<\/code><\/td>\n<td>Position<\/td>\n<td>FX conversions per currency<\/td>\n<\/tr>\n<tr>\n<td><code>GL-FX-ROUNDING-&lt;CCY&gt;<\/code><\/td>\n<td>Income/Expense<\/td>\n<td>Rounding residue<\/td>\n<\/tr>\n<tr>\n<td><code>GL-FEE-INCOME-AED<\/code><\/td>\n<td>Income<\/td>\n<td>Transfer and service fees<\/td>\n<\/tr>\n<tr>\n<td><code>GL-BILLER-SETTLE-AED<\/code><\/td>\n<td>Liability<\/td>\n<td>Biller payouts<\/td>\n<\/tr>\n<tr>\n<td><code>GL-CARD-SETTLE-&lt;CCY&gt;<\/code><\/td>\n<td>Clearing<\/td>\n<td>Card scheme settlement (seed history)<\/td>\n<\/tr>\n<tr>\n<td><code>GL-INTEREST-EXPENSE-&lt;CCY&gt;<\/code><\/td>\n<td>Expense<\/td>\n<td>Savings interest (seed history)<\/td>\n<\/tr>\n<tr>\n<td><code>GL-SEED-EQUITY-&lt;CCY&gt;<\/code><\/td>\n<td>Equity<\/td>\n<td>Opening balances created by seed only<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"d-model-52-postings\">5.2 Postings<\/h3>\n<ul>\n<li><code>JournalEntry { id, businessDate, valueDate, type, reference, description, createdAt, createdBy }<\/code><\/li>\n<li><code>Posting { id, journalId, accountRef (customer acc_ or GL code), direction: DEBIT|CREDIT, amountMinor &gt; 0, currency }<\/code><\/li>\n<li>Customer account sign convention (customer view): CREDIT increases a deposit account balance;\n  DEBIT decreases it. For CREDIT_CARD accounts the <strong>balance owed<\/strong> increases with DEBIT.<\/li>\n<li>A customer-visible <strong>Transaction<\/strong> is a read model derived from postings on a customer\n  account plus enrichment (merchant, category, counterparty, channel, FX details).<\/li>\n<\/ul>\n<h3 id=\"d-model-53-ledger-invariants-enforced-in-code-and-verified-by-pnpm-ledgercheck\">5.3 Ledger invariants (enforced in code AND verified by <code>pnpm ledger:check<\/code>)<\/h3>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>ID<\/th>\n<th>Invariant<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>LGR-INV-1<\/td>\n<td>For every journal entry and every currency: Σ DEBIT = Σ CREDIT.<\/td>\n<\/tr>\n<tr>\n<td>LGR-INV-2<\/td>\n<td>Postings are append-only. Corrections are reversing journals referencing the original.<\/td>\n<\/tr>\n<tr>\n<td>LGR-INV-3<\/td>\n<td>Account ledger balance = Σ postings (cached balance must equal recomputed balance).<\/td>\n<\/tr>\n<tr>\n<td>LGR-INV-4<\/td>\n<td>Available balance = ledger balance − Σ active holds + overdraft limit; must be ≥ 0 after any customer-initiated debit.<\/td>\n<\/tr>\n<tr>\n<td>LGR-INV-5<\/td>\n<td>A posting's currency equals its account's currency.<\/td>\n<\/tr>\n<tr>\n<td>LGR-INV-6<\/td>\n<td>No posting on CLOSED accounts; no customer debits on FROZEN or DORMANT accounts.<\/td>\n<\/tr>\n<tr>\n<td>LGR-INV-7<\/td>\n<td>A hold is released exactly once (by settlement, failure, cancellation or expiry).<\/td>\n<\/tr>\n<tr>\n<td>LGR-INV-8<\/td>\n<td>Every journal created by a customer action references an idempotency key and an audit event.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"d-model-54-concurrency\">5.4 Concurrency<\/h3>\n<ul>\n<li>Debiting service runs in a DB transaction: <code>SELECT … FROM accounts WHERE id = $1 FOR UPDATE<\/code>,\n  recompute available, insert hold/postings, update cached balance, insert audit, commit.<\/li>\n<li>Isolation <code>READ COMMITTED<\/code> + row lock is sufficient for single-account debit; multi-account\n  operations lock accounts <strong>in ascending id order<\/strong> to avoid deadlocks.<\/li>\n<li>Test: 50 concurrent transfers of 1,000.00 from an account holding 10,000.00 → exactly 10\n  succeed, 40 fail <code>INSUFFICIENT_FUNDS<\/code>, balance = 0.00 (see SPEC-90 §5).<\/li>\n<\/ul>\n<h3 id=\"d-model-55-posting-recipes\">5.5 Posting recipes<\/h3>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Event<\/th>\n<th>Debit<\/th>\n<th>Credit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Own transfer same ccy<\/td>\n<td>source acc<\/td>\n<td>target acc<\/td>\n<\/tr>\n<tr>\n<td>Own transfer FX (AED→USD)<\/td>\n<td>source acc (AED); <code>GL-FX-POSITION-USD<\/code> (USD)<\/td>\n<td><code>GL-FX-POSITION-AED<\/code> (AED); target acc (USD)<\/td>\n<\/tr>\n<tr>\n<td>Internal (Tidewell) beneficiary<\/td>\n<td>source acc<\/td>\n<td>beneficiary's Tidewell acc<\/td>\n<\/tr>\n<tr>\n<td>Domestic outgoing settled<\/td>\n<td>source acc<\/td>\n<td><code>GL-SETTLE-DOMESTIC-AED<\/code><\/td>\n<\/tr>\n<tr>\n<td>International outgoing (SHA, fee 35.00)<\/td>\n<td>source acc (amount + fee)<\/td>\n<td><code>GL-SETTLE-SWIFT-&lt;CCY&gt;<\/code> (via FX legs if needed); <code>GL-FEE-INCOME-AED<\/code> (fee)<\/td>\n<\/tr>\n<tr>\n<td>Bill payment<\/td>\n<td>source acc<\/td>\n<td><code>GL-BILLER-SETTLE-AED<\/code><\/td>\n<\/tr>\n<tr>\n<td>Rail rejection after settlement<\/td>\n<td>reversing journal of the above<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Card purchase (seed)<\/td>\n<td>customer acc<\/td>\n<td><code>GL-CARD-SETTLE-&lt;CCY&gt;<\/code><\/td>\n<\/tr>\n<tr>\n<td>Credit card repayment<\/td>\n<td>source deposit acc<\/td>\n<td>credit-card acc (reduces owed)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-model-6-state-machines\">6. State machines<\/h2>\n<h3 id=\"d-model-61-paymentorder-transfers-and-bill-payments\">6.1 PaymentOrder (transfers and bill payments)<\/h3>\n<pre><code class=\"language-mermaid\">stateDiagram-v2\n  [*] --&gt; SCHEDULED: execution date in future\n  [*] --&gt; PROCESSING: execute now\n  [*] --&gt; HELD_FOR_REVIEW: fraud rule hit\n  SCHEDULED --&gt; PROCESSING: execution date reached (job)\n  SCHEDULED --&gt; CANCELLED: customer cancels (before 00:05 local on execution date)\n  SCHEDULED --&gt; FAILED: insufficient funds at execution\n  HELD_FOR_REVIEW --&gt; PROCESSING: supervisor approves (F11)\n  HELD_FOR_REVIEW --&gt; REJECTED: supervisor rejects / 72 h timeout\n  PROCESSING --&gt; COMPLETED: rail settles\n  PROCESSING --&gt; FAILED: rail rejects (hold released)\n  COMPLETED --&gt; RETURNED: rail returns funds later (reversing journal)\n  CANCELLED --&gt; [*]\n  COMPLETED --&gt; [*]\n  FAILED --&gt; [*]\n  REJECTED --&gt; [*]\n  RETURNED --&gt; [*]\n<\/code><\/pre>\n<ul>\n<li>Holds are placed on entering <code>PROCESSING<\/code> or <code>HELD_FOR_REVIEW<\/code>; <code>SCHEDULED<\/code> orders place no\n  hold until execution (balance re-checked then).<\/li>\n<li>Own-account and internal transfers go <code>PROCESSING → COMPLETED<\/code> synchronously in the same request.<\/li>\n<li>Every transition writes <code>payment_order_events (orderId, from, to, reason, at, actor)<\/code>.<\/li>\n<\/ul>\n<h3 id=\"d-model-62-card\">6.2 Card<\/h3>\n<pre><code class=\"language-mermaid\">stateDiagram-v2\n  [*] --&gt; PENDING_ACTIVATION\n  PENDING_ACTIVATION --&gt; ACTIVE: activate (last4 + expiry)\n  ACTIVE --&gt; FROZEN: customer freeze\n  FROZEN --&gt; ACTIVE: customer unfreeze\n  ACTIVE --&gt; BLOCKED: report lost/stolen\n  FROZEN --&gt; BLOCKED: report lost/stolen\n  ACTIVE --&gt; EXPIRED: expiry date passed\n  BLOCKED --&gt; [*]\n  EXPIRED --&gt; [*]\n<\/code><\/pre>\n<h3 id=\"d-model-63-user-credential-status\">6.3 User (credential status)<\/h3>\n<p><code>PENDING_ENROLMENT → ACTIVE ⇄ TEMP_LOCKED (15 min, auto) ; ACTIVE/TEMP_LOCKED → LOCKED (ops unlock required) ; ACTIVE → DISABLED (ops)<\/code><\/p>\n<h3 id=\"d-model-64-account\">6.4 Account<\/h3>\n<p><code>ACTIVE ⇄ FROZEN (ops) ; ACTIVE → DORMANT (seed only) ; ACTIVE → CLOSED (seed only)<\/code><\/p>\n<h3 id=\"d-model-65-message-thread\">6.5 Message thread<\/h3>\n<p><code>OPEN → AWAITING_CUSTOMER ⇄ OPEN → CLOSED (customer or ops) ; CLOSED → OPEN (customer reopens within 14 days)<\/code><\/p>\n<h2 id=\"d-model-7-core-entity-attributes-abridged-prisma-schema-must-include-at-least-these\">7. Core entity attributes (abridged; Prisma schema must include at least these)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Entity<\/th>\n<th>Key attributes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Customer<\/td>\n<td>id, customerNumber (8 digits), fullName, preferredName, dateOfBirth, nationalIdMasked, email, mobileE164, addresses[], segment (RETAIL/PREMIER), createdAt<\/td>\n<\/tr>\n<tr>\n<td>User<\/td>\n<td>id, customerId?, username (unique, case-insensitive), passwordHash, status, failedLoginCount, lockedUntil, roles (CUSTOMER, OPS_AGENT, OPS_SUPERVISOR), lastLoginAt<\/td>\n<\/tr>\n<tr>\n<td>Session<\/td>\n<td>id (hashed), userId, createdAt, lastSeenAt, absoluteExpiresAt, ip, userAgent, deviceId?, csrfToken, mfaLevel (NONE/MFA)<\/td>\n<\/tr>\n<tr>\n<td>TrustedDevice<\/td>\n<td>id, userId, name, fingerprintHash, createdAt, lastSeenAt, revokedAt<\/td>\n<\/tr>\n<tr>\n<td>MfaFactor<\/td>\n<td>id, userId, type (TOTP/SMS), secretEncrypted?, phoneMasked?, verifiedAt<\/td>\n<\/tr>\n<tr>\n<td>Challenge<\/td>\n<td>id, userId, purpose (LOGIN/ENROL/RESET/STEP_UP/CONTACT_CHANGE), codeHash, payloadHash?, attempts, expiresAt, consumedAt<\/td>\n<\/tr>\n<tr>\n<td>Account<\/td>\n<td>id, customerId, type, productName, nickname, currency, iban, accountNumber, status, overdraftLimitMinor, interestRateBps, openedAt, ledgerBalanceMinor (cache), version<\/td>\n<\/tr>\n<tr>\n<td>Hold<\/td>\n<td>id, accountId, amountMinor, reason (PAYMENT/CARD_AUTH), referenceId, status (ACTIVE/RELEASED/EXPIRED), expiresAt<\/td>\n<\/tr>\n<tr>\n<td>Beneficiary<\/td>\n<td>id, customerId, type, displayName, nickname, accountHolderName, iban?, accountNumber?, bic?, bankName, bankCountry, currency?, address?, copResult, createdAt, coolingOffUntil, isFavourite, status<\/td>\n<\/tr>\n<tr>\n<td>PaymentOrder<\/td>\n<td>id, reference, customerId, kind (OWN/INTERNAL/DOMESTIC/INTERNATIONAL/BILL), debitAccountId, beneficiaryId?, creditAccountId?, amount, debitAmount, fee, fxQuoteId?, chargeBearer (OUR/SHA/BEN)?, purposeCode?, customerReference, executionDate, valueDate, status, failureCode?, standingOrderId?, idempotencyKey, createdAt<\/td>\n<\/tr>\n<tr>\n<td>StandingOrder<\/td>\n<td>id, customerId, template (PaymentOrder fields), frequency (WEEKLY/MONTHLY/QUARTERLY), startDate, endDate?, nextRunDate, remainingRuns?, status<\/td>\n<\/tr>\n<tr>\n<td>LimitProfile<\/td>\n<td>customerId, dailyExternalLimitMinor (AED), perTransactionMaxMinor, newBeneficiaryDailyLimitMinor, customerChosenDailyLimitMinor<\/td>\n<\/tr>\n<tr>\n<td>Card<\/td>\n<td>id, customerId, accountId, kind (DEBIT/CREDIT), network (VISA/MASTERCARD), last4, expiryMonth, expiryYear, cardholderName, status, controls{ecommerce, international, contactless, atm}, limits{atmDaily, posDaily, onlineDaily}, replacedById?<\/td>\n<\/tr>\n<tr>\n<td>Statement<\/td>\n<td>id, accountId, periodStart, periodEnd, openingBalance, closingBalance, totalCredits, totalDebits, generatedAt, storageKey<\/td>\n<\/tr>\n<tr>\n<td>Notification<\/td>\n<td>id, customerId, type, severity, titleKey, bodyParams, deepLink, readAt, createdAt<\/td>\n<\/tr>\n<tr>\n<td>AlertRule<\/td>\n<td>id, customerId, type, enabled, thresholdMinor?, currency?, channels[], mandatory<\/td>\n<\/tr>\n<tr>\n<td>AuditEvent<\/td>\n<td>id, occurredAt, actorType (CUSTOMER/OPS/SYSTEM), actorId, action, targetType, targetId, outcome, ip, userAgent, traceId, metadata (redacted JSON), hashPrev, hash<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Audit events form a <strong>hash chain<\/strong> (<code>hash = sha256(hashPrev || canonicalJson(event))<\/code>) so\ntampering is detectable by <code>pnpm audit:verify<\/code>.<\/p>\n<h2 id=\"d-model-8-domain-events-internal-in-process\">8. Domain events (internal, in-process)<\/h2>\n<p>Listed in <code>sdd/contracts/domain-events.md<\/code>. Notifications (F08) subscribe to these events;\nmodules never call the notifications module directly.<\/p>", "toc": [{"id": "d-model-1-bounded-contexts", "t": "1. Bounded contexts"}, {"id": "d-model-2-identifiers", "t": "2. Identifiers"}, {"id": "d-model-3-entityrelationship-overview", "t": "3. Entity–relationship overview"}, {"id": "d-model-4-money-and-currency", "t": "4. Money and currency"}, {"id": "d-model-5-ledger-adr-0003", "t": "5. Ledger (ADR-0003)"}, {"id": "d-model-6-state-machines", "t": "6. State machines"}, {"id": "d-model-7-core-entity-attributes-abridged-prisma-schema-must-include-at-least-these", "t": "7. Core entity attributes (abridged; Prisma schema must include at least these)"}, {"id": "d-model-8-domain-events-internal-in-process", "t": "8. Domain events (internal, in-process)"}]}, {"k": "apig", "floor": "bank", "name": "API Design Guidelines", "file": "sdd/specs/04-api-guidelines.md", "html": "<p><code>sdd/contracts/openapi.yaml<\/code> (OpenAPI 3.1) is the <strong>authoritative contract<\/strong>. This document\ndefines the conventions every operation in it must follow. Bob must update the contract\n(through the Spec Architect mode) <em>before<\/em> implementing any new endpoint.<\/p>\n<h2 id=\"d-apig-1-basics\">1. Basics<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Rule<\/th>\n<th>Value<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Base path<\/td>\n<td><code>/api/v1<\/code> (major version in path; breaking changes → <code>/api/v2<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Media type<\/td>\n<td><code>application/json; charset=utf-8<\/code>; errors <code>application/problem+json<\/code><\/td>\n<\/tr>\n<tr>\n<td>Field naming<\/td>\n<td><code>camelCase<\/code> JSON; enums <code>UPPER_SNAKE_CASE<\/code><\/td>\n<\/tr>\n<tr>\n<td>Time<\/td>\n<td>RFC 3339 UTC timestamps (<code>2026-11-18T09:41:00Z<\/code>); business dates <code>YYYY-MM-DD<\/code> in <code>BUSINESS_TIMEZONE<\/code><\/td>\n<\/tr>\n<tr>\n<td>IDs<\/td>\n<td>Opaque prefixed strings (SPEC-03 §2)<\/td>\n<\/tr>\n<tr>\n<td>Money<\/td>\n<td><code>Money<\/code> object <code>{ \"amount\": \"12505.00\", \"currency\": \"AED\" }<\/code> (SPEC-03 §4.1)<\/td>\n<\/tr>\n<tr>\n<td>Nullability<\/td>\n<td>Absent ≠ null. Optional fields are omitted when unknown; <code>null<\/code> only where documented<\/td>\n<\/tr>\n<tr>\n<td>Caching<\/td>\n<td><code>Cache-Control: no-store<\/code> on every authenticated response<\/td>\n<\/tr>\n<tr>\n<td>Compression<\/td>\n<td>gzip/br for JSON ≥ 1 KB<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-apig-2-resource-and-method-conventions\">2. Resource and method conventions<\/h2>\n<ul>\n<li>Nouns, plural: <code>/accounts<\/code>, <code>/accounts/{accountId}/transactions<\/code>.<\/li>\n<li>Actions that are not CRUD use a sub-resource verb: <code>POST /cards/{cardId}/freeze<\/code>,\n  <code>POST /transfers/{transferId}/cancel<\/code>.<\/li>\n<li><code>GET<\/code> is safe and never changes state (mark-as-read uses <code>POST<\/code>).<\/li>\n<li><code>PATCH<\/code> uses JSON Merge Patch semantics for partial updates and requires <code>If-Match<\/code>\n  (ETag) on resources that customers edit concurrently (preferences, alert rules, beneficiaries).<\/li>\n<li><code>201 Created<\/code> returns the resource and a <code>Location<\/code> header. <code>202 Accepted<\/code> for async jobs.<\/li>\n<\/ul>\n<h2 id=\"d-apig-3-authentication-csrf-adr-0004\">3. Authentication &amp; CSRF (ADR-0004)<\/h2>\n<ul>\n<li>Session cookie <code>__Host-hb_sid<\/code>: <code>HttpOnly; Secure; SameSite=Strict; Path=/<\/code>. (In local\n  HTTP dev, <code>Secure<\/code> is relaxed and the name becomes <code>hb_sid<\/code>; never in any non-dev mode.)<\/li>\n<li>CSRF: the session holds a random token returned by <code>GET /auth/session<\/code> and on login;\n  every unsafe request (<code>POST/PUT/PATCH/DELETE<\/code>) must send <code>X-CSRF-Token<\/code>. Missing/mismatch → <code>403 CSRF_TOKEN_INVALID<\/code>.<\/li>\n<li>Unauthenticated → <code>401 UNAUTHENTICATED<\/code>; session idle/absolute expiry → <code>401 SESSION_EXPIRED<\/code>.<\/li>\n<li>Authenticated but forbidden (wrong role) → <code>403 FORBIDDEN<\/code>.<\/li>\n<li><strong>Other customers' resources return <code>404 NOT_FOUND<\/code><\/strong> (never 403) to avoid enumeration.<\/li>\n<\/ul>\n<h2 id=\"d-apig-4-step-up-authentication\">4. Step-up authentication<\/h2>\n<ul>\n<li>Endpoints flagged <code>x-step-up: &lt;PURPOSE&gt;<\/code> in the contract require header\n  <code>X-Step-Up-Token<\/code>. The token is single-use, valid <strong>5 minutes<\/strong>, bound to user, session,\n  purpose and (where stated) the SHA-256 hash of the canonical request payload.<\/li>\n<li>Missing/invalid → <code>403 STEP_UP_REQUIRED<\/code> with <code>stepUp: { purpose, methods }<\/code> in the problem body.<\/li>\n<\/ul>\n<h2 id=\"d-apig-5-idempotency-adr-0005\">5. Idempotency (ADR-0005)<\/h2>\n<ul>\n<li>Header <code>Idempotency-Key: &lt;UUID v4&gt;<\/code> is <strong>required<\/strong> on operations flagged\n  <code>x-idempotent: required<\/code> (all money movement, card replacement, beneficiary creation).<\/li>\n<li>Server stores <code>(userId, key) → requestHash, status, response<\/code> for 24 h.<\/li>\n<li>Same key + same payload while in progress → <code>409 IDEMPOTENCY_IN_PROGRESS<\/code>; after\n  completion → replay original status and body with header <code>Idempotent-Replayed: true<\/code>.<\/li>\n<li>Same key + different payload → <code>422 IDEMPOTENCY_KEY_REUSED<\/code>.<\/li>\n<li>The web client generates the key when the <strong>review screen<\/strong> is shown and reuses it for\n  retries of that confirmation (so double-clicks and network retries are safe).<\/li>\n<\/ul>\n<h2 id=\"d-apig-6-pagination-filtering-sorting\">6. Pagination, filtering, sorting<\/h2>\n<ul>\n<li>Cursor pagination: <code>?limit=25&amp;cursor=&lt;opaque&gt;<\/code>; <code>limit<\/code> default 25, max 100.<\/li>\n<li>Response envelope:<\/li>\n<\/ul>\n<pre><code class=\"language-json\">{ &quot;items&quot;: [ ... ], &quot;page&quot;: { &quot;nextCursor&quot;: &quot;eyJ...&quot;, &quot;limit&quot;: 25, &quot;hasMore&quot;: true } }\n<\/code><\/pre>\n<ul>\n<li>Filters are explicit query params (<code>from<\/code>, <code>to<\/code>, <code>type<\/code>, <code>status<\/code>, <code>minAmount<\/code>,\n  <code>maxAmount<\/code>, <code>category<\/code>, <code>q<\/code>). Unknown params → <code>400 VALIDATION_FAILED<\/code>.<\/li>\n<li>Sorting: <code>?sort=-bookedAt<\/code> (prefix <code>-<\/code> for descending). Only documented sort keys allowed.<\/li>\n<li>Date range filters are inclusive business dates; max span documented per endpoint.<\/li>\n<\/ul>\n<h2 id=\"d-apig-7-errors-rfc-9457\">7. Errors (RFC 9457)<\/h2>\n<pre><code class=\"language-json\">{\n  &quot;type&quot;: &quot;https://errors.tidewell.example/insufficient-funds&quot;,\n  &quot;title&quot;: &quot;Insufficient funds&quot;,\n  &quot;status&quot;: 422,\n  &quot;detail&quot;: &quot;The available balance is lower than the amount plus fees.&quot;,\n  &quot;instance&quot;: &quot;/api/v1/transfers&quot;,\n  &quot;code&quot;: &quot;INSUFFICIENT_FUNDS&quot;,\n  &quot;traceId&quot;: &quot;4bf92f3577b34da6a3ce929d0e0e4736&quot;,\n  &quot;errors&quot;: [ { &quot;field&quot;: &quot;amount.amount&quot;, &quot;code&quot;: &quot;TOO_LARGE&quot;, &quot;message&quot;: &quot;…&quot; } ]\n}\n<\/code><\/pre>\n<ul>\n<li><code>code<\/code> is stable and machine-readable; the full catalog lives in\n  <code>sdd/contracts/error-codes.md<\/code>. The web app maps <code>code<\/code> → localized message; it never shows\n  <code>detail<\/code> verbatim to customers.<\/li>\n<li>5xx responses never include stack traces, SQL or internal hostnames.<\/li>\n<\/ul>\n<h2 id=\"d-apig-8-rate-limiting\">8. Rate limiting<\/h2>\n<ul>\n<li>Headers on every response: <code>RateLimit-Limit<\/code>, <code>RateLimit-Remaining<\/code>, <code>RateLimit-Reset<\/code>.<\/li>\n<li>Exceeded → <code>429 RATE_LIMITED<\/code> with <code>Retry-After<\/code>.<\/li>\n<li>Named buckets (referenced by <code>x-rate-limit<\/code> in the contract; defaults):\n  | Bucket | Limit |\n  |---|---|\n  | <code>auth<\/code> | login/enrol/reset: 10/min per IP <strong>and<\/strong> 5/min per username/customer number |\n  | <code>otp<\/code> | step-up start/verify: 5/min per user; OTP verify also 5/min per challenge |\n  | <code>export<\/code> | exports &amp; custom statements: 10/hour per user |\n  | <code>reveal<\/code> | card reveal: 5/day per card (BR-CARD-02) |\n  | <code>default<\/code> | any other authenticated route: 300/min per user |<\/li>\n<\/ul>\n<h2 id=\"d-apig-9-concurrency\">9. Concurrency<\/h2>\n<ul>\n<li>Editable resources expose <code>ETag<\/code> (weak, from <code>version<\/code> column). <code>PATCH<\/code>/<code>PUT<\/code> without\n  <code>If-Match<\/code> → <code>428 PRECONDITION_REQUIRED<\/code>; stale → <code>412 PRECONDITION_FAILED<\/code>.<\/li>\n<\/ul>\n<h2 id=\"d-apig-10-server-sent-events\">10. Server-Sent Events<\/h2>\n<ul>\n<li><code>GET /api/v1/notifications/stream<\/code> (<code>text/event-stream<\/code>), authenticated by cookie.<\/li>\n<li>Event names: <code>notification.created<\/code>, <code>payment.status_changed<\/code>, <code>session.expiring<\/code>,\n  <code>balance.changed<\/code>. <code>data<\/code> is JSON matching the contract schema. Heartbeat comment every 20 s.<\/li>\n<li>Client reconnects with <code>Last-Event-ID<\/code>; server replays up to 100 missed events.<\/li>\n<\/ul>\n<h2 id=\"d-apig-11-security-headers-all-responses\">11. Security headers (all responses)<\/h2>\n<p><code>Content-Security-Policy<\/code> (strict, nonce-based for web), <code>Strict-Transport-Security<\/code>\n(non-dev), <code>X-Content-Type-Options: nosniff<\/code>, <code>Referrer-Policy: no-referrer<\/code>,\n<code>Permissions-Policy<\/code> (camera, mic, geolocation disabled), <code>Cross-Origin-Opener-Policy: same-origin<\/code>,\n<code>X-Frame-Options: DENY<\/code> (and CSP <code>frame-ancestors 'none'<\/code>).<\/p>\n<h2 id=\"d-apig-12-contract-workflow\">12. Contract workflow<\/h2>\n<ol>\n<li>Architect edits <code>sdd/contracts/openapi.yaml<\/code> + <code>sdd/contracts/error-codes.md<\/code>.<\/li>\n<li><code>pnpm contracts:lint<\/code> (Redocly/Spectral ruleset in <code>packages/config<\/code>) must pass.<\/li>\n<li><code>pnpm contracts:gen<\/code> regenerates <code>packages/contracts/src/generated.ts<\/code>.<\/li>\n<li>Builder implements route; contract test validates real responses against the schema.<\/li>\n<li>Any drift between implementation and contract is a failing test, not a doc bug.<\/li>\n<\/ol>\n<h2 id=\"d-apig-13-vendor-extensions-used-in-the-contract\">13. Vendor extensions used in the contract<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Extension<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>x-requirements: [XFER-010, …]<\/code><\/td>\n<td>Requirement IDs the operation satisfies (traceability)<\/td>\n<\/tr>\n<tr>\n<td><code>x-step-up: TRANSFER_CREATE<\/code><\/td>\n<td>Step-up purpose required<\/td>\n<\/tr>\n<tr>\n<td><code>x-idempotent: required<\/code><\/td>\n<td>Idempotency-Key header required<\/td>\n<\/tr>\n<tr>\n<td><code>x-audit: TRANSFER_CREATED<\/code><\/td>\n<td>Audit action written on success/failure<\/td>\n<\/tr>\n<tr>\n<td><code>x-rate-limit: auth<\/code><\/td>\n<td>Named rate-limit bucket<\/td>\n<\/tr>\n<tr>\n<td><code>x-demo-only: true<\/code><\/td>\n<td>Route registered only when <code>DEMO_MODE=true<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>x-roles: [OPS_AGENT]<\/code><\/td>\n<td>Required roles (ops endpoints)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": [{"id": "d-apig-1-basics", "t": "1. Basics"}, {"id": "d-apig-2-resource-and-method-conventions", "t": "2. Resource and method conventions"}, {"id": "d-apig-3-authentication-csrf-adr-0004", "t": "3. Authentication & CSRF (ADR-0004)"}, {"id": "d-apig-4-step-up-authentication", "t": "4. Step-up authentication"}, {"id": "d-apig-5-idempotency-adr-0005", "t": "5. Idempotency (ADR-0005)"}, {"id": "d-apig-6-pagination-filtering-sorting", "t": "6. Pagination, filtering, sorting"}, {"id": "d-apig-7-errors-rfc-9457", "t": "7. Errors (RFC 9457)"}, {"id": "d-apig-8-rate-limiting", "t": "8. Rate limiting"}, {"id": "d-apig-9-concurrency", "t": "9. Concurrency"}, {"id": "d-apig-10-server-sent-events", "t": "10. Server-Sent Events"}, {"id": "d-apig-11-security-headers-all-responses", "t": "11. Security headers (all responses)"}, {"id": "d-apig-12-contract-workflow", "t": "12. Contract workflow"}, {"id": "d-apig-13-vendor-extensions-used-in-the-contract", "t": "13. Vendor extensions used in the contract"}]}, {"k": "design", "floor": "bank", "name": "Design System, Layout and Interaction Patterns", "file": "sdd/specs/05-design-system.md", "html": "<h2 id=\"d-design-1-foundation\">1. Foundation<\/h2>\n<ul>\n<li><strong>IBM Carbon Design System v11<\/strong> via <code>@carbon/react<\/code> (ADR-0006).<\/li>\n<li>Themes: <code>white<\/code> (light default), <code>g100<\/code> (dark). <code>system<\/code> preference follows\n  <code>prefers-color-scheme<\/code>. The ops console always uses <code>g10<\/code> with a distinct header colour so\n  staff never confuse it with the customer app.<\/li>\n<li>Fonts: <strong>IBM Plex Sans<\/strong> (Latin) and <strong>IBM Plex Sans Arabic<\/strong> (Arabic), self-hosted\n  (no third-party font CDNs — CSP). Numerals: Western Arabic digits (0–9) in both locales\n  for amounts, account numbers and IBANs (bank convention); dates follow locale.<\/li>\n<\/ul>\n<h2 id=\"d-design-2-brand-layer-fictional-tidewell-brand\">2. Brand layer (fictional Tidewell brand)<\/h2>\n<p>Brand colours are applied <strong>only<\/strong> through Carbon token overrides in <code>apps/web/src/styles/theme.scss<\/code>.<\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Token (override)<\/th>\n<th>Light<\/th>\n<th>Dark<\/th>\n<th>Use<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>$interactive<\/code> / <code>$button-primary<\/code><\/td>\n<td><code>#0B5C6B<\/code> (Tidewell Teal 70)<\/td>\n<td><code>#3DB8C9<\/code> (Teal 40)<\/td>\n<td>Primary actions, links<\/td>\n<\/tr>\n<tr>\n<td><code>$button-primary-hover<\/code><\/td>\n<td><code>#084A57<\/code><\/td>\n<td><code>#5FCAD8<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>$focus<\/code><\/td>\n<td><code>#0F62FE<\/code> (Carbon default)<\/td>\n<td><code>#FFFFFF<\/code><\/td>\n<td>Keep high-contrast focus<\/td>\n<\/tr>\n<tr>\n<td><code>$support-success<\/code><\/td>\n<td>Carbon default<\/td>\n<td>Carbon default<\/td>\n<td>Completed statuses<\/td>\n<\/tr>\n<tr>\n<td><code>$support-error<\/code><\/td>\n<td>Carbon default<\/td>\n<td>Carbon default<\/td>\n<td>Failed / debit warnings<\/td>\n<\/tr>\n<tr>\n<td>Header background<\/td>\n<td><code>#0B2E36<\/code><\/td>\n<td><code>#0B2E36<\/code><\/td>\n<td>UI Shell header (customer)<\/td>\n<\/tr>\n<tr>\n<td>Ops header background<\/td>\n<td><code>#3D1F5C<\/code><\/td>\n<td><code>#3D1F5C<\/code><\/td>\n<td>UI Shell header (ops)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>All text/background pairs must meet <strong>WCAG 2.2 AA (4.5:1 body, 3:1 large text &amp; UI)<\/strong>.\nThe logo is a simple wordmark \"Tidewell\" with a wave glyph built from Carbon icon primitives —\nno real bank marks.<\/p>\n<h2 id=\"d-design-3-layout\">3. Layout<\/h2>\n<h3 id=\"d-design-31-application-shell-customer\">3.1 Application shell (customer)<\/h3>\n<pre><code>┌──────────────────────────────────────────────────────────────────────────┐\n│ DEMO ENVIRONMENT — NO REAL MONEY (persistent banner, role=status)         │\n├──────────────────────────────────────────────────────────────────────────┤\n│ ☰  Tidewell           [Search ⌘K]          🔔3   EN|ع   👤 Sara ▾        │  ← Carbon Header\n├────────────┬─────────────────────────────────────────────────────────────┤\n│ Dashboard  │  Breadcrumb / Page title                     [Primary CTA]  │\n│ Accounts   │  ─────────────────────────────────────────────────────────  │\n│ Transfers  │                                                             │\n│ Payments   │   Content (Carbon Grid, 16 columns ≥ lg, 8 md, 4 sm)        │\n│ Cards      │
