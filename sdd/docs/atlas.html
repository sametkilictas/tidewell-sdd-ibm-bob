                     │\n│ Statements │                                                             │\n│ Messages   │                                                             │\n│ Settings   │                                                             │\n│ ────────── │                                                             │\n│ Sign out   │                                                             │\n└────────────┴─────────────────────────────────────────────────────────────┘\n<\/code><\/pre>\n<ul>\n<li>Side nav: Carbon <code>SideNav<\/code> (rail on <code>md<\/code>, overlay on <code>sm<\/code>, expanded on <code>lg+<\/code>).<\/li>\n<li>Max content width 1584 px; page padding per Carbon grid.<\/li>\n<li>Breakpoints: Carbon defaults (<code>sm<\/code> 320, <code>md<\/code> 672, <code>lg<\/code> 1056, <code>xlg<\/code> 1312, <code>max<\/code> 1584).\n  Must work from <strong>360 px<\/strong> width (NFR-A11Y reflow).<\/li>\n<li>Skip link \"Skip to main content\" is the first focusable element.<\/li>\n<\/ul>\n<h3 id=\"d-design-32-page-templates\">3.2 Page templates<\/h3>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Template<\/th>\n<th>Used by<\/th>\n<th>Structure<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Overview<\/strong><\/td>\n<td>Dashboard<\/td>\n<td>Greeting + last-login line; tiles grid; widgets with independent loading<\/td>\n<\/tr>\n<tr>\n<td><strong>List<\/strong><\/td>\n<td>Accounts, Transactions, Beneficiaries, Cards, Statements, Messages<\/td>\n<td>Header + toolbar (search, filters, actions) + DataTable/StructuredList + pagination/infinite load<\/td>\n<\/tr>\n<tr>\n<td><strong>Detail<\/strong><\/td>\n<td>Account, Card, Transfer, Thread<\/td>\n<td>Header with key facts (balance/status) + Tabs + side panel actions<\/td>\n<\/tr>\n<tr>\n<td><strong>Wizard<\/strong><\/td>\n<td>Transfer, Add beneficiary, Pay bill, Report card<\/td>\n<td>Carbon <code>ProgressIndicator<\/code> (vertical on lg, horizontal on sm), one step per screen, sticky footer with Back / Continue; final <strong>Review<\/strong> step; <strong>Receipt<\/strong> page<\/td>\n<\/tr>\n<tr>\n<td><strong>Settings<\/strong><\/td>\n<td>Profile &amp; security<\/td>\n<td>Left <code>ContentSwitcher<\/code>/tabs + forms with inline save<\/td>\n<\/tr>\n<tr>\n<td><strong>Auth<\/strong><\/td>\n<td>Sign-in, MFA, Enrol, Reset<\/td>\n<td>Centered card (max 480 px), brand panel on lg+, no side nav<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-design-4-component-mapping-use-these-do-not-hand-roll\">4. Component mapping (use these; do not hand-roll)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Need<\/th>\n<th>Carbon component<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Money display<\/td>\n<td>custom <code>&lt;MoneyAmount&gt;<\/code> wrapping text<\/td>\n<td>Uses <code>Intl.NumberFormat<\/code> + domain exponent; <code>aria-label<\/code> spells sign (\"minus 125.00 UAE dirhams\")<\/td>\n<\/tr>\n<tr>\n<td>Balance tiles<\/td>\n<td><code>Tile<\/code>, <code>ClickableTile<\/code><\/td>\n<td>Show available (prominent) + ledger (secondary)<\/td>\n<\/tr>\n<tr>\n<td>Lists of transactions<\/td>\n<td><code>DataTable<\/code> (sortable, with <code>TableToolbar<\/code>, <code>TableBatchActions<\/code> off)<\/td>\n<td>Sticky header; amount column right-aligned (left in RTL)<\/td>\n<\/tr>\n<tr>\n<td>Filters<\/td>\n<td><code>FilterableMultiSelect<\/code>, <code>DatePicker<\/code> (range), <code>NumberInput<\/code>, <code>Search<\/code>, <code>Tag<\/code> (dismissible active filters)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Status<\/td>\n<td><code>Tag<\/code> (type per status table §6) + icon + text (never colour alone)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Forms<\/td>\n<td><code>TextInput<\/code>, <code>Select<\/code>, <code>ComboBox<\/code>, <code>RadioButtonGroup<\/code>, <code>Toggle<\/code>, <code>Checkbox<\/code>, <code>FormGroup<\/code><\/td>\n<td>Inline validation on blur; summary of errors at top on submit (<code>InlineNotification<\/code> with links)<\/td>\n<\/tr>\n<tr>\n<td>Wizard<\/td>\n<td><code>ProgressIndicator<\/code>, <code>ProgressStep<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Confirmation of destructive action<\/td>\n<td><code>Modal<\/code> (danger)<\/td>\n<td>Primary button names the action (\"Freeze card\")<\/td>\n<\/tr>\n<tr>\n<td>Toasts<\/td>\n<td><code>ToastNotification<\/code> (auto-dismiss 6 s; never for errors requiring action)<\/td>\n<td>Live region polite<\/td>\n<\/tr>\n<tr>\n<td>Page-level errors<\/td>\n<td><code>InlineNotification<\/code> / <code>ActionableNotification<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Loading<\/td>\n<td><code>SkeletonText<\/code>, <code>SkeletonPlaceholder<\/code>, <code>DataTableSkeleton<\/code>, <code>InlineLoading<\/code> on buttons<\/td>\n<td>No full-page spinners after first paint<\/td>\n<\/tr>\n<tr>\n<td>Charts<\/td>\n<td><code>@carbon/charts-react<\/code> <code>DonutChart<\/code>, <code>SimpleBarChart<\/code><\/td>\n<td>Provide data table alternative (a11y)<\/td>\n<\/tr>\n<tr>\n<td>Copy<\/td>\n<td><code>CopyButton<\/code><\/td>\n<td>IBAN, account number, references<\/td>\n<\/tr>\n<tr>\n<td>Session timeout<\/td>\n<td><code>Modal<\/code> (passive → danger) with countdown<\/td>\n<td>F01<\/td>\n<\/tr>\n<tr>\n<td>OTP entry<\/td>\n<td>6 × <code>TextInput<\/code> group or single <code>TextInput<\/code> with <code>inputmode=\"numeric\"<\/code> <code>autocomplete=\"one-time-code\"<\/code><\/td>\n<td>Paste fills all<\/td>\n<\/tr>\n<tr>\n<td>Empty states<\/td>\n<td>Carbon empty-state pattern (pictogram + title + body + CTA)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-design-5-data-display-rules\">5. Data display rules<\/h2>\n<ol>\n<li><strong>Money<\/strong>: always via <code>&lt;MoneyAmount&gt;<\/code>; currency code shown (<code>AED 12,505.00<\/code>) unless the\n   column header states currency. Debits shown with a leading minus sign <strong>and<\/strong> a \"Debit\"\n   accessible label; credits with \"+\" in transaction lists only. Never colour-only.<\/li>\n<li><strong>Masking<\/strong>: account numbers <code>•••• 4821<\/code>; IBAN grouped in 4s (<code>AE55 9900 0000 …<\/code>) with\n   reveal/copy; card numbers <code>•••• •••• •••• 1234<\/code>; email <code>s•••a@example.com<\/code>; mobile <code>+971 •• ••• 1234<\/code>.<\/li>\n<li><strong>Dates<\/strong>: relative for &lt; 24 h in lists (\"Today, 09:41\"), absolute otherwise; full\n   timestamp with time zone in details and receipts.<\/li>\n<li><strong>Numbers<\/strong> right-aligned in tables (logical <code>text-align: end<\/code> for RTL).<\/li>\n<li><strong>Truncation<\/strong>: descriptions ellipsize with full text in <code>Tooltip<\/code>/<code>Toggletip<\/code> and in detail view.<\/li>\n<\/ol>\n<h2 id=\"d-design-6-status-taxonomy-single-source-for-coloursiconscopy\">6. Status taxonomy (single source for colours/icons/copy)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Domain status<\/th>\n<th>Tag type<\/th>\n<th>Icon<\/th>\n<th>Customer label (en)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>COMPLETED<\/td>\n<td>green<\/td>\n<td>CheckmarkFilled<\/td>\n<td>Completed<\/td>\n<\/tr>\n<tr>\n<td>PROCESSING<\/td>\n<td>blue<\/td>\n<td>InProgress<\/td>\n<td>Processing<\/td>\n<\/tr>\n<tr>\n<td>SCHEDULED<\/td>\n<td>cool-gray<\/td>\n<td>Calendar<\/td>\n<td>Scheduled<\/td>\n<\/tr>\n<tr>\n<td>HELD_FOR_REVIEW<\/td>\n<td>purple<\/td>\n<td>Time<\/td>\n<td>Under review<\/td>\n<\/tr>\n<tr>\n<td>FAILED / REJECTED<\/td>\n<td>red<\/td>\n<td>ErrorFilled<\/td>\n<td>Failed / Not sent<\/td>\n<\/tr>\n<tr>\n<td>CANCELLED<\/td>\n<td>gray<\/td>\n<td>Close<\/td>\n<td>Cancelled<\/td>\n<\/tr>\n<tr>\n<td>RETURNED<\/td>\n<td>magenta<\/td>\n<td>Undo<\/td>\n<td>Returned<\/td>\n<\/tr>\n<tr>\n<td>Pending card transaction<\/td>\n<td>outline<\/td>\n<td>Pending<\/td>\n<td>Pending<\/td>\n<\/tr>\n<tr>\n<td>Card FROZEN<\/td>\n<td>teal<\/td>\n<td>Snowflake<\/td>\n<td>Frozen<\/td>\n<\/tr>\n<tr>\n<td>Card BLOCKED<\/td>\n<td>red<\/td>\n<td>Locked<\/td>\n<td>Blocked<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-design-7-interaction-patterns\">7. Interaction patterns<\/h2>\n<ul>\n<li><strong>Review-then-confirm<\/strong> for any money movement or irreversible action; the review screen\n  shows: from, to (with CoP result), amount, FX rate &amp; expiry countdown, fees, total debited,\n  amount received, execution &amp; value date, reference.<\/li>\n<li><strong>Receipt<\/strong> page: success pictogram, reference with copy, status tag, summary, actions\n  (Download PDF, Make another, Go to dashboard). Receipt also reachable from history.<\/li>\n<li><strong>Optimistic UI<\/strong> only for non-financial toggles (mark notification read, favourite\n  beneficiary). Never for money movement or card status.<\/li>\n<li><strong>Unsaved changes<\/strong> guard on forms and wizards (route blocker + Modal).<\/li>\n<li><strong>Keyboard<\/strong>: ⌘K / Ctrl+K opens global search (accounts, beneficiaries, transactions by\n  reference, settings pages). <code>Esc<\/code> closes overlays. All flows operable without a mouse.<\/li>\n<li><strong>Focus management<\/strong>: on route change, focus moves to <code>&lt;h1&gt;<\/code>; on wizard step change, to\n  the step heading; on error summary, to the summary.<\/li>\n<li><strong>Motion<\/strong>: Carbon productive motion; honour <code>prefers-reduced-motion<\/code> (no count-up\n  animations of balances when reduced).<\/li>\n<li><strong>Session timeout<\/strong>: warning modal 60 s before idle expiry with \"Stay signed in\" (primary)\n  and \"Sign out\"; announces remaining time every 15 s via <code>aria-live=\"assertive\"<\/code> at 30 s and 10 s only.<\/li>\n<\/ul>\n<h2 id=\"d-design-8-rtl-specifics-arabic\">8. RTL specifics (Arabic)<\/h2>\n<ul>\n<li><code>&lt;html lang=\"ar\" dir=\"rtl\"&gt;<\/code>; Carbon supports RTL via logical properties — use\n  <code>margin-inline-start<\/code> etc. Never <code>left/right<\/code> in custom CSS (lint rule).<\/li>\n<li>Mirror directional icons (ArrowRight → ArrowLeft, chevrons) except media/progress icons\n  that represent time and brand marks.<\/li>\n<li>Keep IBANs, account numbers, card numbers and amounts in LTR isolates (<code>&lt;bdi dir=\"ltr\"&gt;<\/code>).<\/li>\n<li>Charts mirror axes; DataTable column order mirrors.<\/li>\n<\/ul>\n<h2 id=\"d-design-9-content\">9. Content<\/h2>\n<p>Tone, terminology and every error message pattern are defined in\n<code>sdd/design/content-style-guide.md<\/code>. All user-facing strings live in <code>apps/web/src/i18n/*.json<\/code>;\nno hard-coded strings in components (lint rule <code>formatjs/no-literal-string-in-jsx<\/code>).<\/p>", "toc": [{"id": "d-design-1-foundation", "t": "1. Foundation"}, {"id": "d-design-2-brand-layer-fictional-tidewell-brand", "t": "2. Brand layer (fictional Tidewell brand)"}, {"id": "d-design-3-layout", "t": "3. Layout"}, {"id": "d-design-4-component-mapping-use-these-do-not-hand-roll", "t": "4. Component mapping (use these; do not hand-roll)"}, {"id": "d-design-5-data-display-rules", "t": "5. Data display rules"}, {"id": "d-design-6-status-taxonomy-single-source-for-coloursiconscopy", "t": "6. Status taxonomy (single source for colours/icons/copy)"}, {"id": "d-design-7-interaction-patterns", "t": "7. Interaction patterns"}, {"id": "d-design-8-rtl-specifics-arabic", "t": "8. RTL specifics (Arabic)"}, {"id": "d-design-9-content", "t": "9. Content"}]}, {"k": "errors", "floor": "contract", "name": "Error Code Catalog", "file": "sdd/contracts/error-codes.md", "html": "<p>Every problem+json response carries one of these <code>code<\/code> values. The web app maps each code\nto an i18n key <code>errors.&lt;CODE&gt;<\/code> (en + ar). New codes are added here <strong>and<\/strong> in\n<code>sdd/contracts/openapi.yaml#/components/schemas/ErrorCode<\/code> in the same change.<\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Code<\/th>\n<th>HTTP<\/th>\n<th>Meaning<\/th>\n<th>Customer message (en) — tone per content guide<\/th>\n<th>Retry?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>VALIDATION_FAILED<\/code><\/td>\n<td>400<\/td>\n<td>Request does not match schema; see <code>errors[]<\/code><\/td>\n<td>\"Some details need your attention.\" (+ field messages)<\/td>\n<td>after fix<\/td>\n<\/tr>\n<tr>\n<td><code>UNAUTHENTICATED<\/code><\/td>\n<td>401<\/td>\n<td>No/invalid session<\/td>\n<td>\"Please sign in to continue.\"<\/td>\n<td>sign in<\/td>\n<\/tr>\n<tr>\n<td><code>SESSION_EXPIRED<\/code><\/td>\n<td>401<\/td>\n<td>Idle or absolute timeout<\/td>\n<td>\"For your security, you were signed out after a period of inactivity.\"<\/td>\n<td>sign in<\/td>\n<\/tr>\n<tr>\n<td><code>INVALID_CREDENTIALS<\/code><\/td>\n<td>401<\/td>\n<td>Username/password wrong (same for unknown user)<\/td>\n<td>\"The username or password is incorrect.\"<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td><code>MFA_CODE_INVALID<\/code><\/td>\n<td>401<\/td>\n<td>Wrong OTP/TOTP<\/td>\n<td>\"That code isn't right. Check it and try again.\"<\/td>\n<td>yes (≤3)<\/td>\n<\/tr>\n<tr>\n<td><code>MFA_CODE_EXPIRED<\/code><\/td>\n<td>401<\/td>\n<td>Challenge expired<\/td>\n<td>\"That code has expired. We've sent you a new one.\"<\/td>\n<td>resend<\/td>\n<\/tr>\n<tr>\n<td><code>MFA_ATTEMPTS_EXCEEDED<\/code><\/td>\n<td>401<\/td>\n<td>3 wrong codes<\/td>\n<td>\"Too many incorrect codes. Please start again.\"<\/td>\n<td>restart<\/td>\n<\/tr>\n<tr>\n<td><code>FORBIDDEN<\/code><\/td>\n<td>403<\/td>\n<td>Role not permitted<\/td>\n<td>\"You don't have access to this.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>CSRF_TOKEN_INVALID<\/code><\/td>\n<td>403<\/td>\n<td>Missing/mismatched CSRF<\/td>\n<td>(generic) \"Something went wrong. Please refresh and try again.\"<\/td>\n<td>refresh<\/td>\n<\/tr>\n<tr>\n<td><code>STEP_UP_REQUIRED<\/code><\/td>\n<td>403<\/td>\n<td>Sensitive action needs step-up<\/td>\n<td>(triggers OTP dialog)<\/td>\n<td>after step-up<\/td>\n<\/tr>\n<tr>\n<td><code>STEP_UP_TOKEN_INVALID<\/code><\/td>\n<td>403<\/td>\n<td>Expired/used/mismatched step-up token<\/td>\n<td>\"Please verify again to continue.\"<\/td>\n<td>yes<\/td>\n<\/tr>\n<tr>\n<td><code>NOT_FOUND<\/code><\/td>\n<td>404<\/td>\n<td>Unknown or not-owned resource<\/td>\n<td>\"We couldn't find that.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>IDEMPOTENCY_IN_PROGRESS<\/code><\/td>\n<td>409<\/td>\n<td>Same key still processing<\/td>\n<td>(silent retry by client after 1 s)<\/td>\n<td>auto<\/td>\n<\/tr>\n<tr>\n<td><code>CONFLICT_STATE<\/code><\/td>\n<td>409<\/td>\n<td>Action invalid for current state (e.g. cancel completed)<\/td>\n<td>\"This can't be done anymore — its status has changed.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>PRECONDITION_FAILED<\/code><\/td>\n<td>412<\/td>\n<td>ETag mismatch<\/td>\n<td>\"This was updated elsewhere. We've loaded the latest version.\"<\/td>\n<td>reload<\/td>\n<\/tr>\n<tr>\n<td><code>IDEMPOTENCY_KEY_REUSED<\/code><\/td>\n<td>422<\/td>\n<td>Key reused with different payload<\/td>\n<td>(generic)<\/td>\n<td>new key<\/td>\n<\/tr>\n<tr>\n<td><code>INSUFFICIENT_FUNDS<\/code><\/td>\n<td>422<\/td>\n<td>Available &lt; amount + fees<\/td>\n<td>\"Your available balance isn't enough for this payment, including fees.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>LIMIT_EXCEEDED_DAILY<\/code><\/td>\n<td>422<\/td>\n<td>Daily external limit<\/td>\n<td>\"This would exceed your daily transfer limit of {limit}. Remaining today: {remaining}.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>LIMIT_EXCEEDED_PER_TRANSACTION<\/code><\/td>\n<td>422<\/td>\n<td>Per-transaction max<\/td>\n<td>\"The maximum for a single transfer is {limit}.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>LIMIT_EXCEEDED_NEW_BENEFICIARY<\/code><\/td>\n<td>422<\/td>\n<td>Cooling-off limit<\/td>\n<td>\"New payees have a lower limit for the first 24 hours ({limit}).\"<\/td>\n<td>later<\/td>\n<\/tr>\n<tr>\n<td><code>ACCOUNT_NOT_ELIGIBLE<\/code><\/td>\n<td>422<\/td>\n<td>Account type/status cannot be debited/credited<\/td>\n<td>\"This account can't be used for this payment.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>SAME_ACCOUNT<\/code><\/td>\n<td>422<\/td>\n<td>From = To<\/td>\n<td>\"Choose two different accounts.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>CURRENCY_NOT_SUPPORTED<\/code><\/td>\n<td>422<\/td>\n<td>Currency not allowed for this route<\/td>\n<td>\"This currency isn't available for this payment.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>FX_QUOTE_EXPIRED<\/code><\/td>\n<td>422<\/td>\n<td>Quote older than 30 s<\/td>\n<td>\"The exchange rate has been refreshed. Please review the new amount.\"<\/td>\n<td>requote<\/td>\n<\/tr>\n<tr>\n<td><code>FX_UNAVAILABLE<\/code><\/td>\n<td>503<\/td>\n<td>FX feed down<\/td>\n<td>\"Currency exchange is temporarily unavailable.\"<\/td>\n<td>later<\/td>\n<\/tr>\n<tr>\n<td><code>CUTOFF_PASSED<\/code><\/td>\n<td>422<\/td>\n<td>Requested same-day after cut-off (only when customer insists on today)<\/td>\n<td>\"Today's cut-off has passed. The earliest date is {date}.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>EXECUTION_DATE_INVALID<\/code><\/td>\n<td>422<\/td>\n<td>Past date, &gt; 365 days ahead, or non-business day for scheduled<\/td>\n<td>\"Choose a business day within the next year.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>IBAN_INVALID<\/code><\/td>\n<td>422<\/td>\n<td>Checksum/length/country<\/td>\n<td>\"This IBAN doesn't look right. Check it and try again.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>BIC_INVALID<\/code><\/td>\n<td>422<\/td>\n<td>BIC format/unknown<\/td>\n<td>\"We couldn't recognise this SWIFT/BIC code.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>BENEFICIARY_DUPLICATE<\/code><\/td>\n<td>409<\/td>\n<td>Same account already saved<\/td>\n<td>\"You've already saved this payee as {name}.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>BENEFICIARY_LIMIT_REACHED<\/code><\/td>\n<td>422<\/td>\n<td>&gt; 200 beneficiaries<\/td>\n<td>\"You've reached the maximum number of saved payees.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>PURPOSE_CODE_REQUIRED<\/code><\/td>\n<td>422<\/td>\n<td>International without purpose<\/td>\n<td>\"Select the purpose of this payment.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>PASSWORD_TOO_SHORT<\/code><\/td>\n<td>422<\/td>\n<td>&lt; 12 chars<\/td>\n<td>\"Use at least 12 characters.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>PASSWORD_TOO_COMMON<\/code><\/td>\n<td>422<\/td>\n<td>In breached list<\/td>\n<td>\"This password is too common. Try a longer phrase.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>PASSWORD_CONTAINS_PERSONAL_INFO<\/code><\/td>\n<td>422<\/td>\n<td>Contains username/customer no.<\/td>\n<td>\"Don't include your username or customer number.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>PASSWORD_REUSED<\/code><\/td>\n<td>422<\/td>\n<td>Same as current or last 5<\/td>\n<td>\"Choose a password you haven't used recently.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>ENROLMENT_DETAILS_MISMATCH<\/code><\/td>\n<td>422<\/td>\n<td>Customer number/DOB mismatch (generic)<\/td>\n<td>\"We couldn't verify those details.\"<\/td>\n<td>yes (rate-limited)<\/td>\n<\/tr>\n<tr>\n<td><code>USERNAME_TAKEN<\/code><\/td>\n<td>409<\/td>\n<td>Username exists<\/td>\n<td>\"That username is taken.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>ACCOUNT_TEMPORARILY_LOCKED<\/code><\/td>\n<td>423<\/td>\n<td>5 failures<\/td>\n<td>\"Too many attempts. Try again in {minutes} minutes or reset your password.\"<\/td>\n<td>later<\/td>\n<\/tr>\n<tr>\n<td><code>ACCOUNT_LOCKED<\/code><\/td>\n<td>423<\/td>\n<td>10 failures / ops lock<\/td>\n<td>\"Your online banking is locked. Please contact us.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>CARD_STATE_INVALID<\/code><\/td>\n<td>409<\/td>\n<td>e.g. freeze a blocked card<\/td>\n<td>\"This card can't be changed in its current state.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>CARD_ACTIVATION_FAILED<\/code><\/td>\n<td>422<\/td>\n<td>last4/expiry mismatch<\/td>\n<td>\"Those card details don't match.\"<\/td>\n<td>yes (≤3)<\/td>\n<\/tr>\n<tr>\n<td><code>BILLER_REFERENCE_INVALID<\/code><\/td>\n<td>422<\/td>\n<td>Fails biller regex<\/td>\n<td>\"Check the {referenceLabel} format: {example}.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>BILLER_REFERENCE_NOT_FOUND<\/code><\/td>\n<td>422<\/td>\n<td>Biller says unknown<\/td>\n<td>\"{biller} couldn't find this reference.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>BILLER_UNAVAILABLE<\/code><\/td>\n<td>503<\/td>\n<td>Biller network down<\/td>\n<td>\"{biller} isn't responding right now.\"<\/td>\n<td>later<\/td>\n<\/tr>\n<tr>\n<td><code>BILL_AMOUNT_NOT_ALLOWED<\/code><\/td>\n<td>422<\/td>\n<td>Partial/over payment not allowed<\/td>\n<td>\"{biller} only accepts the full amount due.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>STATEMENT_RANGE_INVALID<\/code><\/td>\n<td>422<\/td>\n<td>&gt; 12 months / future<\/td>\n<td>\"Choose a range of up to 12 months, ending today or earlier.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>EXPORT_TOO_LARGE<\/code><\/td>\n<td>422<\/td>\n<td>&gt; 5,000 rows<\/td>\n<td>\"That's too many transactions to export. Narrow the date range.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>ATTACHMENT_TOO_LARGE<\/code><\/td>\n<td>422<\/td>\n<td>&gt; 5 MB<\/td>\n<td>\"Files must be 5 MB or smaller.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>ATTACHMENT_TYPE_NOT_ALLOWED<\/code><\/td>\n<td>422<\/td>\n<td>Not PDF/PNG/JPEG<\/td>\n<td>\"Attach a PDF, PNG or JPG.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>ATTACHMENT_MALWARE_DETECTED<\/code><\/td>\n<td>422<\/td>\n<td>Scanner hit<\/td>\n<td>\"We couldn't accept this file.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>THREAD_CLOSED<\/code><\/td>\n<td>409<\/td>\n<td>Post to closed thread &gt; 14 days<\/td>\n<td>\"This conversation is closed. Start a new message.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>ACCESS_REASON_REQUIRED<\/code><\/td>\n<td>400<\/td>\n<td>Ops view without reason<\/td>\n<td>(ops) \"Enter a reason for accessing this customer.\"<\/td>\n<td>fix<\/td>\n<\/tr>\n<tr>\n<td><code>MAKER_CHECKER_VIOLATION<\/code><\/td>\n<td>403<\/td>\n<td>Same user recommends &amp; approves<\/td>\n<td>(ops) \"A different supervisor must approve this.\"<\/td>\n<td>no<\/td>\n<\/tr>\n<tr>\n<td><code>RATE_LIMITED<\/code><\/td>\n<td>429<\/td>\n<td>Bucket exceeded<\/td>\n<td>\"Too many requests. Please wait a moment.\"<\/td>\n<td>after Retry-After<\/td>\n<\/tr>\n<tr>\n<td><code>DEPENDENCY_UNAVAILABLE<\/code><\/td>\n<td>503<\/td>\n<td>Generic adapter outage<\/td>\n<td>\"This service is temporarily unavailable.\"<\/td>\n<td>later<\/td>\n<\/tr>\n<tr>\n<td><code>INTERNAL_ERROR<\/code><\/td>\n<td>500<\/td>\n<td>Unhandled<\/td>\n<td>\"Something went wrong on our side. Reference: {traceId}.\"<\/td>\n<td>later<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": []}, {"k": "events", "floor": "contract", "name": "Domain Events and Audit Actions", "file": "sdd/contracts/domain-events.md", "html": "<p>Domain events are published <strong>in-process after commit<\/strong> via a transactional outbox table\n(<code>outbox_events<\/code>) and dispatched by the job runner (at-least-once; handlers idempotent by\n<code>eventId<\/code>). Notifications (F08), SSE, metrics and the ops console subscribe to them.<\/p>\n<h2 id=\"d-events-1-domain-events\">1. Domain events<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Event<\/th>\n<th>Producer<\/th>\n<th>Payload (besides <code>eventId<\/code>, <code>occurredAt<\/code>, <code>customerId<\/code>)<\/th>\n<th>Consumers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>identity.login_succeeded<\/code><\/td>\n<td>identity<\/td>\n<td>userId, deviceId, newDevice:boolean, ipCountry<\/td>\n<td>notifications (new device alert), audit view<\/td>\n<\/tr>\n<tr>\n<td><code>identity.login_failed<\/code><\/td>\n<td>identity<\/td>\n<td>usernameHash, reason<\/td>\n<td>metrics<\/td>\n<\/tr>\n<tr>\n<td><code>identity.account_locked<\/code><\/td>\n<td>identity<\/td>\n<td>userId, lockType (TEMP/HARD)<\/td>\n<td>notifications, ops<\/td>\n<\/tr>\n<tr>\n<td><code>identity.password_changed<\/code><\/td>\n<td>identity<\/td>\n<td>userId<\/td>\n<td>notifications (mandatory)<\/td>\n<\/tr>\n<tr>\n<td><code>identity.mfa_changed<\/code><\/td>\n<td>identity<\/td>\n<td>userId, change (TOTP_ADDED/TOTP_REMOVED/RECOVERY_REGENERATED)<\/td>\n<td>notifications (mandatory)<\/td>\n<\/tr>\n<tr>\n<td><code>identity.device_revoked<\/code><\/td>\n<td>identity<\/td>\n<td>deviceId<\/td>\n<td>notifications<\/td>\n<\/tr>\n<tr>\n<td><code>customer.contact_changed<\/code><\/td>\n<td>customers<\/td>\n<td>field (EMAIL/MOBILE)<\/td>\n<td>notifications (mandatory, to old AND new contact)<\/td>\n<\/tr>\n<tr>\n<td><code>payments.beneficiary_added<\/code><\/td>\n<td>payments<\/td>\n<td>beneficiaryId, type, maskedAccount<\/td>\n<td>notifications (mandatory)<\/td>\n<\/tr>\n<tr>\n<td><code>payments.order_created<\/code><\/td>\n<td>payments<\/td>\n<td>orderId, kind, amount, status<\/td>\n<td>SSE, metrics<\/td>\n<\/tr>\n<tr>\n<td><code>payments.order_status_changed<\/code><\/td>\n<td>payments<\/td>\n<td>orderId, from, to, failureCode?<\/td>\n<td>notifications, SSE<\/td>\n<\/tr>\n<tr>\n<td><code>payments.order_held<\/code><\/td>\n<td>payments<\/td>\n<td>orderId, ruleIds[]<\/td>\n<td>ops queue, notifications<\/td>\n<\/tr>\n<tr>\n<td><code>accounts.balance_changed<\/code><\/td>\n<td>ledger<\/td>\n<td>accountId, available, ledger<\/td>\n<td>SSE (dashboard refresh), alert evaluation (low balance)<\/td>\n<\/tr>\n<tr>\n<td><code>accounts.transaction_posted<\/code><\/td>\n<td>ledger<\/td>\n<td>accountId, transactionId, amount, direction, channel<\/td>\n<td>alert evaluation (large txn, international card)<\/td>\n<\/tr>\n<tr>\n<td><code>cards.status_changed<\/code><\/td>\n<td>cards<\/td>\n<td>cardId, from, to, reason<\/td>\n<td>notifications<\/td>\n<\/tr>\n<tr>\n<td><code>cards.controls_changed<\/code><\/td>\n<td>cards<\/td>\n<td>cardId, changes<\/td>\n<td>audit view<\/td>\n<\/tr>\n<tr>\n<td><code>cards.replacement_ordered<\/code><\/td>\n<td>cards<\/td>\n<td>oldCardId, newCardId<\/td>\n<td>notifications<\/td>\n<\/tr>\n<tr>\n<td><code>bills.payment_completed<\/code><\/td>\n<td>bills<\/td>\n<td>billPaymentId, billerId, amount<\/td>\n<td>notifications<\/td>\n<\/tr>\n<tr>\n<td><code>documents.statement_ready<\/code><\/td>\n<td>documents<\/td>\n<td>statementId, accountId, period<\/td>\n<td>notifications<\/td>\n<\/tr>\n<tr>\n<td><code>messaging.message_received<\/code><\/td>\n<td>messaging<\/td>\n<td>threadId, from (BANK/CUSTOMER)<\/td>\n<td>notifications, ops queue<\/td>\n<\/tr>\n<tr>\n<td><code>privacy.export_ready<\/code><\/td>\n<td>customers<\/td>\n<td>exportId<\/td>\n<td>notifications<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-events-2-audit-actions-every-one-is-written-with-outcome-success-or-failure\">2. Audit actions (every one is written with outcome SUCCESS or FAILURE)<\/h2>\n<p><code>LOGIN<\/code>, <code>LOGOUT<\/code>, <code>LOGIN_MFA<\/code>, <code>ENROLMENT_STARTED<\/code>, <code>ENROLMENT_COMPLETED<\/code>,\n<code>PASSWORD_RESET_REQUESTED<\/code>, <code>PASSWORD_RESET_COMPLETED<\/code>, <code>PASSWORD_CHANGED<\/code>,\n<code>STEP_UP_REQUESTED<\/code>, <code>STEP_UP_VERIFIED<\/code>, <code>MFA_TOTP_ENROLLED<\/code>, <code>MFA_TOTP_REMOVED<\/code>,\n<code>RECOVERY_CODES_REGENERATED<\/code>, <code>DEVICE_TRUSTED<\/code>, <code>DEVICE_REVOKED<\/code>, <code>SESSIONS_REVOKED_ALL<\/code>,\n<code>CONTACT_CHANGED<\/code>, <code>PREFERENCES_CHANGED<\/code>, <code>ACCOUNT_NICKNAME_CHANGED<\/code>,\n<code>TRANSACTION_CATEGORY_CHANGED<\/code>, <code>TRANSACTIONS_EXPORTED<\/code>, <code>BENEFICIARY_CREATED<\/code>,\n<code>BENEFICIARY_UPDATED<\/code>, <code>BENEFICIARY_DELETED<\/code>, <code>NAME_CHECK_PERFORMED<\/code>, <code>FX_QUOTE_CREATED<\/code>,\n<code>TRANSFER_CREATED<\/code>, <code>TRANSFER_CANCELLED<\/code>, <code>STANDING_ORDER_CREATED<\/code>,\n<code>STANDING_ORDER_CANCELLED<\/code>, <code>LIMITS_CHANGED<\/code>, <code>BILLER_SAVED<\/code>, <code>BILLER_REMOVED<\/code>,\n<code>BILL_PAYMENT_CREATED<\/code>, <code>CARD_FROZEN<\/code>, <code>CARD_UNFROZEN<\/code>, <code>CARD_CONTROLS_CHANGED<\/code>,\n<code>CARD_REPORTED<\/code>, <code>CARD_DETAILS_REVEALED<\/code>, <code>CARD_ACTIVATED<\/code>, <code>STATEMENT_DOWNLOADED<\/code>,\n<code>DOCUMENT_GENERATED<\/code>, <code>ALERT_RULES_CHANGED<\/code>, <code>MESSAGE_SENT<\/code>, <code>ATTACHMENT_UPLOADED<\/code>,\n<code>DATA_EXPORT_REQUESTED<\/code>, <code>CONSENT_CHANGED<\/code>, <code>AUTHZ_DENIED<\/code>,\n<code>OPS_CUSTOMER_VIEWED<\/code>, <code>OPS_USER_UNLOCKED<\/code>, <code>OPS_PAYMENT_RECOMMENDED<\/code>,\n<code>OPS_PAYMENT_APPROVED<\/code>, <code>OPS_PAYMENT_REJECTED<\/code>, <code>OPS_MESSAGE_SENT<\/code>, <code>OPS_AUDIT_SEARCHED<\/code>.<\/p>", "toc": [{"id": "d-events-1-domain-events", "t": "1. Domain events"}, {"id": "d-events-2-audit-actions-every-one-is-written-with-outcome-success-or-failure", "t": "2. Audit actions (every one is written with outcome SUCCESS or FAILURE)"}]}, {"k": "screens", "floor": "contract", "name": "Screen Inventory (route table)", "file": "sdd/design/screen-inventory.md", "html": "<p>Single source for the router (<code>apps/web/src/app/routes.ts<\/code>), the a11y sweep\n(<code>e2e/a11y.spec.ts<\/code>) and breadcrumbs. <strong>Bob must keep this table and <code>routes.ts<\/code> in sync<\/strong>;\n<code>pnpm specs:check<\/code> warns if a route here has no matching entry in <code>routes.ts<\/code> (once it exists).<\/p>\n<p>Legend — Auth: <code>public<\/code>, <code>customer<\/code>, <code>ops<\/code>, <code>demo<\/code> · Template per SPEC-05 §3.2.<\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Route<\/th>\n<th>Screen<\/th>\n<th>Feature<\/th>\n<th>Template<\/th>\n<th>Auth<\/th>\n<th>Phase<\/th>\n<th>Title key<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>/sign-in<\/code><\/td>\n<td>Sign in<\/td>\n<td>F01<\/td>\n<td>Auth<\/td>\n<td>public<\/td>\n
