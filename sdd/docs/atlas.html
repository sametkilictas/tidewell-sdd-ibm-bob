stomer changes a transaction's category, THE SYSTEM SHALL save it for that transaction only and reflect it in insights (DASH-008).", "acs": [{"id": "ACCT-013-AC1", "t": "The change is audited `TRANSACTION_CATEGORY_CHANGED` and visible after reload."}]}, {"id": "ACCT-014", "title": "Pagination", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL load 25 transactions per page with a \"Load more\" button (not infinite scroll, for keyboard and screen-reader users) and announce \"25 more transactions loaded\".", "acs": [{"id": "ACCT-014-AC1", "t": "Cursor pagination returns no duplicates or gaps when a new transaction posts between page loads."}]}, {"id": "ACCT-015", "title": "Export", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer exports with current filters, THE SYSTEM SHALL generate CSV or PDF per BR-ACCT-05 with header rows (account, IBAN masked, period, generated at, opening/closing balance for unfiltered exports).", "acs": [{"id": "ACCT-015-AC1", "t": "CSV columns: `booking_date,value_date,description,reference,category,debit,credit,currency,running_balance`; amounts use `.` decimal with exact exponent; opens correctly in Excel (BOM)."}, {"id": "ACCT-015-AC2", "t": "Range > 12 months → `422 STATEMENT_RANGE_INVALID` mapped to inline error before request where possible."}]}, {"id": "ACCT-016", "title": "Report a problem", "pri": "P3", "type": "Event-driven", "ears": "WHEN the customer selects \"Report a problem\" on a transaction, THE SYSTEM SHALL start a secure message (F10) of category \"Dispute a transaction\" pre-filled with the transaction reference, date and amount.", "acs": [{"id": "ACCT-016-AC1", "t": "See MSG-005."}]}]}], "routes": [{"route": "/accounts", "screen": "Accounts list (List template)"}, {"route": "/accounts/:accountId", "screen": "Account detail: header (name, masked no., balances, actions: Transfer, Statements, Show details), Tabs: **Transactions** (default) · **Details** · **Statements** (links F07)"}, {"route": "/accounts/:accountId?txn=:transactionId", "screen": "Opens transaction panel (deep-linkable)"}], "ops": [{"id": "listAccounts", "m": "GET", "p": "/accounts", "s": "List the customer's accounts", "r": ["ACCT-001"]}, {"id": "getAccount", "m": "GET", "p": "/accounts/{accountId}", "s": "Account detail with identifiers and product panel", "r": ["ACCT-002", "ACCT-003", "ACCT-005", "NFR-SEC-010"]}, {"id": "updateAccount", "m": "PATCH", "p": "/accounts/{accountId}", "s": "Update nickname", "r": ["ACCT-004", "NFR-SEC-012"]}, {"id": "listTransactions", "m": "GET", "p": "/accounts/{accountId}/transactions", "s": "Transaction history with filters (pending first)", "r": ["ACCT-010", "ACCT-011", "ACCT-014", "NFR-PERF-002"]}, {"id": "getTransaction", "m": "GET", "p": "/accounts/{accountId}/transactions/{transactionId}", "s": "Transaction detail", "r": ["ACCT-012"]}, {"id": "updateTransaction", "m": "PATCH", "p": "/accounts/{accountId}/transactions/{transactionId}", "s": "Change category", "r": ["ACCT-013"]}, {"id": "exportTransactions", "m": "GET", "p": "/accounts/{accountId}/transaction-export", "s": "Export filtered transactions as CSV or PDF", "r": ["ACCT-015"]}], "data": ["pg_trgm", "transactions_view", "tsvector"], "edges": 3, "deps": ["F00", "F01"], "refs": ["SPEC-03"], "personas": ["P1", "P2", "P3"], "journeys": ["J2"], "path": "sdd/specs/features/F03-accounts-transactions"}, {"id": "F04", "title": "Transfers, Beneficiaries, Standing Orders and Limits", "short": "Transfers and beneficiaries (own, internal, domestic; international = P2)", "summary": "The money-movement heart of the prototype. Customers move money between their own accounts (incl. FX), pay saved beneficiaries at Tidewell, other local banks and abroad, schedule one-off and recurring payments, and see exactly what will happen — fees, rate, dates — before confirming. Every order is idempotent, limit-checked, fraud-screened, ledger-posted and fully traceable.", "stories": [{"id": "US-XFER-1", "who": "Sara", "want": "to move AED to my USD account and see the exact rate first", "so": "I'm not surprised by FX"}, {"id": "US-XFER-2", "who": "Sara", "want": "to pay my landlord monthly automatically", "so": "rent is never late"}, {"id": "US-XFER-3", "who": "Daniel", "want": "to send EUR to my sister with known fees and arrival date", "so": "she gets what I intend"}, {"id": "US-XFER-4", "who": "Sara", "want": "a receipt with a reference", "so": "I can prove I paid"}, {"id": "US-XFER-5", "who": "any customer", "want": "protection when adding new payees", "so": "fraudsters can't drain my account"}], "groups": [{"name": "Own-account transfers", "reqs": [{"id": "XFER-001", "title": "Transfer between own accounts", "pri": "P1", "type": "Event-driven", "ears": "WHEN the customer transfers between two of their own ACTIVE accounts in the same currency, THE SYSTEM SHALL validate available balance, post a balanced journal (SPEC-03 §5.5) instantly, and show a receipt.", "acs": [{"id": "XFER-001-AC1", "t": "Sara moves AED 2,000.00 Current → Savings; both balances update on the receipt and dashboard; status COMPLETED."}, {"id": "XFER-001-AC2", "t": "Choosing the same account for From and To is prevented in the UI (destination list excludes source) and rejected by API `SAME_ACCOUNT`."}]}, {"id": "XFER-002", "title": "Own-account FX transfer", "pri": "P1", "type": "Event-driven", "ears": "WHEN source and destination currencies differ, THE SYSTEM SHALL obtain an FX quote (BR-XFER-02), let the customer enter either the amount to send or the amount to receive, show the customer rate, inverse rate and both amounts, and execute only with an unexpired quote.", "acs": [{"id": "XFER-002-AC1", "t": "Entering \"receive USD 100.00\" computes and displays the AED debit using the quote; editing the receive amount re-quotes after 400 ms debounce."}, {"id": "XFER-002-AC2", "t": "Confirming 31 s after quoting returns `FX_QUOTE_EXPIRED`; the review step shows the refreshed amounts and requires a second confirm."}, {"id": "XFER-002-AC3", "t": "Ledger shows four postings across two currencies, each currency balanced (LGR-INV-1)."}]}, {"id": "XFER-003", "title": "Credit card repayment", "pri": "P1", "type": "Event-driven", "ears": "WHEN the destination is the customer's credit card account, THE SYSTEM SHALL offer amount options Minimum due, Statement balance, Full owed, Other, and SHALL reject amounts above the owed balance.", "acs": [{"id": "XFER-003-AC1", "t": "Paying \"Statement balance\" reduces owed by that amount and clears the \"due\" attention item if fully paid."}]}]}, {"name": "Beneficiaries", "reqs": [{"id": "XFER-010", "title": "Beneficiary list", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL list saved beneficiaries with avatar initials, display name/nickname, type tag, masked account, bank name, cooling-off indicator, favourite star, and search by name/nickname/bank, favourites first then alphabetical (locale-aware collation).", "acs": [{"id": "XFER-010-AC1", "t": "Searching \"sal\" matches \"Ahmad Saleh\" and nickname \"Salma\"."}]}, {"id": "XFER-011", "title": "Add internal beneficiary", "pri": "P1", "type": "Event-driven", "ears": "WHEN the customer adds a Tidewell beneficiary by IBAN or account number, THE SYSTEM SHALL validate it exists and is ACTIVE, run name check against the entered holder name, and save after step-up `BENEFICIARY_CREATE`.", "acs": [{"id": "XFER-011-AC1", "t": "Entering one of the customer's own accounts shows \"This is your own account — use 'Between my accounts'\"."}]}, {"id": "XFER-012", "title": "Add domestic beneficiary", "pri": "P1", "type": "Event-driven", "ears": "WHEN the customer enters a `HOME_COUNTRY` IBAN of another bank, THE SYSTEM SHALL validate it (FND-010), auto-fill the bank name from the IBAN bank code, perform name check (XFER-014), and save after step-up.", "acs": [{"id": "XFER-012-AC1", "t": "IBAN typed with spaces/lowercase is normalised; invalid checksum shows \"This IBAN doesn't look right\" inline on blur."}, {"id": "XFER-012-AC2", "t": "Unknown bank code → \"We don't recognise this bank\" (blocking)."}]}, {"id": "XFER-013", "title": "Add international beneficiary", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer adds an international beneficiary, THE SYSTEM SHALL collect country, currency, account identifier (IBAN for IBAN countries, else account number 4–34 alphanumerics), BIC (validated and looked up to show bank name/city), beneficiary full name and address (street, city, country — SWIFT charset), and save after step-up.", "acs": [{"id": "XFER-013-AC1", "t": "Selecting Germany requires an IBAN (22 chars); selecting United States requires account number + BIC and hides IBAN."}, {"id": "XFER-013-AC2", "t": "A non-SWIFT character in the name shows \"Use English letters, numbers and basic punctuation for international payments\"."}]}, {"id": "XFER-014", "title": "Confirmation of payee (simulated)", "pri": "P1", "type": "Event-driven", "ears": "WHEN name check returns MATCH, CLOSE_MATCH, NO_MATCH or UNAVAILABLE, THE SYSTEM SHALL respectively: show a success tag; show the suggested name with \"Use this name\" / \"Keep what I entered\"; show a warning requiring an explicit \"I understand the risk\" checkbox; show an info notice that the name couldn't be checked.", "acs": [{"id": "XFER-014-AC1", "t": "Entering \"Ahmed Saleh\" for account held by \"Ahmad Saleh\" returns CLOSE_MATCH with suggestion."}, {"id": "XFER-014-AC2", "t": "The CoP result and the customer's decision are stored on the beneficiary and shown on the transfer review step."}]}, {"id": "XFER-015", "title": "Cooling-off for new beneficiaries", "pri": "P1", "type": "State-driven", "ears": "WHILE a beneficiary is less than 24 h old, THE SYSTEM SHALL apply BR-XFER-L3, show a \"New payee\" tag with the time cooling-off ends, and require step-up for any transfer to it; WHEN a beneficiary is added, THE SYSTEM SHALL send a mandatory security notification.", "acs": [{"id": "XFER-015-AC1", "t": "A 6,000.00 transfer to a 1-hour-old beneficiary → `LIMIT_EXCEEDED_NEW_BENEFICIARY` with remaining 5,000.00."}]}, {"id": "XFER-016", "title": "Manage beneficiary", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer edits a beneficiary, THE SYSTEM SHALL allow changes to nickname and favourite only (BR-XFER-07); WHEN deleting, THE SYSTEM SHALL list any scheduled/standing orders to that beneficiary and cancel them as part of a confirmed deletion.", "acs": [{"id": "XFER-016-AC1", "t": "Delete modal reads \"Deleting Ahmad Saleh will also cancel 1 standing order (Rent, monthly AED 4,500.00).\""}]}, {"id": "XFER-017", "title": "Duplicate prevention", "pri": "P2", "type": "Unwanted behaviour", "ears": "IF the customer adds a beneficiary whose normalised account identifier already exists in their list, THEN THE SYSTEM SHALL reject with `BENEFICIARY_DUPLICATE` naming the existing entry.", "acs": [{"id": "XFER-017-AC1", "t": "Same IBAN with different spacing is detected as duplicate."}]}]}, {"name": "Making a transfer", "reqs": [{"id": "XFER-020", "title": "Transfer wizard", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL guide transfers through steps **1 Who & how much** (from account with available balance; to: own account / beneficiary picker / \"+ New payee\"; amount with currency; quick amounts not provided), **2 When & details** (now / on a date / repeat; reference; purpose & charges for international), **3 Review**, then **Receipt**, preserving entered data when moving back.", "acs": [{"id": "XFER-020-AC1", "t": "Back from Review to step 1 keeps all values; changing amount invalidates the quote and any step-up token."}, {"id": "XFER-020-AC2", "t": "Leaving the wizard with unsaved input prompts \"Discard this transfer?\"."}]}, {"id": "XFER-021", "title": "Limits enforcement", "pri": "P1", "type": "Unwanted behaviour", "ears": "IF an external transfer would exceed BR-XFER-L1, L2 (or the lower customer-chosen limit) or L3, THEN THE SYSTEM SHALL reject it at quote time and again at submission with the specific limit code and remaining amount.", "acs": [{"id": "XFER-021-AC1", "t": "With 48,000.00 already sent today, a 3,000.00 domestic transfer shows \"This would exceed your daily transfer limit of AED 50,000.00. Remaining today: AED 2,000.00.\""}, {"id": "XFER-021-AC2", "t": "Scheduled transfers are checked against the limit of their execution date at execution time; failure → FAILED with `LIMIT_EXCEEDED_DAILY` and notification."}]}, {"id": "XFER-022", "title": "Cut-off and dates", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL compute and display execution date and value date per §3.1 and the business calendar, and SHALL show a cut-off notice when today's cut-off has passed or today is not a business day.", "acs": [{"id": "XFER-022-AC1", "t": "Domestic submitted Friday 20 Nov 2026 at 14:05 local → review shows \"Sent on Mon 23 Nov · Arrives Mon 23 Nov\" and notice \"Today's cut-off (14:00) has passed.\""}]}, {"id": "XFER-023", "title": "Future-dated transfer", "pri": "P1", "type": "Event-driven", "ears": "WHEN the customer chooses \"On a date\" (BR-XFER-04), THE SYSTEM SHALL create a SCHEDULED order without placing a hold, and on the execution date the job SHALL re-validate balance and limits then process or fail it with a notification.", "acs": [{"id": "XFER-023-AC1", "t": "Using `/dev/clock` to advance to execution date and `/dev/jobs/run scheduled-transfers.release`, the order becomes PROCESSING then COMPLETED."}]}, {"id": "XFER-024", "title": "Standing orders", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer chooses \"Repeat\", THE SYSTEM SHALL create a standing order (BR-XFER-05), show the next 3 execution dates on review, and list it under Transfers › Standing orders with next date, frequency, amount and remaining payments.", "acs": [{"id": "XFER-024-AC1", "t": "Monthly on the 30th is not offered; \"Last business day\" option is."}, {"id": "XFER-024-AC2", "t": "Each execution creates a normal PaymentOrder linked by `standingOrderId`."}]}, {"id": "XFER-025", "title": "Review step", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL show on review: from (name, masked, available after transfer), to (name, masked, bank, CoP result), amount sent, FX rate with live expiry countdown (if any), fees and who pays them, total debited, amount beneficiary receives (or \"may be reduced by intermediary charges\" for SHA/BEN), execution and value dates, frequency, reference, purpose; plus a \"Confirm and send\" primary button whose label includes the total (\"Send AED 2,035.00\").", "acs": [{"id": "XFER-025-AC1", "t": "Values on review equal the server quote exactly (no client-side money math other than formatting)."}]}, {"id": "XFER-026", "title": "Submission", "pri": "P1", "type": "Event-driven", "ears": "WHEN the customer confirms, THE SYSTEM SHALL submit with the review's `Idempotency-Key` (ADR-0005), perform step-up if required (AUTH-040), re-run validations, fraud rules (NFR-SEC-050), place holds, and return the created order; the confirm button SHALL be disabled with an inline loading state until a response arrives.", "acs": [{"id": "XFER-026-AC1", "t": "Double-clicking confirm creates exactly one order (E2E + NFR-REL-003)."}, {"id": "XFER-026-AC2", "t": "A network error after submit shows \"We're checking whether your transfer went through…\" and retries with the same key, then shows the true result."}]}, {"id": "XFER-027", "title": "Receipt", "pri": "P1", "type": "Event-driven", "ears": "WHEN an order is created, THE SYSTEM SHALL show a receipt page (status, reference with copy, all review details, created timestamp with zone) with actions Download PDF (in the customer's preferred language), Make another transfer, Go to dashboard.", "acs": [{"id": "XFER-027-AC1", "t": "PDF contains bank name \"Tidewell Bank (demo)\", reference, masked accounts, amounts, fees, FX, dates, and a \"This is a demo document\" watermark."}]}, {"id": "XFER-028", "title": "Status tracking", "pri": "P1", "type": "Event-driven", "ears": "WHEN an order changes status, THE SYSTEM SHALL update the receipt/detail views live (SSE), add an event to the order timeline (created, held, processing, completed/failed with reason) and notify the customer for COMPLETED (external only), FAILED, RETURNED, HELD_FOR_REVIEW and REJECTED.", "acs": [{"id": "XFER-028-AC1", "t": "Domestic receipt shows Processing then changes to Completed within ~6 s without reload."}]}, {"id": "XFER-029", "title": "Transfer history", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL list the customer's transfers (all kinds) with filters (status, kind, date range, beneficiary) and tabs **History** · **Scheduled** · **Standing orders**, each row opening the transfer detail with timeline.", "acs": [{"id": "XFER-029-AC1", "t": "Scheduled tab shows only SCHEDULED one-offs ordered by execution date."}]}, {"id": "XFER-030", "title": "Cancel", "pri": "P1", "type": "Event-driven", "ears": "WHEN the customer cancels a scheduled order or a standing order (BR-XFER-06), THE SYSTEM SHALL confirm in a danger modal, cancel it, audit, and remove it from upcoming payments.", "acs": [{"id": "XFER-030-AC1", "t": "Cancelling a PROCESSING order is not offered; API returns `409 CONFLICT_STATE` if attempted."}]}, {"id": "XFER-031", "title": "Repeat transfer", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer selects \"Repeat\" on a past transfer, THE SYSTEM SHALL open the wizard pre-filled (from, to, amount, reference) at step 1, with a new idempotency key and fresh quote.", "acs": [{"id": "XFER-031-AC1", "t": "Repeating a transfer to a deleted beneficiary shows \"This payee is no longer saved\"."}]}, {"id": "XFER-032", "title": "International transfer specifics", "pri": "P2", "type": "Event-driven", "ears": "WHEN sending internationally, THE SYSTEM SHALL require purpose (BR-XFER-08), charge bearer choice (SHA default, explained in plain language), apply FX when debit currency ≠ transfer currency, post fee to `GL-FEE-INCOME-AED` (converted if debit account is not AED), and settle via the SWIFT simulator.", "acs": [{"id": "XFER-032-AC1", "t": "Choosing OUR shows fee AED 70.00 and \"Your beneficiary receives the full amount\"."}, {"id": "XFER-032-AC2", "t": "In demo mode, a customer reference containing `DEMO-REJECT` makes the SWIFT simulator reject the order (`INTERMEDIARY_BANK_REJECTED`, ADR-0007) → FAILED, hold released, notification sent."}]}, {"id": "XFER-033", "title": "Held for review", "pri": "P2", "type": "State-driven", "ears": "WHILE an order is HELD_FOR_REVIEW, THE SYSTEM SHALL show \"Under review — we're checking this payment to keep you safe. We'll update you within 1 business day.\" keep the hold in place, and reflect the ops decision (F11) when made.", "acs": [{"id": "XFER-033-AC1", "t": "A demo reference containing `DEMO-REVIEW` is held (FR-4) and appears in the ops queue."}]}, {"id": "XFER-034", "title": "Failure and return handling", "pri": "P1", "type": "Event-driven", "ears": "WHEN the rail rejects an order, THE SYSTEM SHALL mark it FAILED with a customer-readable reason, release the hold, and notify; WHEN completed funds are returned, THE SYSTEM SHALL post a reversing journal, mark RETURNED and notify.", "acs": [{"id": "XFER-034-AC1", "t": "Domestic transfer with reference containing `DEMO-REJECT` → FAILED \"The beneficiary's account is closed.\"; available balance restored."}]}, {"id": "XFER-035", "title": "Limits management", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer views Transfers › Limits, THE SYSTEM SHALL show each limit, today's usage and remaining amount, and allow setting the customer-chosen daily limit (BR-XFER-L4).", "acs": [{"id": "XFER-035-AC1", "t": "Raising from 10,000.00 to 30,000.00 triggers step-up; lowering does not."}]}]}], "routes": [{"route": "/transfers", "screen": "Hub: primary actions (Between my accounts, Pay someone, Send abroad), tabs History · Scheduled · Standing orders, link Limits"}, {"route": "/transfers/new?type=own\\", "screen": "beneficiary\\"}, {"route": "/transfers/:transferId", "screen": "Detail + timeline + actions (Download receipt, Repeat, Cancel)"}, {"route": "/transfers/:transferId/receipt", "screen": "Receipt"}, {"route": "/transfers/limits", "screen": "Limits"}, {"route": "/payees", "screen": "Beneficiaries list (shared with F05 saved billers under \"Payments\" nav)"}, {"route": "/payees/new?type=internal\\", "screen": "domestic\\"}, {"route": "/payees/:beneficiaryId", "screen": "Beneficiary detail (recent payments to them, Pay, Edit nickname, Delete)"}], "ops": [{"id": "listBeneficiaries", "m": "GET", "p": "/beneficiaries", "s": "List saved beneficiaries", "r": ["XFER-010"]}, {"id": "createBeneficiary", "m": "POST", "p": "/beneficiaries", "s": "Add a beneficiary (step-up, cooling-off starts)", "r": ["XFER-011", "XFER-012", "XFER-013", "XFER-015", "XFER-017", "AUTH-040"]}, {"id": "getBeneficiary", "m": "GET", "p": "/beneficiaries/{beneficiaryId}", "s": "Beneficiary detail", "r": ["XFER-010"]}, {"id": "updateBeneficiary", "m": "PATCH", "p": "/beneficiaries/{beneficiaryId}", "s": "Update nickname / favourite", "r": ["XFER-016"]}, {"id": "deleteBeneficiary", "m": "DELETE", "p": "/beneficiaries/{beneficiaryId}", "s": "Delete beneficiary and cancel its scheduled/standing orders", "r": ["XFER-016"]}, {"id": "checkBeneficiaryName", "m": "POST", "p": "/name-checks", "s": "Confirmation of payee (simulated)", "r": ["XFER-014"]}, {"id": "createFxQuote", "m": "POST", "p": "/fx/quotes", "s": "Lock an FX rate for 30 seconds", "r": ["XFER-002"]}, {"id": "quoteTransfer", "m": "POST", "p": "/transfer-quotes", "s": "Validate and price a transfer (fees, FX, dates, limits, step-up need)", "r": ["XFER-020", "XFER-021", "XFER-022", "XFER-025", "XFER-032"]}, {"id": "createTransfer", "m": "POST", "p": "/transfers", "s": "Create a transfer, scheduled transfer or standing order", "r": ["XFER-001", "XFER-002", "XFER-003", "XFER-023", "XFER-024", "XFER-026", "XFER-032", "NFR-REL-003", "NFR-SEC-050"]}, {"id": "listTransfers", "m": "GET", "p": "/transfers", "s": "Transfer history", "r": ["XFER-029"]}, {"id": "getTransfer", "m": "GET", "p": "/transfers/{transferId}", "s": "Transfer detail with timeline", "r": ["XFER-028", "XFER-029"]}, {"id": "cancelTransfer", "m": "POST", "p": "/transfers/{transferId}/cancel", "s": "Cancel a scheduled transfer", "r": ["XFER-030"]}, {"id": "getTransferReceipt", "m": "GET", "p": "/transfers/{transferId}/receipt", "s": "Receipt PDF", "r": ["XFER-027"]}, {"id": "listStandingOrders", "m": "GET", "p": "/standing-orders", "s": "Standing orders", "r": ["XFER-024", "XFER-029"]}, {"id": "cancelStandingOrder", "m": "DELETE", "p": "/standing-orders/{standingOrderId}", "s": "Cancel a standing order", "r": ["XFER-030"]}, {"id": "getLimits", "m": "GET", "p": "/limits", "s": "Transfer limits and today's usage", "r": ["XFER-035"]}, {"id": "updateLimits", "m": "PATCH", "p": "/limits", "s": "Change customer-chosen daily limit (raising needs step-up)", "r": ["XFER-035"]}, {"id": "listPurposeCodes", "m": "GET", "p": "/reference/purpose-codes", "s": "Purpose codes for international payments", "r": ["XFER-032"]}, {"id": "lookupBank", "m": "GET", "p": "/reference/banks", "s": "Look up a bank by BIC or IBAN", "r": ["XFER-012", "XFER-013"]}, {"id": "listCurrencies", "m": "GET", "p": "/reference/currencies", "s": "Supported currencies and exponents", "r": ["XFER-002", "FND-009"]}, {"id": "getBusinessCalendar", "m": "GET", "p": "/reference/business-calendar", "s": "Weekend, holidays and cut-offs", "r": ["XFER-022", "FND-011"]}], "data": ["beneficiaries", "bic_directory", "domestic_banks", "fraud_rule_hits", "fx_quotes", "holds", "journal_entries", "limit_profiles", "limit_usage", "payment_order_events", "payment_orders", "postings", "standing_orders"], "edges": 6, "deps": ["F00", "F01", "F03"], "refs": ["SPEC-03", "ADR-0003", "ADR-0005", "ADR-0007"], "personas": ["P1", "P2"], "journeys": ["J3", "J4", "J5"], "path": "sdd/specs/features/F04-transfers-beneficiaries"}, {"id": "F05", "title": "Bill Payments and Top-ups", "short": "Bill payments", "summary": "Customers pay utility, telecom, internet, education and government-fee bills from a catalogue of (fictional) billers, look up the amount due, pay now or schedule, and top up prepaid mobile lines. Bill payments are PaymentOrders of kind `BILL`, reuse the transfer review/receipt patterns and count toward the daily external limit.", "stories": [], "groups": [{"name": "Requirements", "reqs": [{"id": "BILL-001", "title": "Browse and search billers", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL present billers grouped by category with icons and a search by name (en/ar), showing each biller's reference label and an example.", "acs": [{"id": "BILL-001-AC1", "t": "Typing \"fiber\" shows FiberLink Home; Arabic name search works."}]}, {"id": "BILL-002", "title": "Save a biller", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer saves a biller with a reference and optional nickname, THE SYSTEM SHALL validate the reference against the biller pattern, run an inquiry when supported to confirm the account exists, and save it (no step-up — funds can only go to the biller).", "acs": [{"id": "BILL-002-AC1", "t": "Invalid format shows \"Check the meter account format: 12 digits, e.g. 100200300400\"."}, {"id": "BILL-002-AC2", "t": "Reference ending `999` (demo) shows \"AquaGrid Utilities couldn't find this reference.\""}]}, {"id": "BILL-003", "title": "Amount due inquiry", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer opens a saved inquiry-capable biller, THE SYSTEM SHALL show amount due, due date, bill period, masked account-holder name and \"last updated\" time, with Refresh.", "acs": [{"id": "BILL-003-AC1", "t": "Overdue bills show an \"Overdue\" warning tag."}]}, {"id": "BILL-004", "title": "Pay a bill now", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer pays a bill, THE SYSTEM SHALL pre-fill the amount due, enforce the biller's payment rule (§2.1), check balance and daily limit, and execute via review → confirm → receipt with idempotency.", "acs": [{"id": "BILL-004-AC1", "t": "Editing the amount for FiberLink is not possible (read-only amount with explanation)."}, {"id": "BILL-004-AC2", "t": "The receipt shows biller confirmation number from the simulator."}]}, {"id": "BILL-005", "title": "Prepaid top-up", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer tops up a prepaid line, THE SYSTEM SHALL offer only the fixed denominations as a `RadioTile` group and complete the payment as in BILL-004.", "acs": [{"id": "BILL-005-AC1", "t": "Mobile number can be entered ad hoc without saving, and \"Save for next time\" is offered on the receipt."}]}, {"id": "BILL-006", "title": "Schedule and auto-pay", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer schedules a bill payment or sets up auto-pay (BR-BILL-04), THE SYSTEM SHALL create a scheduled order or standing order of kind BILL, show it in Upcoming payments, and on execution apply the same validations, notifying on success or failure.", "acs": [{"id": "BILL-006-AC1", "t": "Auto-pay \"amount due\" with a maximum of 400.00 and a bill of 523.00 → that execution is FAILED with `BILL_AMOUNT_NOT_ALLOWED`, reason \"Amount due exceeds your auto-pay maximum\", and the customer is notified; the auto-pay itself stays active."}]}, {"id": "BILL-007", "title": "Bill payment history", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL list bill payments with biller, reference (masked), amount, date, status and confirmation number, filterable by biller and date.", "acs": [{"id": "BILL-007-AC1", "t": "Each row links to its receipt (PDF available)."}]}, {"id": "BILL-008", "title": "Biller unavailable", "pri": "P2", "type": "Unwanted behaviour", "ears": "IF the biller network is unavailable, THEN THE SYSTEM SHALL show `BILLER_UNAVAILABLE` messaging for inquiry and payment while leaving the rest of the app usable, and SHALL NOT debit the customer.", "acs": [{"id": "BILL-008-AC1", "t": "With fault toggle on, pay attempt yields no hold/posting and a friendly error with retry."}]}, {"id": "BILL-009", "title": "Remove saved biller", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer removes a saved biller, THE SYSTEM SHALL confirm and cancel any scheduled payments and auto-pay for it.", "acs": [{"id": "BILL-009-AC1", "t": "Upcoming payments no longer lists the cancelled auto-pay."}]}]}], "routes": [{"route": "/payments", "screen": "Payments hub: Saved billers (cards with amount due), Pay a new bill, Top up, tabs History · Scheduled"}, {"route": "/payments/billers", "screen": "Biller catalogue (search + categories)"}, {"route": "/payments/billers/:billerId/save", "screen": "Save biller form"}, {"route": "/payments/saved/:savedBillerId", "screen": "Saved biller detail with inquiry + Pay / Schedule / Auto-pay / Remove"}, {"route": "/payments/pay?savedBillerId=", "screen": "Pay wizard (amount → when → review → receipt)"}, {"route": "/payments/top-up", "screen": "Top-up wizard"}], "ops": [{"id": "listBillers", "m": "GET", "p": "/billers", "s": "Biller catalogue", "r": ["BILL-001"]}, {"id": "getBiller", "m": "GET", "p": "/billers/{billerId}", "s": "Biller detail", "r": ["BILL-001"]}, {"id": "listSavedBillers", "m": "GET", "p": "/saved-billers", "s": "Saved billers with last inquiry", "r": ["BILL-002", "BILL-003"]}, {"id": "createSavedBiller", "m": "POST", "p": "/saved-billers", "s": "Save a biller reference", "r": ["BILL-002"]}, {"id": "deleteSavedBiller", "m": "DELETE", "p": "/saved-billers/{savedBillerId}", "s": "Remove a saved biller (cancels schedules)", "r": ["BILL-009"]}, {"id": "inquireSavedBiller", "m": "POST", "p": "/saved-billers/{savedBillerId}/inquiry", "s": "Fetch amount due", "r": ["BILL-003", "BILL-008"]}, {"id": "createBillPayment", "m": "POST", "p": "/bill-payments", "s": "Pay, schedule or set up auto-pay", "r": ["BILL-004", "BILL-005", "BILL-006", "BILL-008"]}, {"id": "listBillPayments", "m": "GET", "p": "/bill-payments", "s": "Bill payment history", "r": ["BILL-007"]}, {"id": "getBillPayment", "m": "GET", "p": "/bill-payments/{billPaymentId}", "s": "Bill payment detail", "r": ["BILL-007"]}], "data": [], "edges": 0, "deps": ["F00", "F01", "F03", "F04"], "refs": [], "personas": ["P1", "P3"], "journeys": ["J7"], "path": "sdd/specs/features/F05-bill-payments"}, {"id": "F06", "title": "Card Management", "short": "Card management", "summary": "Customers see their debit and credit cards, freeze/unfreeze instantly, control where cards work, adjust spending limits, securely reveal card details, activate new cards and report lost/stolen cards with a replacement. All state changes go through the simulated card processor (ADR-0007) and the card state machine (SPEC-03 §6.2).", "stories": [], "groups": [{"name": "Requirements", "reqs": [{"id": "CARD-001", "title": "Cards overview", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL list cards as visual card tiles (generic Tidewell card art — no network logos copied; network shown as text) with cardholder name, kind, last4, expiry, status tag and linked account; credit cards also show available credit.", "acs": [{"id": "CARD-001-AC1", "t": "A FROZEN card tile shows a frost overlay with \"Frozen\" text (not colour only)."}]}, {"id": "CARD-002", "title": "Freeze and unfreeze", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer toggles \"Freeze card\", THE SYSTEM SHALL confirm the effect (\"New purchases and withdrawals will be declined. Recurring payments may also be declined.\"), apply it via the card processor, update status immediately and send a notification.", "acs": [{"id": "CARD-002-AC1", "t": "Freeze → status FROZEN in < 1 s; unfreeze → ACTIVE; both audited."}, {"id": "CARD-002-AC2", "t": "Freezing a BLOCKED card is impossible (`409 CARD_STATE_INVALID`)."}]}, {"id": "CARD-003", "title": "Card controls", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer changes a control (BR-CARD-03), THE SYSTEM SHALL apply and persist it with an `InlineLoading` state on the toggle and revert the toggle with an error if the processor fails.", "acs": [{"id": "CARD-003-AC1", "t": "With processor fault toggle on, toggling E-commerce reverts and shows \"We couldn't update your card. Try again.\""}]}, {"id": "CARD-004", "title": "Spending limits", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer edits limits (BR-CARD-04) using sliders paired with numeric inputs, THE SYSTEM SHALL validate ranges/steps and save all limits atomically.", "acs": [{"id": "CARD-004-AC1", "t": "Slider and input stay in sync; keyboard arrows move by AED 500.00."}]}, {"id": "CARD-005", "title": "Reveal card details", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer selects \"Show card details\", THE SYSTEM SHALL require step-up, then display PAN, expiry and CVC per BR-CARD-02 with a visible 30-second countdown and automatic re-masking, and SHALL prevent the details being cached by the browser or stored in client state after masking.", "acs": [{"id": "CARD-005-AC1", "t": "After 30 s the DOM no longer contains the PAN (component test)."}, {"id": "CARD-005-AC2", "t": "The reveal response has `Cache-Control: no-store` and is never logged (log-capture test)."}]}, {"id": "CARD-006", "title": "Report lost or stolen", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer reports a card LOST, STOLEN or DAMAGED, THE SYSTEM SHALL (after review + step-up for LOST/STOLEN) block the card permanently (DAMAGED keeps it ACTIVE until the replacement is activated), optionally order a replacement (BR-CARD-06/07), debit any fee, show a receipt and notify.", "acs": [{"id": "CARD-006-AC1", "t": "Reporting STOLEN with replacement: old card BLOCKED, new card PENDING_ACTIVATION appears with \"Arriving in 5–7 business days\"."}, {"id": "CARD-006-AC2", "t": "The flow suggests reviewing recent transactions with a link filtered to that card."}]}, {"id": "CARD-007", "title": "Activate a card", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer activates a PENDING_ACTIVATION card with matching last4 and expiry, THE SYSTEM SHALL set it ACTIVE and, if it replaced a DAMAGED card, block the old card.", "acs": [{"id": "CARD-007-AC1", "t": "3 wrong attempts → `CARD_ACTIVATION_FAILED` and activation locked 24 h with explanation."}]}, {"id": "CARD-008", "title": "Card transactions", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL show on card detail the last 10 transactions made with that card (from the linked account history filtered by card) with a link to full history.", "acs": [{"id": "CARD-008-AC1", "t": "Pending authorisations appear with \"Pending\" tag."}]}]}], "routes": [{"route": "/cards", "screen": "Cards overview (tiles; pending activation banner)"}, {"route": "/cards/:cardId", "screen": "Card detail: tile, primary actions (Freeze toggle, Show details, Report a problem), sections Controls · Limits · Recent transactions · Card info (linked account, issued, expiry)"}, {"route": "/cards/:cardId/report", "screen": "Report wizard: reason → replacement? → review (fee) → step-up → receipt"}, {"route": "/cards/:cardId/activate", "screen": "Activation form"}], "ops": [{"id": "listCards", "m": "GET", "p": "/cards", "s": "List cards", "r": ["CARD-001"]}, {"id": "getCard", "m": "GET", "p": "/cards/{cardId}", "s": "Card detail", "r": ["CARD-001", "CARD-008"]}, {"id": "freezeCard", "m": "POST", "p": "/cards/{cardId}/freeze", "s": "Freeze card", "r": ["CARD-002"]}, {"id": "unfreezeCard", "m": "POST", "p": "/cards/{cardId}/unfreeze", "s": "Unfreeze card", "r": ["CARD-002"]}, {"id": "updateCardControls", "m": "PATCH", "p": "/cards/{cardId}/controls", "s": "Change card controls", "r": ["CARD-003"]}, {"id": "updateCardLimits", "m": "PUT", "p": "/cards/{cardId}/limits", "s": "Change card spending limits", "r": ["CARD-004"]}, {"id": "revealCard", "m": "POST", "p": "/cards/{cardId}/reveal", "s": "Reveal PAN/expiry/CVC for 30 s", "r": ["CARD-005", "NFR-SEC-030"]}, {"id": "reportCard", "m": "POST", "p": "/cards/{cardId}/report", "s": "Report lost/stolen/damaged and optionally replace", "r": ["CARD-006"]}, {"id": "activateCard", "m": "POST", "p": "/cards/{cardId}/activate", "s": "Activate a new card", "r": ["CARD-007"]}], "data": [], "edges": 0, "deps": ["F00", "F01", "F03"], "refs": ["NFR-SEC-030"], "personas": ["P1"], "journeys": ["J6"], "path": "sdd/specs/features/F06-cards"}, {"id": "F07", "title": "Statements and Documents", "short": "Statements and documents", "summary": "Monthly e-statements, custom-period statements, balance certificates and account-details letters generated as professional, bilingual, reconciled PDFs from the ledger.", "stories": [], "groups": [{"name": "Requirements", "reqs": [{"id": "STMT-001", "title": "Statement list", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL list available monthly statements per account, filterable by year, showing period, opening/closing balance and a Download action.", "acs": [{"id": "STMT-001-AC1", "t": "Sara's Current account shows 12 statements for the past 12 months."}]}, {"id": "STMT-002", "title": "Monthly statement content", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL render statements containing: bank header, customer name and address, account name/number/IBAN/currency, period, summary box (opening, total credits, total debits, closing), transaction table (date, value date, description, reference, debit, credit, balance), FX details for foreign transactions, fees summary, and regulatory-style footer text marked as demo.", "acs": [{"id": "STMT-002-AC1", "t": "Parsing the PDF text in a test yields opening + credits − debits = closing (BR-STMT-02)."}]}, {"id": "STMT-003", "title": "Statement generation job", "pri": "P2", "type": "Event-driven", "ears": "WHEN the statement job runs, THE SYSTEM SHALL create statement records idempotently (one per account per period), store the PDF, and emit `documents.statement_ready`.", "acs": [{"id": "STMT-003-AC1", "t": "Running the job twice for the same period creates no duplicates."}]}, {"id": "STMT-004", "title": "Custom statement", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer requests a custom statement (BR-STMT-03), THE SYSTEM SHALL generate and download it within 5 s for up to 2,000 transactions, showing progress.", "acs": [{"id": "STMT-004-AC1", "t": "A 13-month range is blocked client-side and server-side (`STATEMENT_RANGE_INVALID`)."}]}, {"id": "STMT-005", "title": "Balance certificate", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer requests a balance certificate for an account with \"To whom it may concern\" or a named addressee (≤ 60 chars) and language (en/ar), THE SYSTEM SHALL generate a letter stating the account holder, masked IBAN, currency and ledger balance as of end of the previous business day.", "acs": [{"id": "STMT-005-AC1", "t": "Letter shows the as-of date and document ID; it is listed in Documents."}]}, {"id": "STMT-006", "title": "Account details letter", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer requests an account details letter, THE SYSTEM SHALL generate a PDF with account holder, full IBAN, account number, BIC, bank name and address (for salary transfers).", "acs": [{"id": "STMT-006-AC1", "t": "Full IBAN appears in the PDF but never in logs."}]}, {"id": "STMT-007", "title": "Documents centre", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL list all generated documents (statements, certificates, letters, receipts, data exports) with type, account, date, and Download, newest first.", "acs": [{"id": "STMT-007-AC1", "t": "Downloading is audited `STATEMENT_DOWNLOADED` / `DOCUMENT_GENERATED`."}]}, {"id": "STMT-008", "title": "Statement ready notification", "pri": "P2", "type": "Event-driven", "ears": "WHEN a monthly statement is generated, THE SYSTEM SHALL notify the customer per their alert preferences with a deep link to download it.", "acs": [{"id": "STMT-008-AC1", "t": "Notification text: \"Your November statement for Current ••4821 is ready.\""}]}]}], "routes": [{"route": "/statements", "screen": "Tabs: **Statements** (account selector + year filter + list) · **Request a document** (custom statement, balance certificate, account details letter forms) · **All documents**"}], "ops": [{"id": "listStatements", "m": "GET", "p": "/statements", "s": "Monthly statements for an account", "r": ["STMT-001"]}, {"id": "downloadStatement", "m": "GET", "p": "/statements/{statementId}/pdf", "s": "Download statement PDF", "r": ["STMT-002", "STMT-007"]}, {"id": "createCustomStatement", "m": "POST", "p": "/statements/custom", "s": "Generate a custom-period statement", "r": ["STMT-004"]}, {"id": "createBalanceCertificate", "m": "POST", "p": "/letters/balance-certificate", "s": "Generate a balance certificate", "r": ["STMT-005"]}, {"id": "createAccountDetailsLetter", "m": "POST", "p": "/letters/account-details", "s": "Generate an account details letter", "r": ["STMT-006"]}, {"id": "listDocuments", "m": "GET", "p": "/documents", "s": "Documents centre", "r": ["STMT-007"]}, {"id": "downloadDocument", "m": "GET", "p": "/documents/{documentId}", "s": "Download a generated document", "r": ["STMT-007", "PROF-050"]}], "data": [], "edges": 0, "deps": ["F00", "F01", "F03"], "refs": ["SPEC-03"], "personas": ["P2", "P3"], "journeys": ["J8"], "path": "sdd/specs/features/F07-statements-documents"}, {"id": "F08", "title": "Notifications and Alerts", "short": "Notifications and alerts", "summary": "An in-app notification centre with real-time delivery (SSE), configurable alert rules, and simulated email/SMS channels. Security alerts are mandatory (NFR-SEC-051).", "stories": [], "groups": [{"name": "Requirements", "reqs": [{"id": "NOTF-001", "title": "Notification centre", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL show a header bell with unread count (99+ cap) opening a panel of the 10 latest notifications (icon, title, relative time, unread dot) and a link to the full list with filters (All, Unread, Security, Payments, Account).", "acs": [{"id": "NOTF-001-AC1", "t": "The bell's accessible name includes the count: \"Notifications, 3 unread\"."}]}, {"id": "NOTF-002", "title": "Read state", "pri": "P2", "type": "Event-driven", "ears": "WHEN a notification is opened or \"Mark all as read\" is used, THE SYSTEM SHALL mark it read (optimistic UI) and update counts across tabs.", "acs": [{"id": "NOTF-002-AC1", "t": "Opening a notification navigates to its deep link and marks it read."}]}, {"id": "NOTF-003", "title": "Real-time delivery", "pri": "P2", "type": "Event-driven", "ears": "WHEN a notification is created, THE SYSTEM SHALL deliver it via SSE to all of the customer's open sessions within 2 s, show a `ToastNotification` for high-severity items, and replay missed events on reconnect (SPEC-04 §10).", "acs": [{"id": "NOTF-003-AC1", "t": "Killing the SSE connection and reconnecting with `Last-Event-ID` yields missed notifications without duplicates."}]}, {"id": "NOTF-004", "title": "Alert preferences", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer edits alert rules (BR-NOTF-03) — enable/disable, thresholds (money input with account currency), channels, quiet hours — THE SYSTEM SHALL validate and save them with ETag concurrency; mandatory alerts SHALL appear as disabled-on toggles with explanation.", "acs": [{"id": "NOTF-004-AC1", "t": "Mandatory toggles are `disabled` with `aria-describedby` text \"Security alerts are always on to protect you.\""}]}, {"id": "NOTF-005", "title": "Rule evaluation", "pri": "P2", "type": "Event-driven", "ears": "WHEN `accounts.balance_changed` or `accounts.transaction_posted` events occur, THE SYSTEM SHALL evaluate the customer's enabled rules and create notifications per channel, respecting BR-NOTF-04 and quiet hours.", "acs": [{"id": "NOTF-005-AC1", "t": "Low-balance threshold 5,000.00 on Current; a transfer leaving 4,500.00 triggers exactly one alert; another debit to 4,000.00 does not trigger again (J9)."}]}, {"id": "NOTF-006", "title": "Email and SMS rendering", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL render emails (responsive HTML + plain-text part, bilingual per preference, \"Demo\" footer, no tracking pixels) and SMS (BR-NOTF-07) from templates per notification type.", "acs": [{"id": "NOTF-006-AC1", "t": "Mailpit shows the \"New sign-in\" email with masked device info and a \"This wasn't me\" link to Settings › Security."}]}, {"id": "NOTF-007", "title": "Mandatory security notifications", "pri": "P2", "type": "Event-driven", "ears": "WHEN a mandatory event (BR-NOTF-02) occurs, THE SYSTEM SHALL send on all channels regardless of preferences and quiet hours.", "acs": [{"id": "NOTF-007-AC1", "t": "Changing email sends a notice to both old and new addresses."}]}]}], "routes": [{"route": "/notifications", "screen": "Full list with filter `ContentSwitcher`, Mark all as read"}, {"route": "/settings/alerts", "screen": "Alert preferences (grouped: Security (locked), Balances, Payments, Cards, Documents; Quiet hours)"}], "ops": [{"id": "listNotifications", "m": "GET", "p": "/notifications", "s": "Notifications", "r": ["NOTF-001"]}, {"id": "markNotificationRead", "m": "POST", "p": "/notifications/{notificationId}/read", "s": "Mark one as read", "r": ["NOTF-002"]}, {"id": "markAllNotificationsRead", "m": "POST", "p": "/notifications/read-all", "s": "Mark all as read", "r": ["NOTF-002"]}, {"id": "streamNotifications", "m": "GET", "p": "/notifications/stream", "s": "Server-Sent Events stream (SPEC-04 §10)", "r": ["NOTF-003", "DASH-011", "XFER-028"]}, {"id": "getAlertRules", "m": "GET", "p": "/alert-rules", "s": "Alert preferences", "r": ["NOTF-004"]}, {"id": "updateAlertRules", "m": "PUT", "p": "/alert-rules", "s": "Replace alert preferences", "r": ["NOTF-004" ave and apply immediately (BR-PROF-07).", "acs": [{"id": "PROF-010-AC1", "t": "Changing the default account pre-selects it in the transfer wizard."}]}, {"id": "PROF-020", "title": "Change password", "pri": "P1", "type": "Event-driven", "ears": "WHEN the customer changes their password (BR-PROF-04), THE SYSTEM SHALL verify the current password, enforce policy, rotate the current session ID, optionally revoke other sessions, and send a mandatory notification.", "acs": [{"id": "PROF-020-AC1", "t": "Wrong current password → \"Your current password is incorrect.\" (counts toward lockout)."}]}, {"id": "PROF-021", "title": "Authenticator app management", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer sets up or removes an authenticator app (BR-PROF-05), THE SYSTEM SHALL require step-up `MFA_CHANGE`, show QR + manual key for setup, verify the first code, and notify.", "acs": [{"id": "PROF-021-AC1", "t": "The TOTP secret is stored encrypted (NFR-SEC-030) and never returned after setup."}]}, {"id": "PROF-022", "title": "Recovery codes", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer regenerates recovery codes, THE SYSTEM SHALL require step-up, invalidate all previous codes, and show the 10 new codes once with Copy/Download.", "acs": [{"id": "PROF-022-AC1", "t": "An old code fails after regeneration."}]}, {"id": "PROF-023", "title": "Trusted devices", "pri": "P1", "type": "Event-driven", "ears": "THE SYSTEM SHALL list trusted devices (name e.g. \"Chrome on macOS\", added date, last used, \"This device\" tag) and WHEN the customer revokes one, THE SYSTEM SHALL remove trust so the next sign-in on it requires MFA.", "acs": [{"id": "PROF-023-AC1", "t": "Revoking \"This device\" shows a warning that MFA will be needed next time."}]}, {"id": "PROF-024", "title": "Sessions", "pri": "P1", "type": "Event-driven", "ears": "THE SYSTEM SHALL list active sessions (device, approximate location, started, last active, \"Current\") and provide \"Sign out of all other sessions\" and \"Sign out everywhere\".", "acs": [{"id": "PROF-024-AC1", "t": "After \"Sign out of all other sessions\", a second browser's next API call returns `401 SESSION_EXPIRED`."}]}, {"id": "PROF-030", "title": "Security activity", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL show security activity per BR-PROF-06 as a timeline with outcome icons, device, approximate location and time, with a \"This wasn't me\" action leading to password change and sign-out-everywhere.", "acs": [{"id": "PROF-030-AC1", "t": "A failed sign-in attempt appears with outcome \"Failed — wrong password\"."}]}, {"id": "PROF-040", "title": "Consents", "pri": "P3", "type": "Event-driven", "ears": "WHEN the customer toggles marketing (email/SMS) consent, THE SYSTEM SHALL record it per NFR-PRIV-005.", "acs": [{"id": "PROF-040-AC1", "t": "Consent text version is shown under the toggle."}]}, {"id": "PROF-050", "title": "Data export", "pri": "P3", "type": "Event-driven", "ears": "WHEN the customer requests a data export (step-up `DATA_EXPORT`), THE SYSTEM SHALL generate it per NFR-PRIV-003, notify when ready, and offer a download link valid 7 days in the Documents centre.", "acs": [{"id": "PROF-050-AC1", "t": "Archive contains `profile.json`, `accounts.json`, `transactions.csv`, `beneficiaries.json`, `messages.json`, `security-activity.json`, `README.txt`."}]}]}], "routes": [{"route": "/settings", "screen": "Settings overview (cards linking to sections)"}, {"route": "/settings/profile", "screen": "Personal details + contact change flows (side panel wizards)"}, {"route": "/settings/preferences", "screen": "Language, theme, default account, hide balances"}, {"route": "/settings/security", "screen": "Password, Two-step verification (SMS, Authenticator, Recovery codes), Trusted devices, Sessions, Security activity"}, {"route": "/settings/alerts", "screen": "(F08)"}, {"route": "/settings/privacy", "screen": "Consents, Data export"}], "ops": [{"id": "getProfile", "m": "GET", uest personal data export", "r": ["PROF-050", "NFR-PRIV-003"]}], "data": [], "edges": 0, "deps": ["F00", "F01", "F08"], "refs": [], "personas": ["P1", "P2", "P3", "P4"], "journeys": ["J10"], "path": "sdd/specs/features/F09-profile-security-settings"}, {"id": "F10", "title": "Secure Messaging, Help and Disputes", "short": "Secure messaging and disputes", "summary": "An authenticated inbox to converse with the bank (answered by ops users in F11), with attachments, categories (including transaction disputes), and a small searchable help centre (static FAQ).", "stories": [], "groups": [{"name": "Requirements", "reqs": [{"id": "MSG-001", "title": "Inbox", "pri": "P3", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL list threads with subject, category tag, status, last message preview (first 80 chars), last activity time and unread indicator, filterable by status.", "acs": [{"id": "MSG-001-AC1", "t": "Threads with unread bank replies are bold and counted in the nav badge."}]}, {"id": "MSG-002", "title": "New message", "pri": "P3", "type": "Event-driven", "ears": "WHEN the customer composes a new message (category, subject, body, attachments), THE SYSTEM SHALL validate per BR-MSG-01..03, create the thread, show it with the auto-reply, and notify ops queue.", "acs": [{"id": "MSG-002-AC1", "t": "Upload progress per file; failed scan shows the file with an error and excludes it."}]}, {"id": "MSG-003", "title": "Conversation view", "pri": "P3", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL display messages chronologically with sender (You / Tidewell team member first name), timestamp, attachments, and a reply composer unless the thread is closed beyond 14 days.", "acs": [{"id": "MSG-003-AC1", "t": "Message bodies are rendered as text (an `<a>` tag in body is shown literally)."}]}, {"id": "MSG-004", "title": "Close and reopen", "pri": "P3", "type": "Event-driven", "ears": "WHEN the customer marks a thread resolved, THE SYSTEM SHALL close it; WHEN they reply within 14 days, THE SYSTEM SHALL reopen it.", "acs": [{"id": "MSG-004-AC1", "t": "Replying after 14 days → `THREAD_CLOSED` with \"Start a new message\" CTA pre-filled with a link to the old thread reference."}]}, {"id": "MSG-005", "title": "Dispute a transaction", "pri": "P3", "type": "Event-driven", "ears": "WHEN started from a transaction (ACCT-016), THE SYSTEM SHALL pre-fill category DISPUTE_TRANSACTION and the transaction summary, require a reason (BR-MSG-05), and for card transactions offer \"Freeze this card now\" as an optional checkbox.", "acs": [{"id": "MSG-005-AC1", "t": "Ticking \"Freeze this card now\" freezes the card on submit and the thread records it (J11)."}]}, {"id": "MSG-006", "title": "Help centre", "pri": "P3", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL provide a searchable FAQ (≥ 20 entries, en/ar, static JSON) grouped by topic with \"Still need help? Send us a message\".", "acs": [{"id": "MSG-006-AC1", "t": "Search \"cut-off\" returns the transfer cut-off FAQ."}]}]}], "routes": [{"route": "/messages", "screen": "Inbox (List template) + New message button"}, {"route": "/messages/new?category=&transactionId=", "screen": "Compose"}, {"route": "/messages/:threadId", "screen": "Conversation"}, {"route": "/help", "screen": "Help centre"}], "ops": [{"id": "listThreads", "m": "GET", "p": "/message-threads", "s": "Inbox", "r": ["MSG-001"]}, {"id": "createThread", "m": "POST", "p": "/message-threads", "s": "Start a conversation (incl. disputes)", "r": ["MSG-002", "MSG-005", "ACCT-016"]}, {"id": "getThread", "m": "GET", "p": "/message-threads/{threadId}", "s": "Conversation", "r": ["MSG-003"]}, {"id": "postMessage", "m": "POST", "p": "/message-threads/{threadId}/messages", "s": "Reply (reopens within 14 days)", "r": ["MSG-003", "MSG-004"]}, {"id": "closeThread", "m": "POST", "p": "/message-threads/{threadId}/close", "s": "Mark resolved", "r": ["MSG-004"]}, {"id": "uploadAttachment", "m": "POST", "p": "/attachments", "s": "Upload attachment (scanned)", "r": ["MSG-002", "NFR-SEC-024"]}, {"id": "downloadAttachment", "m": "GET", "p": "/attachments/{attachmentId}", "s": "Download attachment", "r": ["MSG-003"]}], "data": [], "edges": 0, "deps": ["F00", "F01", "F03", "F08"], "refs": [], "personas": ["P1", "P3"], "journeys": ["J11"], "path": "sdd/specs/features/F10-secure-messaging"}, {"id": "F11", "title": "Operations Console (maker-checker, unlock, messaging, audit)", "short": "Operations console (maker-checker, unlock, audit)", "summary": "A separate, visually distinct console at `/ops` for bank staff (seeded ops users) to unlock customers, review payments held by fraud rules under four-eyes control, answer secure messages and search the audit log — demonstrating least privilege, justified access and complete auditability.", "stories": [], "groups": [{"name": "Requirements", "reqs": [{"id": "OPS-001", "title": "Ops sign-in and shell", "pri": "P3", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL provide an ops shell under `/ops` with distinct header colour (SPEC-05 §2), role-based navigation, \"Operations console — staff only\" label, and BR-OPS-01 session policy.", "acs": [{"id": "OPS-001-AC1", "t": "A customer user navigating to `/ops` sees a 403 page; API `/ops/**` returns 403."}]}, {"id": "OPS-002", "title": "Customer search", "pri": "P3", "type": "Event-driven", "ears": "WHEN an ops user searches customers (BR-OPS-03), THE SYSTEM SHALL return masked results with status tags (Active, Temp locked, Locked).", "acs": [{"id": "OPS-002-AC1", "t": "Search \"Sar\" returns Sara Haddad with masked mobile `+971 •• ••• 4417`."}]}, {"id": "OPS-003", "title": "Customer 360 with justification", "pri": "P3", "type": "Event-driven", "ears": "WHEN an ops user opens a customer, THE SYSTEM SHALL require an access reason (BR-OPS-02) and then show profile (masked), user status, accounts with balances, recent payments, held payments, open threads, and recent security activity — read-only.", "acs": [{"id": "OPS-003-AC1", "t": "Missing reason → `400 ACCESS_REASON_REQUIRED`; reason recorded in audit metadata."}]}, {"id": "OPS-004", "title": "Unlock customer", "pri": "P3", "type": "Event-driven", "ears": "WHEN an ops user unlocks a LOCKED or TEMP_LOCKED customer with a note, THE SYSTEM SHALL reset failure counters, set ACTIVE, notify the customer and audit `OPS_USER_UNLOCKED`.", "acs": [{"id": "OPS-004-AC1", "t": "The customer can sign in immediately after unlock."}]}, {"id": "OPS-005", "title": "Held payments queue (maker)", "pri": "P3", "type": "Event-driven", "ears": "THE SYSTEM SHALL list HELD_FOR_REVIEW orders oldest first with rule IDs, amount, customer (masked), beneficiary age, SLA countdown to 72 h, and WHEN an agent records a recommendation (BR-OPS-04), THE SYSTEM SHALL store it and route to supervisors.", "acs": [{"id": "OPS-005-AC1", "t": "The `DEMO-REVIEW` payment from XFER-033 appears with rule `FR-4`."}]}, {"id": "OPS-006", "title": "Approve / reject (checker)", "pri": "P3", "type": "Event-driven", "ears": "WHEN a supervisor approves or rejects a recommended held payment, THE SYSTEM SHALL enforce that the supervisor is not the maker (`MAKER_CHECKER_VIOLATION`), transition the order (PROCESSING or REJECTED with hold release), notify the customer and audit.", "acs": [{"id": "OPS-006-AC1", "t": "Supervisor who recommended cannot approve the same payment (J12)."}, {"id": "OPS-006-AC2", "t": "Customer's transfer detail updates live from \"Under review\" to \"Processing\"."}]}, {"id": "OPS-007", "title": "Messaging queue", "pri": "P3", "type": "Event-driven", "ears": "THE SYSTEM SHALL list open customer threads by waiting time with category filters and allow ops to reply (with attachments) and close threads; replies notify the customer.", "acs": [{"id": "OPS-007-AC1", "t": "Replying sets thread status AWAITING_CUSTOMER and the customer receives an in-app notification."}]}, {"id": "OPS-008", "title": "Audit search", "pri": "P3", "type": "Event-driven", "ears": "WHEN a supervisor searches the audit log by actor, customer, action, outcome and time range (≤ 31 days), THE SYSTEM SHALL return paginated events with redacted metadata and a hash-chain verification status badge; the search itself is audited.", "acs": [{"id": "OPS-008-AC1", "t": "Filtering action `CARD_DETAILS_REVEALED` shows Sara's reveal events with timestamps and IP."}]}]}], "routes": [{"route": "/ops", "screen": "Ops home: queues summary tiles (Held payments, Unanswered messages, Locked users today)"}, {"route": "/ops/customers", "screen": "Search"}, {"route": "/ops/customers/:customerId", "screen": "Access reason modal → Customer 360"}, {"route": "/ops/payments/held", "screen": "Held payments queue + detail side panel with Recommend / Approve / Reject"}, {"route": "/ops/messages", "screen": "Messaging queue and conversation"}, {"route": "/ops/audit", "screen": "Audit search (supervisor)"}], "ops": [{"id": "opsSearchCustomers", "m": "GET", "p": "/ops/customers", "s": "Search customers (masked)", "r": ["OPS-002"]}, {"id": "opsGetCustomer", "m": "GET", "p": "/ops/customers/{customerId}", "s": "Customer 360 (requires access reason)", "r": ["OPS-003"]}, {"id": "opsUnlockUser", "m": "POST", "p": "/ops/customers/{customerId}/unlock", "s": "Unlock customer sign-in", "r": ["OPS-004"]}, {"id": "opsListHeldPayments", "m": "GET", "p": "/ops/held-payments", "s": "Held payments queue", "r": ["OPS-005"]}, {"id": "opsRecommendHeldPayment", "m": "POST", "p": "/ops/held-payments/{transferId}/recommendation", "s": "Maker recommendation", "r": ["OPS-005"]}, {"id": "opsDecideHeldPayment", "m": "POST", "p": "/ops/held-payments/{transferId}/decision", "s": "Checker approve/reject (four-eyes)", "r": ["OPS-006"]}, {"id": "opsListThreads", "m": "GET", "p": "/ops/message-threads", "s": "Messaging queue", "r": ["OPS-007"]}, {"id": "opsPostMessage", "m": "POST", "p": "/ops/message-threads/{threadId}/messages", "s": "Reply as bank", "r": ["OPS-007"]}, {"id": "opsCloseThread", "m": "POST", "p": "/ops/message-threads/{threadId}/close", "s  fraud rules (maker), answer secure messages; supervisors (checker) approve/reject held payments. Needs: least-privilege access, every view of customer data justified and audited."}], "journeys": [{"id": "J1", "text": "Enrol online → set password → set up MFA → land on dashboard", "features": ["F01", "F02"], "priority": "P1"}, {"id": "J2", "text": "Sign in with MFA → view balances → open account → find a transaction by search", "features": ["F01", "F02", "F03"], "priority": "P1"}, {"id": "J3", "text": "Move money between own accounts in different currencies (with FX quote)", "features": ["F04"], "priority": "P1"}, {"id": "J4", "text": "Add a domestic beneficiary (step-up) → pay them → download receipt", "features": ["F04"], "priority": "P1"}, {"id": "J5", "text": "International transfer with fee option, purpose code, cut-off/value-date preview", "features": ["F04"], "priority": "P2"}, {"id": "J6", "text": "Freeze a card, change online-purchase control, report card stolen and order replacement", "features": ["F06"], "priority": "P2"}, {"id": "J7", "text": "Pay an electricity bill using inquiry amount; schedule a recurring bill", "features": ["F05"], "priority": "P2"}, {"id": "J8", "text": "Download last month's e-statement; generate balance certificate", "features": ["F07"], "priority": "P2"}, {"id": "J9", "text": "Receive a real-time low-balance alert; adjust alert thresholds", "features": ["F08"], "priority": "P2"}, {"id": "J10", "text": "Change password, review devices, revoke a device, sign out everywhere", "features": ["F09"], "priority": "P1/P2"}, {"id": "J11", "text": "Dispute a card transaction via secure message with attachment", "features": ["F10"], "priority": "P3"}, {"id": "J12", "text": "Ops: transfer held by fraud rule → analyst recommends → supervisor approves", "features": ["F11"], "priority": "P3"}], "phases": [{"n": 0, "name": "Foundation", "features": ["F00"], "demo": "shell in en/ar, light/dark, demo banner, dev outbox, `pnpm verify` output."}, {" t first, pluggable security checks."}]}, {"id": "rules", "name": "Rules nothing may break", "tiles": [{"k": "const", "name": "Constitution", "file": "sdd/specs/00-constitution.md", "n": 11, "u": "articles", "d": "The non-negotiable principles. Bob reads it first and may never edit it."}, {"k": "domain", "name": "Domain rules", "file": "sdd/specs/domain/", "n": 5, "u": "files", "d": "Invariants, money and ledger rules, currencies, posting recipes and the security checklist: the only place Bob learns banking from."}, {"k": "nfr", "name": "Non-functional requirements", "file": "sdd/specs/nfr/", "n": 61, "u": "requirements", "d": "Accessibility and Internationalisation (13) · Observability, Audit and Privacy (10) · Performance, Reliability and Correctness (12) · Security (26). They apply to every feature."}]}], "refs": {"SPEC-00": {"t": "Project Constitution", "file": "sdd/specs/00-constitution.md"}, "SPEC-01": {"t": "Product Vision, Personas and Scope", "file": "sdd/specs/01-product-vision.md"}, "SPEC-02": {"t": "System Architecture", "file": "sdd/specs/02-architecture.md"}, "SPEC-03": {"t": "Domain Model, Ledger and State Machines", "file": "sdd/specs/03-domain-model.md"}, "SPEC-04": {"t": "API Design Guidelines", "file": "sdd/specs/04-api-guidelines.md"}, "SPEC-05": {"t": "Design System, Layout and Interaction Patterns", "file": "sdd/specs/05-design-system.md"}, "ADR-0001": {"t": "TypeScript pnpm monorepo, Fastify API, React SPA", "file": "sdd/adr/0001-typescript-monorepo.md"}, "ADR-0002": {"t": "Money as integer minor units; decimal strings on the wire", "file": "sdd/adr/0002-money-integer-minor-units.md"}, "ADR-0003": {"t": "Double-entry ledger as the only source of balances", "file": "sdd/adr/0003-double-entry-ledger.md"}, "ADR-0004": {"t": "Server-side sessions, HttpOnly cookies, synchronizer CSRF tokens", "file": "sdd/adr/0004-server-sessions-cookie-csrf.md"}, "ADR-0005": {"t": "Idempotency keys on all money movement", "file": "sdd/adr/0005-idempotency-keys.md"}, "ADR-0006": {"t": "IBM Carbon Design System for UI", "file": "sdd/adr/0006-carbon-design-system.md"}, "ADR-0007": {"t": "Simulated external systems behind ports/adapters", "file": "sdd/adr/0007-simulated-external-systems.md"}, "ADR-0008": {"t": "Contract-first OpenAPI 3.1 with codegen and response validation", "file": "sdd/adr/0008-contract-first-openapi.md"}, "ADR-0009": {"t": "SonarQube as the external security gate before testing; Bob findings advisory", "file": "sdd/adr/0009-external-security-scan-sonarqube.md"}, "ADR-0010": {"t": "Pluggable security checks: the same control at every stage", "file": "sdd/adr/0010-pluggable-security-checks.md"}}, "opsTotal": 116, "nfr": [{"file": "sdd/specs/nfr/NFR-accessibility-i18n.md", "name": "Accessibility and Internationalisation", "n": 13}, {"file": "sdd/specs/nfr/NFR-observability-privacy.md", "name": "Observability, Audit and Privacy", "n": 10}, {"file": "sdd/specs/nfr/NFR-performance-reliability.md", "name": "Performance, Reliability and Correctness", "n": 12}, {"file": "sdd/specs/nfr/NFR-security.md", "name": "Security", "n": 26}], "nfrs": [{"id": "NFR-A11Y", "name": "Accessibility and Internationalisation", "file": "sdd/specs/nfr/NFR-accessibility-i18n.md", "intro": "", "standards": ["WCAG 2.2 AA", "WAI-ARIA 1.2", "Unicode Bidi (UAX 9)"], "groups": [{"name": "Accessibility (WCAG 2.2 AA)", "reqs": [{"id": "NFR-A11Y-001", "title": "Automated accessibility gate", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL have zero axe-core violations of impact `serious` or `critical` on every route in `sdd/design/screen-inventory.md`, in light and dark themes, in `en` and `ar`.", "acs": [{"id": "NFR-A11Y-001-AC1", "t": "`e2e/a11y.spec.ts` visits every route (data-driven from the inventory) × 2 themes × 2 locales and asserts no serious/critical violations."}], "verify": "E2E"}, {"id": "NFR-A11Y-002", "title": "Keyboard operability", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL make every interactive element reachable and operable by keyboard in a logical order with a visible focus indicator (≥ 2 px, 3:1 contrast) and no keyboard traps, except modal dialogs which trap focus until closed and return focus to the invoker.", "acs": [{"id": "NFR-A11Y-002-AC1", "t": "Journeys J2, J3 and J4 complete in Playwright using only `keyboard.press`/`type`."}], "verify": "E2E"}, {"id": "NFR-A11Y-003", "title": "Screen-reader semantics", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL provide accessible names for all controls, landmarks (`header`, `nav`, `main`, `footer`), one `h1` per page, table headers for data tables, and SHALL announce asynchronous outcomes (form errors, toast results, transfer status changes) via ARIA live regions.", "acs": [{"id": "NFR-A11Y-003-AC1", "t": "Money amounts expose full spoken form through `aria-label` (e.g. \"minus 125.00 UAE dirhams\")."}, {"id": "NFR-A11Y-003-AC2", "t": "Manual NVDA + VoiceOver smoke script in `sdd/reports/verification/a11y-manual.md` signed off at phase 7."}], "verify": "component tests + manual"}, {"id": "NFR-A11Y-004", "title": "Timing adjustable", "pri": "P1", "type": "State-driven", "ears": "WHILE a session is within 60 s of idle expiry, THE SYSTEM SHALL show a modal allowing the user to extend the session with a single action, and SHALL NOT expire FX quotes without showing a refresh action.", "acs": [{"id": "NFR-A11Y-004-AC1", "t": "See AUTH-031 acceptance criteria."}], "verify": "E2E (fake timers)"}, {"id": "NFR-A11Y-005", "title": "Reflow, zoom and target size", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL support 400 % zoom / 320 CSS px width without horizontal scrolling (except data tables, which scroll within their container), text spacing overrides, and interactive targets ≥ 24 × 24 CSS px (WCAG 2.5.8).", "acs": [{"id": "NFR-A11Y-005-AC1", "t": "Playwright at 320 × 640 viewport: no document-level horizontal scroll on all customer routes."}], "verify": "E2E"}, {"id": "NFR-A11Y-006", "title": "Accessible authentication", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL allow paste into password and OTP fields, support password managers (`autocomplete` attributes), and SHALL NOT use CAPTCHA puzzles (WCAG 3.3.8).", "acs": [{"id": "NFR-A11Y-006-AC1", "t": "OTP field has `autocomplete=\"one-time-code\"` and paste of 6 digits completes entry."}], "verify": "E2E"}, {"id": "NFR-A11Y-007", "title": "Charts have text alternatives", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL provide a visually-hidden or toggleable data table equivalent for every chart.", "acs": [{"id": "NFR-A11Y-007-AC1", "t": "Spending donut has a \"View as table\" toggle exposing the same values."}], "verify": "component test"}, {"id": "NFR-A11Y-008", "title": "Reduced motion & contrast", "pri": "P2", "type": "State-driven", "ears": "WHILE `prefers-reduced-motion: reduce` is set, THE SYSTEM SHALL disable non-essential animation; and THE SYSTEM SHALL meet contrast ratios of 4.5:1 for text and 3:1 for UI components in both themes.", "acs": [{"id": "NFR-A11Y-008-AC1", "t": "Playwright with `reducedMotion: 'reduce'` shows no balance count-up animation."}], "verify": "E2E"}]}, {"name": "Internationalisation", "reqs": [{"id": "NFR-I18N-001", "title": "Bilingual UI", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL provide every user-facing string in English and Arabic via ICU message catalogs, with no hard-coded literals in components.", "acs": [{"id": "NFR-I18N-001-AC1", "t": "`pnpm i18n:check` reports zero missing keys between `en.json` and `ar.json` and zero unused keys."}, {"id": "NFR-I18N-001-AC2", "t": "ESLint `formatjs/no-literal-string-in-jsx` passes."}], "verify": "CI script + lint"}, {"id": "NFR-I18N-002", "title": "RTL layout", "pri": "P1", "type": "State-driven", "ears": "WHILE the locale is `ar`, THE SYSTEM SHALL render with `dir=\"rtl\"`, mirror layout and directional icons, and isolate LTR tokens (IBAN, account numbers, amounts, references) per SPEC-05 §8.", "acs": [{"id": "NFR-I18N-002-AC1", "t": "Visual regression snapshots for Dashboard, Transfer review, Transactions in `ar` are approved and stored in `e2e/__snapshots__`."}], "verify": "E2E visual snapshots"}, {"id": "NFR-I18N-003", "title": "Locale-aware formatting", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL format dates, times, numbers and currencies with `Intl` APIs for the active locale while using Western digits for monetary amounts and identifiers, and SHALL use the currency's exact exponent (AED 3, USD 2, JPY 0).", "acs": [{"id": "NFR-I18N-003-AC1", "t": "Unit tests: `formatMoney({amount:\"1250.5\", …})` is rejected (wrong exponent); `formatMoney(\"12505.00\",\"AED\",\"en\")` → `AED 12,505.00`; `ar` → `‏12,505.00 د.ك.‏` or the agreed pattern documented in the content guide."}], "verify": "unit"}, {"id": "NFR-I18N-004", "title": "Language persistence", "pri": "P2", "type": "Event-driven", "ears": "WHEN the customer switches language, THE SYSTEM SHALL apply it immediately without reload, persist it to the profile, and use it for emails, SMS, PDFs and notifications.", "acs": [{"id": "NFR-I18N-004-AC1", "t": "After switching to Arabic, a newly generated receipt PDF is in Arabic with RTL layout."}], "verify": "integration + E2E"}, {"id": "NFR-I18N-005", "title": "Time zones and business calendar", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL store timestamps in UTC, evaluate cut-offs, business days (Mon–Fri) and holidays in `BUSINESS_TIMEZONE`, and display times in the customer's browser time zone with the zone abbreviation on receipts.", "acs": [{"id": "NFR-I18N-005-AC1", "t": "A domestic transfer submitted Friday 14:05 Asia/Dubai gets execution date next Monday (unless holiday)."}], "verify": "unit (business calendar)"}]}]}, {"id": "NFR-OBS", "name": "Observability, Audit and Privacy", "file": "sdd/specs/nfr/NFR-observability-privacy.md", "intro": "", "standards": [], "groups": [{"name": "Logging & tracing", "reqs": [{"id": "NFR-OBS-001", "title": "Structured logs with correlation", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL emit JSON logs (pino) with `time`, `level`, `msg`, `traceId`, `spanId`, `userId` (pseudonymous ID only), `route`, `statusCode`, `durationMs`, and SHALL accept/propagate W3C `traceparent`.", "acs": [{"id": "NFR-OBS-001-AC1", "t": "A request with `traceparent` yields logs and the problem+json `traceId` with the same trace ID."}], "verify": "integration"}, {"id": "NFR-OBS-002", "title": "Metrics endpoint", "pri": "P3", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL expose Prometheus metrics at `/metrics` (dev only, not under `/api`) including HTTP latency histograms by route, payment orders by status, job run durations, login outcomes.", "acs": [{"id": "NFR-OBS-002-AC1", "t": "`curl /metrics` contains `hb_payment_orders_total{status=\"COMPLETED\"}`."}], "verify": "integration"}]}, {"name": "Audit", "reqs": [{"id": "NFR-OBS-010", "title": "Audit coverage", "pri": "P1", "type": "Event-driven", "ears": "WHEN any action listed in `sdd/contracts/domain-events.md` §Audit actions occurs (success or failure), THE SYSTEM SHALL write an AuditEvent in the same DB transaction as the change, including actor, target, outcome, IP, user agent, traceId and redacted metadata.", "acs": [{"id": "NFR-OBS-010-AC1", "t": "A route-table test asserts each operation with `x-audit` produces exactly one audit event with that action on success and on handled failure."}], "verify": "integration"}, {"id": "NFR-OBS-011", "title": "Tamper evidence", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL chain audit events by SHA-256 hash (SPEC-03 §7) and provide `pnpm audit:verify` that detects any modified, deleted or reordered event.", "acs": [{"id": "NFR-OBS-011-AC1", "t": "Manually updating one audit row's metadata makes `audit:verify` exit non-zero naming the first broken link."}], "verify": "integration"}, {"id": "NFR-OBS-012", "title": "Customer-visible activity", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL let customers see their own security activity (sign-ins, device changes, password/MFA changes, beneficiary changes) for the last 90 days.", "acs": [{"id": "NFR-OBS-012-AC1", "t": "See PROF-030."}], "verify": "E2E"}]}, {"name": "Privacy & data protection", "reqs": [{"id": "NFR-PRIV-001", "title": "Data minimisation", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL return only fields required by each screen; national ID, date of birth and full contact details SHALL be masked by default in API responses except on the dedicated profile endpoint.", "acs": [{"id": "NFR-PRIV-001-AC1", "t": "`GET /dashboard/summary` contains no email, phone, DOB or national ID."}], "verify": "contract test"}, {"id": "NFR-PRIV-002", "title": "Synthetic data only", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL use only synthetic data from SPEC-91; card numbers SHALL use documented test BIN ranges and pass Luhn; IBANs SHALL use fictional bank code `990`/fictional other-bank codes.", "acs": [{"id": "NFR-PRIV-002-AC1", "t": "Seed validation asserts every PAN starts with a test BIN from SPEC-91 §4."}], "verify": "seed test"}, {"id": "NFR-PRIV-003", "title": "Data export (subject access)", "pri": "P3", "type": "Event-driven", "ears": "WHEN a customer requests a data export, THE SYSTEM SHALL generate a JSON archive of their profile, preferences, accounts, beneficiaries, transactions (last 24 months), messages and security activity within 60 s and notify them when ready.", "acs": [{"id": "NFR-PRIV-003-AC1", "t": "See PROF-050."}], "verify": "integration"}, {"id": "NFR-PRIV-004", "title": "Retention", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL purge expired sessions and challenges hourly, idempotency records after 24 h, dev outbox entries after 24 h, and SHALL retain audit events indefinitely in the prototype.", "acs": [{"id": "NFR-PRIV-004-AC1", "t": "Purge job tests with fake clock remove only expired rows."}], "verify": "integration"}, {"id": "NFR-PRIV-005", "title": "Consent records", "pri": "P3", "type": "Event-driven", "ears": "WHEN a customer changes marketing or analytics consent, THE SYSTEM SHALL store the consent type, value, timestamp, and version of the consent text.", "acs": [{"id": "NFR-PRIV-005-AC1", "t": "Toggling marketing consent twice yields two consent records with increasing timestamps."}], "verify": "integration"}]}]}, {"id": "NFR-PERF", "name": "Performance, Reliability and Correctness", "file": "sdd/specs/nfr/NFR-performance-reliability.md", "intro": "", "standards": [], "groups": [{"name": "Performance", "reqs": [{"id": "NFR-PERF-001", "title": "API latency", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL serve authenticated read endpoints with p95 latency < 300 ms and money-movement writes with p95 < 600 ms under 20 concurrent virtual users on the reference environment.", "acs": [{"id": "NFR-PERF-001-AC1", "t": "`pnpm perf:api` (autocannon/k6 script in `perf/`) reports p95 within targets for: `GET /dashboard/summary`, `GET /accounts/{id}/transactions`, `POST /transfers` (own account)."}], "verify": "perf script (phase 7 gate)"}, {"id": "NFR-PERF-002", "title": "Transaction history at scale", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL return any page (limit 25) of an account's transaction history, with any documented filter combination, in < 150 ms p95 for accounts with up to 10,000 transactions.", "acs": [{"id": "NFR-PERF-002-AC1", "t": "Composite indexes exist on `(account_id, booked_at DESC, id DESC)` and trigram index for `q` search; `EXPLAIN` in test shows index usage, no seq scan."}], "verify": "integration (EXPLAIN assertion) + perf script"}, {"id": "NFR-PERF-003", "title": "Front-end performance budgets", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL meet, on a production build served locally with Lighthouse mobile emulation: LCP < 2.5 s, INP < 200 ms, CLS < 0.1 on Sign-in and Dashboard; initial JS ≤ 250 KB gzip; each lazy route chunk ≤ 150 KB gzip.", "acs": [{"id": "NFR-PERF-003-AC1", "t": "`pnpm perf:web` (Lighthouse CI config) passes budgets; bundle analyzer report saved to `sdd/reports/verification/bundle.html`."}], "verify": "Lighthouse CI"}, {"id": "NFR-PERF-004", "title": "Perceived performance", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL render skeletons within 100 ms of navigation for any data view and SHALL prefetch the account detail and transactions queries on hover/focus of an account tile.", "acs": [{"id": "NFR-PERF-004-AC1", "t": "Component tests assert skeleton presence while queries are pending."}], "verify": "component tests"}]}, {"name": "Reliability & correctness", "reqs": [{"id": "NFR-REL-001", "title": "Ledger invariants hold", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL satisfy invariants LGR-INV-1…8 (SPEC-03 §5.3) at all times, verified by `pnpm ledger:check` after seed, after every integration test file, and at every phase gate.", "acs": [{"id": "NFR-REL-001-AC1", "t": "`pnpm ledger:check` exits 0 and prints per-currency trial balance = 0."}], "verify": "script + integration hook"}, {"id": "NFR-REL-002", "title": "Concurrency safety", "pri": "P1", "type": "Unwanted behaviour", "ears": "IF concurrent debit requests would together exceed an account's available balance, THEN THE SYSTEM SHALL accept only those that fit and reject the rest with `INSUFFICIENT_FUNDS`, never producing a negative available balance.", "acs": [{"id": "NFR-REL-002-AC1", "t": "The 50-concurrent-transfers test in SPEC-03 §5.4 passes 20 consecutive runs."}], "verify": "integration (stress)"}, {"id": "NFR-REL-003", "title": "Idempotent money movement", "pri": "P1", "type": "Event-driven", "ears": "WHEN a money-moving request is retried with the same `Idempotency-Key` and payload, THE SYSTEM SHALL return the original result without creating additional orders, holds or postings.", "acs": [{"id": "NFR-R
