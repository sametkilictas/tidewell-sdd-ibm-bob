EL-003-AC1", "t": "10 parallel identical `POST /transfers` with one key → exactly 1 order; 9 responses are replays or `409 IDEMPOTENCY_IN_PROGRESS`."}], "verify": "integration"}, {"id": "NFR-REL-004", "title": "Atomicity", "pri": "P1", "type": "Unwanted behaviour", "ears": "IF any step of a money-moving use case fails (DB error, validation, adapter exception), THEN THE SYSTEM SHALL roll back all of its writes including holds, postings, audit and outbox rows written in that transaction.", "acs": [{"id": "NFR-REL-004-AC1", "t": "Fault-injection test throws inside `ledger.post` → no rows persisted for that order."}], "verify": "integration (fault injection)"}, {"id": "NFR-REL-005", "title": "Graceful degradation", "pri": "P2", "type": "Unwanted behaviour", "ears": "IF a simulated dependency (FX feed, biller network, card processor, notification gateway) is unavailable, THEN THE SYSTEM SHALL fail only the dependent feature with a specific error code (`FX_UNAVAILABLE`, `BILLER_UNAVAILABLE`, …) and keep all other features functional; dashboard widgets fail independently.", "acs": [{"id": "NFR-REL-005-AC1", "t": "With `POST /dev/faults {\"fx\":\"down\"}`, own-account same-currency transfers still succeed and the dashboard renders with an FX widget error state."}], "verify": "E2E (demo fault toggles)"}, {"id": "NFR-REL-006", "title": "Health and readiness", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL expose `/api/v1/health/live` (process up) and `/api/v1/health/ready` (DB reachable, migrations applied, job runner alive) returning 200/503 JSON within 100 ms.", "acs": [{"id": "NFR-REL-006-AC1", "t": "With Postgres stopped, `/health/ready` returns 503 with `{\"checks\":{\"db\":\"down\"}}`."}], "verify": "integration"}, {"id": "NFR-REL-007", "title": "Job safety", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL run each background job under a Postgres advisory lock, make each job execution idempotent, and record `job_runs` with status, duration and error.", "acs": [{"id": "NFR-REL-007-AC1", "t": "Starting two API processes, a standing order due today produces exactly one payment order."}], "verify": "integration"}, {"id": "NFR-REL-008", "title": "Deterministic reset", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL provide `pnpm db:reset` that drops, migrates and seeds the database deterministically (fixed PRNG seed) in < 60 s.", "acs": [{"id": "NFR-REL-008-AC1", "t": "Two consecutive resets produce identical row counts and identical balance totals per currency."}], "verify": "script"}]}]}, {"id": "NFR-SEC", "name": "Security", "file": "sdd/specs/nfr/NFR-security.md", "intro": "", "standards": ["OWASP ASVS 4.0.3 L2", "OWASP Top 10 2021", "OWASP API Security Top 10 2023", "NIST SP 800-63B", "SARIF 2.1.0"], "groups": [{"name": "Authentication & credentials", "reqs": [{"id": "NFR-SEC-001", "title": "Password storage", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL store passwords only as Argon2id hashes with memory ≥ 19 MiB, iterations ≥ 2, parallelism 1, and a per-hash random salt.", "acs": [{"id": "NFR-SEC-001-AC1", "t": "Given a newly set password, when the users table is inspected, then the stored value starts with `$argon2id$` and contains `m=19456` (or higher), `t=2` (or higher)."}, {"id": "NFR-SEC-001-AC2", "t": "Given any log output during registration and login, then the password never appears."}], "verify": "integration test + log-capture test"}, {"id": "NFR-SEC-002", "title": "Password policy", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL accept passwords of 12–128 characters (any Unicode, spaces allowed), SHALL reject passwords found in the bundled breached/common-password list (top 100k), SHALL reject passwords containing the username or customer number, and SHALL NOT impose composition rules or periodic expiry.", "acs": [{"id": "NFR-SEC-002-AC1", "t": "Given password `Password1234`, when set, then `422 PASSWORD_TOO_COMMON`."}, {"id": "NFR-SEC-002-AC2", "t": "Given an 11-character password, then `422 PASSWORD_TOO_SHORT`."}, {"id": "NFR-SEC-002-AC3", "t": "Given a 20-character passphrase with spaces and Arabic letters, then it is accepted."}], "verify": "unit (domain password policy) + E2E strength meter"}, {"id": "NFR-SEC-003", "title": "Credential stuffing & brute force resistance", "pri": "P1", "type": "Event-driven", "ears": "WHEN 5 consecutive failed sign-ins occur for a username, THE SYSTEM SHALL temporarily lock it for 15 minutes; WHEN 10 failures occur within 24 h, THE SYSTEM SHALL set it to LOCKED requiring operations unlock; and THE SYSTEM SHALL return identical responses and similar timing for unknown usernames and wrong passwords.", "acs": [{"id": "NFR-SEC-003-AC1", "t": "Given 5 wrong passwords, when the 6th attempt uses the right password within 15 min, then `423 ACCOUNT_TEMPORARILY_LOCKED`."}, {"id": "NFR-SEC-003-AC2", "t": "Given an unknown username, then the response body and status equal the wrong-password case and the median response time differs by < 50 ms over 20 samples."}], "verify": "integration test"}, {"id": "NFR-SEC-004", "title": "Session security", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL use server-side sessions identified by ≥ 128-bit random IDs stored only as SHA-256 hashes, rotate the session ID on login and privilege change, expire sessions after `SESSION_IDLE_MINUTES` (default 5) idle and `SESSION_ABSOLUTE_HOURS` (default 8) absolute, and set cookies `HttpOnly; Secure; SameSite=Strict; Path=/` with the `__Host-` prefix outside local dev.", "acs": [{"id": "NFR-SEC-004-AC1", "t": "Given a session idle for 5 min 1 s, when any API is called, then `401 SESSION_EXPIRED`."}, {"id": "NFR-SEC-004-AC2", "t": "Given login, then the pre-login session ID (if any) is invalid afterwards."}, {"id": "NFR-SEC-004-AC3", "t": "Given logout, then the session row is deleted and the cookie is cleared with `Max-Age=0`."}], "verify": "integration test (fake clock)"}, {"id": "NFR-SEC-005", "title": "CSRF protection", "pri": "P1", "type": "Unwanted behaviour", "ears": "IF an unsafe HTTP method is received without a valid `X-CSRF-Token` matching the session, THEN THE SYSTEM SHALL reject it with `403 CSRF_TOKEN_INVALID` and perform no side effect.", "acs": [{"id": "NFR-SEC-005-AC1", "t": "Given a valid session and no CSRF header, when `POST /transfers`, then 403 and no payment order row exists."}], "verify": "integration test across all unsafe routes (route-table driven)"}]}, {"name": "Authorization", "reqs": [{"id": "NFR-SEC-010", "title": "Object-level authorization (anti-IDOR)", "pri": "P1", "type": "Unwanted behaviour", "ears": "IF a customer requests or mutates a resource that does not belong to them, THEN THE SYSTEM SHALL respond `404 NOT_FOUND` and record an `AUTHZ_DENIED` audit event.", "acs": [{"id": "NFR-SEC-010-AC1", "t": "Given Sara's session and Daniel's account ID, when `GET /accounts/{danielAccountId}`, then 404."}, {"id": "NFR-SEC-010-AC2", "t": "An automated \"authorization matrix\" test iterates every route with a path ID and asserts cross-customer access yields 404."}], "verify": "integration (matrix test generated from OpenAPI paths)"}, {"id": "NFR-SEC-011", "title": "Role-based access for operations", "pri": "P3", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL restrict `/api/v1/ops/**` to users with role OPS_AGENT or OPS_SUPERVISOR as specified per operation, and SHALL prevent customers from holding ops roles.", "acs": [{"id": "NFR-SEC-011-AC1", "t": "Given a customer session, when calling any `/ops` route, then `403 FORBIDDEN`."}], "verify": "integration"}, {"id": "NFR-SEC-012", "title": "Mass assignment protection", "pri": "P1", "type": "Unwanted behaviour", "ears": "IF a request body contains properties not defined in the contract schema, THEN THE SYSTEM SHALL reject the request with `400 VALIDATION_FAILED`.", "acs": [{"id": "NFR-SEC-012-AC1", "t": "Given `PATCH /accounts/{id}` with `{\"nickname\":\"x\",\"status\":\"CLOSED\"}`, then 400 and status unchanged."}], "verify": "integration (schemas use `additionalProperties: false`)"}]}, {"name": "Input, output and transport", "reqs": [{"id": "NFR-SEC-020", "title": "Input validation", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL validate every request (path, query, headers, body) against the OpenAPI contract with explicit lengths, patterns and enums before reaching application services.", "acs": [{"id": "NFR-SEC-020-AC1", "t": "Given a 10,000-character `customerReference`, then `400 VALIDATION_FAILED` with field error."}], "verify": "contract + integration"}, {"id": "NFR-SEC-021", "title": "Injection prevention", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL use parameterised queries exclusively, SHALL NOT build SQL from string concatenation, and SHALL encode all output rendered in the web app (React default escaping; `dangerouslySetInnerHTML` forbidden by lint).", "acs": [{"id": "NFR-SEC-021-AC1", "t": "Search `q=' OR 1=1 --` returns 200 with zero unintended results."}, {"id": "NFR-SEC-021-AC2", "t": "A beneficiary nickname `<img src=x onerror=alert(1)>` renders as text."}], "verify": "integration + E2E + lint rule"}, {"id": "NFR-SEC-022", "title": "Security headers and CSP", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL send the headers listed in SPEC-04 §11, including a CSP with `default-src 'self'`, no `unsafe-inline` scripts, `object-src 'none'`, `frame-ancestors 'none'`, and `connect-src 'self'`.", "acs": [{"id": "NFR-SEC-022-AC1", "t": "E2E asserts headers on `/` and `/api/v1/health/live`."}, {"id": "NFR-SEC-022-AC2", "t": "No CSP violations reported in browser console during the full E2E suite."}], "verify": "E2E"}, {"id": "NFR-SEC-023", "title": "Rate limiting", "pri": "P1", "type": "Event-driven", "ears": "WHEN a client exceeds a bucket defined in SPEC-04 §8, THE SYSTEM SHALL respond `429 RATE_LIMITED` with `Retry-After`.", "acs": [{"id": "NFR-SEC-023-AC1", "t": "11 login attempts from one IP within a minute → 11th gets 429."}], "verify": "integration"}, {"id": "NFR-SEC-024", "title": "File upload safety", "pri": "P3", "type": "Unwanted behaviour", "ears": "IF an uploaded file exceeds 5 MB, is not PDF/PNG/JPEG by magic-byte detection, or matches the EICAR test signature, THEN THE SYSTEM SHALL reject it and not persist its bytes.", "acs": [{"id": "NFR-SEC-024-AC1", "t": "A `.pdf`-named PE executable is rejected `422 ATTACHMENT_TYPE_NOT_ALLOWED`."}, {"id": "NFR-SEC-024-AC2", "t": "EICAR string upload → `422 ATTACHMENT_MALWARE_DETECTED`."}], "verify": "integration"}]}, {"name": "Sensitive data", "reqs": [{"id": "NFR-SEC-030", "title": "Encryption of sensitive fields at rest", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL encrypt full PAN, CVC seed and TOTP secrets with AES-256-GCM using `DATA_ENCRYPTION_KEY`, with a unique 96-bit nonce per value and a key-version prefix enabling rotation.", "acs": [{"id": "NFR-SEC-030-AC1", "t": "Querying `card_vault` shows ciphertext only; decrypt works with current key; re-encrypt script migrates to a new key version."}], "verify": "unit + integration"}, {"id": "NFR-SEC-031", "title": "Log redaction", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL redact from logs and error responses: passwords, OTP codes, session IDs, CSRF tokens, step-up tokens, `Authorization`/`Cookie` headers, full PAN, CVC, IBAN (except last 4), email and phone (masked), national ID.", "acs": [{"id": "NFR-SEC-031-AC1", "t": "A log-capture test runs the J1–J4 integration flows and asserts none of the seeded secrets/PII literal values appear in captured logs."}], "verify": "integration (log capture)"}, {"id": "NFR-SEC-032", "title": "Secrets management", "pri": "P1", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL read secrets only from environment variables validated at start-up and SHALL refuse to start in non-dev mode with default/example secret values.", "acs": [{"id": "NFR-SEC-032-AC1", "t": "`NODE_ENV=production` with `SESSION_SECRET=change-me` → process exits non-zero with a clear message."}, {"id": "NFR-SEC-032-AC2", "t": "`gitleaks`-style scan (`pnpm security:secrets`) finds no secrets in the repo."}], "verify": "unit + CI script"}, {"id": "NFR-SEC-033", "title": "Demo-only capabilities are fenced", "pri": "P1", "type": "State-driven", "ears": "WHILE `DEMO_MODE` is not `true`, THE SYSTEM SHALL NOT register `/dev/**` routes, SHALL NOT accept the demo OTP bypass, and SHALL NOT honour demo markers (`DEMO-REJECT`, `DEMO-RETURN`, `DEMO-REVIEW`) or other magic test values.", "acs": [{"id": "NFR-SEC-033-AC1", "t": "With `DEMO_MODE=false`, `GET /api/v1/dev/outbox` → 404 and OTP `000000` is rejected."}], "verify": "integration (both modes)"}]}, {"name": "Supply chain & code", "reqs": [{"id": "NFR-SEC-040", "title": "Dependency hygiene", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL have no known High/Critical vulnerabilities in production dependencies per `pnpm audit --prod` at each phase gate, and SHALL commit `pnpm-lock.yaml`.", "acs": [{"id": "NFR-SEC-040-AC1", "t": "`pnpm security:deps` exits 0 or every finding has a dated waiver in `sdd/reports/security/waivers.md`."}], "verify": "CI script"}, {"id": "NFR-SEC-041", "title": "Static analysis", "pri": "P2", "type": "Ubiquitous", "ears": "THE SYSTEM SHALL pass ESLint with `eslint-plugin-security`, `no-restricted-syntax` bans on `eval`, `new Function`, `dangerouslySetInnerHTML`, and float-money patterns (`parseFloat`, `toFixed` in money modules).", "acs": [{"id": "NFR-SEC-041-AC1", "t": "`pnpm lint` exits 0 with zero warnings in `packages/domain` and `apps/api/src/modules/ledger`."}], "verify": "CI"}]}, {"name": "External security scan before testing (Constitution Article XI, ADR-0009)", "reqs": [{"id": "NFR-SEC-042", "title": "External scan gates promotion to testing", "pri": "P1", "type": "Event-driven", "ears": "WHEN all tasks of a feature are complete, THE SYSTEM SHALL require a security scan of the current production code by the scanner set in `sdd/governance/checks.json` (the configured checks, or SonarQube), run through `sdd/scripts/scan.mjs`, and SHALL refuse to start verification or security review of that feature until the resulting evidence in `sdd/reports/scan/F##.json` is PASS for the current code fingerprint.", "acs": [{"id": "NFR-SEC-042-AC1", "t": "Given F03 with every task ticked and no `sdd/reports/scan/F03.json`, when `step.mjs start verify F03 --mode spec-verifier` runs, then it exits 1 and names 🔐 Check Runner → `/sdd-scan F03`."}, {"id": "NFR-SEC-042-AC2", "t": "Given PASS evidence for F03, when any file under `apps/`, `packages/`, `infra/` or a root manifest changes, then the evidence is reported as stale and verification is refused until a re-scan; changes to test files alone do not invalidate it."}, {"id": "NFR-SEC-042-AC3", "t": "Given a pull request to `main`, when the `sdd-gates / sonarqube` job runs `scan.mjs --ci` and the quality gate fails, then the job fails and branch protection blocks the merge."}, {"id": "NFR-SEC-042-AC4", "t": "Given a push to `main`, when `promote-to-test` runs, then `deploy-test` starts only after `scan.mjs --gate-only --revision <sha>` confirms a passing gate for that exact commit."}], "verify": "governance tests (`tools/governance/scan-gate.test.ts`) + CI run"}, {"id": "NFR-SEC-043", "title": "Tidewell Bank quality gate", "pri": "P1", "type": "Ubiquitous", "ears": "WHERE the scanner is SonarQube, THE SYSTEM SHALL be analysed against the SonarQube quality gate named by `SONAR_QUALITY_GATE`, which SHALL fail when, on new code, any vulnerability is open, any security hotspot is unreviewed, or the security rating is worse than A, and when, on overall code, any vulnerability of High/Blocker impact is open; THE SYSTEM SHALL fail a scan whose project is attached to any other gate.", "acs": [{"id": "NFR-SEC-043-AC1", "t": "Given a new string-built SQL query in `apps/api`, when scanned, then the gate is ERROR, the result is FAIL and `sdd/reports/scan/F##.md` lists the issue with its rule and location."}, {"id": "NFR-SEC-043-AC2", "t": "Given a new security hotspot (e.g. cookie without `Secure`) not yet reviewed, when scanned, then the result is FAIL."}, {"id": "NFR-SEC-043-AC3", "t": "Given the project is switched to SonarQube's default gate, when scanned, then the result is FAIL with reason \"project uses quality gate … expected Tidewell Bank\"."}], "verify": "gate definition in `sdd/docs/SONARQUBE.md` §3 + seeded-vulnerability rehearsal on a throwaway branch (never merged)"}, {"id": "NFR-SEC-044", "title": "Dependency vulnerabilities (CVEs) block testing", "pri": "P1", "type": "Unwanted behaviour", "ears": "IF a production or development dependency has a known vulnerability with CVSS ≥ 7.0 or no rating, as reported by the `SCA_PROVIDER`, THEN THE SYSTEM SHALL fail the scan unless an unexpired human waiver recorded with `approve.mjs waiver` covers that vulnerability ID or one of its aliases.", "acs": [{"id": "NFR-SEC-044-AC1", "t": "Given `SCA_PROVIDER=osv-scanner` and a lockfile pinning a package version with a CVSS 9.8 advisory, when scanned, then FAIL, and the report lists the advisory, its CVE alias, the package and the fixed version."}, {"id": "NFR-SEC-044-AC2", "t": "Given a waiver for that CVE expiring in the future, when scanned, then the finding is shown as waived (approver, expiry) and does not fail the scan; after the expiry date it fails again."}, {"id": "NFR-SEC-044-AC3", "t": "Given `SCA_PROVIDER=sonar`, when scanned, then dependency risks are judged by the quality gate's dependency-risk conditions (SonarQube Advanced Security) and OSV-Scanner is not run."}, {"id": "NFR-SEC-044-AC4", "t": "Waivers can only be recorded interactively by a human; `approve.mjs waiver` refuses an expiry more than 90 days ahead or a reason shorter than 15 characters."}], "verify": "governance tests with a fake SCA output + CI run"}, {"id": "NFR-SEC-045", "title": "Bob findings are advisory and portable", "pri": "P2", "type": "Optional feature", "ears": "WHERE `BOB_REVIEW_IN_SCAN` is `on` or `/sdd-scan` runs with `--with-bob-review`, THE SYSTEM SHALL import Bob's security review from `sdd/reports/scan/F##.bob.sarif` (SARIF 2.1.0) into SonarQube as external issues of the engine \"IBM Bob (advisory review)\", SHALL drop results without a valid repository code location, and SHALL list any CVE or GHSA ID Bob claims as a lead that is confirmed only when the SCA provider reports the same ID.", "acs": [{"id": "NFR-SEC-045-AC1", "t": "Given a Bob SARIF result at `apps/api/src/modules/accounts/accounts.repository.ts:42`, when scanned with `--with-bob-review`, then the SonarQube analysis contains one external issue from \"IBM Bob (advisory review)\" at that location."}, {"id": "NFR-SEC-045-AC2", "t": "Given a Bob result claiming `CVE-2099-0001` that the SCA provider does not report, then it is not imported, appears under \"CVE leads\" as \"not counted\", and does not affect the result."}, {"id": "NFR-SEC-045-AC3", "t": "Given `--with-bob-review` but no `sdd/reports/scan/F##.bob.sarif`, then `scan.mjs` exits 2 and writes no evidence."}], "verify": "governance tests with fixture SARIF"}, {"id": "NFR-SEC-046", "title": "Scan integrity", "pri": "P1", "type": "Unwanted behaviour", "ears": "IF anyone attempts to hand-write scan evidence, narrow the analysis scope, silence findings in code, run the scanner outside `scan.mjs`, or change SonarQube issue or hotspot status from Bob, THEN THE SYSTEM SHALL refuse the action and SHALL treat evidence not produced by `scan.mjs` as missing.", "acs": [{"id": "NFR-SEC-046-AC1", "t": "Given any active step, when Bob writes `sdd/reports/scan/F03.json` or `sonar-project.properties`, then the PreToolUse guard denies it; `check-runner` mode may only edit `sdd/reports/scan/F##.md` and `sdd/reports/scan/F##.bob.sarif`."}, {"id": "NFR-SEC-046-AC2", "t": "Given a commit adding `// NOSONAR` under `apps/`, then the commit-msg hook and the CI policy job reject it (rule G8); the PreToolUse guard denies the edit in Bob."}, {"id": "NFR-SEC-046-AC3", "t": "Given Bob runs `npx @sonar/scan` directly or `scan.mjs` with `-Dsonar.*`, then the command is denied."}, {"id": "NFR-SEC-046-AC4", "t": "`.bob/mcp.json` configures the SonarQube MCP server with `SONARQUBE_READ_ONLY=true` and token values that reference environment variables; `validate-specs.mjs` fails otherwise, and SonarQube MCP status-changing tools are denied by the hook."}, {"id": "NFR-SEC-046-AC5", "t": "Given evidence whose `codeFingerprint` does not match, or whose `producer` is not `sdd/scripts/scan.mjs`, then the feature state is `scan-stale` or `scan-evidence-invalid` and verification is refused."}], "verify": "governance tests (`tools/governance/`) + validator"}]}, {"name": "Fraud & abuse controls (simulated)", "reqs": [{"id": "NFR-SEC-050", "title": "Fraud rule engine (simulated)", "pri": "P2", "type": "Event-driven", "ears": "WHEN a payment order is created, THE SYSTEM SHALL evaluate fraud rules (FR-1 amount ≥ 30,000.00 AED-eq to a beneficiary added < 72 h ago; FR-2 > 5 external payments within 10 min; FR-3 first international payment > 10,000.00 AED-eq; FR-4 demo-only marker `DEMO-REVIEW` in the customer reference) and SHALL place matching orders in `HELD_FOR_REVIEW` with the rule IDs recorded.", "acs": [{"id": "NFR-SEC-050-AC1", "t": "Given a new beneficiary (1 h old) and amount 30,000.00, then status HELD_FOR_REVIEW, rule `FR-1`, customer sees \"Under review\" with explanation copy."}], "verify": "unit (rules) + integration"}, {"id": "NFR-SEC-051", "title": "Security notifications are mandatory", "pri": "P2", "type": "Event-driven", "ears": "WHEN a password changes, MFA changes, a new device signs in, contact details change, or a beneficiary is added, THE SYSTEM SHALL notify the customer in-app and via email/SMS regardless of alert preferences.", "acs": [{"id": "NFR-SEC-051-AC1", "t": "Alert preferences UI shows these as locked \"Always on\" toggles."}], "verify": "integration + E2E"}]}]}], "adrs": [{"id": "ADR-0001", "n": "0001", "title": "TypeScript pnpm monorepo, Fastify API, React SPA", "status": "Accepted", "amended": false, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-18 · <strong>Deciders:<\/strong> Lead Architect, Product Owner", "secs": [{"h": "Context", "html": "<p>The prototype must be built quickly by an AI agent (IBM Bob) under human supervision, be\neasy to run on a laptop, share types between client and server, and still look and behave\nlike a professional banking system.<\/p>"}, {"h": "Decision", "html": "<ul>\n<li>One <strong>pnpm workspace<\/strong> monorepo: <code>apps/web<\/code>, <code>apps/api<\/code>, <code>packages/domain<\/code>,\n  <code>packages/contracts<\/code>, <code>packages/config<\/code>, <code>e2e/<\/code>.<\/li>\n<li><strong>TypeScript strict<\/strong> end-to-end; Node.js current LTS; Fastify 5 for the API; React 19 +\n  Vite for the SPA; PostgreSQL + Prisma; Vitest + Playwright.<\/li>\n<li>Pure domain logic (money, IBAN, calendars, state machines, limits, fees) in\n  <code>packages/domain<\/code>, shared by API and web.<\/li>\n<\/ul>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ One language, shared types and Zod schemas; fast agent iteration; single <code>pnpm verify<\/code>.<\/li>\n<li>✅ Domain package is trivially unit-testable (no I/O).<\/li>\n<li>⚠️ Banks commonly run Java/Kotlin cores; the API is a <em>prototype<\/em> and ports/adapters keep\n  a later move to Spring Boot / Quarkus feasible (the OpenAPI contract is the seam).<\/li>\n<li>⚠️ Node's <code>number<\/code> is dangerous for money → mitigated by ADR-0002 and lint rules.<\/li>\n<\/ul>"}, {"h": "Alternatives considered", "html": "<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Why not (for the prototype)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Spring Boot API + React<\/td>\n<td>Two toolchains, slower agent loops, duplicated types<\/td>\n<\/tr>\n<tr>\n<td>Next.js full-stack<\/td>\n<td>Server components blur API contract boundary we want to demo<\/td>\n<\/tr>\n<tr>\n<td>NestJS<\/td>\n<td>More ceremony than needed; Fastify + modules is sufficient<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"h": "Resolved versions", "html": "<p><em>Bob fills this table during F00 (FND-002) with exact versions from <code>pnpm-lock.yaml<\/code>.<\/em><\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Package<\/th>\n<th>Version<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>node<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>pnpm<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>typescript<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>fastify<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>prisma<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>react<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>vite<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>@carbon/react<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>vitest<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>@playwright/test<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "file": "sdd/adr/0001-typescript-monorepo.md"}, {"id": "ADR-0002", "n": "0002", "title": "Money as integer minor units; decimal strings on the wire", "status": "Accepted", "amended": false, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-18", "secs": [{"h": "Context", "html": "<p>JavaScript <code>number<\/code> is IEEE-754 double: <code>0.1 + 0.2 !== 0.3<\/code>. AED has <strong>3<\/strong> decimal places,\nJPY has 0. Rounding errors in a bank demo destroy credibility and break ledger invariants.<\/p>"}, {"h": "Decision", "html": "<ol>\n<li>Domain type <code>Money { minor: bigint; currency: CurrencyCode }<\/code> with operations\n   <code>add<\/code>, <code>subtract<\/code>, <code>multiplyRate(rate: Decimal, rounding: HALF_EVEN)<\/code>, <code>allocate<\/code>,\n   <code>compare<\/code>, <code>isZero<\/code>, <code>negate<\/code>, <code>toDecimalString()<\/code>, <code>fromDecimalString()<\/code>.<\/li>\n<li>Rates use a decimal type (<code>decimal.js<\/code> configured with precision 34) <strong>only<\/strong> inside\n   <code>multiplyRate<\/code>; results immediately return to <code>bigint<\/code> minor units.<\/li>\n<li>DB: <code>BIGINT amount_minor<\/code> + <code>CHAR(3) currency<\/code>. Prisma maps to <code>bigint<\/code>.<\/li>\n<li>Wire: <code>{ \"amount\": \"12505.00\", \"currency\": \"AED\" }<\/code>; strings must carry exactly the\n   currency exponent digits.<\/li>\n<li>Lint bans <code>parseFloat<\/code>, <code>Number(<\/code>, <code>toFixed<\/code>, <code>Math.round<\/code> in <code>packages/domain/src/money/**<\/code>,\n   <code>apps/api/src/modules/{ledger,payments,bills,cards}/**<\/code> and <code>apps/web/src/lib/money/**<\/code>.<\/li>\n<\/ol>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ Exact arithmetic; invariants provable with property-based tests (fast-check).<\/li>\n<li>⚠️ <code>bigint<\/code> is not JSON-serialisable → explicit mappers at the API boundary (good: forces\n  the wire format).<\/li>\n<\/ul>"}, {"h": "Alternatives", "html": "<p>Decimal strings everywhere (slower, error-prone comparisons); <code>number<\/code> of minor units\n(safe only up to 2^53 and invites accidental division).<\/p>"}], "file": "sdd/adr/0002-money-integer-minor-units.md"}, {"id": "ADR-0003", "n": "0003", "title": "Double-entry ledger as the only source of balances", "status": "Accepted", "amended": false, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-18", "secs": [{"h": "Context", "html": "<p>Professional banking demos are judged by whether numbers <em>always<\/em> add up: transfers,\nfees, FX, reversals and statements must reconcile.<\/p>"}, {"h": "Decision", "html": "<ul>\n<li>Immutable <code>journal_entries<\/code> + <code>postings<\/code> (SPEC-03 §5). Every balance change is a balanced\n  journal. Customer balances are a cache (<code>accounts.ledger_balance_minor<\/code>) updated in the same\n  transaction and verifiable by recomputation.<\/li>\n<li>Holds model available-balance reservations separately from postings.<\/li>\n<li>Only the <code>ledger<\/code> module may insert postings (enforced by module boundaries + DB role in\n  tests: other repositories have no INSERT grant on <code>postings<\/code> in the test schema).<\/li>\n<li>Corrections are reversing journals; no UPDATE/DELETE on postings (DB trigger raises).<\/li>\n<\/ul>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ Statements, receipts and trial balance reconcile by construction.<\/li>\n<li>✅ <code>pnpm ledger:check<\/code> can prove correctness at any time.<\/li>\n<li>⚠️ Slightly more code for simple transfers (recipes in <code>sdd/specs/domain/posting-recipes.md<\/code>).<\/li>\n<\/ul>"}, {"h": "Alternatives", "html": "<p>Single-entry <code>balance<\/code> column updates (unverifiable); event-sourced accounts (overkill).<\/p>"}], "file": "sdd/adr/0003-double-entry-ledger.md"}, {"id": "ADR-0004", "n": "0004", "title": "Server-side sessions, HttpOnly cookies, synchronizer CSRF tokens", "status": "Accepted", "amended": false, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-18", "secs": [{"h": "Context", "html": "<p>Browser SPA talking to its own API on the same site. Tokens in <code>localStorage<\/code> are exposed to\nXSS; JWTs are hard to revoke (sign out everywhere, device revoke, ops lock).<\/p>"}, {"h": "Decision", "html": "<ul>\n<li>Opaque random session ID (≥128 bits) in cookie <code>__Host-hb_sid<\/code> (<code>HttpOnly; Secure;\n  SameSite=Strict; Path=/<\/code>); DB stores SHA-256(session ID).<\/li>\n<li>Idle timeout 5 min (configurable), absolute 8 h; keep-alive via <code>POST /auth/session/refresh<\/code>\n  only on genuine user activity (not timers).<\/li>\n<li>CSRF synchronizer token stored server-side on the session, delivered in the login/session\n  response body and kept in memory by the SPA; sent as <code>X-CSRF-Token<\/code> on unsafe methods.<\/li>\n<li>Same-origin deployment via Vite proxy in dev; CORS disabled except <code>WEB_ORIGIN<\/code> in dev.<\/li>\n<li>Step-up tokens: short-lived (5 min), single-use, bound to session + purpose + payload hash.<\/li>\n<\/ul>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ Instant revocation; no token in JS-readable storage; aligns with ASVS V3.<\/li>\n<li>⚠️ Requires DB lookup per request (acceptable; add Redis in production).<\/li>\n<\/ul>"}, {"h": "Alternatives", "html": "<p>JWT access/refresh tokens (revocation complexity), OAuth2/OIDC with external IdP\n(future: Keycloak / IBM Security Verify — the <code>identity<\/code> module is the seam).<\/p>"}], "file": "sdd/adr/0004-server-sessions-cookie-csrf.md"}, {"id": "ADR-0005", "n": "0005", "title": "Idempotency keys on all money movement", "status": "Accepted", "amended": false, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-18", "secs": [{"h": "Context", "html": "<p>Double-clicks, retries after timeouts and flaky networks must never move money twice.<\/p>"}, {"h": "Decision", "html": "<ul>\n<li>Clients send <code>Idempotency-Key<\/code> (UUID v4) on operations marked <code>x-idempotent: required<\/code>.<\/li>\n<li>Table <code>idempotency_records(user_id, key, request_hash, status IN_PROGRESS|COMPLETED,\n  response_status, response_body, created_at)<\/code>, unique <code>(user_id, key)<\/code>.<\/li>\n<li>Flow: insert IN_PROGRESS (unique violation → inspect existing) → execute use case in the\n  same DB transaction as the business writes → store response → commit.<\/li>\n<li>Semantics in SPEC-04 §5. Retention 24 h.<\/li>\n<li>Web client creates the key when entering the Review step and reuses it until the user\n  edits the payment details.<\/li>\n<\/ul>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ Safe retries; deterministic E2E tests of double submit.<\/li>\n<li>⚠️ Response bodies stored (redacted of secrets — none in these responses by design).<\/li>\n<\/ul>"}], "file": "sdd/adr/0005-idempotency-keys.md"}, {"id": "ADR-0006", "n": "0006", "title": "IBM Carbon Design System for UI", "status": "Accepted", "amended": false, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-18", "secs": [{"h": "Context", "html": "<p>The prototype must look professional immediately, be accessible (WCAG 2.2 AA) and support\nRTL. It is built with IBM Bob, and Carbon is IBM's open-source design system with mature\nReact components, data tables, UI shell, charts and accessibility guidance.<\/p>"}, {"h": "Decision", "html": "<p>Use <code>@carbon/react<\/code> (v11), <code>@carbon/icons-react<\/code>, <code>@carbon/pictograms-react<\/code>,\n<code>@carbon/charts-react<\/code>. Brand applied only via token overrides (SPEC-05 §2). No other\ncomponent library. Custom components (MoneyAmount, StatusTag, OtpInput, IbanText,\nSessionTimeoutModal, EmptyState) compose Carbon primitives.<\/p>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ Consistent, accessible, enterprise look; less custom CSS for Bob to get wrong.<\/li>\n<li>⚠️ Bundle size — mitigate with route-level code splitting and per-component imports.<\/li>\n<li>⚠️ RTL needs care in custom CSS (logical properties only).<\/li>\n<\/ul>"}, {"h": "Alternatives", "html": "<p>MUI, Chakra, Tailwind + headless UI — all viable, but Carbon gives the strongest\nenterprise/a11y baseline and IBM alignment.<\/p>"}], "file": "sdd/adr/0006-carbon-design-system.md"}, {"id": "ADR-0007", "n": "0007", "title": "Simulated external systems behind ports/adapters", "status": "Accepted", "amended": false, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-18", "secs": [{"h": "Context", "html": "<p>No real rails, processors or gateways may be used, yet journeys must show realistic\nasynchrony, failures and delays.<\/p>"}, {"h": "Decision", "html": "<p>Each external dependency is a <strong>port<\/strong> (TypeScript interface) owned by the consuming module,\nwith a <strong>simulated adapter<\/strong> in <code>apps/api/src/adapters/sim/*<\/code>:<\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Port<\/th>\n<th>Simulated behaviour<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>PaymentRail<\/code> (domestic)<\/td>\n<td>Accepts, settles after 5 s; customer reference containing <code>DEMO-REJECT<\/code> → reject <code>BENEFICIARY_ACCOUNT_CLOSED<\/code>; <code>DEMO-RETURN<\/code> → completes, then is returned 10 s later (RETURNED)<\/td>\n<\/tr>\n<tr>\n<td><code>PaymentRail<\/code> (SWIFT)<\/td>\n<td>Settles after 30 s; reference containing <code>DEMO-REJECT<\/code> → reject <code>INTERMEDIARY_BANK_REJECTED<\/code>; <code>DEMO-RETURN<\/code> → RETURNED after completion<\/td>\n<\/tr>\n<tr>\n<td><code>NameCheck<\/code> (CoP)<\/td>\n<td>Exact name → MATCH; Levenshtein ≤ 2 → CLOSE_MATCH (suggest); else NO_MATCH; IBAN ending <code>0000<\/code> → UNAVAILABLE<\/td>\n<\/tr>\n<tr>\n<td><code>FxRates<\/code><\/td>\n<td>Seeded mid rates with jitter; fault toggle <code>fx: down<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>BillerNetwork<\/code><\/td>\n<td>Inquiry returns due amount per seeded bill; reference ending <code>999<\/code> → <code>BILLER_REFERENCE_NOT_FOUND<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>CardProcessor<\/code><\/td>\n<td>Applies status/controls; fault toggle<\/td>\n<\/tr>\n<tr>\n<td><code>SmsGateway<\/code> / <code>EmailGateway<\/code><\/td>\n<td>Writes to <code>dev_outbox<\/code> / Mailpit<\/td>\n<\/tr>\n<tr>\n<td><code>MalwareScanner<\/code><\/td>\n<td>Detects EICAR string<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Demo markers are case-insensitive, currency-independent and stripped from the reference sent to the beneficiary. Magic values and fault toggles exist <strong>only<\/strong> when <code>DEMO_MODE=true<\/code> (NFR-SEC-033).<\/p>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ Deterministic tests; realistic demos; production integration is an adapter swap.<\/li>\n<\/ul>"}], "file": "sdd/adr/0007-simulated-external-systems.md"}, {"id": "ADR-0008", "n": "0008", "title": "Contract-first OpenAPI 3.1 with codegen and response validation", "status": "Accepted", "amended": false, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-18", "secs": [{"h": "Context", "html": "<p>An AI agent implementing many endpoints will drift from intent unless a machine-checkable\ncontract exists.<\/p>"}, {"h": "Decision", "html": "<ul>\n<li><code>sdd/contracts/openapi.yaml<\/code> is written/updated <strong>before<\/strong> code (Spec Architect mode only).<\/li>\n<li><code>pnpm contracts:lint<\/code> (Redocly CLI recommended ruleset + custom rules: every operation\n  has <code>operationId<\/code>, <code>x-requirements<\/code>, <code>security<\/code> or explicit <code>security: []<\/code>, problem\n  responses; every unsafe op documents <code>X-CSRF-Token<\/code>).<\/li>\n<li><code>pnpm contracts:gen<\/code> → <code>packages/contracts/src/generated.ts<\/code> (openapi-typescript).<\/li>\n<li>Fastify validates requests with the contract's schemas; in test mode <strong>responses<\/strong> are\n  validated too, and any mismatch fails the test.<\/li>\n<li>Web API client is typed from generated types (<code>openapi-fetch<\/code>).<\/li>\n<\/ul>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ Contract drift is a red test. Traceability from requirement → operation via <code>x-requirements<\/code>.<\/li>\n<li>⚠️ Contract edits are gated (Builder mode cannot edit <code>sdd/contracts/<\/code>), which is intentional.<\/li>\n<\/ul>"}], "file": "sdd/adr/0008-contract-first-openapi.md"}, {"id": "ADR-0009", "n": "0009", "title": "SonarQube as the external security gate before testing; Bob findings advisory", "status": "Accepted", "amended": true, "date": "2026-11-18", "meta": "<strong>Status:<\/strong> Accepted, amended by <a href=\"https://github.com/sametkilictas/tidewell-sdd-ibm-bob/blob/main/sdd/adr/0010-pluggable-security-checks.md\" target=\"_blank\" rel=\"noopener\">ADR-0010<\/a> (the scanner is pluggable; SonarQube is one option) · <strong>Date:<\/strong> 2026-11-18<\/li>\n<li><strong>Related:<\/strong> Constitution Article XI · NFR-SEC-042..046 · <code>sdd/scripts/scan.mjs<\/code> · <code>sdd/docs/SONARQUBE.md<\/code>", "secs": [{"h": "Context", "html": "<p>Bob writes the code, the tests and — in the 🛡️ Security Reviewer mode — the security review.\nA bank cannot let the same agent be the only judge of its own work. We need security problems\n(code vulnerabilities, hotspots, vulnerable dependencies) found by a tool Bob does not control,\n<strong>before<\/strong> a feature is promoted to testing, and the result must be hard to fake or bypass.<\/p>\n<p>Bob already has a code-review feature: <code>/review<\/code> and the <strong>Bob Findings<\/strong> panel. IBM documents\nreview exclusions as its only customization; the docs do not describe calling external tools or\nMCP servers from a review, importing SARIF, or dependency-CVE scanning. So Findings cannot be\n\"customized to trigger\" an external scan, and its results are not an auditable gate. Bob's\nown review can, however, be written as SARIF by a skill (IBM's audit tutorial does this), and\nSonarQube imports SARIF 2.1.0 as external issues (<code>sonar.sarifReportPaths<\/code>).<\/p>"}, {"h": "Decision", "html": "<ol>\n<li><strong>New loop step <code>scan<\/code><\/strong> between implement and verify, owned by a new mode <strong>🔐 Check Runner<\/strong>\n   (<code>check-runner<\/code>) that can run commands and read SonarQube but can only write scan triage notes\n   and an optional Bob SARIF — never code. Fixes go back to 🏗️ Spec Builder (separation of duties).<\/li>\n<li><strong><code>sdd/scripts/scan.mjs<\/code> is the only way to scan.<\/strong> It fingerprints the production code, runs\n   SonarQube with <code>sonar.qualitygate.wait=true<\/code>, reads the gate and findings back from the API, checks\n   the project uses the <code>SONAR_QUALITY_GATE<\/code>, runs SCA, and writes <code>sdd/reports/scan/F##.json<\/code> (evidence)\n   + <code>F##.md<\/code> (report). The step guard refuses verify/secure unless the evidence is PASS and its\n   fingerprint equals the current code's. Tests are excluded from the fingerprint.<\/li>\n<li><strong>SonarQube is authoritative; Bob is advisory.<\/strong> With <code>--with-bob-review<\/code> (or knob\n   <code>BOB_REVIEW_IN_SCAN=on<\/code>), Bob's review is imported into SonarQube as external issues of engine\n   \"IBM Bob (advisory review)\" — so Bob's findings count only through SonarQube. CVE IDs that Bob\n   claims are stripped from the import and listed as <em>leads<\/em>, confirmed only if SCA reports them.<\/li>\n<li><strong>SCA provider is a knob<\/strong> (<code>SCA_PROVIDER<\/code>): <code>sonar<\/code> when SonarQube Advanced Security is licensed\n   (paid add-on: Server Enterprise edition and up, or SonarQube Cloud with the Advanced Security\n   subscription) — dependency risks then sit inside the quality gate; <code>osv-scanner<\/code> (default; works with\n   every edition) — <code>scan.mjs<\/code> fails on CVSS ≥ 7.0 or unrated advisories without an unexpired human\n   waiver; <code>both<\/code> for belt and braces.<\/li>\n<li><strong>Bob's SonarQube access is read-only<\/strong>: the official SonarQube MCP server with\n   <code>SONARQUBE_READ_ONLY=true<\/code>, a token of a low-privilege user (Browse only), tokens referenced from the\n   environment; the hook also denies status-changing MCP tools.<\/li>\n<li><strong>No way to green by hiding<\/strong>: <code>sonar-project.properties<\/code>, the CI workflows and <code>sdd/reports/scan/*.json<\/code>\n   are governance-protected; <code>NOSONAR<\/code>/<code>sonar.issue.ignore<\/code> are denied in Bob (hook) and in git (rule G8);\n   direct scanner runs and <code>-Dsonar.*<\/code> overrides are denied.<\/li>\n<li><strong>CI is the final word<\/strong>: <code>sdd-gates / sonarqube<\/code> re-runs <code>scan.mjs --ci<\/code> on every PR (required check);\n   <code>promote-to-test<\/code> re-scans <code>main<\/code> and confirms the gate for that exact commit before <code>deploy-test<\/code>.<\/li>\n<\/ol>"}, {"h": "Alternatives considered", "html": "<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Why not (alone)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bob Findings / <code>/review<\/code> as the gate<\/td>\n<td>Agent grading its own work; not externally auditable; not documented as configurable to call other tools or scan dependencies<\/td>\n<\/tr>\n<tr>\n<td>CI-only SonarQube<\/td>\n<td>Finds problems late (at PR time), after verification effort is spent; no per-feature evidence<\/td>\n<\/tr>\n<tr>\n<td>SonarQube for IDE only<\/td>\n<td>Advisory, per-developer, not an enforceable gate (still recommended for in-loop feedback)<\/td>\n<\/tr>\n<tr>\n<td>A different SAST (e.g. Semgrep, CodeQL)<\/td>\n<td>Viable; SonarQube chosen for its quality gate model, SARIF import, MCP server and Advanced Security SCA. The design (scan.mjs + evidence + SARIF) would carry over<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ Nothing reaches testing without an external verdict on the exact code; the verdict is reproducible\n  in CI; Bob's findings become portable, triaged next to SAST/SCA results.<\/li>\n<li>✅ Clear ownership: SonarQube decides, Bob runs and explains, humans accept risk.<\/li>\n<li>⚠️ Needs a SonarQube instance, a project, the \"Tidewell Bank\" gate, two tokens and CI secrets\n  (<code>sdd/docs/SONARQUBE.md<\/code>). Branch and PR analysis need SonarQube Developer Edition or above, or Cloud;\n  with Community Build, local and CI scans share the <code>main<\/code> analysis.<\/li>\n<li>⚠️ A scan adds minutes to each feature loop; production-code changes after a scan require a re-scan.<\/li>\n<li>⚠️ Bob's imported findings can fail the gate (that is the point of opting in); a human resolves\n  false positives in SonarQube.<\/li>\n<\/ul>"}, {"h": "Notes", "html": "<ul>\n<li>Bob versions before 2.0.2 are affected by CVE-2026-9764 (code execution via workspace-defined MCP\n  servers). This repository ships a workspace <code>.bob/mcp.json<\/code>: use a current Bob release.<\/li>\n<\/ul>"}], "file": "sdd/adr/0009-external-security-scan-sonarqube.md"}, {"id": "ADR-0010", "n": "0010", "title": "Pluggable security checks: the same control at every stage", "status": "Accepted", "amended": false, "date": "2026-11-24", "meta": "<strong>Status:<\/strong> Accepted · <strong>Date:<\/strong> 2026-11-24 · <strong>Amends:<\/strong> <a href=\"https://github.com/sametkilictas/tidewell-sdd-ibm-bob/blob/main/sdd/adr/0009-external-security-scan-sonarqube.md\" target=\"_blank\" rel=\"noopener\">ADR-0009<\/a><\/li>\n<li><strong>Related:<\/strong> Constitution Article XI · NFR-SEC-042..046 · <code>sdd/governance/checks.json<\/code> · <code>sdd/scripts/checks.mjs<\/code> · <code>sdd/docs/CHECKS.md<\/code>", "secs": [{"h": "Context", "html": "<p>ADR-0009 made SonarQube the gate before testing. Two things pushed us further:<\/p>\n<ol>\n<li><strong>Shift left is about <em>where<\/em> a control runs, not <em>which<\/em> product runs it.<\/strong> A bank already owns\n   security controls (secret scanning, SAST, dependency policy, vulnerability management). The value is\n   running the same control as early as possible — while Bob writes, at commit — and again in the pipeline\n   where it cannot be switched off. Bob brings checks of its own; the organisation brings the rest.<\/li>\n<li><strong>Labs and small teams need to run the loop without a server.<\/strong> Requiring a SonarQube instance, a\n   quality gate and tokens before anyone can practise hid the idea behind set-up work.<\/li>\n<\/ol>"}, {"h": "Decision", "html": "<ol>\n<li><strong>One list of checks, one place:<\/strong> <code>sdd/governance/checks.json<\/code> (governance file, code-owner review).\n   Each check has a <code>run<\/code> (a built-in check, or a <code>command<\/code> for an organisation tool), the <code>stages<\/code> it runs\n   in (<code>bob<\/code>, <code>commit<\/code>, <code>scan<\/code>, <code>pipeline<\/code>) and <code>onFinding<\/code> (<code>block<\/code> or <code>warn<\/code>).<\/li>\n<li><strong>Built-in checks need only Node:<\/strong> secrets (also commit rule G10), risky code patterns, dependency\n   rules with a deny-list. Bob's hook runs them on every write; the git pre-commit hook on what is staged.<\/li>\n<li><strong>Organisation tools plug in as commands<\/strong>, e.g. IBM detect-secrets, HashiCorp Vault Radar, OSV-Scanner,\n   or a Bob Shell review in the pipeline (advisory). A tool that is switched on but missing fails closed.<\/li>\n<li><strong>The scanner is a setting:<\/strong> <code>\"scanner\": \"builtin\"<\/code> (the configured checks give the verdict; the kit's\n   default) or <code>\"sonarqube\"<\/code> (ADR-0009 unchanged, with the checks still running alongside). Either way\n   <code>scan.mjs<\/code> writes the evidence, bound to the code fingerprint and, for built-in, to the checks file.<\/li>\n<li><strong>Modes follow the checks:<\/strong> the scan step's mode is renamed 🔐 Check Runner (<code>check-runner<\/code>, formerly 📡 Scan\n   Runner); it runs and explains the checks and cannot change them. The advisory <code>bob-review<\/code> check runs Bob Shell\n   (<code>bob run --mode sdd-pr-reviewer<\/code>, with <code>BOB_API_KEY<\/code>) in the read-only 🔎 SDD PR Reviewer mode, so the pipeline\n   review is the same review people get in the IDE. Bob V2's built-in modes (Agent, Plan, Ask) are overridden in\n   Bob IDE to read and route only. The hand-review mode is 🛡️ Security Reviewer (<code>security-reviewer<\/code>), and its\n   checklist is split: a general ASVS L2 skill in <code>.bob/<\/code>, the domain's abuse cases in <code>sdd/specs/domain/<\/code>.<\/li>\n<li><strong>Locked:<\/strong> the built-in secrets check cannot be switched off or downgraded (<code>checks.mjs --validate<\/code>,\n   run in the pipeline's policy stage).<\/li>\n<\/ol>"}, {"h": "Consequences", "html": "<ul>\n<li>✅ The loop runs end to end with no server; teams add their own tools by editing one file.<\/li>\n<li>✅ The audience sees shift left as a pattern: one control, four places, the earliest one cheapest.<\/li>\n<li>⚠️ The built-in checks are deliberately simple (pattern checks, a deny-list). They are a floor, not a\n  replacement for a full SAST or SCA tool; a bank sets <code>\"scanner\": \"sonarqube\"<\/code> or switches its own tools on.<\/li>\n<\/ul>"}], "file": "sdd/adr/0010-pluggable-security-checks.md"}], "docs": [{"k": "const", "floor": "rules", "name": "Project Constitution", "file": "sdd/specs/00-constitution.md", "html": "<blockquote>\n<p>The constitution is the highest-ranking document in this repository. When any other\nspec, plan, task, rule, skill or prompt conflicts with it, <strong>the constitution wins<\/strong>.\nBob may <em>propose<\/em> an amendment through a Change Request (<code>sdd/specs/change-requests/<\/code>),\nbut may never edit this file directly.<\/p>\n<\/blockquote>\n<h2 id=\"d-const-1-mission\">1. Mission<\/h2>\n<p>Build a <strong>professional, production-grade-looking prototype<\/strong> of a retail online banking\nweb application for a fictional bank, <strong>Tidewell Bank<\/strong>, so stakeholders can click\nthrough realistic journeys (sign-in, accounts, transfers, cards, bills, statements,\nalerts, secure messaging, operations console) backed by a real API, a real database\nand a real double-entry ledger — with <strong>zero real money, zero real customers and zero\nreal payment rails<\/strong>.<\/p>\n<h2 id=\"d-const-2-configuration-knobs-single-place-to-re-target-the-prototype\">2. Configuration knobs (single place to re-target the prototype)<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Knob<\/th>\n<th>Default<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>BRAND_NAME<\/code><\/td>\n<td>Tidewell Bank<\/td>\n<td>Fictional. Never use a real bank's name, logo or colours.<\/td>\n<\/tr>\n<tr>\n<td><code>BANK_CODE<\/code> (IBAN)<\/td>\n<td><code>990<\/code><\/td>\n<td>Used to build fictional, checksum-valid IBANs.<\/td>\n<\/tr>\n<tr>\n<td><code>BANK_BIC<\/code><\/td>\n<td><code>TDWLAEA0<\/code><\/td>\n<td>Fictional ISO 9362 <em>test<\/em> BIC (location code ends in <code>0<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><code>HOME_COUNTRY<\/code><\/td>\n<td><code>AE<\/code><\/td>\n<td>Drives IBAN format, business calendar and default currency.<\/td>\n<\/tr>\n<tr>\n<td><code>BASE_CURRENCY<\/code><\/td>\n<td><code>AED<\/code> (2 decimal places)<\/td>\n<td>Multi-currency supported; see SPEC-03 §4.<\/td>\n<\/tr>\n<tr>\n<td><code>BUSINESS_TIMEZONE<\/code><\/td>\n<td><code>Asia/Dubai<\/code><\/td>\n<td>All business dates &amp; cut-offs are evaluated here. Storage is UTC.<\/td>\n<\/tr>\n<tr>\n<td><code>WEEKEND<\/code><\/td>\n<td>Saturday, Sunday<\/td>\n<td>Business days Mon–Fri.<\/td>\n<\/tr>\n<tr>\n<td><code>LOCALES<\/code><\/td>\n<td><code>en<\/code> (default), <code>ar<\/code> (RTL)<\/td>\n<td>Full RTL mirroring is required (NFR-I18N).<\/td>\n<\/tr>\n<tr>\n<td><code>DEMO_MODE<\/code><\/td>\n<td><code>true<\/code> in dev<\/td>\n<td>Enables demo banner, dev outbox, magic test values. Must be <code>false<\/code>-safe.<\/td>\n<\/tr>\n<tr>\n<td><code>SONAR_PROJECT_KEY<\/code><\/td>\n<td><code>tidewell-bank<\/code><\/td>\n<td>SonarQube project analysed by <code>sdd/scripts/scan.mjs<\/code> (also in <code>sonar-project.properties<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><code>SONAR_QUALITY_GATE<\/code><\/td>\n<td>Tidewell Bank<\/td>\n<td>Quality gate the project must use (NFR-SEC-043). A scan under any other gate fails.<\/td>\n<\/tr>\n<tr>\n<td><code>SCA_PROVIDER<\/code><\/td>\n<td><code>osv-scanner<\/code><\/td>\n<td>Dependency-CVE source: <code>osv-scanner<\/code> (any SonarQube edition), <code>sonar<\/code> (SonarQube Advanced Security), or <code>both<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><code>BOB_REVIEW_IN_SCAN<\/code><\/td>\n<td><code>off<\/code><\/td>\n<td><code>on<\/code> = every <code>/sdd-scan<\/code> also imports Bob's own review as SARIF; <code>off<\/code> = only with <code>--with-bob-review<\/code>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Changing a knob is a Change Request; the rest of the specs reference knobs by name. Secrets\n(<code>SONAR_TOKEN<\/code>, <code>SONAR_HOST_URL<\/code>, <code>SONARQUBE_READONLY_TOKEN<\/code>) are environment variables, never knobs.<\/p>\n<h2 id=\"d-const-3-articles-non-negotiable-principles\">3. Articles (non-negotiable principles)<\/h2>\n<h3 id=\"d-const-article-i-specs-are-the-source-of-truth\">Article I — Specs are the source of truth<\/h3>\n<ol>\n<li>Code exists to satisfy a requirement ID. No requirement → no code.<\/li>\n<li>If implementation reveals a gap or contradiction, <strong>stop and raise a Change Request<\/strong>\n   (<code>/sdd-change-request<\/code>). Never silently diverge from a spec.<\/li>\n<li>Order of precedence: Constitution → NFR specs → Foundational specs (01–05) →\n   Feature <code>spec.md<\/code> → <code>sdd/contracts/openapi.yaml<\/code> → ADRs → <code>plan.md<\/code> → <code>tasks.md<\/code> → code.\n   (The OpenAPI contract is authoritative for <em>shapes<\/em>; feature specs for <em>behaviour<\/em>.)<\/li>\n<li><strong>Approved scope is locked.<\/strong> A plan approval binds the plan <em>and<\/em> the feature's <code>spec.md<\/code>; editing\n   either afterwards voids it. After that, the feature's spec and plan — and at any time the\n   foundation specs, NFRs, templates, and the contract/ADRs/design outside the planning of a\n   not-yet-approved feature — change only through an approved change request, cited in the commit\n   (<code>spec(CR-###): …<\/code>), followed by a fresh human plan approval (git rule G9).<\/li>\n<\/ol>\n<h3 id=\"d-const-article-ii-contract-first\">Article II — Contract first<\/h3>\n<ol>\n<li>Every HTTP endpoint is defined in <code>sdd/contracts/openapi.yaml<\/code> <strong>before<\/strong> it is implemented.<\/li>\n<li>Server request/response validation and client types are generated from the contract.<\/li>\n<li>A response that does not validate against the contract is a failing test.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-iii-money-is-sacred\">Article III — Money is sacred<\/h3>\n<ol>\n<li>Monetary amounts are <strong>integers in minor units<\/strong> (<code>bigint<\/code>) internally and\n   <strong>decimal strings with the currency's exact exponent<\/strong> on the wire\n   (<code>\"12505.00\"<\/code> AED, <code>\"19.99\"<\/code> USD). Floating point is forbidden for money — no\n   <code>number<\/code>, <code>float<\/code>, <code>double<\/code>, <code>parseFloat<\/code> or <code>toFixed<\/code> on monetary values.<\/li>\n<li>Every balance change is a <strong>balanced double-entry journal<\/strong> (Σ debits = Σ credits per\n   currency). Balances are derived from postings, never written directly.<\/li>\n<li>Every money-moving request carries an <code>Idempotency-Key<\/code>. Replays return the original\n   result; never double-post.<\/li>\n<li>Rounding: banker's rounding (half-even) and only at well-defined points (FX conversion,\n   fee calculation). Rounding residue is recorded (on the FX quote or a rounding GL), never lost.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-iv-security-and-privacy-by-default\">Article IV — Security and privacy by default<\/h3>\n<ol>\n<li>Target <strong>OWASP ASVS 4.0.3 Level 2<\/strong> for the customer app and API.<\/li>\n<li>Least privilege everywhere: every query is scoped to the authenticated customer;\n   object-level authorization is tested for every resource (no IDOR).<\/li>\n<li>Secrets come from environment variables, never from source. No PII, secrets, OTPs,\n   passwords, session IDs or full card numbers (PAN) in logs, URLs, analytics or errors.<\/li>\n<li>Sensitive actions require <strong>step-up authentication<\/strong> (SPEC F01 §Step-up).<\/li>\n<li>Every security-relevant or money-relevant action writes an immutable <strong>audit event<\/strong>.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-v-accessibility-and-inclusion-are-features\">Article V — Accessibility and inclusion are features<\/h3>\n<ol>\n<li><strong>WCAG 2.2 AA<\/strong> is the minimum bar; automated axe checks run in E2E.<\/li>\n<li>Full keyboard operation, visible focus, screen-reader labels, reduced-motion support.<\/li>\n<li>English and Arabic with complete <strong>RTL<\/strong> layout mirroring; numbers, dates and currency\n   formatted per locale.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-vi-professional-quality-ux\">Article VI — Professional quality UX<\/h3>\n<ol>\n<li>UI built with <strong>IBM Carbon Design System<\/strong> (ADR-0006); no ad-hoc component libraries.<\/li>\n<li>Every data view has loading (skeleton), empty, error and partial-failure states.<\/li>\n<li>Every destructive or money-moving action has a review step and a clear receipt.<\/li>\n<li>Microcopy follows <code>sdd/design/content-style-guide.md<\/code>.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-vii-test-first-traceable-verification\">Article VII — Test-first, traceable verification<\/h3>\n<ol>\n<li>Each acceptance criterion maps to at least one automated test whose title contains the\n   requirement ID in brackets, e.g. <code>it('[XFER-012] rejects amount above daily limit')<\/code>.<\/li>\n<li>A task is <strong>Done<\/strong> only when the Definition of Done (<code>.bob/rules/05-definition-of-done.md<\/code>)\n   holds — including <code>pnpm verify<\/code> green.<\/li>\n<li><code>sdd/traceability/matrix.md<\/code> is regenerated by <code>pnpm specs:trace<\/code> and must show no\n   uncovered P1 requirement before a phase gate closes.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-viii-simplicity-and-reversibility\">Article VIII — Simplicity and reversibility<\/h3>\n<ol>\n<li>Prefer boring, well-documented technology (ADR-0001). New runtime dependencies need a\n   one-line justification in the plan.<\/li>\n<li>External systems (payment rails, card processor, SMS, email, FX feed, billers) are\n   <strong>simulated behind ports/adapters<\/strong> (ADR-0007) so they can be swapped later.<\/li>\n<li>Small vertical slices; each phase ends in a runnable, demoable state.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-ix-human-gates\">Article IX — Human gates<\/h3>\n<ol>\n<li>Bob pauses for human approval at: spec clarification sign-off, plan approval, end of each\n   delivery phase, any Change Request, and any acceptance of security risk (SonarQube status\n   changes, dependency-CVE waivers).<\/li>\n<li>Bob never pushes to <code>main<\/code>, never force-pushes, never disables tests or lowers\n   thresholds to get to green.<\/li>\n<li>Who signs is set in <code>sdd/docs/ROLES.md<\/code>: by default the <strong>business owner<\/strong> signs plan approvals,\n   phase gates and change-request decisions, after the <strong>business analyst<\/strong> and the <strong>architect<\/strong>\n   have reviewed; <strong>AppSec<\/strong> owns the quality gate and accepts security risk together with the\n   business owner.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-x-honesty-about-the-prototype\">Article X — Honesty about the prototype<\/h3>\n<ol>\n<li>A persistent, non-dismissible <strong>\"Demo environment — no real money\"<\/strong> banner is shown\n   in every screen when <code>DEMO_MODE=true<\/code>.<\/li>\n<li>All data is synthetic (SPEC-91). No real names of public figures, no real card numbers,\n   no real bank identifiers.<\/li>\n<\/ol>\n<h3 id=\"d-const-article-xi-security-is-checked-as-early-as-possible-before-testing\">Article XI — Security is checked, as early as possible, before testing<\/h3>\n<ol>\n<li>No feature is promoted to testing (<code>/sdd-verify<\/code>) until the <strong>security scan<\/strong> — run by\n   <code>sdd/scripts/scan.mjs<\/code>, a script Bob does not control — has passed the <em>current<\/em> production code.\n   The scanner is set in <code>sdd/governance/checks.json<\/code> (ADR-0010): the configured checks (built-in checks\n   plus any organisation tool switched on), or SonarQube's <code>SONAR_QUALITY_GATE<\/code> with the <code>SCA_PROVIDER<\/code>\n   reporting no unwaived High/Critical dependency vulnerability (NFR-SEC-042..044).<\/li>\n<li>The scanner's verdict is authoritative. Bob's own findings (Findings panel, <code>/review<\/code>, review skills,\n   a Bob Shell review in the pipeline) are advisory; with SonarQube they reach the gate only when imported\n   as SARIF. A CVE that Bob reports counts only when the SCA provider confirms it (NFR-SEC-045).<\/li>\n<li>Nobody gets to green by hiding findings: no <code>NOSONAR<\/code>, no ignore rules, no narrowing of\n   <code>sonar-project.properties<\/code>, no switching or weakening of the quality gate, no switching off a check in\n   <code>sdd/governance/checks.json<\/code> outside a reviewed governance change, no hand-written scan evidence. A false positive or accepted risk is a <strong>human<\/strong> decision recorded in SonarQube or with\n   <code>approve.mjs waiver<\/code> (expires within 90 days) (NFR-SEC-046).<\/li>\n<li>CI re-runs the scan on every push to a branch, on every pull request to <code>main<\/code> and before every\n   deployment to the test environment; local evidence is a convenience, never the final word.<\/li>\n<li><strong>Shift left:<\/strong> each check runs as early as it can — in Bob's hook as code is written, at commit,\n   before testing — and again in the pipeline, where nobody can switch it off.<\/li>\n<\/ol>\n<h2 id=\"d-const-4-amendment-process\">4. Amendment process<\/h2>\n<ol>\n<li>Raise <code>sdd/specs/change-requests/CR-&lt;nnn&gt;-&lt;slug&gt;.md<\/code> from the template.<\/li>\n<li>Human approver records decision in the CR.<\/li>\n<li>On approval, the Spec Architect mode updates affected specs and bumps their <code>version<\/code>.<\/li>\n<li>Constitution amendments additionally bump this file's version and add a changelog row.<\/li>\n<\/ol>\n<h2 id=\"d-const-5-changelog\">5. Changelog<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Version<\/th>\n<th>Date<\/th>\n<th>Change<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1.0.0<\/td>\n<td>2026-11-18<\/td>\n<td>Initial constitution<\/td>\n<\/tr>\n<tr>\n<td>1.1.0<\/td>\n<td>2026-11-18<\/td>\n<td>Article XI (external security scan before testing); knobs <code>SONAR_PROJECT_KEY<\/code>, <code>SONAR_QUALITY_GATE<\/code>, <code>SCA_PROVIDER<\/code>, <code>BOB_REVIEW_IN_SCAN<\/code>; risk acceptance added to Article IX human gates. Pre-adoption amendment by the product owner.<\/td>\n<\/tr>\n<tr>\n<td>1.2.0<\/td>\n<td>2026-11-18<\/td>\n<td>Article I.4 — approved scope is locked: plan approvals bind <code>spec.md<\/code>; post-approval spec changes need an approved CR (G9). Pre-adoption amendment by the product owner.<\/td>\n<\/tr>\n<tr>\n<td>1.3.0<\/td>\n<td>2026-11-18<\/td>\n<td>Article IX.3 — roles and default signers (<code>sdd/docs/ROLES.md<\/code>); Article XI.4 — CI checks and scans every branch push, not only pull requests. Pre-adoption amendment by the product owner.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "toc": [{"id": "d-const-1-mission", "t": "1. Mission"}, {"id": "d-const-2-configuration-knobs-single-place-to-re-target-the-prototype", "t": "2. Configuration knobs (single place to re-target the prototype)"}, {"id": "d-const-3-articles-non-negotiable-principles", "t": "3. Articles (non-negotiable principles)"}, {"id": "d-const-4-amendment-process", "t": "4. Amendment process"}, {"id": "d-const-5-changelog", "t": "5. Changelog"}]}, {"k": "dom-readme", "floor": "rules", "name": "Domain rules — what this product must never get wrong", "file": "sdd/specs/domain/README.md", "html": "<p>This folder holds the <strong>domain<\/strong> of the worked example: Tidewell Bank, a fictional UAE retail bank.\nEverything Bob needs to know about the business — money, ledger, payments, the bank's own security\nabuse cases — lives here and in the numbered specs, not in Bob's configuration.<\/p>\n<p>Bob's modes, rules, commands and skills (<code>.bob/<\/code>), the scripts (<code>sdd/scripts/<\/code>) and the governance\nfiles are industry-agnostic. To use the kit for another domain (insurance, health, retail,\ngovernment…), replace this folder and the specs; the Bob layer stays the same.<\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>File<\/th>\n<th>Covers<\/th>\n<th>Loaded by<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"https://github.com/sametkilictas/tidewell-sdd-ibm-bob/blob/main/sdd/specs/domain/invariants.md\" target=\"_blank\" rel=\"noopener\">invariants.md<\/a><\/td>\n<td>The hard rules: money type, ledger, payments, synthetic data<\/td>\n<td>rule 02 and the <strong>domain-rules<\/strong> skill, for any code that touches them<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/sametkilictas/tidewell-sdd-ibm-bob/blob/main/sdd/specs/domain/money-and-ledger.md\" target=\"_blank\" rel=\"noopener\">money-and-ledger.md<\/a><\/td>\n<td>How to represent, parse, calculate, quote and post money<\/td>\n<td><strong>domain-rules<\/strong>, when code touches money, balances, journals, holds, FX or fees<\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/sametkilictas/tidewell-sdd-ibm-bob/blob/main/sdd/specs/domain/currency-table.md\" target=\"_blank\" rel=\"noopener\">currency-table.md<\/a><\/td>\n<td>Currency exponents, symbols and test values<\/td>\n<td><code>money-and-ledger.md<\/code><\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/sametkilictas/tidewell-sdd-ibm-bob/blob/main/sdd/specs/domain/posting-recipes.md\" target=\"_blank\" rel=\"noopener\">posting-recipes.md<\/a><\/td>\n<td>Every journal shape the product uses, with worked numbers<\/td>\n<td><code>money-and-ledger.md<\/code><\/td>\n<\/tr>\n<tr>\n<td><a href=\"https://github.com/sametkilictas/tidewell-sdd-ibm-bob/blob/main/sdd/specs/domain/security-checklist.md\" target=\"_blank\" rel=\"noopener\">security-checklist.md<\/a><\/td>\n<td>The project's ASVS L2 checklist with its banking abuse cases<\/td>\n<td>the <strong>security-review<\/strong> skill, after its general checklist<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-dom-readme-the-domains-own-checks\">The domain's own checks<\/h2>\n<p>These commands prove the invariants once the workspace exists. The 🏗️ Spec Builder runs them after\ntouching domain code; the 🔍 Spec Verifier runs them for every feature.<\/p>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Command<\/th>\n<th>Proves<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>pnpm ledger:check<\/code><\/td>\n<td>every journal balances per currency; cached balances equal the postings<\/td>\n<\/tr>\n<tr>\n<td>the concurrency test (SPEC-03 §5.4)<\/td>\n<td>no overspend under parallel requests<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-dom-readme-for-another-domain\">For another domain<\/h2>\n<p>Keep the same shape: one <code>invariants.md<\/code> with the rules that must never break, one reference file per\narea the code touches, a security checklist with the domain's abuse cases, and a table of the commands\nthat prove the invariants. Update the table above so the <strong>domain-rules<\/strong> skill can find them.<\/p>", "toc": [{"id": "d-dom-readme-the-domains-own-checks", "t": "The domain's own checks"}, {"id": "d-dom-readme-for-another-domain", "t": "For another domain"}]}, {"k": "dom-inv", "floor": "rules", "name": "Domain invariants — Tidewell Bank (money, ledger, payments)", "file": "sdd/specs/domain/invariants.md", "html": "<p>The rules that most often go wrong when an AI writes banking code, for this worked example. Bob's\nrule 02 (<code>.bob/rules/02-domain-invariants.md<\/code>) makes every one a hard requirement, and the generic\n<strong>domain-rules<\/strong> skill loads <code>money-and-ledger.md<\/code> whenever code touches money.<\/p>\n<h2 id=\"d-dom-inv-money\">Money<\/h2>\n<ul>\n<li>Internal type <code>Money { minor: bigint; currency }<\/code> from <code>packages/domain<\/code>. Never <code>number<\/code> for money.<\/li>\n<li>Wire format <code>{ \"amount\": \"12505.00\", \"currency\": \"AED\" }<\/code> with <strong>exactly<\/strong> the currency exponent\n  (AED/USD/EUR/GBP/SAR 2, KWD/BHD 3, JPY 0).<\/li>\n<li>Forbidden on money: <code>parseFloat<\/code>, <code>Number()<\/code>, <code>toFixed<\/code>, <code>Math.round<\/code>, <code>+<\/code>/<code>*<\/code> on decimal strings,\n  floating literals like <code>0.005<\/code>. Lint enforces; do not disable the rule.<\/li>\n<li>Rounding only half-even, only in <code>Money.multiplyRate<\/code> / fee calculators; residue goes to a GL.<\/li>\n<li>The web app never calculates money other than formatting; totals, fees and FX come from the API.<\/li>\n<\/ul>\n<h2 id=\"d-dom-inv-ledger\">Ledger<\/h2>\n<ul>\n<li>Balances change <strong>only<\/strong> through <code>ledger.post(journal)<\/code>; every journal balances per currency.<\/li>\n<li>Postings are immutable; corrections are reversing journals.<\/li>\n<li>Available = ledger − holds + overdraft. Never let a customer debit make it negative.<\/li>\n<li>Lock accounts <code>FOR UPDATE<\/code> in ascending id order inside one DB transaction; write audit and\n  outbox rows in the same transaction.<\/li>\n<li><code>pnpm ledger:check<\/code> must pass after seeds and in every integration test file's <code>afterAll<\/code>.<\/li>\n<\/ul>\n<h2 id=\"d-dom-inv-payments\">Payments<\/h2>\n<ul>\n<li>Every money-moving POST requires <code>Idempotency-Key<\/code>; same key + same payload ⇒ same result.<\/li>\n<li>Re-validate everything at submission (balance, limits, cut-off, beneficiary status, quote expiry),\n  even if the quote step validated it seconds earlier.<\/li>\n<li>Respect the PaymentOrder state machine (SPEC-03 §6.1); illegal transitions throw.<\/li>\n<li>Step-up tokens are single-use and bound to purpose (+ payload hash where specified).<\/li>\n<li>Demo markers (<code>DEMO-REJECT<\/code>, <code>DEMO-RETURN<\/code>, <code>DEMO-REVIEW<\/code>) and fault toggles exist only when\n  <code>DEMO_MODE=true<\/code>.<\/li>\n<\/ul>\n<h2 id=\"d-dom-inv-data\">Data<\/h2>\n<ul>\n<li>Only synthetic data. Card PANs only from test BINs <code>400000<\/code> / <code>555555<\/code>, Luhn-valid, encrypted at rest.<\/li>\n<li>IBANs are built with <code>buildIban()<\/code> using fictional bank codes; never paste real IBANs.<\/li>\n<\/ul>", "toc": [{"id": "d-dom-inv-money", "t": "Money"}, {"id": "d-dom-inv-ledger", "t": "Ledger"}, {"id": "d-dom-inv-payments", "t": "Payments"}, {"id": "d-dom-inv-data", "t": "Data"}]}, {"k": "dom-money", "floor": "rules", "name": "Money and ledger — Tidewell Bank (worked example)", "file": "sdd/specs/domain/money-and-ledger.md", "html": "<p>Domain reference for this scenario, loaded by Bob through the generic <strong>domain-rules<\/strong> skill whenever\ncode parses, formats, calculates, stores or moves money, or touches balances, journals, postings,\nholds, FX or fees. Follow it exactly; ADR-0002 and ADR-0003 explain why.<\/p>\n<h2 id=\"d-dom-money-1-representation-checklist\">1. Representation checklist<\/h2>\n<ul>\n<li>Domain: <code>Money { minor: bigint; currency: CurrencyCode }<\/code> (immutable). Construct only via\n  <code>Money.of(minor, ccy)<\/code> or <code>Money.fromDecimalString(\"125.00\", \"AED\")<\/code>.<\/li>\n<li>Exponents live in <code>currency-table.md<\/code> (this folder) (same data as <code>packages/domain/src/money/currencies.ts<\/code>).<\/li>\n<li>DB: <code>amount_minor BIGINT<\/code>, <code>currency CHAR(3)<\/code>; Prisma <code>BigInt<\/code>.<\/li>\n<li>API: <code>{ amount: string, currency }<\/code> — <code>toDecimalString()<\/code> always emits exactly <code>exponent<\/code> decimals.<\/li>\n<li>Web: <code>formatMoney(money, locale)<\/code> → <code>new Intl.NumberFormat(locale, { style: 'currency', currency,\n  currencyDisplay: 'code', minimumFractionDigits: exp, maximumFractionDigits: exp,\n  numberingSystem: 'latn' }).format(decimalString)<\/code> — pass the <strong>decimal string<\/strong> (Intl.NumberFormat\n  v3 formats strings exactly), never a JS number. Cover 3-dp and 0-dp cases in tests.<\/li>\n<\/ul>\n<h2 id=\"d-dom-money-2-parsing-rules-fromdecimalstring\">2. Parsing rules (<code>fromDecimalString<\/code>)<\/h2>\n<ol>\n<li>Trim; reject empty, exponent notation (<code>1e3<\/code>), leading <code>+<\/code>, more than one <code>.<\/code>, grouping commas\n   (UI normalises input before calling).<\/li>\n<li>Fraction length must be <strong>≤ exponent<\/strong> for user input (pad right) and <strong>== exponent<\/strong> for wire\n   input (<code>strict: true<\/code>). Wrong exponent on the wire ⇒ <code>VALIDATION_FAILED<\/code> (<code>WRONG_EXPONENT<\/code>).<\/li>\n<li>Build <code>minor = BigInt(intPart) * 10n ** BigInt(exp) + BigInt(fracPadded)<\/code>; apply sign.<\/li>\n<\/ol>\n<h2 id=\"d-dom-money-3-arithmetic\">3. Arithmetic<\/h2>\n<ul>\n<li><code>add/subtract<\/code> require same currency (throw <code>CURRENCY_MISMATCH<\/code>).<\/li>\n<li><code>multiplyRate(rate: string, targetCcy, rounding = 'HALF_EVEN')<\/code> — uses <code>decimal.js<\/code>\n  (precision 34) internally, converts minor→major, multiplies, rounds to target exponent, returns\n  new <code>Money<\/code> in target currency. This is the <strong>only<\/strong> place decimals exist.<\/li>\n<li><code>allocate(ratios: number[])<\/code> — integer split, distributing remainder 1 minor unit at a time to\n  the first parts; sum preserved (test it).<\/li>\n<li>Fees are computed in AED then converted if the debit account currency differs, with the same\n  quote's rate (never a second quote).<\/li>\n<\/ul>\n<h2 id=\"d-dom-money-4-fx-quote-recipe\">4. FX quote recipe<\/h2>\n<p>Rates are expressed as <strong>units of buy currency per 1 unit of sell currency<\/strong>.<\/p>\n<pre><code>mid(AED→USD)      = 1 / 3.6725            = 0.272294…   (feed gives AED per USD)\ncustomer rate     = mid × (1 − 0.0050)    = 0.2709      (bank buys AED, gives less USD; 50 bps)\nbuy amount        = AED 1,000.00 × 0.2709  = USD 270.90  (HALF_EVEN to 2 dp)\nstore FxQuote { id, sell: AED 1,000.00, buy: USD 270.90, rate: &quot;0.27090000&quot;, inverseRate, midRate,\n                marginBps: 50, roundingResidue, expiresAt: now + 30 s }\n<\/code><\/pre>\n<ul>\n<li>\"Receive\" mode (customer enters USD 100.00): sell = buy ÷ rate, rounded HALF_EVEN to the sell\n  exponent (Constitution Art. III.4 — no other rounding modes); the residue is stored on the quote.<\/li>\n<li>Execute only if <code>now ≤ expiresAt<\/code> (else <code>FX_QUOTE_EXPIRED<\/code>) and post the stored amounts verbatim.<\/li>\n<li>Cross currency (USD→EUR): compute via AED mid rates, apply margin once, quote a single rate.<\/li>\n<\/ul>\n<h2 id=\"d-dom-money-5-ledger-posting-recipe-pseudo-typescript\">5. Ledger posting recipe (pseudo-TypeScript)<\/h2>\n<pre><code class=\"language-ts\">await db.$transaction(async (tx) =&gt; {\n  const accounts = await ledger.lockAccounts(tx, [debitId, creditId].sort()); // SELECT … FOR UPDATE\n  const debit = accounts.get(debitId)!;\n  assertDebitable(debit);                                  // status ACTIVE, not FROZEN/DORMANT/CLOSED\n  const available = await ledger.available(tx, debit);     // ledger − holds + overdraft\n  if (available.lessThan(totalDebit)) throw new DomainError('INSUFFICIENT_FUNDS');\n  const journal = Journal.create({ type: 'TRANSFER_OWN', reference, businessDate, valueDate })\n    .debit(debit.id, totalDebit)\n    .credit(creditId, creditAmount)                        // + FX legs / fee legs per posting-recipes.md\n    .assertBalanced();                                     // Σ debit = Σ credit per currency\n  await ledger.post(tx, journal);                          // inserts postings, updates cached balances\n  await audit.record(tx, { action: 'TRANSFER_CREATED', … });\n  await outbox.add(tx, { type: 'accounts.balance_changed', … });\n});\n<\/code><\/pre>\n<ul>\n<li>External transfers: <strong>hold<\/strong> at submission (<code>ledger.placeHold<\/code>), <strong>post + release<\/strong> at settlement\n  (same transaction), <strong>release only<\/strong> on failure.<\/li>\n<li>Never update <code>ledger_balance_minor<\/code> outside <code>ledger.post<\/code>.<\/li>\n<li>After writing ledger code: run <code>pnpm ledger:check<\/code> and the concurrency test (SPEC-03 §5.4).<\/li>\n<\/ul>\n<h2 id=\"d-dom-money-6-supporting-files\">6. Supporting files<\/h2>\n<ul>\n<li><code>currency-table.md<\/code> (this folder) — exponents, symbols, test values.<\/li>\n<li><code>posting-recipes.md<\/code> — every journal shape used by the prototype with worked numbers.<\/li>\n<\/ul>\n<h2 id=\"d-dom-money-7-self-check-before-you-finish\">7. Self-check before you finish<\/h2>\n<ul>\n<li>[ ] No <code>number<\/code> holds money anywhere in the diff (search for <code>parseFloat|toFixed|Number(<\/code> in money paths).<\/li>\n<li>[ ] Every journal balances per currency (unit test with <code>assertBalanced<\/code>).<\/li>\n<li>[ ] Idempotency key path covered by a test.<\/li>\n<li>[ ] Rounding residue posted to <code>GL-FX-ROUNDING-&lt;CCY&gt;<\/code> when FX applies.<\/li>\n<li>[ ] Tests include a 3-dp (KWD or BHD) and a 0-dp (JPY) case.<\/li>\n<\/ul>", "toc": [{"id": "d-dom-money-1-representation-checklist", "t": "1. Representation checklist"}, {"id": "d-dom-money-2-parsing-rules-fromdecimalstring", "t": "2. Parsing rules (fromDecimalString)"}, {"id": "d-dom-money-3-arithmetic", "t": "3. Arithmetic"}, {"id": "d-dom-money-4-fx-quote-recipe", "t": "4. FX quote recipe"}, {"id": "d-dom-money-5-ledger-posting-recipe-pseudo-typescript", "t": "5. Ledger posting recipe (pseudo-TypeScript)"}, {"id": "d-dom-money-6-supporting-files", "t": "6. Supporting files"}, {"id": "d-dom-money-7-self-check-before-you-finish", "t": "7. Self-check before you finish"}]}, {"k": "dom-cur", "floor": "rules", "name": "Currency table and test values", "file": "sdd/specs/domain/currency-table.md", "html": "<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Code<\/th>\n<th>Exponent<\/th>\n<th>Minor unit<\/th>\n<th>Account ccy<\/th>\n<th>Tradable<\/th>\n<th>Example wire string<\/th>\n<th>Minor units<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AED<\/td>\n<td>2<\/td>\n<td>fils<\/td>\n<td>✔<\/td>\n<td>✔<\/td>\n<td><code>\"12505.00\"<\/code><\/td>\n<td>1250500n<\/td>\n<\/tr>\n<tr>\n<td>KWD<\/td>\n<td>3<\/td>\n<td>fils<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td><code>\"1250.500\"<\/code><\/td>\n<td>1250500n<\/td>\n<\/tr>\n<tr>\n<td>BHD<\/td>\n<td>3<\/td>\n<td>fils<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td><code>\"10.125\"<\/code><\/td>\n<td>10125n<\/td>\n<\/tr>\n<tr>\n<td>USD<\/td>\n<td>2<\/td>\n<td>cent<\/td>\n<td>✔<\/td>\n<td>✔<\/td>\n<td><code>\"19.99\"<\/code><\/td>\n<td>1999n<\/td>\n<\/tr>\n<tr>\n<td>EUR<\/td>\n<td>2<\/td>\n<td>cent<\/td>\n<td>✔<\/td>\n<td>✔<\/td>\n<td><code>\"0.05\"<\/code><\/td>\n<td>5n<\/td>\n<\/tr>\n<tr>\n<td>GBP<\/td>\n<td>2<\/td>\n<td>penny<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td><code>\"100.00\"<\/code><\/td>\n<td>10000n<\/td>\n<\/tr>\n<tr>\n<td>SAR<\/td>\n<td>2<\/td>\n<td>halala<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td><code>\"37.50\"<\/code><\/td>\n<td>3750n<\/td>\n<\/tr>\n<tr>\n<td>JPY<\/td>\n<td>0<\/td>\n<td>yen<\/td>\n<td>—<\/td>\n<td>✔<\/td>\n<td><code>\"1200\"<\/code><\/td>\n<td>1200n<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"d-dom-cur-must-pass-unit-cases\">Must-pass unit cases<\/h2>\n<div class=\"tablewrap\"><table class=\"dt\">\n<thead>\n<tr>\n<th>Input<\/th>\n<th>Expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>fromDecimalString(\"0.1\",\"AED\",{strict:true})<\/code><\/td>\n<td>throws WRONG_EXPONENT<\/td>\n<\/tr>\n<tr>\n<td><code>fromDecimalString(\"0.1\",\"AED\")<\/code> (user input)<\/td>\n<td>10n<\/td>\n<\/tr>\n<tr>\n<td>
