 <h4 style="margin-top:32px">Read next, in the kit</h4><ul class="optlist">${[['sdd/docs/CHECKS.md','Security checks, and where IBM tools plug in'],['sdd/docs/SDLC.md','How SDD fits the SDLC and CI/CD'],['sdd/docs/CUSTOMIZE.md','Change what Bob and people may do'],['sdd/docs/CI.md','Jenkins, Azure DevOps, GitLab'],['sdd/docs/SONARQUBE.md','SonarQube as the scanner (optional)'],['sdd/docs/ROLES.md','Every role, in plain words'],['node sdd/tests/checks/run.mjs','Prove the checks work']].map(([c,t])=>`<li><span style="display:block;padding:12px 16px;border-bottom:1px solid var(--bs);font-size:14px;line-height:20px">${t}<br><code>${c}</code></span></li>`).join('')}</ul></div></div>
 <h2>Bob's commands</h2><div class="search" style="max-width:480px;margin:16px 0">${icon('search')}<input id="cq" type="search" placeholder="Search the ${D.commands.length} commands" aria-label="Search Bob's commands"></div>
 <div class="tablewrap"><table class="dt"><thead><tr><th>Command</th><th>What it does</th></tr></thead><tbody id="cmds">${D.commands.map(c=>`<tr data-q="${esc((c.cmd+' '+c.desc).toLowerCase())}"><td style="white-space:nowrap"><code>${esc(c.cmd)} ${esc(c.args)}</code></td><td>${inline(c.desc)}</td></tr>`).join('')}</tbody></table></div>
 <p class="helper" id="cnone" hidden style="margin-top:8px">No command matches. Try "scan", "plan" or "change".</p></div>`},
 mount(el){$('#cq',el).addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();let n=0;$$('#cmds tr',el).forEach(r=>{const ok=!q||r.dataset.q.includes(q);r.hidden=!ok;n+=ok});$('#cnone',el).hidden=n>0})}};

/* ============ boot ============ */
shell();addEventListener('hashchange',()=>route());route();

/* ---------- guided tour: how to read the Atlas ----------
   Opened from "Tour" in the top bar, from the first-visit prompt, or with ?tour in the address.
   A spotlight on one part of a page and a short card beside it; Back, Next, Esc. The page stays usable
   underneath, so readers can try what the card points at. */
const vis=el=>{if(!el)return null;const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&getComputedStyle(el).visibility!=='hidden'?el:null};
const narrow=()=>innerWidth<=1055;
const TOUR=[
 {page:'overview',title:'Welcome to the Atlas',
  body:()=>`<p>A map of spec-driven delivery with IBM Bob, built around one fictional bank. Every rule, count and command on these pages comes from the real kit.</p><p>This tour shows how to read it. It takes about a minute, and you can leave at any step.</p>`},
 {page:'overview',find:()=>narrow()?vis($('#hamb')):vis($('#side')),title:'Three parts, read top to bottom',
  body:()=>`<p>${narrow()?'The menu holds the pages, in three parts.':'The pages come in three parts.'}</p><ul><li><b>Understand</b>: what SDD is and who does what.</li><li><b>Customise</b>: what your team sets: the dial, the security checks, the pipeline, the guardrails.</li><li><b>Prove and start</b>: the audit trail, the bank's features, your first commands.</li></ul>`},
 {page:'overview',find:()=>vis($('.hpath'))||vis($('#hamb')),title:'Choose how people sign',
  body:()=>`<p>Sign-offs work one of two ways: <b>Terminal</b>, as commands that work with any git host and CI, or <b>GitHub</b>, as pull-request comments.</p><p>${vis($('.hpath'))?'This switch':'The switch in the menu'} changes every sign-off and command on every page. Not sure? Keep Terminal.</p>`},
 {page:'overview',find:()=>vis($('#tower')),title:'Each layer stands on a signed one',
  body:()=>`<p>Every layer of the tower is something a person signed or a check passed, and nothing is built on an unsigned layer.</p><p>Drag to turn the tower. Select a layer, or its name in the list, to open the step that builds it.</p>`},
 {page:'loop',find:()=>vis($('#lens')&&$('#lens').closest('.field')),title:'See it through your role',
  body:()=>`<p>The delivery loop has nine steps. Choose your role here to see the steps where you have the turn.</p><p>Then drag the ring, or press play, to walk through them.</p>`},
 {page:'dial',find:()=>vis($('#knob')),title:'Try things. Nothing here can break.',
  body:()=>`<p>The pages under <b>Customise</b> are simulators. Turn the dial to see what Bob may automate and what a person must still sign. The locked gates never move.</p><p>The others work the same way: send a threat through the security layers, run the gate on a pull request, try a shortcut and read the refusal.</p>`},
 {page:'evidence',find:()=>vis($('#chain')),title:'Follow the proof',
  body:()=>`<p>Select any link in the chain to follow one requirement from the spec to production. Each link is a file or a commit an auditor can open.</p><p>File names such as <code>sdd/governance/policy.json</code> are real paths in the kit.</p>`},
 {page:null,title:'Where to start',last:true,
  body:()=>`<p>Pick the path that fits you; each starts at the first page named.</p><ul class="tour-paths">${[
   ['sdlc','New to SDD','SDLC meets SDD → The delivery loop → People and Bob'],
   ['people','Business owner or approver','People and Bob → Automation dial → Evidence for audit'],
   ['loop','Architect or developer','The delivery loop → Guardrails → Get started'],
   ['security','Security','Security, shifted left → CI/CD pipeline → Evidence for audit'],
   ['features','Want the specs themselves','The bank\'s features: every requirement, screen and API operation'],
   ['start','Ready to try it','Get started: from clone to the first sign-off']].map(([k,w,p])=>`<li><a href="#${k}" data-go="${k}"><b>${w}</b><span>${p}</span>${icon('arrow')}</a></li>`).join('')}</ul><p class="tour-note">${icon('info')}<span>Replay this tour any time from ${innerWidth<672?'the <b>ⓘ</b> button':'<b>Tour</b>'} in the top bar.</span></p>`}];
const Tour={i:-1,
 start(){if(this.i>=0)return;$('#tourask')&&$('#tourask').remove();store.set('atlas-tour','seen');this.ret=document.activeElement;
  const s=document.createElement('div');s.className='tour-spot';s.setAttribute('aria-hidden','true');
  const d=document.createElement('div');d.className='tour';d.setAttribute('role','dialog');d.setAttribute('aria-labelledby','tour-t');d.setAttribute('aria-describedby','tour-b');
  d.innerHTML=`<div class="tour-top"><p class="tour-n" id="tour-n"></p><button type="button" class="tour-x" id="tour-x" aria-label="End the tour">${icon('close')}</button></div><h2 id="tour-t"></h2><div id="tour-b"></div>
   <div class="tour-dots" id="tour-dots" aria-hidden="true">${TOUR.map(()=>'<i></i>').join('')}</div>
   <div class="tour-act"><button type="button" class="btn ghost md" id="tour-p">Back</button><button type="button" class="btn pri md" id="tour-nx">Next</button></div>`;
  document.body.append(s,d);this.spot=s;this.card=d;
  $('#tour-x').onclick=()=>this.end();$('#tour-p').onclick=()=>this.go(this.i-1);$('#tour-nx').onclick=()=>this.i===TOUR.length-1?this.end():this.go(this.i+1);
  d.addEventListener('click',e=>{const a=e.target.closest('[data-go]');if(a){e.preventDefault();this.end(false);location.hash=a.dataset.go}});
  this.key=e=>{if(e.key==='Escape'){e.preventDefault();this.end()}else if(e.key==='ArrowRight'&&!e.target.closest('input,select,textarea,[role=slider]')){this.i<TOUR.length-1&&this.go(this.i+1)}else if(e.key==='ArrowLeft'&&!e.target.closest('input,select,textarea,[role=slider]')){this.i>0&&this.go(this.i-1)}};
  this.re=()=>{cancelAnimationFrame(this.raf);this.raf=requestAnimationFrame(()=>this.place())};
  this.hc=()=>{if(!this.nav&&this.i>=0&&TOUR[this.i].page&&location.hash.slice(1)!==TOUR[this.i].page)this.end(false)};
  addEventListener('keydown',this.key);addEventListener('resize',this.re);addEventListener('scroll',this.re,{passive:true});addEventListener('hashchange',this.hc);
  this.go(0)},
 async go(i){if(i<0||i>=TOUR.length)return;const st=TOUR[i];this.i=i;const tok=this.tok=(this.tok||0)+1;
  if(st.page&&CURID!==st.page){this.nav=true;location.hash=st.page;for(let n=0;n<40&&CURID!==st.page;n++)await new Promise(r=>setTimeout(r,25));await new Promise(r=>setTimeout(r,120));this.nav=false}
  if(tok!==this.tok||this.i<0)return;
  $('#tour-n').textContent=`${i+1} of ${TOUR.length}`;$('#tour-t').textContent=st.title;$('#tour-b').innerHTML=st.body();
  $$('#tour-dots i').forEach((d,k)=>d.className=k===i?'on':k<i?'done':'');
  $('#tour-p').hidden=i===0;$('#tour-nx').innerHTML=i===0?`Start the tour${icon('arrow')}`:st.last?'Finish':`Next${icon('arrow')}`;
  this.card.classList.toggle('wide',!!st.last);
  this.target=st.find?st.find():null;
  if(this.target){const r=this.target.getBoundingClientRect();if(r.top<56||r.bottom>innerHeight-24){this.target.scrollIntoView({block:r.height>innerHeight*.6?'start':'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});await new Promise(r=>setTimeout(r,380))}}
  if(tok!==this.tok)return;
  this.place();$('#tour-t').setAttribute('tabindex','-1');$('#tour-t').focus({preventScroll:true})},
 place(){if(this.i<0)return;const c=this.card,s=this.spot,vw=innerWidth,vh=innerHeight,t=this.target&&document.contains(this.target)?this.target:null;
  const cw=c.offsetWidth,ch=c.offsetHeight,M=12;
  if(!t){s.style.cssText=`left:${vw/2}px;top:${vh/2}px;width:0;height:0`;c.style.left=Math.max(8,(vw-cw)/2)+'px';c.style.top=Math.max(56,(vh-ch)/2)+'px';c.dataset.at='mid';return}
  const r=t.getBoundingClientRect(),p=6,inHdr=!!t.closest('#hdr'),top=inHdr?r.top+2:Math.max(48,r.top-p),bot=inHdr?r.bottom-2:Math.min(vh,r.bottom+p),pl=inHdr?2:p;
  s.style.cssText=`left:${r.left-pl}px;top:${top}px;width:${r.width+2*pl}px;height:${Math.max(0,bot-top)}px`;
  let x,y,at;
  if(vw<672){x=8;y=r.top+r.height/2<vh/2?vh-ch-8:56;at='dock'}
  else if(r.right+M+cw<=vw-8){x=r.right+M;y=Math.min(Math.max(56,r.top),vh-ch-8);at='right'}
  else if(bot+M+ch<=vh-8){x=Math.min(Math.max(8,r.left),vw-cw-8);y=bot+M;at='below'}
  else if(top-M-ch>=56){x=Math.min(Math.max(8,r.left),vw-cw-8);y=top-M-ch;at='above'}
  else if(r.left-M-cw>=8){x=r.left-M-cw;y=Math.min(Math.max(56,r.top),vh-ch-8);at='left'}
  else{x=vw-cw-16;y=vh-ch-16;at='corner'}
  c.style.left=x+'px';c.style.top=y+'px';c.dataset.at=at},
 end(focusBack=true){if(this.i<0)return;this.i=-1;this.tok++;removeEventListener('keydown',this.key);removeEventListener('resize',this.re);removeEventListener('scroll',this.re);removeEventListener('hashchange',this.hc);
  this.spot.remove();this.card.remove();if(focusBack){const b=vis($('#tourbtn'))||this.ret;b&&b.focus&&b.focus()}}};
$('#tourbtn')&&$('#tourbtn').addEventListener('click',()=>Tour.start());
// first visit: offer the tour, without getting in the way
if(/[?&]tour\b/.test(location.search))setTimeout(()=>Tour.start(),400);
else if(!store.get('atlas-tour',''))setTimeout(()=>{if(Tour.i>=0||$('#tourask'))return;const a=document.createElement('div');a.className='tourask';a.id='tourask';a.setAttribute('role','region');a.setAttribute('aria-label','Tour offer');
 a.innerHTML=`<p><b>New to the Atlas?</b> A one-minute tour shows how to read it.</p><div class="btns"><button type="button" class="btn pri md" id="ta-go">Take the tour</button><button type="button" class="btn ghost md" id="ta-no">No thanks</button></div>`;
 document.body.appendChild(a);$('#ta-go').onclick=()=>Tour.start();$('#ta-no').onclick=()=>{store.set('atlas-tour','no');a.remove()}},1200);

}</script></body></html>
