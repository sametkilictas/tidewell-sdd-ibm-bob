<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-labelledby="lab-layers-t lab-layers-d" class="dg"><title id="lab-layers-t">Lab 5: where each security problem is caught</title><desc id="lab-layers-d">A secret is caught by Bob&#x27;s hook, at commit by rule G10, by the scan before testing and by the pipeline. Risky code is caught by Bob&#x27;s hook, at commit, by the scan and by the pipeline. A compromised library is caught at commit, by the scan and by the pipeline. IBM detect-secrets, once switched on, runs at commit, in the scan and in the pipeline.</desc><defs><marker id="lab-layers-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="408" fill="#ffffff"/><path d="M264.0 22.0 L846.0 22.0" fill="none" stroke="#c6c6c6" stroke-width="1.6" marker-end="url(#lab-layers-ah)"/><text x="264.0" y="16.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">cheapest to fix</text><text x="842.0" y="16.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="end">nobody can switch it off</text><rect x="257.0" y="46.0" width="144.5" height="50.0" rx="0" fill="#f4f4f4"/><text x="329.2" y="68.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="middle">While Bob writes</text><text x="329.2" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">Bob&#x27;s hook</text><rect x="407.5" y="46.0" width="144.5" height="50.0" rx="0" fill="#f4f4f4"/><text x="479.8" y="68.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="middle">At commit</text><text x="479.8" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">the git hook</text><rect x="558.0" y="46.0" width="144.5" height="50.0" rx="0" fill="#f4f4f4"/><text x="630.2" y="68.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="middle">Before testing</text><text x="630.2" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">the scan</text><rect x="708.5" y="46.0" width="144.5" height="50.0" rx="0" fill="#f4f4f4"/><text x="780.8" y="68.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="middle">In the pipeline</text><text x="780.8" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">ci.mjs</text><rect x="24.0" y="170.0" width="832.0" height="1.0" rx="0" fill="#e0e0e0"/><text x="24.0" y="135.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">A secret</text><text x="24.0" y="154.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">an API key in a file · 5a</text><rect x="257.0" y="114.0" width="144.5" height="50.0" rx="0" fill="#24a148"/><circle cx="276.0" cy="139.0" r="9" fill="#ffffff"/><path d="M272.0 139.2L275.0 142.3L280.3 135.8" fill="none" stroke="#24a148" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="292.0" y="143.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="start">secrets check</text><rect x="407.5" y="114.0" width="144.5" heigh