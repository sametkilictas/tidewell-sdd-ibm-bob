<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-labelledby="lab-roles-t lab-roles-d" class="dg"><title id="lab-roles-t">Who does what in the lab</title><desc id="lab-roles-d">Bob builds: Partner A drives it as developer, architect and business analyst. People approve: Partner B signs as business owner and AppSec. The checks verify: built-in checks and your organisation&#x27;s tools, run by scripts Bob cannot change.</desc><defs><marker id="lab-roles-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="262" fill="#ffffff"/><rect x="24.0" y="24.0" width="252.0" height="170.0" rx="0" fill="#edf5ff"/><rect x="24.0" y="24.0" width="252.0" height="4.0" rx="0" fill="#0f62fe"/><text x="38.0" y="55.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">Bob builds</text><text x="38.0" y="81.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">The maker: writes specs, plans,</text><text x="38.0" y="99.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">code and tests, one step at a time.</text><text x="38.0" y="121.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">Partner A drives Bob, as</text><text x="38.0" y="139.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">developer, architect and business</text><text x="38.0" y="157.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">analyst.</text><rect x="314.0" y="24.0" width="252.0" height="170.0" rx="0" fill="#fcf4d6"/><rect x="314.0" y="24.0" width="252.0" height="4.0" rx="0" fill="#f1c21b"/><text x="328.0" y="55.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">People approve</text><text x="328.0" y="81.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">The checkers: sign plans, phases</text><text x="328.0" y="99.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">and change requests, and accept</text><text x="328.0" y="117.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">risk.</text><text x="328.0" y="139.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#684e00" text-anchor="start">Partner B signs, as business</text><text x="328.0" y="157.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#684e00" text-anchor="start">owner and AppSec.</text><rect x="604.0" y="24.0" width="252.0" height="170.0" rx="0" fill="#defbe6"/><rect x="604.0" y="24.0" width="252.0" height="4.0" rx="0" fill="#24a148"/><text x="618.0" y="55.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">Checks verify</text><text x="618.0" y="81.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">Built-in checks and your</text><text x="618.0" y="99.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">organisation&#x27;s tools, run by scripts</text><text x="618.0" y="117.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">Bob cannot change.</text><text x="618.0" y="139.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0e6027" text-anchor="start">In Bob, at commit, before testing</text><text x="618.0" y="157.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0e6027" text-anchor="start">and in the pipeline.</text><g transform="translate(536.0 40.0)" fill="#684e00"><path d="M9.6 0.6l2.8 2.8-7.9 7.9-3.5 0.7 0.7-3.5z"/><path d="M0 13h13" stroke="#684e00" stroke-width="1.4"/></g><path d="M280.0 94.0 L309.0 94.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-roles-ah)"/><text x="295.0" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="middle">asks</text><path d="M310.0 128.0 L281.0 128.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-roles-ah)"/><text x="295.0" y="146.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="middle">signs</text><path d="M600.0 111.0 L571.0 111.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-roles-ah)"/><text x="585.0" y="103.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="middle">proof</text><text x="440.0" y="238.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="middle">Working alone? One person can hold every role with &quot;trainingMode&quot;: true (Lab 0).</text></svg>
