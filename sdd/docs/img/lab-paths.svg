<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352" width="880" height="352" role="img" aria-labelledby="lab-paths-t lab-paths-d" class="dg"><title id="lab-paths-t">Two paths, one kit</title><desc id="lab-paths-d">Only the way people sign and the place the pipeline runs differ. Terminal path: sign with approve.mjs and commit approvals.json on its own; the gate runs in any CI or on a laptop. GitHub path: sign with a comment on the pull request; the gate runs in GitHub Actions. Specs, Bob&#x27;s modes, the guardrails and the gate are the same on both.</desc><defs><marker id="lab-paths-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="352" fill="#ffffff"/><rect x="348.0" y="58.0" width="196.0" height="204.0" rx="0" fill="#f4f4f4"/><rect x="348.0" y="58.0" width="196.0" height="4.0" rx="0" fill="#8d8d8d"/><text x="362.0" y="89.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">The same on both</text><text x="362.0" y="109.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">paths</text><text x="362.0" y="135.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">specs and contract</text><text x="362.0" y="157.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">Bob&#x27;s modes and hooks</text><text x="362.0" y="179.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">the guardrails G1–G10</text><text x="362.0" y="201.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">the gate: ci.mjs</text><text x="362.0" y="223.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">the automation dial</text><rect x="24.0" y="24.0" width="310.0" height="272.0" rx="0" fill="#ffffff" stroke="#c6c6c6" stroke-width="1"/><rect x="24.0" y="24.0" width="310.0" height="4.0" rx="0" fill="#393939"/><text x="40.0" y="54.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">Terminal path (default)</text><text x="40.0" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#6f6f6f" text-anchor="start">SIGN</text><rect x="40.0" y="94.0" width="278.0" height="26.0" rx="0" fill="#f4f4f4"/><text x="48.0" y="111.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">node sdd/scripts/approve.mjs plan F00</text><text x="40.0" y="138.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">then commit approvals.json on its own</text><text x="40.0" y="171.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#6f6f6f" text-anchor="start">PIPELINE</text><rect x="40.0" y="179.0" width="278.0" height="26.0" rx="0" fill="#f4f4f4"/><text x="48.0" y="196.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">node sdd/scripts/ci.mjs pr</text><text x="40.0" y="223.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">Jenkins, Azure DevOps, GitLab, or a laptop</text><text x="40.0" y="278.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0043ce" text-anchor="start">&quot;approvalChannel&quot;: &quot;terminal&quot;</text><rect x="558.0" y="24.0" width="310.0" height="272.0" rx="0" fill="#ffffff" stroke="#c6c6c6" stroke-width="1"/><rect x="558.0" y="24.0" width="310.0" height="4.0" rx="0" fill="#393939"/><text x="574.0" y="54.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">GitHub path</text><text x="574.0" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#6f6f6f" text-anchor="start">SIGN</text><rect x="574.0" y="94.0" width="278.0" height="26.0" rx="0" fill="#f4f4f4"/><text x="582.0" y="111.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">/approve-plan F00</text><text x="574.0" y="138.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">a comment on the pull request</text><text x="574.0" y="171.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#6f6f6f" text-anchor="start">PIPELINE</text><rect x="574.0" y="179.0" width="278.0" height="26.0" rx="0" fill="#f4f4f4"/><text x="582.0" y="196.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">.github/workflows/</text><text x="574.0" y="223.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">GitHub Actions, plus Bob reviewing pull</text><text x="574.0" y="240.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">requests</text><text x="574.0" y="278.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0043ce" text-anchor="start">&quot;approvalChannel&quot;: &quot;github&quot;</text><text x="440.0" y="330.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="middle">One setting in sdd/governance/approvers.json picks the path.</text></svg>
