<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="lab-signoff-t lab-signoff-d" class="dg"><title id="lab-signoff-t">Lab 3: the maker cannot sign, the checker can, and the pipeline can tell</title><desc id="lab-signoff-d">Partner A, the maker, runs approve.mjs plan F00 and is refused: the plan needs the business owner. Partner B reads the spec and plan, signs, and commits approvals.json on its own. The pipeline&#x27;s sign-off check passes. A forged record that A writes by hand fails the same check.</desc><defs><marker id="lab-signoff-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="400" fill="#ffffff"/><rect x="24.0" y="20.0" width="832.0" height="104.0" rx="0" fill="#f4f8ff"/><rect x="24.0" y="20.0" width="4.0" height="104.0" rx="0" fill="#0f62fe"/><text x="40.0" y="60.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">Partner A</text><text x="40.0" y="78.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">the maker</text><rect x="24.0" y="134.0" width="832.0" height="104.0" rx="0" fill="#fcf4d6"/><rect x="24.0" y="134.0" width="4.0" height="104.0" rx="0" fill="#f1c21b"/><text x="40.0" y="174.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">Partner B</text><text x="40.0" y="192.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">the checker</text><rect x="24.0" y="248.0" width="832.0" height="104.0" rx="0" fill="#defbe6"/><rect x="24.0" y="248.0" width="4.0" height="104.0" rx="0" fill="#24a148"/><text x="40.0" y="288.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">The checks</text><text x="40.0" y="306.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">scripts</text><rect x="160.0" y="34.0" width="128.0" height="78.0" rx="0" fill="#ffffff" stroke="#c6c6c6" stroke-width="1"/><text x="168.0" y="53.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">approve.mjs</text><text x="168.0" y="68.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">plan F00</text><text x="168.0" y="84.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">tries to sign</text><rect x="160.0" y="262.0" width="128.0" height="78.0" rx="0" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="168.0" y="281.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#161616" text-anchor="start">✖ refused</text><text x="168.0" y="297.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2191f" text-anchor="start">needs the business</text><text x="168.0" y="311.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2191f" text-anchor="start">owner</text><path d="M224.0 113.0 L224.0 259.0" fill="none" stroke="#da1e28" stroke-width="1.6" marker-end="url(#lab-signoff-ah)"/><rect x="300.0" y="148.0" width="128.0" height="78.0" rx="0" fill="#ffffff" stroke="#c6c6c6" stroke-width="1"/><text x="308.0" y="167.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#161616" text-anchor="start">reads spec.md</text><text x="308.0" y="182.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#161616" text-anchor="start">and plan.md</text><text x="308.0" y="198.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">in Bob or on the</text><text x="308.0" y="212.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">host</text><rect x="440.0" y="148.0" width="128.0" height="78.0" rx="0" fill="#ffffff" stroke="#c6c6c6" stroke-width="1"/><text x="448.0" y="167.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">approve.mjs</text><text x="448.0" y="182.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">plan F00</text><text x="448.0" y="198.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">types F00 to</text><text x="448.0" y="212.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">confirm</text><path d="M430.0 186.0 L436.0 186.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-signoff-ah)"/><rect x="580.0" y="148.0" width="128.0" height="78.0" rx="0" fill="#ffffff" stroke="#f1c21b" stroke-width="1"/><text x="588.0" y="167.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#161616" text-anchor="start">commits</text><text x="588.0" y="182.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#161616" text-anchor="start">approvals.json</text><text x="588.0" y="198.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#525252" text-anchor="start">on its own, as B</text><path d="M570.0 186.0 L576.0 186.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-signoff-ah)"/><rect x="580.0" y="262.0" width="128.0" height="78.0" rx="0" fill="#ffffff" stroke="#24a148" stroke-width="1"/><text x="588.0" y="281.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#161616" text-anchor="start">✔ ci.mjs signoffs</text><text x="588.0" y="297.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0e6027" text-anchor="start">listed person, right</text><text x="588.0" y="311.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0e6027" text-anchor="start">role</text><path d="M644.0 227.0 L644.0 259.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-signoff-ah)"/><rect x="726.0" y="34.0" width="128.0" height="78.0" rx="0" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="734.0" y="53.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#161616" text-anchor="start">forgery drill</text><text x="734.0" y="69.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2191f" text-anchor="start">copies B&#x27;s record</text><text x="734.0" y="83.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2191f" text-anchor="start">to F01 by hand</text><rect x="726.0" y="262.0" width="128.0" height="78.0" rx="0" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="734.0" y="281.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#161616" text-anchor="start">✖ ci.mjs signoffs</text><text x="734.0" y="297.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2191f" text-anchor="start">A may not give this</text><text x="734.0" y="311.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2191f" text-anchor="start">sign-off</text><path d="M790.0 113.0 L790.0 259.0" fill="none" stroke="#da1e28" stroke-width="1.6" marker-end="url(#lab-signoff-ah)"/><text x="24.0" y="378.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">GitHub path: the same decision is a comment, /approve-plan F00. The workflow checks the commenter against approvers.json.</text></svg>
