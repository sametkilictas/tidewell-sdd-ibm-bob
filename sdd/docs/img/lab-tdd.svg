<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-labelledby="lab-tdd-t lab-tdd-d" class="dg"><title id="lab-tdd-t">Lab 4: every task is built test-first</title><desc id="lab-tdd-d">For each task Bob writes a test that fails, then the smallest code that passes it, then one commit naming the task and its requirement. The developer approves every write. F00 has 31 tasks in seven groups, A to G. When all are done, F00 needs a scan before any testing.</desc><defs><marker id="lab-tdd-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="312" fill="#ffffff"/><path d="M270.0 40.2 A118 118 0 0 1 339.4 160.3" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-tdd-ah)"/><path d="M291.4 243.5 A118 118 0 0 1 152.6 243.5" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-tdd-ah)"/><path d="M104.6 160.3 A118 118 0 0 1 174.0 40.2" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-tdd-ah)"/><rect x="133.0" y="4.0" width="178.0" height="52.0" rx="0" fill="#fff1f1" stroke="#da1e28" stroke-width="1"/><text x="143.0" y="24.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#161616" text-anchor="start">1. A test that fails</text><text x="143.0" y="43.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#a2191f" text-anchor="start">red: it must fail first</text><rect x="235.2" y="181.0" width="178.0" height="52.0" rx="0" fill="#defbe6" stroke="#24a148" stroke-width="1"/><text x="245.2" y="201.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#161616" text-anchor="start">2. The smallest code</text><text x="245.2" y="220.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#0e6027" text-anchor="start">green: it passes</text><rect x="30.8" y="181.0" width="178.0" height="52.0" rx="0" fill="#edf5ff" stroke="#0f62fe" stroke-width="1"/><text x="40.8" y="201.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#161616" text-anchor="start">3. One commit</text><text x="40.8" y="220.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#0043ce" text-anchor="start">feat(F00): T0NN [FND-…]</text><g transform="translate(215.0 130.0)" fill="#684e00"><path d="M9.6 0.6l2.8 2.8-7.9 7.9-3.5 0.7 0.7-3.5z"/><path d="M0 13h13" stroke="#684e00" stroke-width="1.4"/></g><text x="222.0" y="162.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#684e00" text-anchor="middle">you approve</text><text x="222.0" y="178.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#684e00" text-anchor="middle">every write</text><text x="155.9" y="105.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="middle">next task</text><text x="470.0" y="38.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">F00 Foundation: 31 tasks in seven groups</text><rect x="470.0" y="54.0" width="26.0" height="24.0" rx="0" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><text x="483.0" y="70.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">A</text><text x="506.0" y="70.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">workspace</text><rect x="470.0" y="84.0" width="26.0" height="24.0" rx="0" fill="#0f62fe" stroke="#0f62fe" stroke-width="1"/><text x="483.0" y="100.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">B</text><text x="506.0" y="100.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">domain: money in fils, AE IBANs, the business calendar</text><rect x="470.0" y="114.0" width="26.0" height="24.0" rx="0" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="483.0" y="130.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0043ce" text-anchor="middle">C</text><text x="506.0" y="130.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">infrastructure</text><rect x="470.0" y="144.0" width="26.0" height="24.0" rx="0" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="483.0" y="160.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0043ce" text-anchor="middle">D</text><text x="506.0" y="160.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">API platform</text><rect x="470.0" y="174.0" width="26.0" height="24.0" rx="0" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="483.0" y="190.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0043ce" text-anchor="middle">E</text><text x="506.0" y="190.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">contracts and web shell</text><rect x="470.0" y="204.0" width="26.0" height="24.0" rx="0" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="483.0" y="220.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0043ce" text-anchor="middle">F</text><text x="506.0" y="220.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">quality gates</text><rect x="470.0" y="234.0" width="26.0" height="24.0" rx="0" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="483.0" y="250.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="600" fill="#0043ce" text-anchor="middle">G</text><text x="506.0" y="250.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">close-out</text><text x="470.0" y="280.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">Filled: built live in the lab. The rest: /sdd-implement F00 while</text><text x="470.0" y="296.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">you carry on.</text></svg>
