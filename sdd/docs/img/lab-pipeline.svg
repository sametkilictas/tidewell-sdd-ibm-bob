<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 316" width="880" height="316" role="img" aria-labelledby="lab-pipeline-t lab-pipeline-d" class="dg"><title id="lab-pipeline-t">Lab 7: the same gate in any CI, then the release decision</title><desc id="lab-pipeline-d">A pull request runs the gate, node sdd/scripts/ci.mjs pr, with seven stages: policy, specs, commits, sign-offs, secrets, tests and scan. After the merge, deployment to the test environment is automatic once the scan is confirmed for the exact commit. Production waits for people: the business owner for tier 2, the business owner and AppSec for tier 1, never the same person twice.</desc><defs><marker id="lab-pipeline-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="316" fill="#ffffff"/><rect x="24.0" y="24.0" width="124.0" height="240.0" rx="0" fill="#f4f4f4"/><rect x="24.0" y="24.0" width="124.0" height="4.0" rx="0" fill="#8d8d8d"/><text x="38.0" y="54.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Pull request</text><text x="38.0" y="79.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">from the</text><text x="38.0" y="97.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">phase branch</text><rect x="172.0" y="24.0" width="300.0" height="240.0" rx="0" fill="#defbe6"/><rect x="172.0" y="24.0" width="300.0" height="4.0" rx="0" fill="#24a148"/><text x="186.0" y="52.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">The gate</text><rect x="186.0" y="64.0" width="272.0" height="26.0" rx="0" fill="#ffffff"/><text x="194.0" y="81.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#161616" text-anchor="start">node sdd/scripts/ci.mjs pr</text><rect x="186.0" y="104.0" width="73.9" height="24.0" rx="12" fill="#ffffff" stroke="#24a148" stroke-width="1"/><path d="M195.0 116.0l3 3 5.5-6" fill="none" stroke="#24a148" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="208.0" y="120.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">policy</text><rect x="265.9" y="104.0" width="66.6" height="24.0" rx="12" fill="#ffffff" stroke="#24a148" stroke-width="1"/><path d="M274.9 116.0l3 3 5.5-6" fill="none" stroke="#24a148" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="287.9" y="120.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">specs</text><rect x="338.5" y="104.0" width="81.2" height="24.0" rx="12" fill="#ffffff" stroke="#24a148" stroke-width="1"/><path d="M347.5 116.0l3 3 5.5-6" fill="none" stroke="#24a148" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="360.5" y="120.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">commits</text><rect x="186.0" y="134.0" width="88.6" height="24.0" rx="12" fill="#ffffff" stroke="#24a148" stroke-width="1"/><path d="M195.0 146.0l3 3 5.5-6" fill="none" stroke="#24a148" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="208.0" y="150.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">signoffs</text><rect x="280.6" y="134.0" width="81.2" height="24.0" rx="12" fill="#ffffff" stroke="#24a148" stroke-width="1"/><path d="M289.6 146.0l3 3 5.5-6" fill="none" stroke="#24a148" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="302.6" y="150.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">secrets</text><rect x="367.8" y="134.0" width="66.6" height="24.0" rx="12" fill="#ffffff" stroke="#24a148" stroke-width="1"/><path d="M376.8 146.0l3 3 5.5-6" fill="none" stroke="#24a148" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="389.8" y="150.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">tests</text><rect x="186.0" y="164.0" width="59.3" height="24.0" rx="12" fill="#ffffff" stroke="#24a148" stroke-width="1"/><path d="M195.0 176.0l3 3 5.5-6" fill="none" stroke="#24a148" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="208.0" y="180.5" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">scan</text><text x="186.0" y="214.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0e6027" text-anchor="start">in any CI:</text><text x="186.0" y="232.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">Jenkins · Azure DevOps · GitLab · GitHub</text><text x="186.0" y="248.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#0e6027" text-anchor="start">Actions · Tekton · a laptop</text><path d="M150.0 144.0 L168.0 144.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-pipeline-ah)"/><rect x="502.0" y="24.0" width="168.0" height="240.0" rx="0" fill="#defbe6"/><rect x="502.0" y="24.0" width="168.0" height="4.0" rx="0" fill="#24a148"/><text x="516.0" y="54.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Test environment</text><text x="516.0" y="79.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">automatic once the</text><text x="516.0" y="96.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">gate passes</text><text x="516.0" y="117.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">the scan re-checked</text><text x="516.0" y="134.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">for the exact commit</text><path d="M474.0 144.0 L498.0 144.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-pipeline-ah)"/><text x="487.0" y="136.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#525252" text-anchor="middle">merge</text><rect x="694.0" y="24.0" width="162.0" height="240.0" rx="0" fill="#fcf4d6"/><rect x="694.0" y="24.0" width="162.0" height="4.0" rx="0" fill="#f1c21b"/><text x="708.0" y="54.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Production</text><text x="708.0" y="79.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">people approve, by</text><text x="708.0" y="96.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">the strictest tier in</text><text x="708.0" y="113.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">the release:</text><text x="708.0" y="134.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#684e00" text-anchor="start">tier 2: business</text><text x="708.0" y="151.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#684e00" text-anchor="start">owner</text><text x="708.0" y="172.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#684e00" text-anchor="start">tier 1: business</text><text x="708.0" y="189.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#684e00" text-anchor="start">owner and AppSec</text><text x="708.0" y="210.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">never the same</text><text x="708.0" y="227.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">person twice</text><g transform="translate(828.0 40.0)" fill="#684e00"><path d="M9.6 0.6l2.8 2.8-7.9 7.9-3.5 0.7 0.7-3.5z"/><path d="M0 13h13" stroke="#684e00" stroke-width="1.4"/></g><path d="M672.0 144.0 L690.0 144.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-pipeline-ah)"/><text x="24.0" y="298.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">Skip a hook with --no-verify and the gate still fails: ci.mjs commits and ci.mjs secrets run the same rules on the server.</text></svg>
