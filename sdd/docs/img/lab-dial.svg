<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img" aria-labelledby="lab-dial-t lab-dial-d" class="dg"><title id="lab-dial-t">The automation dial: three risk tiers</title><desc id="lab-dial-d">Tier 1 Critical (F01, F04, F05, F06, F09, F11): plan signed by the business owner only, hand security review required, Bob one step at a time, release approved by the business owner and AppSec. Tier 2 Sensitive (F00, F03, F07, F10): business owner, review required, one step at a time, release by the business owner. Tier 3 Standard (F02, F08): business owner or architect, review optional, Bob may drive several steps, release by the business owner. Locked settings cannot be configured away.</desc><defs><marker id="lab-dial-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="432" fill="#ffffff"/><rect x="206.0" y="20.0" width="214.0" height="150.0" rx="0" fill="#fff1f1"/><rect x="206.0" y="20.0" width="214.0" height="4.0" rx="0" fill="#da1e28"/><text x="220.0" y="50.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">Tier 1 · Critical</text><text x="220.0" y="70.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">moves money or value, guards</text><text x="220.0" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">access, changes security</text><text x="220.0" y="102.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">settings</text><rect x="220.0" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="236.5" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F01</text><rect x="258.0" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="274.6" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F04</text><rect x="296.1" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="312.6" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F05</text><rect x="334.1" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="350.7" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F06</text><rect x="372.2" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="388.7" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F09</text><rect x="220.0" y="142.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#da1e28" stroke-width="1"/><text x="236.5" y="156.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F11</text><rect x="432.0" y="20.0" width="214.0" height="150.0" rx="0" fill="#fcf4d6"/><rect x="432.0" y="20.0" width="214.0" height="4.0" rx="0" fill="#f1c21b"/><text x="446.0" y="50.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">Tier 2 · Sensitive</text><text x="446.0" y="70.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">shows or stores personal data;</text><text x="446.0" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">moves no value</text><rect x="446.0" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#f1c21b" stroke-width="1"/><text x="462.5" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F00</text><rect x="484.0" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#f1c21b" stroke-width="1"/><text x="500.6" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F03</text><rect x="522.1" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#f1c21b" stroke-width="1"/><text x="538.6" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F07</text><rect x="560.1" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#f1c21b" stroke-width="1"/><text x="576.7" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F10</text><rect x="658.0" y="20.0" width="214.0" height="150.0" rx="0" fill="#defbe6"/><rect x="658.0" y="20.0" width="214.0" height="4.0" rx="0" fill="#24a148"/><text x="672.0" y="50.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#161616" text-anchor="start">Tier 3 · Standard</text><text x="672.0" y="70.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">no value, no credentials, no</text><text x="672.0" y="86.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">personal data</text><rect x="672.0" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#24a148" stroke-width="1"/><text x="688.5" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F02</text><rect x="710.0" y="116.0" width="33.0" height="20.0" rx="10" fill="#ffffff" stroke="#24a148" stroke-width="1"/><text x="726.6" y="130.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="middle">F08</text><rect x="24.0" y="180.0" width="832.0" height="52.0" rx="0" fill="#ffffff"/><rect x="24.0" y="232.0" width="832.0" height="1.0" rx="0" fill="#e0e0e0"/><text x="24.0" y="203.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="start">Plan signed by</text><text x="220.0" y="203.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">business owner only</text><g transform="translate(396.0 196.0)" fill="none" stroke="#684e00" stroke-width="1.6"><path d="M2.5 6V4a3.5 3.5 0 0 1 7 0v2"/><rect x="0.5" y="6" width="11" height="8" rx="1.5" fill="#684e00"/></g><text x="446.0" y="203.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">business owner</text><text x="672.0" y="203.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">business owner or</text><text x="672.0" y="220.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">architect</text><rect x="24.0" y="234.0" width="832.0" height="52.0" rx="0" fill="#ffffff"/><rect x="24.0" y="286.0" width="832.0" height="1.0" rx="0" fill="#e0e0e0"/><text x="24.0" y="257.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="start">Hand security review</text><text x="220.0" y="257.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">required</text><g transform="translate(396.0 250.0)" fill="none" stroke="#684e00" stroke-width="1.6"><path d="M2.5 6V4a3.5 3.5 0 0 1 7 0v2"/><rect x="0.5" y="6" width="11" height="8" rx="1.5" fill="#684e00"/></g><text x="446.0" y="257.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">required</text><g transform="translate(622.0 250.0)" fill="none" stroke="#684e00" stroke-width="1.6"><path d="M2.5 6V4a3.5 3.5 0 0 1 7 0v2"/><rect x="0.5" y="6" width="11" height="8" rx="1.5" fill="#684e00"/></g><text x="672.0" y="257.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">optional</text><rect x="24.0" y="288.0" width="832.0" height="52.0" rx="0" fill="#ffffff"/><rect x="24.0" y="340.0" width="832.0" height="1.0" rx="0" fill="#e0e0e0"/><text x="24.0" y="311.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="start">Bob</text><text x="220.0" y="311.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">one step at a time</text><g transform="translate(396.0 304.0)" fill="none" stroke="#684e00" stroke-width="1.6"><path d="M2.5 6V4a3.5 3.5 0 0 1 7 0v2"/><rect x="0.5" y="6" width="11" height="8" rx="1.5" fill="#684e00"/></g><text x="446.0" y="311.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">one step at a time</text><text x="672.0" y="311.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">may drive several steps</text><rect x="24.0" y="342.0" width="832.0" height="52.0" rx="0" fill="#ffffff"/><rect x="24.0" y="394.0" width="832.0" height="1.0" rx="0" fill="#e0e0e0"/><text x="24.0" y="365.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="start">Release to production</text><text x="220.0" y="365.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">business owner and</text><text x="220.0" y="382.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">AppSec: two people</text><g transform="translate(396.0 358.0)" fill="none" stroke="#684e00" stroke-width="1.6"><path d="M2.5 6V4a3.5 3.5 0 0 1 7 0v2"/><rect x="0.5" y="6" width="11" height="8" rx="1.5" fill="#684e00"/></g><text x="446.0" y="365.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">business owner</text><text x="672.0" y="365.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#161616" text-anchor="start">business owner</text><g transform="translate(24.0 410.0)" fill="none" stroke="#684e00" stroke-width="1.6"><path d="M2.5 6V4a3.5 3.5 0 0 1 7 0v2"/><rect x="0.5" y="6" width="11" height="8" rx="1.5" fill="#684e00"/></g><text x="44.0" y="422.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">Locked: policy.mjs check fails if a change would remove it. Every tier keeps a human plan and phase sign-off.</text></svg>
