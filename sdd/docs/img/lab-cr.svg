<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 262" width="880" height="262" role="img" aria-labelledby="lab-cr-t lab-cr-d" class="dg"><title id="lab-cr-t">Lab 8: a signed spec changes only through a change request</title><desc id="lab-cr-d">Editing a signed spec directly is refused by rule G9. Instead: Bob writes CR-001 with options and impact, the business owner decides, Bob applies only what the CR lists in a commit that cites it, the plan sign-off becomes stale, and the business owner signs the plan again.</desc><defs><marker id="lab-cr-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="262" fill="#ffffff"/><rect x="24.0" y="18.0" width="250.0" height="52.0" rx="0" fill="#fff1f1"/><rect x="24.0" y="18.0" width="4.0" height="52.0" rx="0" fill="#da1e28"/><text x="37.0" y="38.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#161616" text-anchor="start">Edit spec.md directly</text><text x="37.0" y="62.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">✖ G9: it is approved scope</text><path d="M278.0 44.0 L300.0 44.0" fill="none" stroke="#da1e28" stroke-width="1.6" stroke-dasharray="5 4"/><text x="308.0" y="48.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#a2191f" text-anchor="start">refused at commit, and again in the pipeline</text><rect x="24.0" y="92.0" width="160.0" height="132.0" rx="0" fill="#edf5ff"/><rect x="24.0" y="92.0" width="160.0" height="4.0" rx="0" fill="#0f62fe"/><text x="36.0" y="120.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">1  Raise</text><rect x="34.0" y="132.0" width="140.0" height="24.0" rx="0" fill="#ffffff"/><text x="39.0" y="148.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#161616" text-anchor="start">/sdd-change-request</text><text x="36.0" y="176.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">Bob writes CR-001:</text><text x="36.0" y="192.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">options, impact</text><rect x="192.0" y="92.0" width="160.0" height="132.0" rx="0" fill="#fcf4d6"/><rect x="192.0" y="92.0" width="160.0" height="4.0" rx="0" fill="#f1c21b"/><text x="204.0" y="120.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">2  Decide</text><rect x="202.0" y="132.0" width="140.0" height="24.0" rx="0" fill="#ffffff"/><text x="207.0" y="148.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#161616" text-anchor="start">approve.mjs cr CR-001</text><text x="204.0" y="176.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">the business owner</text><text x="204.0" y="192.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">picks an option</text><g transform="translate(326.0 106.0)" fill="#684e00"><path d="M9.6 0.6l2.8 2.8-7.9 7.9-3.5 0.7 0.7-3.5z"/><path d="M0 13h13" stroke="#684e00" stroke-width="1.4"/></g><path d="M185.0 152.0l6 6-6 6" fill="none" stroke="#8d8d8d" stroke-width="1.6"/><rect x="360.0" y="92.0" width="160.0" height="132.0" rx="0" fill="#edf5ff"/><rect x="360.0" y="92.0" width="160.0" height="4.0" rx="0" fill="#0f62fe"/><text x="372.0" y="120.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">3  Apply</text><rect x="370.0" y="132.0" width="140.0" height="24.0" rx="0" fill="#ffffff"/><text x="375.0" y="148.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#161616" text-anchor="start">/sdd-apply-cr CR-001</text><text x="372.0" y="176.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">only what the CR lists;</text><text x="372.0" y="192.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">the commit cites it</text><path d="M353.0 152.0l6 6-6 6" fill="none" stroke="#8d8d8d" stroke-width="1.6"/><rect x="528.0" y="92.0" width="160.0" height="132.0" rx="0" fill="#defbe6"/><rect x="528.0" y="92.0" width="160.0" height="4.0" rx="0" fill="#24a148"/><text x="540.0" y="120.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">4  Notice</text><rect x="538.0" y="132.0" width="140.0" height="24.0" rx="0" fill="#ffffff"/><text x="543.0" y="148.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#161616" text-anchor="start">state.mjs</text><text x="540.0" y="176.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">the plan sign-off is</text><text x="540.0" y="192.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">now stale</text><path d="M521.0 152.0l6 6-6 6" fill="none" stroke="#8d8d8d" stroke-width="1.6"/><rect x="696.0" y="92.0" width="160.0" height="132.0" rx="0" fill="#fcf4d6"/><rect x="696.0" y="92.0" width="160.0" height="4.0" rx="0" fill="#f1c21b"/><text x="708.0" y="120.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#161616" text-anchor="start">5  Re-sign</text><rect x="706.0" y="132.0" width="140.0" height="24.0" rx="0" fill="#ffffff"/><text x="711.0" y="148.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#161616" text-anchor="start">approve.mjs plan F00</text><text x="708.0" y="176.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">the business owner</text><text x="708.0" y="192.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">signs again</text><g transform="translate(830.0 106.0)" fill="#684e00"><path d="M9.6 0.6l2.8 2.8-7.9 7.9-3.5 0.7 0.7-3.5z"/><path d="M0 13h13" stroke="#684e00" stroke-width="1.4"/></g><path d="M689.0 152.0l6 6-6 6" fill="none" stroke="#8d8d8d" stroke-width="1.6"/><text x="24.0" y="254.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">GitHub path: /approve-cr CR-001 option A, and /approve-plan F00, as pull-request comments.</text></svg>
