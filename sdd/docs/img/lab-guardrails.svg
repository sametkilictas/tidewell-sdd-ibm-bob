<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 244" width="880" height="244" role="img" aria-labelledby="lab-guardrails-t lab-guardrails-d" class="dg"><title id="lab-guardrails-t">Lab 10: five layers, each catching what got past the one before</title><desc id="lab-guardrails-d">Bob&#x27;s hook stops drills 1 to 6 and 9. The git hook stops 7 and 8. The sign-off script stops 11. The policy check stops 14. The pipeline stops 10, 12 and 13, and the GitHub sign-off workflow stops 15. The pipeline is the layer nobody can switch off.</desc><defs><marker id="lab-guardrails-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="244" fill="#ffffff"/><rect x="24.0" y="24.0" width="152.0" height="150.0" rx="0" fill="#edf5ff"/><rect x="24.0" y="24.0" width="152.0" height="4.0" rx="0" fill="#0f62fe"/><text x="36.0" y="54.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Bob&#x27;s hook</text><text x="36.0" y="73.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">while Bob works</text><text x="36.0" y="102.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6f6f6f" text-anchor="start">DRILLS</text><rect x="36.0" y="112.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="49.0" y="127.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0043ce" text-anchor="middle">1</text><rect x="67.0" y="112.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="80.0" y="127.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0043ce" text-anchor="middle">2</text><rect x="98.0" y="112.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="111.0" y="127.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0043ce" text-anchor="middle">3</text><rect x="129.0" y="112.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="142.0" y="127.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0043ce" text-anchor="middle">4</text><rect x="36.0" y="140.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="49.0" y="155.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0043ce" text-anchor="middle">5</text><rect x="67.0" y="140.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="80.0" y="155.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0043ce" text-anchor="middle">6</text><rect x="98.0" y="140.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#0f62fe" stroke-width="1"/><text x="111.0" y="155.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#0043ce" text-anchor="middle">9</text><rect x="190.0" y="24.0" width="152.0" height="150.0" rx="0" fill="#f4f4f4"/><rect x="190.0" y="24.0" width="152.0" height="4.0" rx="0" fill="#8d8d8d"/><text x="202.0" y="54.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">The git hook</text><text x="202.0" y="73.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">at commit</text><text x="202.0" y="102.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6f6f6f" text-anchor="start">DRILLS</text><rect x="202.0" y="112.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#8d8d8d" stroke-width="1"/><text x="215.0" y="127.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#393939" text-anchor="middle">7</text><rect x="233.0" y="112.0" width="26.0" height="22.0" rx="11" fill="#ffffff" stroke="#8d8d8d" stroke-width="1"/><text x="246.0" y="127.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#393939" text-anchor="middle">8</text><path d="M177.0 99.0 L187.0 99.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-guardrails-ah)"/><rect x="356.0" y="24.0" width="152.0" height="150.0" rx="0" fill="#fcf4d6"/><rect x="356.0" y="24.0" width="152.0" height="4.0" rx="0" fill="#f1c21b"/><text x="368.0" y="54.0" font-family="'IBM Plex Mono',Menlo,Consolas,monospace" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">approve.mjs</text><text x="368.0" y="73.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="400" fill="#525252" text-anchor="start">who may sign</text><text x="368.0" y="102.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#6f6f6f" text-anchor="start">DRILLS</text><rect x="368.0" y="112.0" width="32.0" height="22.0" rx="11" fill="#ffffff" stroke="#f1c21b" stroke-width="1"/><text x="384.0" y="127.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" fill="#684e00" text-anchor="middle">11</text><path d="M343.0 99.0 L353.0 99.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-guardrails-ah)"/><rect x="522.0" y="24.0" width="152.0" height="150.0" rx="0" fill="#fcf4d6"/><rect x="522.0" y="24.0" width="152.0" height="4.0" rx="0" fill="#f1c21b"/><text x="534.0" y="54.