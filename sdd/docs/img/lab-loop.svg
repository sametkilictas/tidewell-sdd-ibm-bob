<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" width="880" height="446" role="img" aria-labelledby="lab-loop-t lab-loop-d" class="dg"><title id="lab-loop-t">The delivery loop for one feature</title><desc id="lab-loop-d">Clarify, plan, a person approves the plan, tasks, implement test-first, scan, verify, secure, a person approves the phase. Anything that fails the scan, the verification or the security review goes back to implement as a fix task. All of this happens before the push; after the push the pipeline runs the same checks again and people approve the release.</desc><defs><marker id="lab-loop-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8d8d8d"/></marker></defs><rect width="880" height="446" fill="#ffffff"/><rect x="24.0" y="20.0" width="12.0" height="12.0" rx="0" fill="#edf5ff" stroke="#0f62fe" stroke-width="1"/><text x="42.0" y="30.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">Bob writes</text><rect x="130.6" y="20.0" width="12.0" height="12.0" rx="0" fill="#fcf4d6" stroke="#f1c21b" stroke-width="1"/><text x="148.6" y="30.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">A person decides</text><rect x="280.3" y="20.0" width="12.0" height="12.0" rx="0" fill="#defbe6" stroke="#24a148" stroke-width="1"/><text x="298.3" y="30.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#525252" text-anchor="start">The checks verify</text><rect x="28.0" y="56.0" width="152.0" height="88.0" rx="0" fill="#edf5ff"/><rect x="28.0" y="56.0" width="4.0" height="88.0" rx="0" fill="#0f62fe"/><text x="46.0" y="82.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Clarify</text><text x="46.0" y="107.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">analyst</text><text x="46.0" y="129.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">Bob</text><rect x="196.0" y="56.0" width="152.0" height="88.0" rx="0" fill="#edf5ff"/><rect x="196.0" y="56.0" width="4.0" height="88.0" rx="0" fill="#0f62fe"/><text x="214.0" y="82.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Plan</text><text x="214.0" y="107.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">architect</text><text x="214.0" y="129.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">Bob</text><path d="M182.0 100.0 L193.0 100.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-loop-ah)"/><rect x="364.0" y="56.0" width="152.0" height="88.0" rx="0" fill="#fcf4d6"/><rect x="364.0" y="56.0" width="4.0" height="88.0" rx="0" fill="#f1c21b"/><text x="382.0" y="82.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Approve plan</text><text x="382.0" y="107.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">business owner</text><text x="382.0" y="129.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#684e00" text-anchor="start">signs</text><g transform="translate(492.0 120.0)" fill="#684e00"><path d="M9.6 0.6l2.8 2.8-7.9 7.9-3.5 0.7 0.7-3.5z"/><path d="M0 13h13" stroke="#684e00" stroke-width="1.4"/></g><path d="M350.0 100.0 L361.0 100.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-loop-ah)"/><rect x="532.0" y="56.0" width="152.0" height="88.0" rx="0" fill="#edf5ff"/><rect x="532.0" y="56.0" width="4.0" height="88.0" rx="0" fill="#0f62fe"/><text x="550.0" y="82.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Tasks</text><text x="550.0" y="107.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">architect</text><text x="550.0" y="129.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">Bob</text><path d="M518.0 100.0 L529.0 100.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-loop-ah)"/><rect x="28.0" y="200.0" width="152.0" height="88.0" rx="0" fill="#edf5ff"/><rect x="28.0" y="200.0" width="4.0" height="88.0" rx="0" fill="#0f62fe"/><text x="46.0" y="226.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Implement</text><text x="46.0" y="251.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">developer</text><text x="46.0" y="273.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">Bob, test-first</text><rect x="196.0" y="200.0" width="152.0" height="88.0" rx="0" fill="#defbe6"/><rect x="196.0" y="200.0" width="4.0" height="88.0" rx="0" fill="#24a148"/><text x="214.0" y="226.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Scan</text><text x="214.0" y="251.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">security checks</text><text x="214.0" y="273.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0e6027" text-anchor="start">plain scripts</text><path d="M182.0 244.0 L193.0 244.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-loop-ah)"/><rect x="364.0" y="200.0" width="152.0" height="88.0" rx="0" fill="#edf5ff"/><rect x="364.0" y="200.0" width="4.0" height="88.0" rx="0" fill="#0f62fe"/><text x="382.0" y="226.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Verify</text><text x="382.0" y="251.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">developer</text><text x="382.0" y="273.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">Bob proves it</text><path d="M350.0 244.0 L361.0 244.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-loop-ah)"/><rect x="532.0" y="200.0" width="152.0" height="88.0" rx="0" fill="#edf5ff"/><rect x="532.0" y="200.0" width="4.0" height="88.0" rx="0" fill="#0f62fe"/><text x="550.0" y="226.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Secure</text><text x="550.0" y="251.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">AppSec decides</text><text x="550.0" y="273.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#0043ce" text-anchor="start">Bob reviews</text><path d="M518.0 244.0 L529.0 244.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-loop-ah)"/><rect x="700.0" y="200.0" width="152.0" height="88.0" rx="0" fill="#fcf4d6"/><rect x="700.0" y="200.0" width="4.0" height="88.0" rx="0" fill="#f1c21b"/><text x="718.0" y="226.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="600" fill="#161616" text-anchor="start">Approve phase</text><text x="718.0" y="251.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#525252" text-anchor="start">business owner</text><text x="718.0" y="273.5" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#684e00" text-anchor="start">demo, then signs</text><g transform="translate(828.0 264.0)" fill="#684e00"><path d="M9.6 0.6l2.8 2.8-7.9 7.9-3.5 0.7 0.7-3.5z"/><path d="M0 13h13" stroke="#684e00" stroke-width="1.4"/></g><path d="M686.0 244.0 L697.0 244.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-loop-ah)"/><path d="M608.0 146.0 L608.0 172.0 L104.0 172.0 L104.0 197.0" fill="none" stroke="#8d8d8d" stroke-width="1.6" marker-end="url(#lab-loop-ah)"/><path d="M272.0 290.0 L272.0 318.0" fill="none" stroke="#da1e28" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M440.0 290.0 L440.0 318.0" fill="none" stroke="#da1e28" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M608.0 290.0 L608.0 318.0" fill="none" stroke="#da1e28" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M608.0 318.0 L104.0 318.0 L104.0 291.0" fill="none" stroke="#da1e28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#lab-loop-ah)"/><text x="282.0" y="336.0" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="400" fill="#a2191f" text-anchor="start">anything that fails goes back to Implement, as a fix task</text><rect x="28.0" y="352.0" width="824.0" height="1.0" rx="0" fill="#e0e0e0"/><rect x="28.0" y="370.0" width="250.0" height="58.0" rx="0" fill="#f4f4f4"/><rect x="28.0" y="370.0" width="4.0" height="58.0" rx="0" fill="#8d8d8d"/><text x="42.0" y="392.0" 