                required: [items, page]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/HeldPayment'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [OPS-005]
      x-roles: [OPS_AGENT, OPS_SUPERVISOR]
  /ops/held-payments/{transferId}/recommendation:
    post:
      operationId: opsRecommendHeldPayment
      tags: [ops]
      summary: Maker recommendation
      parameters:
      - name: transferId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpsRecommendation'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HeldPayment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [OPS-005]
      x-audit: OPS_PAYMENT_RECOMMENDED
      x-roles: [OPS_AGENT, OPS_SUPERVISOR]
  /ops/held-payments/{transferId}/decision:
    post:
      operationId: opsDecideHeldPayment
      tags: [ops]
      summary: Checker approve/reject (four-eyes)
      parameters:
      - name: transferId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpsDecision'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HeldPayment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [OPS-006]
      x-audit: OPS_PAYMENT_APPROVED
      x-roles: [OPS_SUPERVISOR]
  /ops/message-threads:
    get:
      operationId: opsListThreads
      tags: [ops]
      summary: Messaging queue
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id001
        description: Opaque cursor from page.nextCursor
      - name: limit
        in: query
        required: false
        schema: *id002
      - name: status
        in: query
        required: false
        schema: *id010
      - name: category
        in: query
        required: false
        schema: {$ref: '#/components/schemas/MessageCategory'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ThreadSummary'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [OPS-007]
      x-roles: [OPS_AGENT, OPS_SUPERVISOR]
  /ops/message-threads/{threadId}/messages:
    post:
      operationId: opsPostMessage
      tags: [ops]
      summary: Reply as bank
      parameters:
      - name: threadId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Message'}
          headers:
            Location:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [OPS-007]
      x-audit: OPS_MESSAGE_SENT
      x-roles: [OPS_AGENT, OPS_SUPERVISOR]
  /ops/message-threads/{threadId}/close:
    post:
      operationId: opsCloseThread
      tags: [ops]
      summary: Close thread
      parameters:
      - name: threadId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Thread'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [OPS-007]
      x-roles: [OPS_AGENT, OPS_SUPERVISOR]
  /ops/audit-events:
    get:
      operationId: opsSearchAudit
      tags: [ops]
      summary: Search audit log (≤31 days)
      parameters:
      - name: cursor
        in: query
        required: false
        schema: *id001
        description: Opaque cursor from page.nextCursor
      - name: limit
        in: query
        required: false
        schema: *id002
      - name: from
        in: query
        required: true
        schema: {$ref: '#/components/schemas/Timestamp'}
      - name: to
        in: query
        required: true
        schema: {$ref: '#/components/schemas/Timestamp'}
      - name: actorId
        in: query
        required: false
        schema: {$ref: '#/components/schemas/Id'}
      - name: customerId
        in: query
        required: false
        schema: {$ref: '#/components/schemas/Id'}
      - name: action
        in: query
        required: false
        schema: {type: string, maxLength: 60}
      - name: outcome
        in: query
        required: false
        schema: {type: string, enum: [SUCCESS, FAILURE]}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [OPS-008, NFR-OBS-011]
      x-audit: OPS_AUDIT_SEARCHED
      x-roles: [OPS_SUPERVISOR]
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: __Host-hb_sid, description: Server-side session (ADR-0004). Dev over HTTP uses hb_sid.}
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 128}
      description: Synchronizer token from session (ADR-0004)
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, format: uuid}
      description: ADR-0005
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      schema: {type: string, maxLength: 256}
      description: Single-use token from verifyStepUp (SPEC-04 §4)
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
      description: ETag from the last read (SPEC-04 §9)
    AccessReason:
      name: X-Access-Reason
      in: header
      required: true
      schema: {type: string, pattern: '^(CUSTOMER_CALL|SECURE_MESSAGE|HELD_PAYMENT_REVIEW|FRAUD_INVESTIGATION|OTHER)(:.{10,200})?$'}
      description: Reason code, optionally ":free text" (required ≥10 chars for OTHER) — BR-OPS-02
  responses:
    BadRequest:
      description: BadRequest
      content: &id011
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: UNAUTHENTICATED, SESSION_EXPIRED, INVALID_CREDENTIALS or MFA_* codes
      content: *id011
    Forbidden:
      description: FORBIDDEN, CSRF_TOKEN_INVALID, STEP_UP_REQUIRED (with stepUp block), STEP_UP_TOKEN_INVALID, MAKER_CHECKER_VIOLATION
      content: *id011
    NotFound:
      description: NotFound
      content: *id011
    Conflict:
      description: Conflict
      content: *id011
    PreconditionFailed:
      description: PreconditionFailed
      content: *id011
    PayloadTooLarge:
      description: PayloadTooLarge
      content: *id011
    Unprocessable:
      description: Unprocessable
      content: *id011
    Locked:
      description: Locked
      content: *id011
    PreconditionRequired:
      description: PreconditionRequired
      content: *id011
    TooManyRequests:
      description: TooManyRequests
      content: *id011
      headers:
        Retry-After:
          schema: {type: integer}
    InternalError:
      description: InternalError
      content: *id011
    ServiceUnavailable:
      description: ServiceUnavailable
      content: *id011
  schemas:
    Money:
      type: object
      description: Monetary amount. `amount` is a decimal string with exactly the currency exponent digits (SPEC-03 §4.1).
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: {type: string, pattern: '^-?(0|[1-9][0-9]{0,14})(\.[0-9]{1,3})?$', examples: ['12505.00']}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
    CurrencyCode: {type: string, enum: [AED, USD, EUR, GBP, AED, SAR, BHD, JPY]}
    Locale: {type: string, enum: [en, ar]}
    Theme: {type: string, enum: [white, g100, system]}
    BusinessDate: {type: string, format: date, examples: ['2026-11-18']}
    Timestamp: {type: string, format: date-time, examples: ['2026-11-18T09:41:00Z']}
    Id: {type: string, pattern: '^[a-z]{3}_[0-9A-HJKMNP-TV-Z]{26}$', description: Opaque prefixed ULID}
    Reference: {type: string, pattern: '^HB[0-9]{6}-[A-Z2-7]{6}$', examples: [HB261118-7KQ2MX]}
    FieldError:
      type: object
      required: [field, code]
      properties:
        field: {type: string}
        code: {type: string}
        message: {type: string}
    Problem:
      type: object
      description: RFC 9457 problem details (SPEC-04 §7)
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {$ref: '#/components/schemas/ErrorCode'}
        traceId: {type: string}
        errors:
          type: array
          items: {$ref: '#/components/schemas/FieldError'}
        params: {type: object, additionalProperties: true, description: 'Values for localized message placeholders (e.g. limit, remaining)'}
        stepUp:
          type: object
          properties:
            purpose: {$ref: '#/components/schemas/StepUpPurpose'}
            methods:
              type: array
              items: {$ref: '#/components/schemas/MfaMethod'}
    PageInfo:
      type: object
      required: [limit, hasMore]
      properties:
        nextCursor: {type: string}
        limit: {type: integer, minimum: 1, maximum: 100}
        hasMore: {type: boolean}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded, down]}
        checks:
          type: object
          additionalProperties: {type: string, enum: [up, down]}
    Version:
      type: object
      required: [version, gitSha, builtAt, demoMode]
      properties:
        version: {type: string}
        gitSha: {type: string}
        builtAt: {$ref: '#/components/schemas/Timestamp'}
        demoMode: {type: boolean}
    MfaMethod: {type: string, enum: [SMS, TOTP, RECOVERY_CODE]}
    StepUpPurpose: {type: string, enum: [BENEFICIARY_CREATE, BENEFICIARY_UPDATE, TRANSFER_CREATE, CARD_REVEAL, CARD_REPORT, CONTACT_CHANGE, PASSWORD_CHANGE, MFA_CHANGE,
        LIMITS_INCREASE, DATA_EXPORT]}
    UserStatus: {type: string, enum: [PENDING_ENROLMENT, ACTIVE, TEMP_LOCKED, LOCKED, DISABLED]}
    Role: {type: string, enum: [CUSTOMER, OPS_AGENT, OPS_SUPERVISOR]}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
        password: {type: string, minLength: 1, maxLength: 128, format: password}
    LoginResponse:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [MFA_REQUIRED, AUTHENTICATED]}
        challenge: {$ref: '#/components/schemas/Challenge'}
        session: {$ref: '#/components/schemas/Session'}
    Challenge:
      type: object
      required: [challengeId, methods, expiresAt]
      properties:
        challengeId: {$ref: '#/components/schemas/Id'}
        methods:
          type: array
          items: {$ref: '#/components/schemas/MfaMethod'}
        sentTo: {type: string, description: Masked destination, examples: [+971 •• ••• 4417]}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
        resendAvailableAt: {$ref: '#/components/schemas/Timestamp'}
        attemptsRemaining: {type: integer}
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, method, code]
      properties:
        challengeId: {$ref: '#/components/schemas/Id'}
        method: {$ref: '#/components/schemas/MfaMethod'}
        code: {type: string, pattern: '^([0-9]{6}|[A-Z2-7]{5}-[A-Z2-7]{5})$'}
        rememberDevice: {type: boolean, default: false}
    ChallengeRef:
      type: object
      additionalProperties: false
      required: [challengeId]
      properties:
        challengeId: {$ref: '#/components/schemas/Id'}
        method: {$ref: '#/components/schemas/MfaMethod'}
    Session:
      type: object
      required: [user, csrfToken, idleExpiresAt, absoluteExpiresAt]
      properties:
        user:
          type: object
          required: [id, displayName, roles, locale]
          properties:
            id: {$ref: '#/components/schemas/Id'}
            displayName: {type: string}
            roles:
              type: array
              items: {$ref: '#/components/schemas/Role'}
            locale: {$ref: '#/components/schemas/Locale'}
            theme: {$ref: '#/components/schemas/Theme'}
        csrfToken: {type: string}
        idleExpiresAt: {$ref: '#/components/schemas/Timestamp'}
        absoluteExpiresAt: {$ref: '#/components/schemas/Timestamp'}
        previousLogin: {$ref: '#/components/schemas/PreviousLogin'}
    PreviousLogin:
      type: object
      properties:
        at: {$ref: '#/components/schemas/Timestamp'}
        device: {type: string}
        approximateLocation: {type: string}
    EnrolmentStartRequest:
      type: object
      additionalProperties: false
      required: [customerNumber, dateOfBirth]
      properties:
        customerNumber: {type: string, pattern: '^[0-9]{8}$'}
        dateOfBirth: {$ref: '#/components/schemas/BusinessDate'}
    EnrolmentCompleteRequest:
      type: object
      additionalProperties: false
      required: [enrolmentToken, username, password]
      properties:
        enrolmentToken: {type: string, description: Returned by verifyEnrolment}
        username: {type: string, pattern: '^[a-z0-9._-]{6,32}$'}
        password: {type: string, minLength: 12, maxLength: 128, format: password}
    EnrolmentToken:
      type: object
      required: [enrolmentToken, expiresAt]
      properties:
        enrolmentToken: {type: string}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: {type: string, minLength: 1, maxLength: 64}
    PasswordResetVerifyRequest:
      type: object
      additionalProperties: false
      required: [resetToken]
      properties:
        resetToken: {type: string, minLength: 32, maxLength: 128}
    PasswordResetCompleteRequest:
      type: object
      additionalProperties: false
      required: [resetToken, challengeId, code, newPassword]
      properties:
        resetToken: {type: string, minLength: 32, maxLength: 128}
        challengeId: {$ref: '#/components/schemas/Id'}
        code: {type: string, pattern: '^[0-9]{6}$'}
        newPassword: {type: string, minLength: 12, maxLength: 128, format: password}
    StepUpStartRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: {$ref: '#/components/schemas/StepUpPurpose'}
        payloadHash: {type: string, pattern: '^[a-f0-9]{64}$', description: SHA-256 of canonical JSON of the protected request body (payload-bound purposes)}
        method: {$ref: '#/components/schemas/MfaMethod'}
    StepUpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, method, code]
      properties:
        challengeId: {$ref: '#/components/schemas/Id'}
        method: {$ref: '#/components/schemas/MfaMethod'}
        code: {type: string, pattern: '^[0-9]{6}$'}
    StepUpToken:
      type: object
      required: [stepUpToken, purpose, expiresAt]
      properties:
        stepUpToken: {type: string}
        purpose: {$ref: '#/components/schemas/StepUpPurpose'}
        expiresAt: {$ref: '#/components/schemas/Timestamp'}
    AccountType: {type: string, enum: [CURRENT, SAVINGS, CREDIT_CARD, TERM_DEPOSIT, LOAN]}
    AccountStatus: {type: string, enum: [ACTIVE, FROZEN, DORMANT, CLOSED]}
    Balances:
      type: object
      required: [available, ledger, holds]
      properties:
        available: {$ref: '#/components/schemas/Money'}
        ledger: {$ref: '#/components/schemas/Money'}
        holds: {$ref: '#/components/schemas/Money'}
        holdsCount: {type: integer}
        overdraftLimit: {$ref: '#/components/schemas/Money'}
    Account:
      type: object
      required: [id, type, productName, currency, status, maskedNumber, balances]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        type: {$ref: '#/components/schemas/AccountType'}
        productName: {type: string}
        nickname: {type: string, maxLength: 40}
        currency: {$ref: '#/components/schemas/CurrencyCode'}
        status: {$ref: '#/components/schemas/AccountStatus'}
        maskedNumber: {type: string, examples: [•••• 4821]}
        iban: {type: string, description: Full IBAN; present only on getAccount}
        accountNumber: {type: string, description: Present only on getAccount}
        bic: {type: string}
        openedOn: {$ref: '#/components/schemas/BusinessDate'}
        balances: {$ref: '#/components/schemas/Balances'}
        product: {$ref: '#/components/schemas/ProductDetails'}
        etag: {type: string}
    ProductDetails:
      type: object
      description: Type-specific details (ACCT-005). Only the block for the account type is present.
      properties:
        savings:
          type: object
          properties:
            interestRateBps: {type: integer}
            interestPaidYtd: {$ref: '#/components/schemas/Money'}
            lastInterestDate: {$ref: '#/components/schemas/BusinessDate'}
        creditCard:
          type: object
          properties:
            creditLimit: {$ref: '#/components/schemas/Money'}
            owed: {$ref: '#/components/schemas/Money'}
            availableCredit: {$ref: '#/components/schemas/Money'}
            statementBalance: {$ref: '#/components/schemas/Money'}
            minimumDue: {$ref: '#/components/schemas/Money'}
            dueDate: {$ref: '#/components/schemas/BusinessDate'}
        termDeposit:
          type: object
          properties:
            principal: {$ref: '#/components/schemas/Money'}
            interestRateBps: {type: integer}
            startDate: {$ref: '#/components/schemas/BusinessDate'}
            maturityDate: {$ref: '#/components/schemas/BusinessDate'}
            maturityInstruction: {type: string, enum: [RENEW_PRINCIPAL, RENEW_ALL, CREDIT_TO_ACCOUNT]}
            projectedInterest: {$ref: '#/components/schemas/Money'}
        loan:
          type: object
          properties:
            originalAmount: {$ref: '#/components/schemas/Money'}
            outstandingPrincipal: {$ref: '#/components/schemas/Money'}
            nextInstalment: {$ref: '#/components/schemas/Money'}
            nextInstalmentDate: {$ref: '#/components/schemas/BusinessDate'}
            remainingInstalments: {type: integer}
    AccountUpdate:
      type: object
      additionalProperties: false
      properties:
        nickname: {type: [string, 'null'], maxLength: 40, pattern: '^[\p{L}\p{N} .,''&()-]*$'}
    Category:
      type: string
      enum: [GROCERIES, DINING, TRANSPORT, SHOPPING, BILLS_UTILITIES, HEALTH, ENTERTAINMENT, TRAVEL, EDUCATION, TRANSFERS, CASH, INCOME, FEES, OTHER]
    Channel: {type: string, enum: [CARD, TRANSFER, BILL, FEE, INTEREST, CASH, OTHER]}
    Transaction:
      type: object
      required: [id, accountId, status, direction, amount, description, bookedAt]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        accountId: {$ref: '#/components/schemas/Id'}
        status: {type: string, enum: [PENDING, POSTED]}
        direction: {type: string, enum: [DEBIT, CREDIT]}
        amount: {$ref: '#/components/schemas/Money'}
        description: {type: string}
        merchantName: {type: string}
        counterpartyName: {type: string}
        category: {$ref: '#/components/schemas/Category'}
        channel: {$ref: '#/components/schemas/Channel'}
        reference: {type: string}
        bookedAt: {$ref: '#/components/schemas/Timestamp'}
        valueDate: {$ref: '#/components/schemas/BusinessDate'}
        runningBalance: {$ref: '#/components/schemas/Money'}
        cardLast4: {type: string, pattern: '^[0-9]{4}$'}
        originalAmount: {$ref: '#/components/schemas/Money'}
        fxRate: {type: string, pattern: '^[0-9]+\.[0-9]{4,8}$'}
        fee: {$ref: '#/components/schemas/Money'}
        paymentOrderId: {$ref: '#/components/schemas/Id'}
        finalAmountDiffers: {type: boolean}
    TransactionUpdate:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category: {$ref: '#/components/schemas/Category'}
    DashboardSection:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [OK, UNAVAILABLE]}
    DashboardSummary:
      type: object
      required: [greetingName, accounts, totals, recent, upcoming, attention]
      properties:
        greetingName: {type: string}
        previousLogin: {$ref: '#/components/schemas/PreviousLogin'}
        accounts:
          allOf:
          - {$ref: '#/components/schemas/DashboardSection'}
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Account'}
        totals:
          allOf:
          - {$ref: '#/components/schemas/DashboardSection'}
          properties:
            byCurrency:
              type: array
              items: {$ref: '#/components/schemas/Money'}
            estimatedInBase: {$ref: '#/components/schemas/Money'}
            ratesAsOf: {$ref: '#/components/schemas/Timestamp'}
        recent:
          allOf:
          - {$ref: '#/components/schemas/DashboardSection'}
          properties:
            items:
              type: array
              maxItems: 5
              items: {$ref: '#/components/schemas/Transaction'}
        upcoming:
          allOf:
          - {$ref: '#/components/schemas/DashboardSection'}
          properties:
            items:
              type: array
              items:
                type: object
                required: [date, kind, amount, label]
                properties:
                  date: {$ref: '#/components/schemas/BusinessDate'}
