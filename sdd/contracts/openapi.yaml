# GENERATED-STYLE CONTRACT — edit deliberately (Spec Architect mode only), then run `pnpm contracts:lint && pnpm contracts:gen`.
# Every operation lists the requirement IDs it satisfies in x-requirements (traceability).
openapi: 3.1.0
info:
  title: Tidewell Online Banking API (prototype)
  version: 1.0.0
  description: 'Contract-first API for the Tidewell Bank online banking prototype. Authoritative for request/response shapes (Constitution Art. II). Conventions: sdd/specs/04-api-guidelines.md.
    Error catalog: sdd/contracts/error-codes.md. FICTIONAL BANK — DEMO ONLY.'
  license: {name: Proprietary — prototype}
servers:
- {url: 'http://localhost:4000/api/v1', description: Local API}
- {url: /api/v1, description: Same-origin via Vite proxy}
security:
- {sessionCookie: []}
tags:
- {name: accounts}
- {name: auth}
- {name: beneficiaries}
- {name: bills}
- {name: cards}
- {name: dashboard}
- {name: dev}
- {name: documents}
- {name: fx}
- {name: limits}
- {name: messaging}
- {name: notifications}
- {name: ops}
- {name: privacy}
- {name: profile}
- {name: reference}
- {name: security}
- {name: system}
- {name: transfers}
paths:
  /health/live:
    get:
      operationId: getHealthLive
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [FND-007, NFR-REL-006]
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [system]
      summary: Readiness probe (DB, migrations, job runner)
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-requirements: [FND-007, NFR-REL-006]
  /version:
    get:
      operationId: getVersion
      tags: [system]
      summary: Build and runtime info
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [FND-007]
  /dev/outbox:
    get:
      operationId: listDevOutbox
      tags: [dev]
      summary: List simulated SMS/email messages (demo only)
      security: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema: &id001 {type: string, maxLength: 512}
        description: Opaque cursor from page.nextCursor
      - name: limit
        in: query
        required: false
        schema: &id002 {type: integer, minimum: 1, maximum: 100, default: 25}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/DevOutboxItem'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [FND-015, AUTH-050]
      x-demo-only: true
  /dev/jobs/run:
    post:
      operationId: runDevJob
      tags: [dev]
      summary: Run a background job immediately (demo only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevJobRun'}
      responses:
        '202': {description: Success}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [FND-015, FND-017]
      x-demo-only: true
  /dev/faults:
    put:
      operationId: setDevFaults
      tags: [dev]
      summary: Toggle simulated dependency outages (demo only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevFaults'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevFaults'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [FND-015, NFR-REL-005]
      x-demo-only: true
  /dev/clock:
    put:
      operationId: setDevClock
      tags: [dev]
      summary: Move the server clock forward (demo only)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DevClock'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DevClock'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [FND-015, XFER-023]
      x-demo-only: true
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '423': {$ref: '#/components/responses/Locked'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-001, AUTH-002, NFR-SEC-003]
      x-audit: LOGIN
      x-rate-limit: auth
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      tags: [auth]
      summary: Verify second factor and create session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MfaVerifyRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-003, AUTH-004, AUTH-005, AUTH-006, AUTH-030]
      x-audit: LOGIN_MFA
      x-rate-limit: auth
  /auth/mfa/resend:
    post:
      operationId: resendMfa
      tags: [auth]
      summary: Resend SMS code for a challenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChallengeRef'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Challenge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-003]
      x-rate-limit: auth
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Current session, CSRF token and expiry times
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-030, FND-014]
  /auth/session/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Extend idle timeout after genuine user activity
      parameters:
      - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-031]
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out (invalidates session)
      parameters:
      - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '204': {description: Success}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-033, NFR-SEC-004]
      x-audit: LOGOUT
  /auth/enrolment/start:
    post:
      operationId: startEnrolment
      tags: [auth]
      summary: Verify customer number + DOB and send OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrolmentStartRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Challenge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-010]
      x-audit: ENROLMENT_STARTED
      x-rate-limit: auth
  /auth/enrolment/verify:
    post:
      operationId: verifyEnrolment
      tags: [auth]
      summary: Verify enrolment OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepUpVerifyRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EnrolmentToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-010]
      x-rate-limit: auth
  /auth/enrolment/complete:
    post:
      operationId: completeEnrolment
      tags: [auth]
      summary: Create username and password; signs in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EnrolmentCompleteRequest'}
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
          headers:
            Location:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-011, NFR-SEC-002]
      x-audit: ENROLMENT_COMPLETED
      x-rate-limit: auth
  /auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset link (always 202)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetRequest'}
      responses:
        '202': {description: Success}
        '400': {$ref: '#/components/responses/BadRequest'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-020]
      x-audit: PASSWORD_RESET_REQUESTED
      x-rate-limit: auth
  /auth/password-reset/verify:
    post:
      operationId: verifyPasswordReset
      tags: [auth]
      summary: Validate reset token and send SMS OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetVerifyRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Challenge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-021]
      x-rate-limit: auth
  /auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags: [auth]
      summary: Set new password; revokes sessions and devices
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordResetCompleteRequest'}
      responses:
        '204': {description: Success}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-021, NFR-SEC-002]
      x-audit: PASSWORD_RESET_COMPLETED
      x-rate-limit: auth
  /auth/step-up:
    post:
      operationId: startStepUp
      tags: [auth]
      summary: Start a step-up challenge for a sensitive action
      parameters:
      - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepUpStartRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Challenge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-040]
      x-audit: STEP_UP_REQUESTED
      x-rate-limit: otp
  /auth/step-up/verify:
    post:
      operationId: verifyStepUp
      tags: [auth]
      summary: Verify step-up code and obtain a single-use token
      parameters:
      - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StepUpVerifyRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StepUpToken'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [AUTH-040, AUTH-041]
      x-audit: STEP_UP_VERIFIED
      x-rate-limit: otp
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard read model (sections fail independently)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DashboardSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [DASH-001, DASH-002, DASH-003, DASH-005, DASH-006, DASH-009, DASH-010, NFR-PRIV-001]
  /insights/spending:
    get:
      operationId: getSpendingInsights
      tags: [dashboard]
      summary: Spending by category for a month vs previous
      parameters:
      - name: month
        in: query
        required: false
        schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}
        description: Defaults to current month
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpendingInsights'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
      x-requirements: [DASH-008]
  /search:
    get:
      operationId: search
      tags: [dashboard]
      summary: Global search across accounts, payees, transactions and pages
      parameters:
      - name: q
        in: query
        required: true
        schema: {type: string, minLength: 2, maxLength: 100}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResults'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [DASH-013]
  /accounts:
    get:
      operationId: listAccounts
      tags: [accounts]
      summary: List the customer's accounts
      parameters:
      - name: includeClosed
        in: query
        required: false
        schema: {type: boolean, default: false}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [ACCT-001]
  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Account detail with identifiers and product panel
      parameters:
      - name: accountId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
          headers:
            ETag:
              schema: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [ACCT-002, ACCT-003, ACCT-005, NFR-SEC-010]
    patch:
      operationId: updateAccount
      tags: [accounts]
      summary: Update nickname
      parameters:
      - name: accountId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - {$ref: '#/components/parameters/CsrfToken'}
      - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountUpdate'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Account'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [ACCT-004, NFR-SEC-012]
      x-audit: ACCOUNT_NICKNAME_CHANGED
  /accounts/{accountId}/transactions:
    get:
      operationId: listTransactions
      tags: [accounts]
      summary: Transaction history with filters (pending first)
      parameters:
      - name: accountId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - name: cursor
        in: query
        required: false
        schema: *id001
        description: Opaque cursor from page.nextCursor
      - name: limit
        in: query
        required: false
        schema: *id002
      - name: from
        in: query
        required: false
        schema: &id003 {$ref: '#/components/schemas/BusinessDate'}
        description: Inclusive business date
      - name: to
        in: query
        required: false
        schema: &id004 {$ref: '#/components/schemas/BusinessDate'}
        description: Inclusive business date
      - name: q
        in: query
        required: false
        schema: &id005 {type: string, minLength: 2, maxLength: 100}
      - name: direction
        in: query
        required: false
        schema: &id006 {type: string, enum: [DEBIT, CREDIT]}
      - name: minAmount
        in: query
        required: false
        schema: {type: string, pattern: '^[0-9]+(\.[0-9]{1,3})?$'}
      - name: maxAmount
        in: query
        required: false
        schema: {type: string, pattern: '^[0-9]+(\.[0-9]{1,3})?$'}
      - name: category
        in: query
        required: false
        schema: &id007
          type: array
          items: {$ref: '#/components/schemas/Category'}
        style: form
        explode: true
      - name: status
        in: query
        required: false
        schema: {type: string, enum: [PENDING, POSTED]}
      - name: cardId
        in: query
        required: false
        schema: {$ref: '#/components/schemas/Id'}
      - name: sort
        in: query
        required: false
        schema: {type: string, enum: [-bookedAt, bookedAt, -amount, amount], default: -bookedAt}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [items, page]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Transaction'}
                  page: {$ref: '#/components/schemas/PageInfo'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [ACCT-010, ACCT-011, ACCT-014, NFR-PERF-002]
  /accounts/{accountId}/transactions/{transactionId}:
    get:
      operationId: getTransaction
      tags: [accounts]
      summary: Transaction detail
      parameters:
      - name: accountId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - name: transactionId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Transaction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
      x-requirements: [ACCT-012]
    patch:
      operationId: updateTransaction
      tags: [accounts]
      summary: Change category
      parameters:
      - name: accountId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - name: transactionId
        in: path
        required: true
        schema: {$ref: '#/components/schemas/Id'}
      - {$ref: '#/components/parameters/CsrfToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransactionUpdate'}
      responses:
        '200':
          description: Success
